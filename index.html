["Joint tenancy: creation and severance?","Requires the four unities — time, title, interest, possession — and clear intent to create survivorship. Severed by a conveyance by one joint tenant (the transferee takes as a tenant in common), by partition, or (in title-theory states) by a mortgage. Under the majority lien theory, a mortgage by one joint tenant does not sever.","property-5"],
["Tenancy by the entirety?","Co-ownership available only to married couples (in states recognizing it), with right of survivorship. Neither spouse may unilaterally sever or convey, and creditors of only one spouse cannot reach the property. Terminated by death, divorce, or mutual agreement.","property-6"],
["Rights and duties among co-tenants?","Each co-tenant may possess the whole; a possessing co-tenant owes no rent to the others absent ouster or agreement, but must share net rents received from third parties. Co-tenants may obtain contribution for taxes and mortgage payments; improvements are not reimbursed except via credit in partition (for value added).","property-7"],
["Types of leasehold estates?","Term of years (fixed period; ends automatically); periodic tenancy (renews automatically; ended by notice equal to the period, but common law requires 6 months for year-to-year); tenancy at will (terminable by either at any time); tenancy at sufferance (holdover). For a holdover, the landlord may evict (and get damages) or bind the tenant to a new periodic tenancy.","property-8"],
["Implied warranty of habitability?","In residential leases (majority), the landlord impliedly warrants premises fit for basic human habitation (e.g., compliance with housing codes). Tenant remedies after notice and a reasonable time: terminate and move out, repair and deduct, reduce/withhold rent (often escrowed), or stay, pay, and sue for damages. Generally not waivable.","property-9"],
["Constructive eviction?","When the landlord’s act or failure to act (breach of a duty) substantially interferes with the tenant’s use and enjoyment, the tenant may terminate the lease and stop paying rent — but must give notice, allow a reasonable time to cure, and vacate within a reasonable time.","property-10"],
["Assignment vs. sublease?","Assignment: transfer of the entire remaining term; the assignee is in privity of estate with the landlord and is liable for rent and covenants that run with the land while in possession; the original tenant remains liable (privity of contract) unless released. Sublease: transfer of less than the whole term; the sublessee is not personally liable to the landlord for rent (no privity of estate or contract) unless it assumed.","property-11"],
["Landlord’s duty to mitigate when the tenant abandons?","Majority (especially residential): the landlord must make reasonable efforts to re-let and may recover rent minus what was or could reasonably have been obtained. Traditional/minority: the landlord may let the premises sit and sue for rent as it comes due.","property-12"],
["How are easements created?","(1) Express grant or reservation (writing satisfying the Statute of Frauds); (2) implication from prior use (common ownership, apparent and continuous prior use, reasonably necessary at severance); (3) necessity (strict necessity at severance, e.g., landlocked parcel; ends when the necessity ends); (4) prescription (use that is open and notorious, adverse, and continuous for the statutory period — exclusivity not required).","property-13"],
["How are easements terminated?","Merger of dominant and servient estates; written release; abandonment (nonuse plus a physical act showing intent — nonuse alone is insufficient); estoppel; prescription by the servient owner; end of necessity (for easements by necessity); condemnation; destruction of the servient structure (for easements in buildings).","property-14"],
["Real covenant: when do the burden and benefit run?","Burden runs with: writing, intent to bind successors, touch and concern, notice, horizontal privity (e.g., grantor-grantee relationship), and vertical privity (successor holds the same estate). Benefit runs with: writing, intent, touch and concern, and vertical privity (relaxed — any interest). Remedy: money damages.","property-15"],
["Equitable servitudes?","A restriction enforceable by injunction against successors if there is a writing (or a common scheme), intent to bind, touch and concern, and notice (actual, record, or inquiry). Privity is not required. Under the common-scheme doctrine, a reciprocal negative servitude may be implied for lots in a subdivision developed under a general plan.","property-16"],
["Adverse possession elements?","Possession that is actual, open and notorious, exclusive, hostile (without the owner’s permission), and continuous for the statutory period. Tacking is allowed between possessors in privity. The period is tolled only for disabilities existing when possession began. Does not run against government land, or against holders of future interests until those interests become possessory.","property-17"],
["Equitable conversion and risk of loss?","Once a land sale contract is signed, the buyer holds equitable title. Majority rule: if the property is destroyed without fault before closing, the risk falls on the buyer (who must still pay), absent a contrary clause or statute (some states adopt the Uniform Vendor and Purchaser Risk Act, placing risk on the party in possession or holding legal title).","property-18"],
["Implied covenant of marketable title?","Every land sale contract implies the seller will deliver marketable title at closing — title reasonably free from doubt (no defects in the chain, no undisclosed encumbrances like mortgages, easements, or covenants, and no existing zoning violations). Zoning restrictions themselves do not make title unmarketable. The buyer must notify the seller and give time to cure before closing.","property-19"],
["Seller’s duty to disclose defects?","Majority: a seller must disclose known latent material defects not reasonably discoverable by inspection. A general “as is” clause does not shield a seller from liability for fraud or active concealment.","property-20"],
["Requirements for a valid deed and delivery?","A writing signed by the grantor that identifies the parties and adequately describes the land, with words of conveyance. Delivery requires the grantor’s present intent to pass title (physical transfer is not required); acceptance is presumed if beneficial. Recording is not required for validity between the parties.","property-21"],
["Covenants of title in a general warranty deed?","Present covenants (breached, if at all, at delivery): seisin, right to convey, against encumbrances. Future covenants (breached upon eviction/disturbance; run with the land): warranty, quiet enjoyment, further assurances. A special warranty deed covers only defects arising during the grantor’s ownership; a quitclaim deed contains no covenants.","property-22"],
["Types of recording acts?","Race: the first to record prevails. Notice: a subsequent bona fide purchaser for value without notice prevails over a prior unrecorded interest. Race-notice: a subsequent BFP without notice prevails only if it also records first. Shelter rule: a transferee from a BFP takes the BFP’s protection. Notice may be actual, record (constructive), or inquiry.","property-23"],
["Wild deeds and estoppel by deed?","A deed recorded outside the chain of title (e.g., from a grantor whose own acquisition was never recorded) does not give constructive notice. Estoppel by deed: if a grantor conveys land it does not own by warranty deed and later acquires title, title passes automatically to the grantee.","property-24"],
["Mortgage foreclosure: priorities?","Sale proceeds pay foreclosure costs, then the foreclosing mortgage, then junior interests in order of priority, with any surplus to the mortgagor. Foreclosure extinguishes junior interests that are joined, but senior interests survive — the buyer takes subject to them. The mortgagee may seek a deficiency judgment. The equity of redemption exists until the sale and cannot be waived in the mortgage (no clogging).","property-25"],
["Transfers of mortgaged property: “subject to” vs. “assumes”?","A grantee who takes “subject to” the mortgage is not personally liable — the land remains security. A grantee who “assumes” the mortgage becomes personally liable; the original mortgagor remains secondarily liable (as surety) absent a novation. Due-on-sale clauses are generally enforceable.","property-26"],
["Purchase-money mortgage priority?","A mortgage given to finance acquisition of the property has priority over pre-existing judgment liens and other non-PMM claims against the mortgagor, even if recorded later (subject to the recording act). Between competing PMMs, the seller’s PMM generally has priority over a third-party lender’s.","property-27"],
["Fixtures?","A chattel so attached to land that it is treated as part of the realty; determined by the annexor’s objective intent (degree of attachment, adaptation to the land, damage on removal). Tenants may remove trade fixtures before the lease ends if they repair resulting damage.","property-28"],
["Zoning: nonconforming uses and variances?","A pre-existing use that violates a new ordinance may continue (but generally cannot be expanded and may be amortized/terminated after a reasonable period). A variance permits departure from the ordinance on a showing of unnecessary hardship (or practical difficulty) without substantial detriment to the public good. Special-use permits are granted when stated conditions are met.","property-29"]
];
CARDS.torts = [
["Battery?","An intentional act causing harmful or offensive contact with the plaintiff’s person (including things closely connected to the person). Intent to cause the contact (or imminent apprehension of it) suffices; no physical injury is needed. Transferred intent applies among assault, battery, false imprisonment, trespass to land, and trespass to chattels.","torts-0"],
["Assault?","An intentional act that causes the plaintiff reasonable apprehension of an imminent harmful or offensive contact. The plaintiff must be aware of the threat; words alone are generally insufficient without an overt act, and conditional words may negate imminence.","torts-1"],
["False imprisonment and the shopkeeper’s privilege?","Intentional confinement of the plaintiff within fixed boundaries with no known reasonable means of escape; the plaintiff must be aware of the confinement or harmed by it. Shopkeepers may detain a suspected shoplifter for a reasonable time, in a reasonable manner, based on a reasonable belief.","torts-2"],
["Intentional infliction of emotional distress (IIED)?","Extreme and outrageous conduct, intentionally or recklessly causing severe emotional distress. Bystander recovery (when conduct is directed at a third party) generally requires presence, a close family relationship, and the defendant’s knowledge of both.","torts-3"],
["Trespass to land, trespass to chattels, conversion?","Trespass to land: intentional physical entry onto another’s land (intent to enter suffices; mistake is no defense; no damages needed). Trespass to chattels: intentional interference with another’s chattel causing actual damage or dispossession. Conversion: interference so serious that the defendant must pay the chattel’s full value.","torts-4"],
["Privileges: defense of property and necessity?","Reasonable force may be used to defend property, but never deadly force (e.g., spring guns). Public necessity (to avert a public disaster) is a complete defense. Private necessity is a defense to trespass, but the actor must pay for actual damage caused.","torts-5"],
["Negligence elements and standard of care?","Duty, breach, actual cause, proximate cause, damages. Standard: a reasonably prudent person under the circumstances. Children: a child of like age, intelligence, and experience (adult standard for adult activities). Professionals: the knowledge and skill of a member of the profession in good standing (specialists often held to a national standard).","torts-6"],
["Negligence per se?","A statute may set the standard of care if it imposes a specific duty, the plaintiff is within the protected class, and the harm is the type the statute was designed to prevent. Violation then establishes duty and breach (majority) — the plaintiff must still prove causation and damages. Excuses: compliance more dangerous, impossible, or emergency.","torts-7"],
["Duty to rescue/act?","No general duty to aid a stranger. Exceptions: special relationship (common carrier–passenger, innkeeper–guest, employer–employee, parent–child, landowner–invitee), defendant negligently created the peril, or defendant voluntarily undertook a rescue (must act reasonably and not leave the victim worse off).","torts-8"],
["Landowner duties (traditional status approach)?","Undiscovered trespassers: no duty. Discovered/anticipated trespassers: warn of or make safe known, artificial, highly dangerous conditions; use reasonable care in activities. Licensees (e.g., social guests): warn of known dangerous conditions not obvious to the guest. Invitees (business/public): reasonable care, including reasonable inspection to discover dangers and make them safe or warn.","torts-9"],
["Attractive nuisance doctrine?","A possessor is liable to trespassing children for an artificial condition if: the possessor knows or should know children are likely to trespass; it poses an unreasonable risk of death or serious harm; children don’t appreciate the risk because of their youth; the burden of eliminating it is slight relative to the risk; and the possessor fails to use reasonable care.","torts-10"],
["Res ipsa loquitur?","Negligence may be inferred if (1) the event ordinarily does not occur absent negligence, (2) it was caused by an instrumentality within the defendant’s control (or the negligence is attributable to the defendant), and (3) the plaintiff did not contribute. It permits — but does not compel — a finding of negligence and is enough to survive a directed verdict.","torts-11"],
["Actual (factual) cause?","But-for test: the injury would not have occurred but for the defendant’s conduct. Substantial-factor test when multiple sufficient causes merge. Alternative liability (Summers v. Tice): when two negligent defendants acted and only one caused the harm, the burden shifts to each defendant to prove it was not the cause.","torts-12"],
["Proximate cause and intervening causes?","A defendant is liable for foreseeable harms within the scope of the risk created. Foreseeable intervening causes (subsequent medical malpractice, rescuers, ordinary negligence of others) do not cut off liability; unforeseeable ones (e.g., most intentional crimes, extraordinary events) are superseding. Eggshell-skull rule: the defendant takes the plaintiff as found — liable for the full extent of harm.","torts-13"],
["Negligent infliction of emotional distress (NIED)?","Zone of danger: a plaintiff threatened with physical impact may recover for distress (many states require physical manifestation). Bystander (Thing v. La Chusa approach): plaintiff closely related to the victim, present at the scene, and contemporaneously perceived the injury. Special relationships (e.g., mishandling a corpse, erroneous report of death) can also support recovery.","torts-14"],
["MBE default rules for torts questions?","Per NCBE’s MBE Subject Matter Outline: assume survival actions and wrongful-death claims are available, and that joint and several liability and PURE comparative fault apply unless the question indicates otherwise.","torts-15"],
["Comparative and contributory negligence?","Pure comparative: the plaintiff’s recovery is reduced by the plaintiff’s percentage of fault, even if over 50%. Modified comparative (most states): barred if the plaintiff’s fault reaches a threshold (50% or 51%). Contributory negligence (few jurisdictions): any plaintiff fault bars recovery, subject to last clear chance. Ohio note: Ohio uses modified comparative fault — recovery is barred if the plaintiff’s fault is greater than the combined tortious conduct of all other persons, both those the plaintiff seeks recovery from and those the plaintiff does not, including nonparties (R.C. 2315.33, 2315.35) — but answer MBE questions under pure comparative fault unless told otherwise.","torts-16"],
["Assumption of risk?","Express assumption (waiver/release) is generally enforced, but not for intentional, reckless, or grossly negligent conduct, or where against public policy. Implied primary assumption: no duty for risks inherent in an activity (e.g., sports). Implied secondary assumption (knowingly encountering a risk created by the defendant’s negligence) is absorbed into comparative fault in most comparative-fault jurisdictions.","torts-17"],
["Joint and several liability, contribution, and indemnity?","When two or more tortfeasors cause an indivisible injury, each is liable for the entire amount; the plaintiff may collect from any. A tortfeasor who pays more than its share may seek contribution from the others (in proportion to fault). Indemnity shifts the entire loss, e.g., from a vicariously liable party to the active wrongdoer, or from a retailer to the manufacturer.","torts-18"],
["Vicarious liability?","Respondeat superior: an employer is liable for employee torts within the scope of employment (detours yes; frolics no; intentional torts if within scope, e.g., force inherent in the job). Generally not liable for independent contractors except for nondelegable duties or inherently dangerous activities. Parents are not vicariously liable at common law (but may be negligent in supervision); car owners may be liable for negligent entrustment.","torts-19"],
["Strict liability for animals?","Owners of wild animals are strictly liable for harm arising from the animal’s dangerous propensities. Owners of domestic animals are strictly liable only if they know or have reason to know of the animal’s abnormally dangerous propensities (common law; many states have dog-bite statutes). Owners of trespassing livestock are strictly liable for foreseeable damage.","torts-20"],
["Abnormally dangerous activities?","Strict liability for harm resulting from an activity that creates a foreseeable and highly significant risk of physical harm even when reasonable care is exercised and is not a matter of common usage (e.g., blasting, storing explosives). The harm must result from the risk that made the activity abnormally dangerous.","torts-21"],
["Strict products liability?","A commercial seller (manufacturer, distributor, retailer) is liable for physical harm caused by a product sold in a defective condition unreasonably dangerous: manufacturing defect (departs from intended design), design defect (risk-utility / feasible safer alternative design, or consumer expectations), or inadequate warnings. The product must reach the user without substantial change; privity is not required.","torts-22"],
["Defenses in products liability?","Unforeseeable misuse; substantial alteration after sale; assumption of a known risk; comparative fault (reduces recovery in comparative-fault jurisdictions). A plaintiff’s mere failure to discover or guard against a defect is generally not a defense in strict liability. Compliance with government standards is evidence but usually not conclusive.","torts-23"],
["Private vs. public nuisance?","Private nuisance: substantial and unreasonable interference with another’s use and enjoyment of land, judged by the effect on a person of ordinary sensibilities in the community. Public nuisance: unreasonable interference with a right common to the public; a private party may sue only with a special injury different in kind from the public’s.","torts-24"],
["Defamation elements and constitutional fault requirements?","Defamatory statement of fact, of and concerning the plaintiff, published to a third party, causing damage (falsity required where the matter is of public concern). Public officials and public figures must prove actual malice — knowledge of falsity or reckless disregard for truth (NYT v. Sullivan). Private plaintiffs on matters of public concern must prove at least negligence; presumed or punitive damages then require actual malice.","torts-25"],
["Slander per se and libel?","Slander (spoken) requires proof of special (pecuniary) damages unless it is slander per se: imputing a crime, a loathsome disease, conduct incompatible with one’s business/profession, or serious sexual misconduct. Libel (written/fixed) traditionally allows presumed general damages.","torts-26"],
["Invasion of privacy torts?","(1) Appropriation of name or likeness for commercial advantage; (2) intrusion upon seclusion (highly offensive to a reasonable person); (3) false light (highly offensive; actual malice if a matter of public concern); (4) public disclosure of private facts (highly offensive, not of legitimate public concern).","torts-27"],
["Intentional and negligent misrepresentation?","Intentional (fraud): false representation of material fact, scienter (knowledge or reckless disregard), intent to induce reliance, justifiable reliance, and damages. Negligent misrepresentation: generally limited to those in a business or professional capacity supplying false information for the guidance of others, causing pecuniary loss to a limited group of foreseeable relying persons.","torts-28"],
["Damages in tort?","Compensatory (economic and noneconomic, e.g., pain and suffering); punitive damages for malicious, willful, wanton, or reckless conduct (subject to due-process limits). The plaintiff must mitigate. Collateral-source rule (traditional): benefits from independent sources don’t reduce recovery. Pure economic loss is generally not recoverable in negligence absent personal injury or property damage.","torts-29"]

CARDS.ba = [
["How is an agency relationship created?","By mutual assent: the principal manifests that the agent shall act on its behalf and subject to its control, and the agent consents. No writing or consideration is generally required (some states’ equal-dignities rules require a writing when the underlying contract must be in writing).","ba-0"],
["Actual authority (express and implied)?","Authority the agent reasonably believes it has based on the principal’s manifestations to the agent. Implied actual authority covers acts necessary or incidental to accomplishing the expressly authorized task, and acts the agent reasonably believes the principal wants based on past dealings or custom.","ba-1"],
["Apparent authority?","Exists when a third party reasonably believes the agent has authority to act for the principal, and that belief is traceable to the principal’s manifestations to the third party (e.g., title/position, prior dealings). It can linger after termination until the third party has notice.","ba-2"],
["Ratification?","A principal who, with knowledge of the material facts, affirms an unauthorized act (expressly, or by conduct such as accepting benefits) is bound as if it had been authorized from the start. The principal must ratify the entire transaction and must have existed and had capacity at the time of the act and at ratification.","ba-3"],
["Agent’s liability on contracts?","Disclosed principal: the agent is not a party (if authorized). Unidentified (partially disclosed) principal: the agent is a party, along with the principal. Undisclosed principal: the agent is a party; the principal is also bound if the agent acted with actual authority. An agent who lacked authority is liable to the third party for breach of the implied warranty of authority.","ba-4"],
["Principal’s tort liability for agents?","Respondeat superior: liable for torts of employees committed within the scope of employment. Generally not liable for torts of nonemployee agents/independent contractors (no control over physical conduct), except for nondelegable duties, inherently dangerous activities, or the principal’s own negligence (hiring, supervision).","ba-5"],
["Agent’s fiduciary duties to the principal?","Duty of loyalty (no self-dealing, no competing, no usurping opportunities, no secret profits — act solely for the principal’s benefit); duty of care, competence, and diligence; duty of obedience (follow reasonable instructions); duty to provide information. The principal owes duties to compensate, reimburse, and indemnify.","ba-6"],
["Formation of a general partnership (RUPA)?","An association of two or more persons to carry on as co-owners a business for profit forms a partnership, whether or not they intend to. Sharing profits creates a presumption of partnership, except when received as payment of a debt, wages, rent, an annuity, interest on a loan, or for the sale of goodwill. No filing is required.","ba-7"],
["Partners’ personal liability (RUPA)?","All partners are jointly and severally liable for all partnership obligations. A judgment creditor generally must first exhaust partnership assets before levying on a partner’s personal assets. A newly admitted partner is not personally liable for obligations incurred before admission (but that partner’s capital contribution is at risk).","ba-8"],
["Partner’s authority to bind the partnership?","Each partner is an agent of the partnership; an act apparently carrying on in the ordinary course of the partnership business (or business of the kind) binds the partnership unless the partner lacked authority and the third party knew or had notice of that. A filed statement of partnership authority may expand or limit authority.","ba-9"],
["Partnership default management and financial rules?","Each partner has equal management rights. Ordinary-course matters: majority vote. Acts outside the ordinary course and amendments to the partnership agreement: unanimous consent. Profits are shared equally (per capita) absent agreement; losses are shared in the same proportion as profits. No right to remuneration except for winding up.","ba-10"],
["Partners’ fiduciary duties (RUPA)?","Duty of loyalty: account for partnership benefits/opportunities, refrain from dealing adversely, and refrain from competing before dissolution. Duty of care: refrain from grossly negligent or reckless conduct, intentional misconduct, or a knowing violation of law. Plus the obligation of good faith and fair dealing. The agreement may not eliminate these duties but may narrow them within statutory limits.","ba-11"],
["Dissociation and dissolution of a partnership (RUPA)?","A partner’s dissociation ends its management rights. In an at-will partnership, a partner’s express will to withdraw causes dissolution; in a term partnership, dissociation before expiration is wrongful (liable for damages) and dissolution occurs only on specified events. After dissolution, the partnership winds up its affairs. If no dissolution results, the partnership must buy out the dissociated partner.","ba-12"],
["Transfer of a partnership interest?","A partner may transfer its transferable interest — the right to receive distributions — without dissolving the partnership. The transferee does not become a partner and gets no management or information rights unless all the partners consent.","ba-13"],
["Limited partnerships and LLPs?","LP: formed by filing a certificate; at least one general partner (personally liable for obligations) and one limited partner. Under ULPA (2001), limited partners are not personally liable even if they participate in management (older acts had a control rule). LLP: a general partnership that files a statement of qualification; partners are shielded from personal liability for partnership obligations.","ba-14"],
["Formation of a corporation and defective incorporation?","File articles of incorporation with the state, typically stating the name, number of authorized shares, registered agent and office, and each incorporator’s name and address. Defective incorporation: some states retain de facto corporation/corporation-by-estoppel doctrines; under MBCA §2.04, persons who purport to act for a corporation knowing there was no incorporation are jointly and severally liable.","ba-15"],
["Promoter liability for pre-incorporation contracts?","A promoter is personally liable on contracts made for a corporation not yet formed (unless the contract clearly shows otherwise). The corporation becomes liable only if it adopts the contract, expressly or impliedly (e.g., accepting benefits with knowledge). The promoter remains liable unless there is a novation.","ba-16"],
["Piercing the corporate veil?","Courts disregard limited liability to hold shareholders personally liable when they abuse the corporate form to perpetrate fraud or injustice — e.g., alter ego/commingling of funds, inadequate capitalization at formation, failure to observe formalities, or use of the corporation to evade obligations. Most often applied to closely held corporations and parent-subsidiary situations.","ba-17"],
["Board of directors: quorum and action?","Quorum: a majority of the fixed number of directors (unless the articles/bylaws provide otherwise). Action requires the affirmative vote of a majority of directors present at a meeting with a quorum, or unanimous written consent without a meeting. Directors may not vote by proxy or through binding voting agreements. A director present is presumed to assent unless the dissent is noted.","ba-18"],
["Duty of care and the business judgment rule?","Directors must act in good faith, with the care a person in a like position would reasonably believe appropriate, and in a manner reasonably believed to be in the corporation’s best interests. The BJR presumes informed, good-faith, disinterested decisions are proper; challengers must rebut it. Articles may exculpate directors from money damages except for improper financial benefit, intentional harm to the corporation or shareholders, unlawful distributions, or intentional criminal violations.","ba-19"],
["Duty of loyalty: conflicting-interest transactions and corporate opportunities?","A director’s conflicting-interest transaction is protected (MBCA safe harbor) if approved after full disclosure by qualified (disinterested) directors, or by disinterested shareholders, or if it was fair to the corporation when entered. Corporate opportunity: a director/officer must first offer the corporation a business opportunity in which it has an interest or expectancy (or within its line of business) before taking it personally.","ba-20"],
["Shareholder meetings, quorum, and voting (MBCA defaults)?","Annual meeting required; special meetings may be called by the board or by holders of at least 10% of the votes entitled to be cast. Notice: 10–60 days before the meeting. Quorum: a majority of votes entitled to be cast. Action is approved if votes cast in favor exceed votes cast against; directors are elected by a plurality.","ba-21"],
["Shareholder voting arrangements?","Proxy: a written or electronically transmitted appointment; revocable unless it states that it is irrevocable and is coupled with an interest. Voting trusts (written, filed with the corporation) and voting agreements are permitted. Cumulative voting for directors exists only if the articles provide for it (MBCA).","ba-22"],
["Fundamental corporate changes?","Mergers, share exchanges, sales of all or substantially all assets outside the ordinary course, most amendments to the articles, and dissolution require board approval plus shareholder approval (voting thresholds vary by statute). Shareholders who dissent from a merger, share exchange, or sale of substantially all assets generally have appraisal rights (fair value), subject to market-out exceptions.","ba-23"],
["Shareholder derivative suits?","A shareholder sues on the corporation’s behalf for harm to the corporation; recovery goes to the corporation. Requirements: contemporaneous ownership (shareholder at the time of the wrong), fair and adequate representation, and (MBCA universal demand) a written demand on the board, then waiting 90 days unless the demand is rejected earlier or irreparable injury would result. Delaware excuses demand if futile.","ba-24"],
["Shareholder inspection rights (MBCA)?","With 5 business days’ written notice, a shareholder may inspect basic records (articles, bylaws, shareholder minutes, etc.). Other records (board minutes, accounting records, the shareholder list) require a demand made in good faith, for a proper purpose described with reasonable particularity, with the records directly connected to that purpose.","ba-25"],
["Limits on corporate distributions?","A board may authorize distributions unless afterward (1) the corporation would be unable to pay its debts as they come due in the usual course of business (equity insolvency), or (2) total assets would be less than total liabilities plus amounts needed for senior liquidation preferences (balance-sheet test). Directors who vote for an unlawful distribution are personally liable to the corporation; shareholders who knowingly receive it must repay.","ba-26"],
["Fiduciary duties of controlling shareholders?","Controlling shareholders who engage in self-dealing or use control to benefit themselves at the minority’s expense must show the transaction was fair. In close corporations, many states impose partner-like duties of utmost good faith among shareholders, and courts may remedy oppression of minority shareholders (e.g., buyout, dissolution).","ba-27"],
["Limited liability companies (LLCs)?","Formed by filing a certificate/articles of organization. Members are not personally liable for LLC obligations solely by reason of membership (veil-piercing remains possible). Default: member-managed, with members owing duties of loyalty and care; in a manager-managed LLC, the managers owe those duties. Default tax treatment is pass-through. Operating agreements may modify many default rules.","ba-28"],
["Ultra vires acts?","Modern statutes allow corporations to engage in any lawful business, so ultra vires is rarely a defense. Lack of corporate power may be raised only in (1) a shareholder suit to enjoin the act, (2) a corporate suit against current/former directors or officers, or (3) a proceeding by the state attorney general.","ba-29"]
];

const MCQ = [
{"id":"civpro_0","s":"civpro","q":"A plaintiff domiciled in Ohio sues two defendants in federal court in Ohio for $200,000 in damages on a state-law negligence claim. One defendant is domiciled in Kentucky; the other is domiciled in Ohio. No federal law is involved. Does the court have subject-matter jurisdiction over the action as filed?","o":["Yes, because the amount in controversy exceeds $75,000.","Yes, because at least one defendant is diverse from the plaintiff.","No, because the Ohio defendant shares the plaintiff’s citizenship, so complete diversity is lacking.","No, because negligence claims may be heard only in state court."],"a":2,"e":"Diversity jurisdiction under §1332 requires complete diversity: no plaintiff may share citizenship with any defendant. The Ohio defendant destroys diversity, and there is no federal question. (A court might cure the defect by dropping a dispensable nondiverse party under Rule 21, but the action as filed lacks jurisdiction.) State courts are not exclusive forums for negligence claims."},
{"id":"civpro_1","s":"civpro","q":"A corporation is incorporated in Delaware. Its officers direct and control its business from headquarters in Columbus, Ohio, but most of its employees and manufacturing are in Indiana. For diversity purposes, the corporation is a citizen of:","o":["Delaware only.","Delaware and Ohio.","Delaware and Indiana.","Delaware, Ohio, and Indiana."],"a":1,"e":"A corporation is a citizen of every state of incorporation and the state of its principal place of business, which is its “nerve center” — where high-level officers direct, control, and coordinate activities (Hertz v. Friend). That is Ohio, not the site of most operations (Indiana)."},
{"id":"civpro_2","s":"civpro","q":"A Pennsylvania citizen sued an Ohio citizen in Ohio state court on a state-law contract claim seeking $150,000. Fifteen days after service, the defendant removed the case to the federal district court in Ohio. Ten days after removal, the plaintiff moved to remand. How should the court rule?","o":["Deny the motion, because the parties are completely diverse and the amount in controversy exceeds $75,000, exclusive of interest and costs.","Deny the motion, because the defendant filed the notice of removal within 30 days after being served with the complaint.","Grant the motion, because a properly joined and served defendant is a citizen of the forum state.","Grant the motion, because breach-of-contract claims arise under state law and therefore cannot be removed to federal court."],"a":2,"e":"Under the forum-defendant rule (§1441(b)(2)), a case removable only on diversity grounds may not be removed if any properly joined and served defendant is a citizen of the state where the action was brought. Because this defect is non-jurisdictional, it must be raised within 30 days of removal — the plaintiff did so."},
{"id":"civpro_3","s":"civpro","q":"Two citizens of the same state are in a dispute. The plaintiff sues in state court for breach of a state-law contract. The defendant removes, arguing that its defense — that federal law preempts the plaintiff’s claim — presents a substantial federal question. The plaintiff moves to remand. How should the court rule?","o":["Deny remand, because resolving the case will require the court to interpret and apply a federal statute.","Deny remand, because a preemption defense always presents a substantial federal question supporting removal.","Grant remand, because a federal defense does not make a case “arise under” federal law.","Grant remand, because the defendant did not obtain the plaintiff’s consent to removal."],"a":2,"e":"Under the well-pleaded complaint rule, federal-question jurisdiction exists only when the federal issue appears in the plaintiff’s own claim; an anticipated or actual federal defense, including ordinary preemption, does not suffice. With no diversity, the case must be remanded. A plaintiff’s consent is never required for removal."},
{"id":"civpro_4","s":"civpro","q":"A defendant filed a pre-answer motion to dismiss for failure to state a claim. After the motion was denied, the defendant filed an answer asserting, for the first time, that the court lacks personal jurisdiction. The plaintiff moves to strike the defense. How should the court rule?","o":["Deny the motion, because personal jurisdiction is a due-process requirement that a party can never waive.","Deny the motion, because a defendant may raise any Rule 12(b) defense in a timely answer, even after a Rule 12 motion.","Grant the motion, because the defense was waived when it was omitted from the defendant’s Rule 12 motion.","Grant the motion, because a personal-jurisdiction objection must be raised within 7 days after service of process."],"a":2,"e":"Under Rule 12(g)–(h), the defenses of lack of personal jurisdiction, improper venue, insufficient process, and insufficient service are waived if a party makes a Rule 12 motion and omits them. Personal jurisdiction is an individual right that can be waived, unlike subject-matter jurisdiction."},
{"id":"civpro_5","s":"civpro","q":"A federal court is hearing a diversity action on a state-law tort claim. The forum state has a two-year statute of limitations for the claim; the plaintiff filed suit 30 months after the injury. The plaintiff argues that federal courts apply a uniform federal limitations period. What law should the court apply to determine timeliness?","o":["Federal common law, because limitations periods are procedural.","The Federal Rules of Civil Procedure, which set a three-year default limitations period.","State law, as determined by the forum state’s law including its choice-of-law rules.","The law most favorable to the plaintiff."],"a":2,"e":"Under Erie and Guaranty Trust v. York, statutes of limitations are substantive for Erie purposes, so a federal court sitting in diversity applies the state limitations period. Under Klaxon, it applies the forum state’s choice-of-law rules to decide which state’s law governs. The Federal Rules contain no general limitations period."},
{"id":"civpro_6","s":"civpro","q":"In a car-accident case, the defendant moved for summary judgment, supported by an affidavit from an eyewitness swearing that the light was green for the defendant. The plaintiff responded with an affidavit from a different eyewitness swearing that the light was red for the defendant. The judge finds the defendant’s witness more credible. How should the court rule?","o":["Grant the motion, because the court found the defendant’s witness more credible.","Grant the motion, because the defendant filed first.","Deny the motion, because there is a genuine dispute of material fact.","Deny the motion, because summary judgment is unavailable in negligence cases."],"a":2,"e":"Summary judgment requires no genuine dispute of material fact. On a summary-judgment motion the court views the evidence in the light most favorable to the nonmovant and may not make credibility determinations or weigh conflicting evidence. Conflicting sworn eyewitness accounts on a material fact create a jury question."},
{"id":"civpro_7","s":"civpro","q":"At the close of all evidence in a jury trial, the defendant did not move for judgment as a matter of law. The jury returned a verdict for the plaintiff. Ten days after entry of judgment, the defendant filed a renewed motion for judgment as a matter of law, arguing the evidence was legally insufficient. How should the court rule?","o":["Grant the motion if no reasonable jury could have found for the plaintiff on the evidence presented at trial.","Deny the motion, because the defendant made no Rule 50(a) motion before the case went to the jury.","Deny the motion, because a renewed motion must be filed within 7 days after entry of judgment.","Grant the motion, because legal sufficiency of the evidence may be challenged at any time, even after judgment."],"a":1,"e":"A renewed JMOL motion under Rule 50(b) is permitted only if the party made a Rule 50(a) motion before the case was submitted to the jury. The defendant could instead seek a new trial under Rule 59. The deadline for a Rule 50(b) motion is 28 days after entry of judgment, so timing was not the problem."},
{"id":"civpro_8","s":"civpro","q":"A driver sued another driver in state court for property damage to her car from a collision and won a final judgment. She then filed a second action against the same defendant for personal injuries suffered in the same collision. The defendant moves to dismiss. How should the court rule?","o":["Deny the motion, because claims for personal injury and for property damage are separate causes of action.","Deny the motion, because the personal-injury issue was never actually litigated or decided in the first action.","Grant the motion, because claim preclusion bars same-transaction claims that could have been brought earlier.","Grant the motion only if the defendant shows the plaintiff deliberately split her claims in bad faith."],"a":2,"e":"Under the modern transactional approach, claim preclusion bars all claims arising out of the same transaction or occurrence between the same parties after a valid final judgment on the merits, whether or not they were actually litigated. The “actually litigated” requirement belongs to issue preclusion."},
{"id":"civpro_9","s":"civpro","q":"An Ohio plaintiff sued a Michigan defendant in federal court for $100,000 on a state-law claim, invoking diversity jurisdiction. The defendant impleaded a third-party defendant, a citizen of Ohio, under Rule 14. The plaintiff then asserted a $100,000 state-law claim directly against the third-party defendant arising from the same occurrence. Does the court have jurisdiction over the plaintiff’s claim against the third-party defendant?","o":["Yes, because the claim arises from the same occurrence and so falls within supplemental jurisdiction under §1367(a).","Yes, because the third-party defendant was properly impleaded and is already before the court.","No, because §1367(b) bars a plaintiff’s claims against Rule 14 parties in diversity-only cases.","No, because Rule 14 does not permit a plaintiff to assert any claim directly against a third-party defendant."],"a":2,"e":"Section 1367(b) withholds supplemental jurisdiction over claims by plaintiffs against persons made parties under Rule 14 when exercising it would be inconsistent with §1332 (codifying Owen Equipment v. Kroger). With both parties from Ohio, there is no independent basis. Rule 14(a)(3) does permit the plaintiff to assert such a claim; jurisdiction is the obstacle."},
{"id":"civpro_10","s":"civpro","q":"Which of the following district-court orders is immediately appealable as of right?","o":["An order denying a motion to dismiss for failure to state a claim.","An order granting the plaintiff’s motion for a preliminary injunction against the defendant.","An order denying a motion for summary judgment.","An order compelling the production of documents in discovery."],"a":1,"e":"Under 28 U.S.C. §1292(a)(1), interlocutory orders granting, continuing, modifying, refusing, or dissolving injunctions are immediately appealable. The other orders are interlocutory and generally reviewable only after final judgment (absent §1292(b) certification or mandamus)."},
{"id":"civpro_11","s":"civpro","q":"An Illinois plaintiff sues two individual defendants in federal court on a diversity claim. One defendant resides in the Southern District of Ohio; the other resides in the Northern District of Ohio. The events giving rise to the claim occurred entirely in Indiana. Which of the following is a proper venue?","o":["The Northern District of Illinois, where the plaintiff resides.","The Southern District of Ohio, where one of the two defendants resides.","Any federal district, because the defendants are individuals.","Only the district in Indiana where the events occurred."],"a":1,"e":"Under §1391(b)(1), venue is proper in any district where any defendant resides if all defendants reside in the same state — so either Ohio district works. Venue would also be proper in the Indiana district under §1391(b)(2), so “only” Indiana is wrong. The plaintiff’s residence is irrelevant to venue."},
{"id":"conlaw_0","s":"conlaw","q":"A federal statute authorizes a federal agency to lease surplus federal land to private developers. A citizen sues in federal court, alleging only that the leases violate the statute and that, as a citizen and taxpayer, she has an interest in seeing the law properly enforced. The government moves to dismiss. How should the court rule?","o":["Deny the motion, because every citizen has standing to require the government to obey the law.","Deny the motion, because federal taxpayers have standing to challenge any federal expenditure.","Grant the motion, because the citizen asserts only a generalized grievance and lacks standing.","Grant the motion, because the leasing of federal land is a political question committed to Congress."],"a":2,"e":"Standing requires a concrete and particularized injury. An interest in proper application of the law shared by all citizens is a generalized grievance. Federal taxpayer standing is limited to Establishment Clause challenges to congressional taxing-and-spending legislation (Flast), which this is not."},
{"id":"conlaw_1","s":"conlaw","q":"Congress enacts a statute regulating the small-scale cultivation of a crop for home consumption, finding that home cultivation, in the aggregate, substantially affects the national market for that crop. A grower who raises the crop only for personal use challenges the statute. The statute is most likely:","o":["Unconstitutional, because home cultivation is purely intrastate and noncommercial.","Unconstitutional, because agriculture is a matter reserved to the states.","Constitutional, because in the aggregate such home cultivation substantially affects interstate commerce.","Constitutional, because Congress has a general police power over public welfare."],"a":2,"e":"Under Wickard v. Filburn and Gonzales v. Raich, Congress may regulate intrastate production and consumption of a commodity for which there is an interstate market, because the aggregate effect is substantial. Congress has no general police power."},
{"id":"conlaw_2","s":"conlaw","q":"A state enacts a law requiring that all milk sold in the state be pasteurized at facilities located within the state, citing health concerns. Out-of-state dairies that pasteurize milk under equally rigorous standards challenge the law. The law is most likely:","o":["Constitutional, because protecting the health and safety of consumers is a traditional and legitimate state concern.","Constitutional, because Congress has not enacted any legislation regulating milk pasteurization or sale.","Unconstitutional, because it discriminates against interstate commerce without adequate justification.","Unconstitutional, because it denies out-of-state dairies the protection of the Privileges and Immunities Clause of Article IV."],"a":2,"e":"Under the dormant Commerce Clause, a law that discriminates against out-of-state commerce is virtually per se invalid unless necessary to serve a legitimate local purpose that cannot be served by reasonable nondiscriminatory alternatives. Uniform health standards would serve the purpose. Corporations are not protected by Article IV’s Privileges and Immunities Clause."},
{"id":"conlaw_3","s":"conlaw","q":"A state-run nursing school limits admission to women. A qualified man denied admission sues, alleging an equal protection violation. Which standard will the court apply?","o":["The state must show only that the admissions policy is rationally related to a legitimate government interest.","The man must prove the policy is not rationally related to any conceivable legitimate government interest.","The state must show the classification is substantially related to an important government interest.","The state must show the policy is necessary to achieve a compelling government interest by the least restrictive means."],"a":2,"e":"Sex-based classifications receive intermediate scrutiny: the government must show the classification is substantially related to an important governmental objective, with an “exceedingly persuasive justification” (Mississippi University for Women v. Hogan; U.S. v. Virginia). The burden is on the government."},
{"id":"conlaw_4","s":"conlaw","q":"A city ordinance prohibits all signs on residential lawns except “for sale” real estate signs and signs identifying the homeowner. A homeowner who wants to post a political sign challenges the ordinance. A court will most likely:","o":["Uphold the ordinance, because it is a reasonable, content-neutral time, place, and manner regulation of residential signs.","Uphold the ordinance because residential lawns are nonpublic forums.","Strike down the ordinance because it is content-based and not narrowly tailored to a compelling interest.","Strike down the ordinance only if the homeowner shows the city intended to suppress political views."],"a":2,"e":"A law that distinguishes speech by its subject matter (real-estate signs allowed, political signs barred) is content-based and triggers strict scrutiny regardless of motive (Reed v. Town of Gilbert). Interests in aesthetics or traffic safety are unlikely to satisfy strict scrutiny, and the city has nearly foreclosed an important medium of expression (City of Ladue v. Gilleo)."},
{"id":"conlaw_5","s":"conlaw","q":"A city ordinance prohibits the use of amplified sound in public parks between 10 p.m. and 7 a.m. A musical group wishing to hold a late-night amplified concert challenges the ordinance. The ordinance is most likely:","o":["Unconstitutional, because parks are traditional public forums in which government may not restrict expressive activity at all.","Unconstitutional, because musical performance is expressive conduct and any restriction on it triggers strict scrutiny.","Constitutional, as a content-neutral time, place, and manner rule that leaves ample alternatives.","Constitutional, because amplified sound is noise rather than speech and receives no First Amendment protection."],"a":2,"e":"Content-neutral time, place, and manner restrictions in a public forum are valid if narrowly tailored to serve a significant government interest (here, residents’ quiet at night) and leave open ample alternative channels (daytime amplification, unamplified performance). Narrow tailoring does not require the least restrictive means (Ward v. Rock Against Racism)."},
{"id":"conlaw_6","s":"conlaw","q":"A state criminal law prohibits possession of a particular hallucinogenic substance, with no exceptions. A member of a religious group that uses the substance in its ceremonies is prosecuted and argues the law violates the Free Exercise Clause. The court should:","o":["Apply strict scrutiny, because the law burdens a sincere religious practice.","Uphold the law, because it is a neutral law of general applicability rationally related to a legitimate interest.","Strike down the law, because the Free Exercise Clause requires the state to exempt sincere religious ceremonies.","Uphold the law only if the state shows the substance is more dangerous than alcohol."],"a":1,"e":"Under Employment Division v. Smith, a neutral, generally applicable law that incidentally burdens religious practice is subject only to rational-basis review. Strict scrutiny would apply if the law targeted religion or allowed comparable secular exemptions. (Federal law, such as RFRA, may provide statutory protection against federal action, but this is a state prosecution under the Constitution.)"},
{"id":"conlaw_7","s":"conlaw","q":"A state statute requires apartment building owners to permit a cable company to install a small cable box and wires permanently on the roof of their buildings. The statute caps the owner’s compensation at $1. An owner challenges the statute. A court will most likely hold that:","o":["There is no taking, because the economic impact on the owner is minimal and investment-backed expectations are intact.","There is no taking, because the statute serves the public purpose of expanding access to cable service.","There is a taking requiring just compensation, because the statute authorizes a permanent physical occupation.","There is a taking only if the owner loses all economically beneficial use of the building."],"a":2,"e":"A permanent physical occupation authorized by the government is a per se taking regardless of size or the public interest served (Loretto v. Teleprompter Manhattan CATV). The Lucas total-wipeout test and Penn Central balancing apply to regulatory restrictions, not physical occupations."},
{"id":"conlaw_8","s":"conlaw","q":"A privately owned shopping mall prohibits all leafleting on its premises. A group distributing political leaflets in the mall is ejected and sues the mall, claiming a violation of the First Amendment. The group’s best chance of success depends on which of the following?","o":["Showing that the mall is open to the public.","Showing that the mall’s conduct constitutes state action.","Showing that the leaflets concern matters of public concern.","Showing that the mall’s policy is not content-neutral."],"a":1,"e":"The First Amendment restricts only government action. A privately owned mall is generally not a state actor (Hudgens v. NLRB), even though open to the public. Unless the group can show state action (e.g., a public function or entanglement), there is no federal constitutional claim; some state constitutions provide broader protection (PruneYard)."},
{"id":"conlaw_9","s":"conlaw","q":"A tenured professor at a state university was dismissed for alleged misconduct without any notice of the charges or opportunity to respond. She sues, claiming a violation of due process. Which is the most accurate statement?","o":["She has no claim, because public employment is a privilege rather than a right and may be withdrawn at will.","She has no claim, because a post-termination lawsuit for back pay provides all the process that is due.","She was entitled to notice and a chance to respond before termination, because tenure is a property interest.","She was entitled to a full trial-type hearing, with counsel and cross-examination of witnesses, before any adverse action was taken."],"a":2,"e":"Tenure creates a legitimate claim of entitlement — a property interest. Under Cleveland Board of Education v. Loudermill and Mathews balancing, a tenured public employee generally must receive notice and a pre-termination opportunity to respond, with fuller post-termination procedures. A full trial-type pre-termination hearing is not required."},
{"id":"conlaw_10","s":"conlaw","q":"A contractor sues a state in federal court for money damages, alleging the state breached a construction contract governed by state law. The state has not consented to suit. The court should:","o":["Hear the case under diversity jurisdiction, because the contractor and the state are citizens of different states.","Hear the case, because the Contracts Clause gives the contractor a federal right to enforce the state’s promise.","Dismiss the case, because state sovereign immunity bars this damages suit in federal court.","Dismiss the case only if the state proves that the construction contract was invalid under state law."],"a":2,"e":"State sovereign immunity (Eleventh Amendment) bars private suits for damages against an unconsenting state in federal court. A state is not a citizen for diversity purposes anyway. An Ex parte Young suit for prospective injunctive relief against a state officer for an ongoing federal-law violation would be different."},
{"id":"conlaw_11","s":"conlaw","q":"A federal statute requires county sheriffs to conduct background checks on prospective handgun purchasers until a federal system becomes operational. A sheriff challenges the requirement. The statute is most likely:","o":["Constitutional under the Commerce Clause, because handgun sales are economic activity that substantially affects interstate commerce.","Constitutional under the Necessary and Proper Clause, because the checks are an interim means of executing federal law.","Unconstitutional, because Congress may not commandeer state executive officers to administer a federal regulatory program.","Unconstitutional, because a background-check requirement infringes the Second Amendment right to keep and bear arms."],"a":2,"e":"Printz v. United States held that Congress may not compel state or local officers to administer or enforce a federal regulatory program. Congress could regulate purchasers directly or offer funding conditioned on state participation."},
{"id":"contracts_0","s":"contracts","q":"On Monday, a seller mailed a buyer a written offer to sell a used tractor for $20,000; the buyer received it Tuesday. On Tuesday afternoon, the seller mailed a letter revoking the offer, which the buyer received on Thursday. On Wednesday, the buyer mailed a properly addressed acceptance, which the seller received on Friday. Is there a contract?","o":["No, because the revocation was mailed before the acceptance.","No, because the revocation reached the buyer first.","Yes, a contract was formed on Wednesday when the acceptance was mailed.","Yes, a contract was formed on Friday, on receipt."],"a":2,"e":"Under the mailbox rule, a properly dispatched acceptance is effective on dispatch (Wednesday). A revocation is effective only on receipt (Thursday). Because the acceptance took effect before the revocation was received, a contract was formed Wednesday. (This is a sale of goods, but the UCC does not displace the common-law mailbox rule.)"},
{"id":"contracts_1","s":"contracts","q":"A consumer who is not a merchant mailed a furniture store a signed order for a sofa at the advertised price. The store responded with a signed form stating “Order accepted,” which also included a clause requiring 18% annual interest on any late payment. The consumer never responded to the interest clause. Which statement is most accurate?","o":["There is no contract, because the store’s response added a new term and therefore operated as a counteroffer.","There is a contract that includes the interest clause, because the consumer did not object within a reasonable time.","There is a contract; the interest clause is only a proposal that the consumer has not accepted.","There is a contract that includes the interest clause, but only if the clause does not materially alter the deal."],"a":2,"e":"Under UCC §2-207(1), a definite and seasonable expression of acceptance operates as an acceptance even if it states additional terms (unless expressly conditional on assent to them). Under §2-207(2), additional terms are proposals; they automatically become part of the contract only between merchants (and then only if not material, etc.). The consumer is not a merchant, so the clause is merely a proposal."},
{"id":"contracts_2","s":"contracts","q":"A dealer in industrial pumps gave a contractor a signed letter offering to sell 10 pumps at $3,000 each and stating, “This offer will remain open for 30 days.” The contractor gave no consideration. On day 10, the dealer telephoned to revoke. On day 15, the contractor sent a written acceptance. Is there an enforceable contract?","o":["No, because the offer was revoked before the contractor accepted.","No, because the promise to hold the offer open lacked consideration.","Yes, because the dealer’s signed firm offer could not be revoked during the stated 30 days.","Yes, but only if the contractor relied on the offer to its detriment."],"a":2,"e":"UCC §2-205: a firm offer by a merchant in a signed writing that by its terms gives assurance it will be held open is not revocable, for lack of consideration, during the time stated (not to exceed three months). The attempted revocation on day 10 was ineffective; acceptance on day 15 formed a contract. Reliance is not required."},
{"id":"contracts_3","s":"contracts","q":"A builder contracted to build a garage for a homeowner for $40,000. Halfway through, with no unforeseen difficulties, the builder said he would stop work unless the homeowner agreed to pay an additional $5,000. The homeowner agreed in writing. When the garage was finished, the homeowner paid only $40,000. In the builder’s suit for the additional $5,000, the homeowner will most likely:","o":["Lose, because the homeowner agreed to the modification in a signed writing, which makes it enforceable.","Lose, because the homeowner accepted the benefit of a completed garage built in reliance on the promise.","Win, because the builder gave no consideration for the promise of an additional $5,000.","Win, because a modification of a construction contract is enforceable only if approved by a court."],"a":2,"e":"This is a services contract governed by common law, where a modification requires consideration. Performance of a pre-existing duty is not consideration. The exception for fair and equitable modifications in light of unanticipated circumstances (R2d §89) does not apply because nothing unforeseen occurred. (Under the UCC, good faith would suffice — but this is not a sale of goods.)"},
{"id":"contracts_4","s":"contracts","q":"A restaurant orally ordered 10,000 custom-printed paper bags bearing its logo from a supplier for $6,000. After the supplier printed 7,000 bags, the restaurant repudiated. The bags are not suitable for sale to others. In the supplier’s suit, the restaurant raises the Statute of Frauds. The defense will most likely:","o":["Succeed, because the contract is for the sale of goods for $500 or more and there is no signed writing.","Succeed, because the supplier never sent the restaurant a written confirmation of the oral order.","Fail, because of the Statute of Frauds exception for specially manufactured goods.","Fail, because both parties are merchants, and contracts between merchants are exempt from the Statute of Frauds."],"a":2,"e":"UCC §2-201(3)(a) exempts goods specially manufactured for the buyer, not suitable for sale to others in the ordinary course of the seller’s business, where the seller made a substantial beginning before notice of repudiation. Merchants are not generally exempt; the merchant’s-confirmation exception requires a writing."},
{"id":"contracts_5","s":"contracts","q":"A buyer and seller signed a detailed written contract for the sale of a warehouse, containing a clause stating that the writing is the parties’ complete and exclusive agreement. In a later dispute, which of the following is admissible?","o":["Evidence of a prior oral agreement that the price would be $50,000 less than stated in the writing.","Evidence of a contemporaneous oral agreement that the seller would also convey an adjacent parking lot.","Evidence that the seller fraudulently misrepresented the building’s condition to induce the buyer to sign.","Evidence of a prior oral agreement that the closing date would be earlier than stated in the writing."],"a":2,"e":"For a fully integrated writing, the parol evidence rule bars prior or contemporaneous agreements that add to or contradict it. But evidence offered to show a defect in formation — fraud, duress, mistake — is always admissible, because it attacks the validity of the agreement itself."},
{"id":"contracts_6","s":"contracts","q":"An employer wrongfully fired an employee with one year remaining on a fixed-term contract at $60,000 per year. A week later, the employee was offered a substantially similar job in the same city for the same one-year period at $55,000. The employee declined and remained unemployed for the year. Ignoring incidental costs, how much can the employee recover?","o":["$60,000, because the employer breached and the employee was entitled to the full salary remaining under the contract.","$55,000, because that is the amount the employee could have earned in the substitute job.","$5,000, because damages are reduced by what the employee could have earned through reasonable mitigation.","Nothing, because the employee’s failure to mitigate bars any recovery for the wrongful discharge."],"a":2,"e":"A non-breaching party cannot recover losses that could have been avoided with reasonable effort. Rejecting a substantially similar job means the employee’s recovery is reduced by the $55,000 that could have been earned, leaving $5,000. Failure to mitigate reduces damages; it does not bar recovery entirely."},
{"id":"contracts_7","s":"contracts","q":"A contract called for a seller to deliver 100 blue chairs to a buyer by June 10. On June 5, the seller delivered 100 green chairs. The buyer rejected them. On June 6, the seller notified the buyer it would cure and delivered 100 conforming blue chairs on June 9. The buyer refused them, having found a cheaper supplier. Is the buyer in breach?","o":["No, because the first delivery was nonconforming and the perfect-tender rule allows rejection.","No, because the buyer had already rejected the goods.","Yes, because the seller seasonably notified the buyer and cured within the contract time.","Yes, because the green chairs substantially conformed."],"a":2,"e":"Under UCC §2-508(1), when a nonconforming tender is rejected and the time for performance has not yet expired, the seller may seasonably notify the buyer of its intention to cure and then make a conforming delivery within the contract time. The buyer must accept the conforming tender."},
{"id":"contracts_8","s":"contracts","q":"A debtor owed a creditor $10,000. The debtor sold her car to a buyer, who promised the debtor that, as the purchase price, he would pay $10,000 directly to the creditor. The buyer never paid. The creditor sues the buyer. The creditor will most likely:","o":["Lose, because the creditor was not a party to the contract between the debtor and the buyer.","Lose, because the creditor gave no consideration to the buyer.","Win, because the creditor is an intended beneficiary of the buyer’s promise.","Win only if the creditor first obtains a judgment against the debtor."],"a":2,"e":"The debtor (promisee) intended to give the creditor the benefit of the buyer’s (promisor’s) performance, making the creditor an intended beneficiary who may enforce the promise directly against the promisor. The creditor may also still pursue the debtor on the original debt."},
{"id":"contracts_9","s":"contracts","q":"In January, a manufacturer contracted to deliver specialized equipment to a buyer on June 1. In March, the manufacturer wrote to the buyer: “We will not deliver the equipment under any circumstances.” In April, the buyer sued for breach. The manufacturer moves to dismiss, arguing the suit is premature. How should the court rule?","o":["Grant the motion, because no breach can occur before the date on which performance is due.","Grant the motion, because the buyer was first required to demand adequate assurance of performance.","Deny the motion, because an unequivocal repudiation lets the buyer sue immediately.","Deny the motion, but only if the buyer has already bought substitute equipment from another seller."],"a":2,"e":"An anticipatory repudiation — a clear, unequivocal statement that a party will not perform — allows the non-repudiating party to treat it as a total breach and sue immediately (UCC §2-610; R2d §253). Demand for assurances is used when the situation is ambiguous; cover is optional."},
{"id":"contracts_10","s":"contracts","q":"A construction contract provided that the builder would pay $1,000 per day for each day of delay beyond the completion date. At signing, it was difficult to estimate the owner’s losses from delay, and $1,000 per day was a reasonable forecast. The builder finished 10 days late; the owner’s provable losses were about $7,000. How much may the owner recover?","o":["$7,000, because the owner’s recovery is limited to the actual losses it can prove.","$10,000, because the clause is an enforceable liquidated-damages provision.","Nothing, because liquidated-damages clauses are unenforceable penalties.","$17,000, combining actual and liquidated damages."],"a":1,"e":"A liquidated-damages clause is enforceable if the amount is reasonable in light of the anticipated or actual loss and damages were difficult to estimate. A reasonable forecast at formation is enforceable even if actual losses turn out somewhat lower. The owner recovers the liquidated sum, not both."},
{"id":"contracts_11","s":"contracts","q":"A merchant seller agreed to sell a buyer a machine, which the buyer was to pick up at the seller’s warehouse. The seller notified the buyer that the machine was ready. Before the buyer arrived, a fire not caused by either party destroyed the machine. The contract was silent on risk of loss. Who bears the loss?","o":["The buyer, because the seller had tendered the machine by notifying the buyer that it was ready.","The buyer, because title to the machine passed to the buyer when the contract was made.","The seller, because a merchant seller keeps the risk until the buyer receives the goods.","The parties share the loss equally, because neither party caused the fire."],"a":2,"e":"Under UCC §2-509(3), when no carrier is involved, if the seller is a merchant, risk of loss passes to the buyer only on the buyer’s receipt (taking physical possession) of the goods. A non-merchant seller’s risk passes on tender. Title is not determinative."},
{"id":"crim_0","s":"crim","q":"A defendant and his accomplice attempted to rob a liquor store. The store owner drew a gun and shot and killed the accomplice. The defendant was charged with felony murder for the accomplice’s death in a jurisdiction following the majority rule. He will most likely be:","o":["Convicted, because the death occurred during an inherently dangerous felony.","Convicted, because the accomplice’s death was a foreseeable result of the armed robbery attempt.","Acquitted, because the killing was committed by a non-felon resisting the felony.","Acquitted, because the robbery was not completed."],"a":2,"e":"Under the majority “agency” theory, felony-murder liability attaches only to killings committed by a felon or co-felon in furtherance of the felony. When a victim or police officer kills a co-felon, the surviving felon is not liable for felony murder. An attempted robbery can support felony murder, so the incompleteness is irrelevant."},
{"id":"crim_1","s":"crim","q":"A defendant rented a car for one week, honestly intending to return it. Three days later, she decided to keep the car and sold it to a buyer for cash. At common law, the defendant is guilty of:","o":["Larceny, because she intended to permanently deprive the rental company of its car.","Larceny by trick, because she obtained possession of the car by deception.","Embezzlement, because she fraudulently converted property she lawfully possessed.","False pretenses, because she obtained the car by misrepresentation."],"a":2,"e":"Because she obtained possession lawfully and without fraudulent intent, later conversion is embezzlement. Larceny by trick requires intent to steal at the time possession was obtained by deception. False pretenses requires obtaining title by misrepresentation."},
{"id":"crim_2","s":"crim","q":"During a cold night, a defendant broke a window of a stranger’s unoccupied house and climbed in, intending only to get out of the storm. Once inside, he saw jewelry and decided to take it, which he did. At common law, he is guilty of:","o":["Burglary and larceny.","Burglary only.","Larceny only.","Neither burglary nor larceny."],"a":2,"e":"Common-law burglary requires intent to commit a felony inside at the time of the breaking and entering. His intent to steal formed only after entry, so there is no burglary. Taking the jewelry with intent to permanently deprive is larceny."},
{"id":"crim_3","s":"crim","q":"A defendant and a friend agreed to rob a bank, and the defendant bought ski masks for the robbery. He kept the masks himself and never gave them to the friend. The next day, the defendant told the friend he was backing out and urged the friend not to go through with it. The friend robbed the bank alone, without the masks. In a majority jurisdiction, the defendant is guilty of:","o":["Conspiracy and robbery, because he bought the masks that were meant for the robbery.","Robbery only, because conspiracy merges into the completed robbery.","Conspiracy only, because he timely withdrew before the robbery and gave the friend no aid.","Neither crime, because his withdrawal before the robbery undid the agreement."],"a":2,"e":"Conspiracy: the crime was complete upon the agreement plus an overt act (buying the masks), and under the majority/common-law rule withdrawal does not undo a completed conspiracy. Robbery via conspiracy (Pinkerton): by communicating his withdrawal to all co-conspirators (here, the friend) before the robbery, he cut off Pinkerton liability for the later robbery. Robbery as an accomplice: withdrawal requires more than walking away. An accomplice must repudiate any encouragement AND neutralize any assistance he provided, e.g., retrieve the masks he supplied, give a timely warning to the police, or otherwise make a proper effort to thwart the crime. Here he expressly repudiated his encouragement before the robbery, and his only assistance (the masks) never reached the friend, so there was nothing left to neutralize and no accomplice liability. Had he handed the masks over, merely telling the friend he was out would not have been enough; he would have had to get the masks back, warn the police, or otherwise prevent the robbery. Result: conspiracy only."},
{"id":"crim_4","s":"crim","q":"After drinking heavily at a party, a defendant took a coat from a pile, honestly believing it was his own; it was nearly identical but belonged to another guest. He is charged with larceny. His best defense is:","o":["Voluntary intoxication is never a defense to any crime, so he has none.","He lacked the intent to steal, because he honestly believed the coat was his own.","His mistake was unreasonable because he was drunk, so it cannot negate the intent required for larceny.","Larceny is a strict-liability crime, so his belief is irrelevant."],"a":1,"e":"Larceny is a specific-intent crime requiring intent to permanently deprive another of property. An honest mistake of fact — even an unreasonable one — that negates that intent is a defense to a specific-intent crime. Voluntary intoxication can be relevant to specific-intent crimes as well."},
{"id":"crim_5","s":"crim","q":"After his arrest for burglary and receipt of Miranda warnings, a suspect said, “I want a lawyer.” Questioning stopped. Two hours later, while he remained in custody, a different detective, unaware of the request, gave fresh Miranda warnings and asked about an unrelated robbery. The suspect waived his rights and confessed to the robbery. The confession is:","o":["Admissible, because the questioning concerned a different crime.","Admissible, because he received fresh warnings and waived.","Inadmissible, because police reinitiated questioning after he asked for a lawyer.","Inadmissible, because his Sixth Amendment right had attached."],"a":2,"e":"Under Edwards v. Arizona and Arizona v. Roberson, once a suspect in custody unambiguously invokes the Miranda right to counsel, police may not initiate interrogation about any crime until counsel is present, unless the suspect initiates contact or there is a 14-day break in custody. The detective’s ignorance does not matter. The Sixth Amendment has not attached because no formal charges were filed."},
{"id":"crim_6","s":"crim","q":"An officer with reasonable suspicion that a suspect was armed stopped and frisked him. The officer felt a small, soft lump in the suspect’s pocket and determined it was not a weapon. The officer then squeezed and manipulated it until concluding it was a bag of cocaine, and seized it. On a motion to suppress, the court should:","o":["Deny the motion, because the frisk was supported by reasonable suspicion, so anything found during it may be seized.","Deny the motion, because the cocaine was properly seized under the plain-feel doctrine.","Grant the motion, because the officer exceeded the frisk’s scope by manipulating a known non-weapon.","Grant the motion, because officers may never seize anything other than weapons during a frisk."],"a":2,"e":"During a lawful Terry frisk, an officer may seize contraband whose identity is immediately apparent by plain feel. But once the officer knew the object was not a weapon, continued manipulation to determine its nature exceeded the frisk’s permissible scope (Minnesota v. Dickerson)."},
