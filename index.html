 // MCQ ids are FIXED in mcq.js. Fallback only if an item is missing an id; warn on duplicates.
 const seen=new Set();const cnt={};MCQ.forEach(q=>{cnt[q.s]=(cnt[q.s]||0);if(!q.id){q.id=q.s+'_new_'+cnt[q.s];console.warn('MCQ missing fixed id',q.q.slice(0,40));}cnt[q.s]++;if(seen.has(q.id))console.warn('duplicate MCQ id',q.id);seen.add(q.id);});
 ensureStart();buildNav();applyTheme();$('#themeBtn').onclick=toggleTheme;
 const pb=$('#pomoBtn');if(pb)pb.onclick=pomoPanel;drawPomo();

 tickCountdown();setInterval(tickCountdown,1000);

/* ===== Installable PWA (hosted site only) =====
   The single-file HTML has no <meta name="pwa">, so it never registers a service worker and works from file:// as before.
   make_site.py adds <meta name="pwa" content="1"> plus manifest/icons and writes sw.js stamped with BUILD. */
(function(){
 const hosted=!!document.querySelector('meta[name="pwa"]')&&/^https?:$/.test(location.protocol);
 const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
 const ua=navigator.userAgent||'';const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const isSafari=isIOS&&/Safari/.test(ua)&&!/CriOS|FxiOS|EdgiOS|GSA/.test(ua);
 const bar=document.getElementById('pwaBar');
 function show(html,bind){if(!bar)return;bar.innerHTML=html;bar.classList.remove('hidden');bind&&bind(bar);}
 function hide(){bar&&bar.classList.add('hidden');}
 window.PWA={hosted,standalone,isIOS,isSafari,swReady:false};
 if(!hosted)return;
 S.ui=S.ui||{};
 // iPhone Safari: one-time tip BEFORE starting, because the home-screen app keeps its own progress separate from Safari.
 if(isSafari&&!standalone&&!S.ui.iosTip){
  show(`<div class="pwa-in"><b>Install first (recommended)</b><div class="small">On iPhone, tap <b>Share</b> <span aria-hidden="true">⬆︎</span>, then <b>Add to Home Screen</b>, and open Bar Prep from your home screen. The home-screen app keeps its <b>own</b> progress, separate from Safari, so start there.</div><div class="row" style="margin-top:8px"><button class="btn primary sm" id="pwaOk">Got it</button><button class="btn ghost sm" id="pwaLater">Continue in Safari</button></div></div>`,b=>{
   const done=()=>{S.ui.iosTip=1;save();hide();};b.querySelector('#pwaOk').onclick=done;b.querySelector('#pwaLater').onclick=done;});
 }
 // Android / desktop Chrome: small dismissible install prompt.
 let deferred=null;
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(S.ui.installDismissed||standalone)return;
  show(`<div class="pwa-in row"><span><b>Install Bar Prep</b> <span class="small muted">for full-screen, offline use</span></span><span class="spacer"></span><button class="btn primary sm" id="pwaInstall">Install app</button><button class="btn ghost sm" id="pwaX" aria-label="Dismiss">✕</button></div>`,b=>{
   b.querySelector('#pwaInstall').onclick=async()=>{hide();if(!deferred)return;deferred.prompt();try{await deferred.userChoice;}catch(_){}deferred=null;};
   b.querySelector('#pwaX').onclick=()=>{S.ui.installDismissed=1;save();hide();};});});
 window.addEventListener('appinstalled',()=>{hide();toast('Installed. Open Bar Prep from your home screen or app list.');});
 if(!('serviceWorker' in navigator))return;
 let reloading=false;const hadController=!!navigator.serviceWorker.controller; // first install: no reload needed
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading||!hadController)return;reloading=true;location.reload();});
 const offerUpdate=w=>{if(!w)return;
  // Apply automatically on the next launch if the user hasn't interacted yet; otherwise show a banner.
  if(!window.__userActed&&performance.now()<4000){w.postMessage({type:'SKIP_WAITING'});return;}
  show(`<div class="pwa-in row"><span><b>Update available.</b> <span class="small muted">Your progress is kept.</span></span><span class="spacer"></span><button class="btn primary sm" id="pwaUpd">Tap to refresh</button></div>`,b=>{b.querySelector('#pwaUpd').onclick=()=>{w.postMessage({type:'SKIP_WAITING'});};});};
 ['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{window.__userActed=true;},{once:true,capture:true}));
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{PWA.swReady=true;PWA.reg=reg;
   if(reg.waiting&&navigator.serviceWorker.controller)offerUpdate(reg.waiting);
   reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offerUpdate(w);});});
   setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
   document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
  }).catch(err=>console.warn('SW registration failed',err));});
})();
