<style>
/* Calm, low-glare palette. All text/background pairs target WCAG AA (≥4.5:1 body text). */
:root{--bg:#f6f3ee;--panel:#fdfbf7;--panel2:#efeae2;--text:#26303b;--muted:#5b6573;--border:#e2dbd0;--accent:#3b6fb6;--accent-ink:#fff;--accent-soft:#e3ecf7;
 --good:#276b43;--good-soft:#e2f1e7;--warn:#8a5200;--warn-soft:#f8ecd9;--bad:#b83d3d;--bad-soft:#f8e3e1;--examc:#b83d3d;
 --s-civpro:#3b6fb6;--s-conlaw:#8a5cb8;--s-contracts:#2e8a7a;--s-crim:#b84f4f;--s-evidence:#c07a1a;--s-property:#5f8a2e;--s-torts:#c0577f;--s-ba:#56708f;
 --radius:18px;--shadow:0 1px 2px rgba(38,48,59,.05),0 4px 16px rgba(38,48,59,.05);--fs:17.5px;--lh:1.65;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--ls:0;
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);color-scheme:light}
[data-theme=dark]{--bg:#15191f;--panel:#1d232b;--panel2:#252c36;--text:#e4e7eb;--muted:#a3acb8;--border:#323b47;--accent:#8ab4f8;--accent-ink:#0f1720;--accent-soft:#22324a;
 --good:#7cc79a;--good-soft:#1f3328;--warn:#e7b267;--warn-soft:#3a2f1e;--bad:#f09a9a;--bad-soft:#3d2424;--examc:#e07a7a;
 --s-civpro:#8ab4f8;--s-conlaw:#c3a1e8;--s-contracts:#6fd0bd;--s-crim:#f09a9a;--s-evidence:#f0c070;--s-property:#a8d178;--s-torts:#f0a0c0;--s-ba:#a9bdd6;
 --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
[data-font=readable]{--font:"Atkinson Hyperlegible",Lexend,Verdana,"Segoe UI",Tahoma,sans-serif;--ls:.02em;--lh:1.75}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/var(--lh) var(--font);letter-spacing:var(--ls);padding-left:var(--sal);padding-right:var(--sar);padding-bottom:var(--sab)}
a{color:var(--accent);text-underline-offset:2px}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;font-weight:650}
h2{font-size:1.3em}h3{font-size:1.08em}
.skip{position:absolute;left:-999px;top:0}.skip:focus{left:8px;top:8px;z-index:99;background:var(--panel);padding:8px 12px;border-radius:10px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding-top:var(--sat)}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05em;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px}
.hcount{margin-left:auto;font-size:.82em;color:var(--muted);text-align:right}
nav{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.9em;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.active{background:var(--accent-soft);color:var(--text);font-weight:650;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spacer{flex:1}.grow{flex:1;min-width:0}
.small{font-size:.9em}.tiny{font-size:.8em}.muted{color:var(--muted)}.hidden{display:none!important}.tnum{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:.95em;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:9px 16px;border-radius:12px;cursor:pointer;line-height:1.3;min-height:42px;transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover{background:var(--panel2)}.btn:active{transform:scale(.98)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.opt:focus-visible,nav button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.primary:hover{filter:brightness(1.06)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent}.btn.sm{padding:5px 11px;min-height:34px;font-size:.85em;border-radius:10px}
.btn.xl{padding:14px 26px;font-size:1.08em;border-radius:14px;min-height:54px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
select,input,textarea{font:inherit;font-size:.95em;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-height:40px;max-width:100%}
input[type=checkbox],input[type=radio]{min-height:0;width:20px;height:20px;accent-color:var(--accent);vertical-align:middle}
textarea{width:100%;min-height:260px;line-height:1.6;resize:vertical}
label{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:.92em}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:.85em}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8em;font-weight:600;background:var(--accent-soft);color:var(--text);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gray{background:var(--panel2);color:var(--muted)}
.tag{display:inline-block;font-size:.75em;padding:1px 8px;border-radius:6px;border:1px dashed var(--border);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8em;font-weight:600;padding:2px 10px 2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--muted)) 14%,var(--panel));color:var(--text);white-space:nowrap;vertical-align:middle}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.93em}
.bar{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden;position:relative}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.bar.lg{height:12px}.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.goalbar{overflow:visible}.goalbar b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--text);border-radius:2px;opacity:.7}.goalbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--muted);opacity:.6}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.task:last-child{border-bottom:0}.task input{margin-top:4px;flex:none}.task.done .tl{text-decoration:line-through;color:var(--muted)}
.tl{line-height:1.45}
details.fold>summary{cursor:pointer;font-weight:650;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"›";display:inline-block;transition:transform .2s;color:var(--muted);font-size:1.2em;width:12px}
details.fold[open]>summary::before{transform:rotate(90deg)}
.eyebrow{font-size:.85em;color:var(--muted);font-weight:600;letter-spacing:.02em}
.h1{font-size:1.75em;margin:.15em 0 0}
.hero{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--panel)),var(--panel))}
.hero-main{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-top:16px}
.rings{display:flex;gap:18px;flex-wrap:wrap}
.hero-cta{flex:1;min-width:240px}
.streak{background:var(--warn-soft);color:var(--text);padding:6px 12px;border-radius:999px;font-size:.9em}
.ring{position:relative;width:104px;height:104px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}.ring .trk{stroke:var(--panel2)}.ring .val{stroke:var(--accent);transition:stroke-dasharray .6s ease}
.ring.r2 .val{stroke:var(--good)}.ring.r3 .val{stroke:var(--s-torts)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.ring .rv b{font-size:.95em}.ring .rv span{font-size:.7em;color:var(--muted)}
.stat{font-size:1.5em;font-weight:700;font-variant-numeric:tabular-nums}
.count{display:flex;gap:10px;flex-wrap:wrap}.count .u{background:var(--panel2);border-radius:14px;padding:10px 14px;text-align:center;min-width:76px}.count .u b{display:block;font-size:1.5em}.count .u span{font-size:.75em;color:var(--muted)}
/* flashcards */
.fc{background:var(--panel);border:1px solid var(--border);border-top:5px solid var(--c,var(--accent));border-radius:var(--radius);padding:28px 24px;margin-top:12px;min-height:200px;cursor:pointer;transition:transform .25s ease,opacity .15s}
.fc .front{font-size:1.18em;font-weight:600;line-height:1.5}
.fc .back{margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);font-size:1.05em;animation:fadeUp .25s ease}
.fc.out-l{transform:translateX(-24px);opacity:0}.fc.out-r{transform:translateX(24px);opacity:0}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.rate .btn{display:flex;flex-direction:column;align-items:center;min-height:62px;font-weight:650}
.rate .btn small{font-weight:400;color:var(--muted);font-size:.78em}
.rate .again{border-color:color-mix(in srgb,var(--bad) 45%,var(--border))}.rate .hard{border-color:color-mix(in srgb,var(--warn) 45%,var(--border))}.rate .good{border-color:color-mix(in srgb,var(--good) 45%,var(--border))}.rate .easy{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
/* MBE */
.stem{font-size:1.08em;line-height:1.7}
#opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;text-align:left;width:100%;font:inherit;color:var(--text);background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;line-height:1.5;transition:border-color .15s,background .15s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.opt b{flex:none}.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--panel2);font-size:.96em}
.expl.ok{background:var(--good-soft)}.expl.no{background:var(--bad-soft)}
.why{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chipbtn{font:inherit;font-size:.8em;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;min-height:32px}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1em;background:var(--panel2);padding:4px 12px;border-radius:10px}.timer.low{background:var(--bad-soft);color:var(--bad)}
.pace{color:var(--muted);background:var(--panel2);padding:3px 8px;border-radius:8px}
.facts{white-space:pre-wrap;background:var(--panel2);border-radius:14px;padding:14px 16px;line-height:1.7}
/* schedule calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:.75em;color:var(--muted)}
.cal .d{min-height:54px;border-radius:10px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--c,var(--border));padding:3px 5px;font-size:.7em;cursor:pointer;overflow:hidden}
.cal .d .n{font-weight:700}.cal .d .lbl{color:var(--muted);line-height:1.2;max-height:2.4em;overflow:hidden}
.cal .d.empty{background:transparent;border:0;cursor:default}.cal .d.off{background:var(--panel2)}
.cal .d.pt{background:var(--warn-soft);border-left-color:var(--warn)}.cal .d.rv{background:var(--good-soft);border-left-color:var(--good)}.cal .d.exam{background:var(--bad-soft);border-left-color:var(--examc)}
.cal .d.sim{box-shadow:inset 0 0 0 2px var(--warn)}.cal .d.today{outline:2px solid var(--accent)}.cal .d.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 3px 0 8px;vertical-align:middle}
.sticky-side{position:sticky;top:120px;align-self:start}
/* subject reviews */
.olsec{border-left:5px solid var(--c,var(--accent))}.olsec.read{opacity:.92}
.secno{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--c) 18%,var(--panel));font-size:.8em}
.olist{margin:12px 0 0;padding-left:1.2em}.olist li{margin:0 0 .6em}
.subj-card{border-top:4px solid var(--c,var(--border))}
.rd{background:var(--panel2);border-radius:14px;padding:12px 14px}.rd.na{opacity:.75}
/* settings switches */
.switch{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--border)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw-ui{flex:none;width:44px;height:26px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);position:relative;transition:background .2s;margin-top:2px}
.sw-ui::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.sw-ui{background:var(--accent);border-color:var(--accent)}.switch input:checked+.sw-ui::after{transform:translateX(18px)}
.switch input:focus-visible+.sw-ui{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
/* pomodoro, toast, pwa */
.pomo-panel{position:fixed;right:max(14px,var(--sar));top:calc(70px + var(--sat));z-index:40;width:min(340px,calc(100vw - 28px))}
.pm-ring{--p:0;width:170px;height:170px;margin:14px auto;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0)}
.pm-ring>div{width:146px;height:146px;border-radius:50%;background:var(--panel);display:grid;place-content:center}
#pomoBtn.running{background:var(--accent-soft);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px);font-size:.92em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pwa-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sab));z-index:55;width:min(560px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:12px 14px}
/* focus mode */
#focusExit{position:fixed;top:calc(12px + var(--sat));right:calc(12px + var(--sar));z-index:50}
body.focus header,body.focus .setup,body.focus .pwa-bar{display:none!important}
body.focus main{max-width:760px;padding-top:calc(64px + var(--sat))}
body.focus #t-cards>.card:not(#fcArea),body.focus #t-cards>details{display:none}
body.focus .fc .front{font-size:1.3em}body.focus .stem{font-size:1.15em}
body.focus .card{box-shadow:none}
/* motion */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes popk{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shakek{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:popk .35s ease}.shake{animation:shakek .3s ease}
main section:not(.hidden)>*{animation:fadeUp .25s ease both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;bottom:30%;width:8px;height:12px;border-radius:2px;animation:conf 1.2s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(540deg);opacity:0}}
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* responsive */
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.sticky-side{position:static}}
@media (max-width:640px){:root{--fs:17px}.g2,.g3,.g4{grid-template-columns:1fr}main{padding:16px 12px 90px}.card{padding:16px}.hwrap{padding:8px 12px;gap:8px}
 .brand-sub,.hcount{display:none}.brand span:not(.brand-sub){font-size:.95em}.h1{font-size:1.45em}.rings{gap:10px;justify-content:space-between;width:100%}.ring{width:96px;height:96px}
 .hero-cta .btn.xl{width:100%}.rate{grid-template-columns:repeat(2,1fr)}.cal .d{min-height:44px;padding:2px 3px}.cal .d .lbl{display:none}table{font-size:.85em}}
@media print{header,nav,.toast,.pwa-bar,#focusExit{display:none}}
.grid>*{min-width:0}.grid>label select,.grid>label input[type=date],.grid label>select{width:100%}

</style>

<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="hwrap"><div class="brand"><div class="logo" aria-hidden="true">⚖</div><span>Ohio Bar Prep</span><span class="tiny muted brand-sub">Feb 2027 UBE</span></div><div class="hcount" id="hcount"></div><button class="btn ghost sm" id="pomoBtn" type="button">⏱ 25:00</button><button class="btn ghost sm" id="themeBtn" type="button" aria-label="Toggle dark mode">🌙</button></div><nav aria-label="Sections"></nav></header>
<div id="pomoPanel" class="pomo-panel card hidden" role="dialog" aria-label="Focus timer"></div>
<div id="pwaBar" class="pwa-bar hidden" role="status"></div>
<main id="main">
<section id="t-dash"></section><section id="t-course" class="hidden"></section><section id="t-plan" class="hidden"></section><section id="t-outline" class="hidden"></section><section id="t-cards" class="hidden"></section><section id="t-mcq" class="hidden"></section><section id="t-essay" class="hidden"></section><section id="t-mpt" class="hidden"></section><section id="t-weak" class="hidden"></section><section id="t-data" class="hidden"></section><section id="t-info" class="hidden"></section>
</main>
<button id="focusExit" class="btn ghost hidden" type="button" aria-label="Exit focus mode">✕ Exit focus</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const BUILD='b8e25fc8b1';
// Flashcards: black-letter-law summaries written for this app (majority / MBE rules unless noted). Not NCBE content.
// Each card is [front, back, id]. The id is FIXED (saved progress is keyed by it): never change or reuse it; new cards get new ids (e.g., torts-30).
const CARDS = {};
CARDS.civpro = [
["Diversity jurisdiction: requirements?","28 U.S.C. §1332(a): (1) complete diversity — no plaintiff may share state citizenship with any defendant; and (2) amount in controversy exceeding $75,000, exclusive of interest and costs. Citizenship is measured when the action is filed.","civpro-0"],
["Citizenship of an individual (diversity)?","The state of domicile: physical presence plus intent to remain indefinitely. A person has only one domicile at a time.","civpro-1"],
["Citizenship of a corporation?","Every state where it is incorporated AND the state of its principal place of business — the “nerve center” where officers direct, control, and coordinate activities (Hertz v. Friend).","civpro-2"],
["Citizenship of an LLC, partnership, or other unincorporated association?","The citizenship of each of its members/partners (general and limited).","civpro-3"],
["Amount in controversy: aggregation and the legal-certainty test?","One plaintiff may aggregate all claims against one defendant. Multiple plaintiffs generally cannot aggregate separate claims (unless enforcing a single, undivided right). The plaintiff’s good-faith claim controls unless it appears to a legal certainty that the claim is really for $75,000 or less.","civpro-4"],
["Federal-question jurisdiction and the well-pleaded complaint rule?","§1331: claims “arising under” federal law. The federal issue must appear on the face of the plaintiff’s well-pleaded complaint; an anticipated federal defense (e.g., preemption) does not create federal-question jurisdiction.","civpro-5"],
["Supplemental jurisdiction (§1367)?","Federal courts may hear claims that form part of the same case or controversy (common nucleus of operative fact) as a claim within original jurisdiction. In diversity-only cases, §1367(b) bars PLAINTIFFS’ claims against persons made parties under Rules 14, 19, 20, or 24 when that would be inconsistent with §1332. Courts may decline (novel/complex state issue, state claim predominates, original claims dismissed, exceptional circumstances).","civpro-6"],
["Removal: basic rules?","A defendant may remove a case that could have been filed in federal court to the federal district embracing the state court. File within 30 days after service of the initial pleading; all properly joined and served defendants must consent (§1441(a) removal). Forum-defendant rule: a diversity case is not removable if any properly joined and served defendant is a citizen of the forum state. Diversity cases may not be removed more than 1 year after commencement absent plaintiff’s bad faith.","civpro-7"],
["Personal jurisdiction: constitutional test?","Due process requires minimum contacts with the forum such that the suit does not offend traditional notions of fair play and substantial justice (International Shoe). Specific jurisdiction: purposeful availment + claim arises out of or relates to the contacts + fairness. General jurisdiction: defendant is “at home” — an individual’s domicile; a corporation’s state of incorporation and principal place of business (Daimler). Also: in-state service (Burnham), consent.","civpro-8"],
["Venue under 28 U.S.C. §1391(b)?","Proper in: (1) any district where any defendant resides, if all defendants reside in the same state; (2) a district where a substantial part of the events or omissions occurred or the property is located; or (3) if neither applies, any district where any defendant is subject to personal jurisdiction. An entity defendant resides wherever it is subject to personal jurisdiction regarding the action.","civpro-9"],
["Transfer: §1404(a) vs. §1406(a)?","§1404(a): venue is proper; court may transfer for convenience of parties and witnesses and in the interest of justice to a district where the case might have been brought (or all parties consent); transferee applies the transferor’s choice-of-law rules. §1406(a): venue is improper; court dismisses or transfers in the interest of justice.","civpro-10"],
["The Erie doctrine?","In diversity (and supplemental state claims), a federal court applies state substantive law (including the forum state’s choice-of-law rules — Klaxon — and statutes of limitations) and federal procedural law. If a valid Federal Rule directly covers the issue, it controls (Hanna v. Plumer).","civpro-11"],
["Service of process under Rule 4?","Summons and complaint served by any nonparty at least 18 years old: personal delivery; leaving copies at the individual’s dwelling with someone of suitable age and discretion who resides there; delivery to an authorized agent; or any method allowed by state law. Must serve within 90 days after the complaint is filed (Rule 4(m)). A defendant who waives service gets 60 days (from the date the request was sent) to answer.","civpro-12"],
["Time to answer the complaint?","21 days after being served with the summons and complaint (Rule 12(a)); 60 days after the waiver request was sent if service is waived (90 if the defendant is outside the U.S.).","civpro-13"],
["Which Rule 12(b) defenses are waived if not raised early?","Lack of personal jurisdiction, improper venue, insufficient process, and insufficient service (12(b)(2)–(5)) are waived if omitted from a pre-answer Rule 12 motion or, if none, from the answer. Failure to state a claim and failure to join a required party may be raised through trial. Lack of subject-matter jurisdiction is never waived.","civpro-14"],
["Federal pleading standard?","Rule 8(a): short and plain statement of the claim showing entitlement to relief — facts must make the claim plausible, not merely conceivable (Twombly; Iqbal). Fraud or mistake must be pleaded with particularity (Rule 9(b)).","civpro-15"],
["Amending pleadings and relation back (Rule 15)?","Amend once as a matter of course within 21 days after serving it, or (if a responsive pleading is required) 21 days after service of the responsive pleading or a 12(b), (e), or (f) motion, whichever is earlier; otherwise with written consent or leave, freely given when justice so requires. An amendment relates back if it arises from the same conduct, transaction, or occurrence; changing a party also requires that the new party received notice within the Rule 4(m) period and knew or should have known it would have been sued but for a mistake concerning identity.","civpro-16"],
["Rule 11?","By presenting a paper, the attorney/party certifies after reasonable inquiry that it is not for an improper purpose, legal contentions are warranted, and factual contentions have (or likely will have) evidentiary support. A sanctions motion must be served and the 21-day safe harbor allowed before filing.","civpro-17"],
["Permissive joinder of parties (Rule 20) vs. impleader (Rule 14)?","Rule 20: plaintiffs may join (or defendants be joined) if claims arise from the same transaction/occurrence (or series) AND share a common question of law or fact. Rule 14: a defending party may implead a nonparty who is or may be liable to it for all or part of the claim against it (indemnity/contribution); no leave needed within 14 days after serving its original answer.","civpro-18"],
["Class action requirements (Rule 23)?","23(a): numerosity, commonality, typicality, adequacy of representation; plus a 23(b) type. For (b)(3) damages classes: common questions predominate and class action is superior; members get notice and the right to opt out. CAFA gives federal jurisdiction where the aggregate amount exceeds $5 million, any class member is diverse from any defendant (minimal diversity), and there are at least 100 members.","civpro-19"],
["Required initial disclosures (Rule 26(a)(1))?","Without awaiting a request: names/contact info of individuals likely to have discoverable information the party may use to support its claims or defenses; copies/descriptions of such documents; computation of damages; and insurance agreements. Generally due within 14 days after the Rule 26(f) conference.","civpro-20"],
["Scope of discovery and work product?","Any nonprivileged matter relevant to any party’s claim or defense and proportional to the needs of the case (Rule 26(b)(1)). Work product (prepared in anticipation of litigation) is discoverable only on a showing of substantial need and inability to obtain the equivalent without undue hardship; mental impressions, opinions, and legal theories receive near-absolute protection.","civpro-21"],
["Numerical discovery limits?","Interrogatories: 25 per party, including discrete subparts (served on parties only). Depositions: 10 per side, each limited to 1 day of 7 hours, absent stipulation or leave. Requests for admission: no numeric limit; matters are deemed admitted if not answered or objected to within 30 days.","civpro-22"],
["Summary judgment (Rule 56)?","Granted if there is no genuine dispute as to any material fact and the movant is entitled to judgment as a matter of law. Evidence is viewed in the light most favorable to the nonmovant; the court does not weigh credibility. May be filed until 30 days after the close of all discovery unless the court orders otherwise.","civpro-23"],
["Judgment as a matter of law (Rule 50)?","After a party has been fully heard on an issue at a jury trial, the court may grant JMOL if a reasonable jury would not have a legally sufficient evidentiary basis to find for that party. A renewed motion must be filed no later than 28 days after entry of judgment and requires a pre-verdict Rule 50(a) motion.","civpro-24"],
["Motion for new trial (Rule 59) and relief from judgment (Rule 60(b))?","Rule 59: within 28 days after entry of judgment; grounds include prejudicial error, verdict against the clear weight of the evidence, misconduct, newly discovered evidence, excessive/inadequate damages (remittitur). Rule 60(b) grounds: (1) mistake, inadvertence, surprise, or excusable neglect; (2) newly discovered evidence that could not have been found in time for a Rule 59(b) motion; (3) fraud, misrepresentation, or misconduct by an opposing party; (4) the judgment is void; (5) the judgment has been satisfied, released, or discharged (or is based on a reversed/vacated judgment, or prospective application is no longer equitable); (6) any other reason justifying relief. Timing (Rule 60(c)(1)): every 60(b) motion must be made within a reasonable time, and motions under (1), (2), and (3) must also be made no more than 1 year after entry of the judgment or order. Grounds (4)–(6) have no fixed 1-year cap, only the reasonable-time limit.","civpro-25"],
["Right to a jury trial in federal court?","Seventh Amendment preserves the right for legal claims (e.g., damages), not equitable ones. When legal and equitable claims share common fact issues, the jury decides the legal claims first (Beacon Theatres). A party must serve a written demand no later than 14 days after service of the last pleading directed to the issue.","civpro-26"],
["Final judgment rule and exceptions?","Appeals generally lie only from final judgments (§1291); notice of appeal within 30 days after entry of judgment (FRAP 4). Exceptions: interlocutory orders granting/denying/modifying injunctions (§1292(a)); certified questions (§1292(b)); collateral-order doctrine; Rule 54(b) partial final judgment; Rule 23(f) class-certification appeals (discretionary).","civpro-27"],
["Standards of appellate review?","Questions of law: de novo. Judge’s findings of fact: clearly erroneous. Jury findings: upheld if a reasonable jury could have so found. Discretionary rulings (e.g., evidentiary, discovery): abuse of discretion.","civpro-28"],
["Claim preclusion (res judicata)?","Bars a second suit when (1) the same claim (same transaction or occurrence) is asserted, (2) between the same parties or those in privity, and (3) the first suit ended in a valid, final judgment on the merits. Bars claims that were or could have been brought.","civpro-29"],
["Issue preclusion (collateral estoppel)?","Bars relitigation of an issue actually litigated and determined, essential to a valid final judgment, against a party who had a full and fair opportunity to litigate it. Nonmutual defensive use is generally allowed; nonmutual offensive use is within the court’s discretion considering fairness (Parklane Hosiery).","civpro-30"]
];
CARDS.conlaw = [
["Article III standing?","Plaintiff must show (1) injury in fact — concrete, particularized, actual or imminent; (2) causation — fairly traceable to defendant’s conduct; (3) redressability by a favorable decision. Generalized grievances shared by all citizens are insufficient; federal taxpayer standing exists only for Establishment Clause challenges to congressional spending (Flast).","conlaw-0"],
["Organizational (associational) standing?","An organization may sue on behalf of members if (1) members would have standing in their own right, (2) the interests are germane to the organization’s purpose, and (3) neither the claim nor relief requires individual members’ participation.","conlaw-1"],
["Mootness exceptions?","A live controversy must exist at all stages. Exceptions: wrongs capable of repetition yet evading review; voluntary cessation by defendant (unless it is absolutely clear the conduct won’t recur); class actions where the named plaintiff’s claim becomes moot.","conlaw-2"],
["Political question doctrine examples?","Nonjusticiable: Guarantee (Republican Form) Clause claims, the Senate’s impeachment trial procedures, certain foreign-affairs matters, and partisan gerrymandering claims (Rucho v. Common Cause, 2019).","conlaw-3"],
["Eleventh Amendment / state sovereign immunity?","Bars private suits for damages against an unconsenting state in federal court. Exceptions: (1) state consent (waiver); (2) valid congressional abrogation by an unmistakably clear statement: under §5 of the 14th Amendment (if the remedy is congruent and proportional), under the Bankruptcy Clause (Central Va. Community College v. Katz, 2006), and under Congress's war powers (Torres v. Texas Dep't of Public Safety, 2022). Congress generally cannot abrogate under its ordinary Article I powers, e.g., the Commerce Clause or Indian Commerce Clause (Seminole Tribe v. Florida, 1996); (3) suits against state officers for prospective injunctive relief (Ex parte Young). Does not protect cities or counties.","conlaw-4"],
["Commerce Clause: scope of congressional power?","Congress may regulate (1) channels of interstate commerce, (2) instrumentalities and persons/things in interstate commerce, and (3) activities that substantially affect interstate commerce. Intrastate economic activity may be aggregated (Wickard; Raich); noneconomic activity generally may not be (Lopez; Morrison). Congress cannot compel individuals to enter commerce (NFIB v. Sebelius).","conlaw-5"],
["Spending power conditions on federal funds?","Congress may tax and spend for the general welfare and attach conditions to grants to states if the conditions are unambiguous, related to the federal interest, do not induce unconstitutional action, and are not so coercive as to compel (South Dakota v. Dole; NFIB).","conlaw-6"],
["Congress’s power under §5 of the 14th Amendment?","Congress may enforce 14th Amendment rights through legislation that is congruent and proportional to the injury to be prevented or remedied (City of Boerne v. Flores). It may not redefine the substance of the right, and §5 reaches only state action, not purely private conduct.","conlaw-7"],
["Anti-commandeering doctrine?","The 10th Amendment bars Congress from compelling state legislatures to enact or enforce a federal regulatory program, or from conscripting state executive officers (New York v. U.S.; Printz v. U.S.; Murphy v. NCAA). Congress may instead regulate individuals directly or use conditional spending.","conlaw-8"],
["Dormant Commerce Clause?","A state law that discriminates against interstate commerce (facially or in purpose/effect) is invalid unless necessary to serve a legitimate local purpose that cannot be adequately served by reasonable nondiscriminatory alternatives. Nondiscriminatory laws are invalid only if the burden on interstate commerce is clearly excessive relative to local benefits (Pike). Exceptions: market-participant doctrine; congressional authorization.","conlaw-9"],
["Article IV Privileges and Immunities Clause?","A state may not discriminate against nonresident citizens regarding fundamental rights (important commercial activities like pursuing a livelihood; civil liberties) unless there is a substantial reason and the discrimination bears a substantial relationship to it (considering less restrictive means). Corporations and aliens are not protected.","conlaw-10"],
["Appointments Clause?","Principal officers are appointed by the President with Senate advice and consent. Congress may vest appointment of inferior officers in the President alone, the courts of law, or department heads. Congress itself may not appoint officers who exercise executive power.","conlaw-11"],
["Treaties and executive agreements?","Treaties (President + two-thirds of the Senate) prevail over conflicting state law; between a treaty and a federal statute, the later in time controls; the Constitution prevails over both. Executive agreements are valid and prevail over conflicting state law but not over a conflicting federal statute.","conlaw-12"],
["State action requirement?","Constitutional protections (other than the 13th Amendment) restrict government, not private actors. Private conduct is state action when (1) performing a function traditionally and exclusively governmental (e.g., running elections, a company town) or (2) the government is significantly involved/entangled (e.g., judicial enforcement of racially restrictive covenants — Shelley v. Kraemer).","conlaw-13"],
["Levels of scrutiny under equal protection?","Strict scrutiny (race, national origin, most state alienage classifications; fundamental rights): necessary to a compelling interest — government bears burden. Intermediate scrutiny (sex/gender; nonmarital children): substantially related to an important interest; for sex, an “exceedingly persuasive justification.” Rational basis (all else, e.g., age, disability, wealth): rationally related to a legitimate interest — challenger bears burden.","conlaw-14"],
["How is a discriminatory classification proved?","(1) Facially discriminatory law; (2) facially neutral law applied in a discriminatory manner; or (3) facially neutral law with a discriminatory impact AND a discriminatory purpose. Disparate impact alone is insufficient (Washington v. Davis).","conlaw-15"],
["Alienage classifications?","State/local laws: strict scrutiny, except rational basis when excluding aliens from functions tied to self-government (e.g., police, public school teachers, probation officers, jurors). Federal alienage classifications: rational basis due to Congress’s plenary power over immigration.","conlaw-16"],
["Fundamental rights triggering strict scrutiny?","Rights to marry, procreate, use contraception, raise one’s children and direct their upbringing, family living arrangements, interstate travel, voting, and First Amendment rights. Abortion is no longer a fundamental right; regulations get rational-basis review (Dobbs, 2022).","conlaw-17"],
["Procedural due process?","When government deprives a person of life, liberty, or property (a legitimate claim of entitlement, e.g., tenured public job, welfare benefits), it must give notice and an opportunity to be heard. What process is due: Mathews v. Eldridge balancing — private interest, risk of erroneous deprivation and value of added safeguards, government’s interest.","conlaw-18"],
["Takings Clause?","Private property may be taken for public use only with just compensation (fair market value). Per se takings: permanent physical occupation (Loretto; Cedar Point) and regulations eliminating all economically beneficial use (Lucas). Otherwise Penn Central balancing (economic impact, investment-backed expectations, character of action). Exactions need an essential nexus and rough proportionality (Nollan; Dolan).","conlaw-19"],
["Contracts Clause?","States may not substantially impair existing contractual obligations. For private contracts, the impairment must serve a significant and legitimate public purpose through reasonable and appropriate means; impairment of the state’s own contracts gets stricter review. Does not apply to the federal government or to future contracts.","conlaw-20"],
["Content-based vs. content-neutral speech regulation?","Content-based regulations (subject matter or viewpoint) get strict scrutiny. Content-neutral time, place, and manner regulations in public/designated public forums are valid if narrowly tailored to a significant government interest and leave open ample alternative channels. In nonpublic forums: reasonable and viewpoint neutral.","conlaw-21"],
["Categories of unprotected or less-protected speech?","Incitement (directed to producing imminent lawless action and likely to do so — Brandenburg); obscenity (Miller test); true threats (requires at least recklessness — Counterman v. Colorado, 2023); fighting words; child pornography; defamation and false/misleading commercial speech (subject to constitutional limits).","conlaw-22"],
["Prior restraints?","Government orders or licensing schemes that restrain speech before it occurs bear a heavy presumption of unconstitutionality; they must be narrowly drawn to prevent a grave, specific harm, and licensing schemes need narrow, objective standards and procedural safeguards (prompt judicial review).","conlaw-23"],
["Overbreadth and vagueness?","Overbreadth: a law that punishes a substantial amount of protected speech relative to its legitimate sweep is facially invalid. Vagueness: a law is void if a reasonable person cannot tell what is prohibited or it invites arbitrary enforcement.","conlaw-24"],
["Commercial speech?","False or misleading commercial speech, or speech proposing unlawful activity, is unprotected. Otherwise, regulation must (Central Hudson): serve a substantial government interest, directly advance it, and be no more extensive than necessary (a reasonable fit, not least restrictive means).","conlaw-25"],
["Free Exercise Clause?","Neutral laws of general applicability that incidentally burden religion get rational-basis review (Employment Division v. Smith). Laws that target religion, or are not generally applicable (e.g., allow comparable secular exemptions or individualized exemptions), get strict scrutiny (Lukumi; Fulton; Tandon).","conlaw-26"],
["Establishment Clause?","Interpreted by reference to historical practices and understandings (Kennedy v. Bremerton, 2022 — the Lemon test is abandoned). Government may not coerce religious participation; laws preferring one religious denomination over another get strict scrutiny (Larson v. Valente).","conlaw-27"],
["Public employee speech?","Speech made pursuant to official duties is unprotected (Garcetti). Speech as a citizen on a matter of public concern is protected unless the government’s interest in efficient operations outweighs it (Pickering balancing).","conlaw-28"]
];
CARDS.contracts = [
["UCC Article 2 vs. common law?","Article 2 governs sales of goods (things movable when identified to the contract). Services, real estate, and employment contracts are governed by common law. Mixed goods/services: predominant-purpose test.","contracts-0"],
["What is an offer?","A manifestation of willingness to enter a bargain, made so as to justify another in understanding that assent is invited and will conclude the bargain. Advertisements are usually invitations to deal unless specific and limiting who may accept (e.g., “first come, first served”).","contracts-1"],
["How is an offer terminated?","Revocation by the offeror (communicated directly or indirectly) before acceptance; rejection or counteroffer by the offeree; lapse of the stated or a reasonable time; death or incapacity of either party (for non-option offers).","contracts-2"],
["When is an offer irrevocable?","(1) Option contract supported by consideration; (2) UCC firm offer — merchant, signed writing, assurance it will be held open (irrevocable for the stated or a reasonable time, not exceeding 3 months, without consideration); (3) foreseeable, substantial reliance by the offeree (R2d §87(2)); (4) unilateral-contract offer once the offeree begins performance (R2d §45 option).","contracts-3"],
["The mailbox rule?","An acceptance is effective upon dispatch if properly sent. Exceptions: option contracts (acceptance effective on receipt); offeror specifies otherwise. Revocations and rejections are effective on receipt. If the offeree sends a rejection and then an acceptance, whichever arrives first controls.","contracts-4"],
["Mirror-image rule vs. UCC §2-207?","Common law: acceptance must mirror the offer; added terms make it a counteroffer. UCC: a definite and seasonable expression of acceptance operates as acceptance even with additional/different terms unless expressly conditional on assent to them. Between merchants, additional terms become part of the contract unless they materially alter it, the offer limits acceptance to its terms, or objection is made within a reasonable time. If either party is not a merchant, additional terms are mere proposals.","contracts-5"],
["Consideration and modifications?","Consideration = bargained-for exchange of legal detriment/benefit; past consideration and performance of a pre-existing legal duty do not count. Common-law modification requires new consideration (exception: fair and equitable modification due to unanticipated circumstances, R2d §89). UCC modification needs only good faith — no consideration.","contracts-6"],
["Promissory estoppel (R2d §90)?","A promise the promisor should reasonably expect to induce action or forbearance, which does induce it, is binding if injustice can be avoided only by enforcement. The remedy may be limited as justice requires (often reliance damages).","contracts-7"],
["Statute of Frauds: which contracts?","Marriage (in consideration of), contracts not performable within one year of making, interests in land, executor/administrator promise to pay estate debts personally, sale of goods for $500 or more, and suretyship (promise to answer for another’s debt — subject to the main-purpose rule). Need a writing signed by the party to be charged with essential terms (or an exception).","contracts-8"],
["UCC Statute of Frauds exceptions?","(1) Specially manufactured goods (not suitable for others; seller substantially began or committed); (2) admission in pleading/testimony; (3) goods paid for and accepted, or received and accepted (to that extent); (4) merchant’s written confirmation — binding on a recipient merchant who doesn’t object in writing within 10 days. The writing must state a quantity; enforceable only up to that quantity.","contracts-9"],
["Parol evidence rule?","If a writing is a complete (full) integration, evidence of prior or contemporaneous agreements cannot add to or contradict it. If partially integrated, consistent additional terms may be shown but not contradictory ones. Always admissible: to show formation defects (fraud, duress, mistake), a condition precedent to effectiveness, to interpret ambiguity, and subsequent modifications.","contracts-10"],
["Mutual vs. unilateral mistake?","Mutual mistake about a basic assumption with a material effect on the exchange makes the contract voidable by the adversely affected party unless that party bore the risk. Unilateral mistake: voidable only if, in addition, the other party knew/had reason to know or caused it, or enforcement would be unconscionable.","contracts-11"],
["Common defenses to formation?","Misrepresentation (fraudulent or material, with justified reliance — voidable); duress; undue influence; unconscionability (procedural + substantive, judged at formation); illegality; incapacity (minors may disaffirm, but are liable for the reasonable value of necessaries).","contracts-12"],
["Perfect tender rule and seller’s right to cure?","Buyer may reject goods if the goods or tender fail in any respect to conform. Seller may cure if the time for performance has not expired, or if seller had reasonable grounds to believe the nonconforming tender would be acceptable (reasonable additional time). Installment contracts: reject an installment only if the nonconformity substantially impairs it and can’t be cured.","contracts-13"],
["Risk of loss without breach (UCC)?","Agreement controls. Shipment contract: risk passes when seller duly delivers goods to the carrier. Destination contract: when goods are tendered at the destination. No carrier: merchant seller — risk passes on buyer’s receipt; non-merchant seller — on tender. If seller tenders nonconforming goods, risk stays with seller until cure or acceptance.","contracts-14"],
["Implied warranties (UCC)?","Merchantability: implied when seller is a merchant in goods of that kind — goods fit for their ordinary purpose. Fitness for a particular purpose: seller has reason to know the buyer’s particular purpose and that the buyer relies on seller’s skill/judgment. A disclaimer of merchantability must mention “merchantability” (conspicuous if written); “as is” disclaims implied warranties.","contracts-15"],
["Express warranty (UCC §2-313)?","Created by any affirmation of fact or promise, description of the goods, or sample or model that becomes part of the basis of the bargain. No intent or words like “warrant” needed; mere opinion or puffery does not create one.","contracts-16"],
["Express vs. constructive conditions?","Express conditions require strict compliance unless excused (waiver, estoppel, prevention/hindrance, or to avoid disproportionate forfeiture). Constructive conditions (common law): substantial performance satisfies; a material breach excuses the other party’s counter-performance.","contracts-17"],
["Factors for material breach (R2d §241)?","Extent to which the injured party is deprived of the benefit reasonably expected; adequacy of compensation; forfeiture by the breaching party; likelihood of cure; and the breaching party’s good faith and fair dealing.","contracts-18"],
["Anticipatory repudiation and adequate assurances?","An unequivocal statement or act indicating a party will not perform. The non-repudiating party may treat it as a total breach and sue immediately, suspend performance, or (for a commercially reasonable time) await performance. Retraction is allowed until the other party relies or treats it as final. UCC §2-609: on reasonable grounds for insecurity, a party may demand adequate assurance in writing; failure to provide it within a reasonable time (not over 30 days) is a repudiation.","contracts-19"],
["Impossibility, impracticability, and frustration of purpose?","Performance is discharged if an unforeseen event, the non-occurrence of which was a basic assumption of the contract, makes performance impossible or commercially impracticable, without fault of the party and without that party having assumed the risk. Frustration: the principal purpose, known to both, is substantially frustrated by such an event.","contracts-20"],
["Expectation damages and limits?","Put the non-breaching party where it would have been had the contract been performed: loss in value + incidental and consequential damages − cost avoided − loss avoided. Limits: foreseeability at formation (Hadley v. Baxendale), reasonable certainty, and mitigation (no recovery for avoidable losses).","contracts-21"],
["UCC buyer’s remedies?","Cover (cover price − contract price) or market differential (market price when buyer learned of breach − contract price), plus incidental and consequential damages, minus expenses saved. For accepted nonconforming goods: value as warranted − value as accepted. Specific performance for unique goods; replevin in limited cases.","contracts-22"],
["UCC seller’s remedies?","Resale differential (contract price − resale price, if commercially reasonable); market differential (contract price − market price at the time and place of tender); lost profits for a lost-volume seller; action for the price if goods were accepted, lost/damaged after risk passed, or cannot reasonably be resold. Plus incidental damages.","contracts-23"],
["Liquidated damages clauses?","Enforceable if the amount is reasonable in light of the anticipated or actual loss and damages were difficult to prove/estimate. A clause fixing an unreasonably large amount is an unenforceable penalty.","contracts-24"],
["Third-party beneficiaries?","Intended beneficiaries (performance is meant to benefit them) may enforce the contract against the promisor; incidental beneficiaries may not. Rights vest when the beneficiary materially changes position in justifiable reliance, sues on the promise, or assents at a party’s request; after vesting, the parties cannot modify or rescind without the beneficiary’s consent (unless reserved).","contracts-25"],
["Assignment of rights and delegation of duties?","Rights are generally assignable unless assignment materially changes the obligor’s duty/risk, is barred by law, or is validly prohibited by contract. A clause prohibiting assignment of “the contract” is construed to bar only delegation of duties, absent contrary intent. Duties are delegable unless they involve personal skill/trust or the contract forbids it; the delegating party remains liable.","contracts-26"],
["Accord and satisfaction?","An accord is an agreement to accept a different performance in satisfaction of an existing claim; satisfaction is performance of the accord, which discharges both. For a full-payment check to discharge a debt, the claim must be unliquidated or subject to a good-faith dispute, and the check must conspicuously state it is tendered in full satisfaction.","contracts-27"],
["Restitution / quasi-contract?","Where one party confers a benefit and it would be unjust for the other to retain it without paying, the law implies an obligation to pay its reasonable value. Modern view: even a breaching party may recover restitution for benefits conferred in excess of the damages it caused.","contracts-28"],
["Requirements and output contracts?","Enforceable under the UCC. Quantity means actual output or requirements occurring in good faith, but not unreasonably disproportionate to any stated estimate (or, absent an estimate, to normal or comparable prior output/requirements).","contracts-29"]
];
CARDS.crim = [
["Common-law murder?","An unlawful killing of another human being with malice aforethought, which exists with: (1) intent to kill, (2) intent to inflict serious bodily harm, (3) depraved heart (extreme recklessness/reckless indifference to human life), or (4) felony murder.","crim-0"],
["Felony murder rule?","A killing (even accidental) during the commission or attempt of an inherently dangerous felony (classically burglary, arson, robbery, rape, kidnapping). The felony must be independent of the killing; death must be foreseeable; liability continues through immediate flight until reaching temporary safety. Majority (agency) rule: no liability when a victim or police officer kills a co-felon.","crim-1"],
["Voluntary manslaughter?","An intentional killing in the heat of passion upon adequate provocation (one that would cause a reasonable person to lose self-control), with insufficient time for a reasonable person to cool off, and the defendant did not in fact cool off. Some states also recognize imperfect self-defense.","crim-2"],
["Involuntary manslaughter?","An unintentional killing resulting from criminal negligence or recklessness (gross deviation from reasonable care), or during an unlawful act not amounting to felony murder (misdemeanor-manslaughter).","crim-3"],
["MPC culpable mental states?","Purposely (conscious object), knowingly (aware conduct is of that nature/practically certain to cause the result), recklessly (consciously disregards a substantial and unjustifiable risk), negligently (should be aware of such a risk; gross deviation). If a statute is silent, recklessness is the MPC default.","crim-4"],
["Mistake of fact as a defense?","For specific-intent crimes, an honest mistake (even unreasonable) negating the intent is a defense. For general-intent crimes, the mistake must be honest and reasonable. For strict-liability crimes, mistake is no defense. Mistake of law is generally no defense.","crim-5"],
["Which common-law crimes require specific intent?","Solicitation, conspiracy, attempt, first-degree (premeditated) murder, assault (as attempted battery), larceny, robbery, burglary, embezzlement, false pretenses, and forgery.","crim-6"],
["Intoxication as a defense?","Voluntary intoxication is a defense only to specific-intent crimes, and only if it prevented formation of the required intent (not to general-intent or malice crimes). Involuntary intoxication can be a defense to any crime if it negates the mental state or produces insanity-like incapacity.","crim-7"],
["Insanity tests?","M’Naghten: due to a disease of the mind, the defendant did not know the nature and quality of the act or that it was wrong. Irresistible impulse: unable to control conduct. MPC: lacked substantial capacity to appreciate the criminality (wrongfulness) of conduct or to conform conduct to the law. (Federal: severe mental disease, unable to appreciate nature/quality or wrongfulness — defendant must prove by clear and convincing evidence.)","crim-8"],
["Self-defense?","Non-deadly force may be used when one reasonably believes it necessary to defend against imminent unlawful force. Deadly force only if one reasonably believes it necessary to prevent imminent death or serious bodily harm. Majority: no duty to retreat; minority: must retreat if it can be done in complete safety, except in one’s home. An initial aggressor may use force only after withdrawing and communicating it, or if the victim escalates to deadly force.","crim-9"],
["Conspiracy?","An agreement between two or more persons to commit a crime, with intent to agree and intent to achieve the objective; most jurisdictions require an overt act in furtherance. Common law is bilateral; MPC is unilateral. Pinkerton: each conspirator is liable for foreseeable crimes of co-conspirators in furtherance. Conspiracy does not merge with the completed crime. Withdrawal (timely notice to all co-conspirators) cuts off liability for later crimes but not for the conspiracy itself (majority/common law).","crim-10"],
["Attempt?","Specific intent to commit the crime plus an act beyond mere preparation (MPC: a substantial step strongly corroborative of intent). Factual impossibility is no defense; legal impossibility is. Abandonment: no defense at common law; MPC allows voluntary and complete renunciation. Attempt merges into the completed offense.","crim-11"],
["Accomplice liability?","One who, with intent that the crime be committed, aids, abets, counsels, or encourages the principal is liable for that crime and other foreseeable crimes. Mere presence or knowledge is insufficient. Withdrawal requires repudiating encouragement, neutralizing assistance, or timely notifying authorities before the crime is committed.","crim-12"],
["Larceny vs. larceny by trick vs. embezzlement vs. false pretenses?","Larceny: trespassory taking and carrying away of another’s personal property with intent to permanently deprive. Larceny by trick: possession (not title) obtained by fraud. Embezzlement: fraudulent conversion of property by one in lawful possession. False pretenses: obtaining TITLE by a knowingly false representation of material past/present fact with intent to defraud.","crim-13"],
["Robbery and common-law burglary?","Robbery: larceny from the person or presence of the victim by force or intimidation. Common-law burglary: breaking and entering the dwelling of another at nighttime with intent (at the time of entry) to commit a felony inside. Most statutes have relaxed the dwelling and nighttime elements.","crim-14"],
["What is a Fourth Amendment search?","Government conduct that violates a person’s reasonable expectation of privacy (Katz) or physically intrudes on a constitutionally protected area (persons, houses, papers, effects) to obtain information (Jones). Not protected: open fields, garbage left for collection, things in plain public view. Historical cell-site location records require a warrant (Carpenter).","crim-15"],
["Requirements for a valid search warrant?","Probable cause (fair probability evidence will be found, totality of circumstances), particular description of the place and items, issued by a neutral and detached magistrate. Executing officers must generally knock and announce.","crim-16"],
["Warrantless search exceptions?","Search incident to lawful arrest; automobile exception (probable cause → may search the whole vehicle and containers that may hold the object); plain view; consent; Terry stop-and-frisk; hot pursuit; evanescent evidence/exigent circumstances; inventory searches; administrative/special-needs searches.","crim-17"],
["Search incident to arrest of a vehicle occupant (Gant)?","Police may search the passenger compartment only if (1) the arrestee is unsecured and within reaching distance of the compartment at the time of the search, or (2) it is reasonable to believe evidence of the offense of arrest might be found in the vehicle.","crim-18"],
["Terry stops and frisks?","Police may briefly detain a person on reasonable, articulable suspicion of criminal activity, and may pat down outer clothing for weapons if they reasonably believe the person is armed and dangerous. Contraband felt during a lawful frisk may be seized only if its identity is immediately apparent (plain feel — Minnesota v. Dickerson).","crim-19"],
["Exceptions to the exclusionary rule?","Independent source; inevitable discovery; attenuation (intervening circumstances, time, flagrancy); good-faith reliance on a warrant or binding law (unless the warrant is facially deficient, the affidavit lacks indicia of probable cause, or the magistrate was misled or not neutral); knock-and-announce violations; use to impeach the defendant’s testimony.","crim-20"],
["Miranda: when required and invocation?","Warnings are required before custodial interrogation by police. Custody: a reasonable person would not feel free to end the interrogation and leave, in a coercive environment. Invoking silence: police must scrupulously honor it. Invoking counsel must be unambiguous; all police-initiated interrogation must stop until counsel is present (Edwards), even about other crimes, unless the suspect initiates or there is a 14-day break in custody (Shatzer). Public-safety exception (Quarles).","crim-21"],
["Sixth Amendment right to counsel: attachment and scope?","Attaches when formal adversarial judicial proceedings begin (formal charge, indictment, arraignment) and is offense-specific (same-elements test). Applies at critical stages: post-charge lineups, arraignment, plea negotiations, trial, sentencing, first appeal as of right. Not: pre-charge interrogation, photo arrays, taking handwriting/blood samples.","crim-22"],
["Eyewitness identification and due process?","An identification is excluded under due process if police used an unnecessarily suggestive procedure that creates a substantial likelihood of misidentification, judged by reliability factors (opportunity to view, degree of attention, accuracy of description, certainty, time elapsed).","crim-23"],
["Double jeopardy?","Attaches when the jury is sworn (or the first witness is sworn in a bench trial). Same offense = Blockburger test (each offense requires proof of an element the other does not); lesser-included offenses are the same offense. Retrial allowed after a hung jury, a mistrial for manifest necessity or at defendant’s request, or a successful appeal (except for insufficient evidence). Separate sovereigns (state/federal) may each prosecute.","crim-24"],
["Ineffective assistance of counsel?","Strickland: (1) counsel’s performance fell below an objective standard of reasonableness, and (2) prejudice — a reasonable probability that, but for the errors, the result would have been different.","crim-25"],
["Jury trial rights?","Sixth Amendment right for serious offenses (authorized imprisonment over 6 months). State and federal criminal verdicts must be unanimous (Ramos v. Louisiana, 2020). No peremptory strikes based on race or sex (Batson; J.E.B.). Any fact other than a prior conviction that increases the penalty beyond the statutory maximum (or increases a mandatory minimum) must be found by a jury beyond a reasonable doubt (Apprendi; Alleyne).","crim-26"],
["Brady obligations?","The prosecution must disclose evidence favorable to the accused (exculpatory or impeachment) that is material — a reasonable probability that disclosure would have produced a different result. A violation requires a new trial regardless of the prosecution’s good faith.","crim-27"],
["Voluntariness of confessions (due process)?","A confession obtained through police coercion that overbears the defendant’s will (totality of circumstances) is involuntary and inadmissible for any purpose, including impeachment. Coercive police activity is a necessary predicate.","crim-28"],
["Merger doctrine?","Solicitation and attempt merge into the completed crime (no conviction for both). Conspiracy does NOT merge — a defendant may be convicted of both conspiracy and the completed substantive offense. Lesser-included offenses merge into the greater.","crim-29"]
];
CARDS.evidence = [
["Relevance and Rule 403?","FRE 401: evidence is relevant if it has any tendency to make a fact of consequence more or less probable. FRE 403: relevant evidence may be excluded if its probative value is substantially outweighed by unfair prejudice, confusing the issues, misleading the jury, undue delay, wasting time, or needlessly cumulative evidence.","evidence-0"],
["Character evidence in criminal cases (404(a))?","Character is inadmissible to prove action in conformity, but: (1) the accused may offer a pertinent trait (by reputation/opinion), opening the door to prosecution rebuttal; (2) the accused may offer the victim’s pertinent trait, and the prosecution may then rebut it and offer the same trait of the accused; (3) in a homicide case, the prosecution may offer the victim’s peacefulness to rebut evidence that the victim was the first aggressor.","evidence-1"],
["Rule 404(b) other acts?","Evidence of other crimes, wrongs, or acts is inadmissible to prove propensity but admissible for other purposes: motive, opportunity, intent, preparation, plan, knowledge, identity, absence of mistake, or lack of accident. In criminal cases the prosecution must give reasonable written notice. Subject to 403.","evidence-2"],
["Methods of proving character (405)?","Reputation or opinion testimony. Specific instances may be inquired into on cross-examination. Specific instances are admissible on direct only when character is an essential element of a charge, claim, or defense (e.g., defamation, negligent entrustment, child custody).","evidence-3"],
["Sex-offense cases: Rules 412–415?","Rape shield (412): evidence of a victim’s other sexual behavior or predisposition is generally inadmissible; criminal exceptions include source of semen/injury, prior acts with the accused to show consent (or offered by the prosecutor), and where exclusion would violate constitutional rights. Rules 413–415: in sexual-assault and child-molestation cases, the defendant’s other such acts are admissible for any relevant purpose, including propensity.","evidence-4"],
["Habit evidence (406)?","Evidence of a person’s habit or an organization’s routine practice is admissible to prove conduct on a particular occasion in accordance with it, regardless of corroboration or eyewitnesses. Habit = a regular, specific, semi-automatic response to a repeated situation.","evidence-5"],
["Subsequent remedial measures (407)?","Inadmissible to prove negligence, culpable conduct, a product/design defect, or a need for a warning. Admissible for other purposes: impeachment, ownership or control, or feasibility of precautions — if disputed.","evidence-6"],
["Rules 408–411 policy exclusions?","408: compromise offers and statements in negotiations of a disputed claim are inadmissible to prove validity/amount or to impeach by prior inconsistent statement (criminal exception for statements to a public office exercising regulatory authority). 409: offers to pay medical expenses are inadmissible to prove liability (accompanying statements are admissible). 410: withdrawn guilty pleas, nolo contendere pleas, and statements in plea discussions with a prosecuting attorney are inadmissible against the defendant. 411: liability insurance is inadmissible to prove negligence; admissible for bias, ownership/control, agency.","evidence-7"],
["Lay opinion (701)?","Admissible if rationally based on the witness’s perception, helpful to understanding testimony or determining a fact, and not based on scientific, technical, or specialized knowledge (e.g., speed, intoxication, identity of handwriting/voice, emotions).","evidence-8"],
["Expert testimony (702–704)?","702 (as amended 2023): the proponent must show it is more likely than not that the expert’s knowledge will help the trier of fact, the testimony is based on sufficient facts/data, is the product of reliable principles/methods, and reflects a reliable application to the facts; the judge is gatekeeper (Daubert). 703: may rely on inadmissible facts if experts in the field reasonably rely on them. 704(b): in a criminal case, an expert may not opine on whether the defendant had the mental state constituting an element.","evidence-9"],
["Impeachment by prior conviction (609)?","Crimes involving a dishonest act or false statement: always admissible, regardless of punishment. Other crimes punishable by more than 1 year: for a criminal defendant-witness, admitted if probative value outweighs prejudicial effect to the defendant; for other witnesses, subject to 403. If more than 10 years since conviction or release (whichever is later): only if probative value substantially outweighs prejudicial effect, with notice.","evidence-10"],
["Impeachment by prior bad acts (608(b))?","On cross, a witness may be asked about specific instances of conduct probative of untruthfulness. No extrinsic evidence may be used to prove the act — the examiner must take the answer.","evidence-11"],
["Prior inconsistent statements: impeachment vs. substantive use?","Extrinsic evidence of a prior inconsistent statement is admissible only if the witness is given a chance to explain or deny it and the adverse party can examine the witness about it (or justice requires), and not on a collateral matter. Substantive use (801(d)(1)(A)) only if the statement was made under penalty of perjury at a trial, hearing, other proceeding, or deposition.","evidence-12"],
["Hearsay definition and common non-hearsay uses?","Hearsay is an out-of-court statement offered to prove the truth of the matter asserted. Not hearsay when offered for: effect on the listener/reader (notice, knowledge, motive), verbal acts/legally operative words (contract offers, defamatory words), impeachment, or circumstantial evidence of the declarant’s state of mind.","evidence-13"],
["Opposing party’s statements (801(d)(2))?","Not hearsay when offered against a party: the party’s own statement; one the party adopted; one by a person authorized to speak; one by the party’s agent or employee on a matter within the scope of that relationship while it existed; one by a co-conspirator during and in furtherance of the conspiracy.","evidence-14"],
["Prior statements of a testifying witness (801(d)(1))?","Not hearsay if the declarant testifies and is subject to cross about the statement and it is: (A) inconsistent and given under penalty of perjury at a proceeding/deposition; (B) consistent and offered to rebut a charge of recent fabrication or improper motive, or to rehabilitate credibility attacked on another ground; or (C) an identification of a person made after perceiving them.","evidence-15"],
["Rule 803 exceptions (availability immaterial)?","Present sense impression; excited utterance; then-existing mental, emotional, or physical condition (including intent/plan — but not memory or belief to prove the fact remembered, except about the declarant’s will); statements for medical diagnosis or treatment; recorded recollection; business records; public records; ancient documents (prepared before Jan. 1, 1998, and authenticated); learned treatises (read in, not received as exhibits); and others.","evidence-16"],
["Business records exception (803(6))?","A record of an act, event, condition, opinion, or diagnosis made at or near the time by — or from information transmitted by — someone with knowledge, kept in the course of a regularly conducted activity, where making the record was a regular practice, shown by a custodian/qualified witness or certification — unless the opponent shows a lack of trustworthiness.","evidence-17"],
["Rule 804 exceptions (declarant unavailable)?","Former testimony (the party against whom offered — or, in civil cases, a predecessor in interest — had an opportunity and similar motive to develop it); dying declaration (homicide prosecutions or civil cases; declarant believed death imminent; about its cause/circumstances); statement against interest (when made; in a criminal case, a statement exposing the declarant to criminal liability requires corroborating circumstances indicating trustworthiness); statement of personal or family history; forfeiture by wrongdoing.","evidence-18"],
["When is a declarant “unavailable” (804(a))?","Exempted by privilege; refuses to testify despite a court order; testifies to not remembering the subject matter; death or then-existing physical/mental illness; or absent and the proponent could not procure attendance (or testimony) by process or other reasonable means. Not unavailable if the proponent wrongfully caused it.","evidence-19"],
["Confrontation Clause (Crawford)?","Testimonial hearsay is inadmissible against a criminal defendant unless the declarant testifies at trial, or is unavailable and the defendant had a prior opportunity to cross-examine. Statements are testimonial when their primary purpose is to establish past facts for later prosecution, not to meet an ongoing emergency (Davis v. Washington). Forfeiture by wrongdoing applies.","evidence-20"],
["Best evidence rule (1001–1008)?","To prove the content of a writing, recording, or photograph, the original is required when its contents are at issue or the witness testifies to its contents. Duplicates are admissible unless there is a genuine question of authenticity or unfairness. Excused if the original is lost or destroyed (not in bad faith), unobtainable, in the opponent’s control, or collateral.","evidence-21"],
["Authentication (901–902)?","The proponent must produce evidence sufficient to support a finding that the item is what it is claimed to be (e.g., witness with knowledge, lay familiarity with handwriting not acquired for litigation, voice identification, distinctive characteristics). Self-authenticating: certified public records, official publications, newspapers/periodicals, trade inscriptions, acknowledged documents, certified domestic business records.","evidence-22"],
["Attorney-client privilege?","Protects confidential communications between client (or representative) and lawyer made for the purpose of obtaining or providing legal advice. Held by the client; survives death. Exceptions: crime-fraud (services sought to further a future crime or fraud), joint clients in a later dispute between them, attorney-client disputes. Corporate employees’ communications are covered under Upjohn.","evidence-23"],
["Spousal privileges (federal)?","Spousal testimonial immunity: in a criminal case, the witness-spouse may refuse to testify against the defendant-spouse; the witness-spouse holds it (Trammel); applies only during a valid marriage, covering events before or during it. Marital communications privilege: confidential communications made during a valid marriage; either spouse may assert; survives divorce. Exceptions: suits between spouses, crimes against the spouse or a child.","evidence-24"],
["Judicial notice (201)?","A court may notice an adjudicative fact not subject to reasonable dispute because it is generally known within the court’s jurisdiction or can be accurately and readily determined from sources whose accuracy cannot reasonably be questioned. Civil: the jury must accept it as conclusive. Criminal: the jury may, but need not, accept it.","evidence-25"],
["Preliminary questions (104)?","104(a): the judge decides preliminary questions about admissibility (e.g., privilege, hearsay foundations, expert qualifications) by a preponderance and is not bound by the evidence rules except privilege. 104(b): when relevance depends on a fact (conditional relevance), proof must be sufficient to support a finding that the fact exists.","evidence-26"],
["Refreshing recollection vs. recorded recollection?","Refreshing (612): anything may be shown to jog memory; it is not evidence; the adverse party may inspect it, cross-examine on it, and introduce relevant portions. Recorded recollection (803(5)): the witness once had knowledge, now cannot recall well enough to testify fully, and the record was made/adopted when fresh and accurately reflects that knowledge; it may be read into evidence but received as an exhibit only if offered by the adverse party.","evidence-27"],
["Leading questions and scope of cross (611)?","Leading questions are generally not allowed on direct, except for preliminary matters, hostile witnesses, adverse parties, or witnesses identified with an adverse party; ordinarily allowed on cross. Cross-examination is limited to the subject matter of the direct and matters affecting credibility (the court may allow more, as if on direct).","evidence-28"],
["Statements for medical diagnosis or treatment (803(4))?","Admissible if made for and reasonably pertinent to medical diagnosis or treatment, describing medical history, past or present symptoms or sensations, their inception, or their general cause. Need not be made to a doctor. Statements assigning fault are generally not pertinent.","evidence-29"]
];
CARDS.property = [
["Fee simple determinable vs. fee simple subject to condition subsequent?","FSD: durational language (“so long as,” “while,” “until”); ends automatically when the condition occurs; grantor holds a possibility of reverter. FSSCS: conditional language (“but if,” “provided that,” “on condition that”) plus a reserved power; grantor holds a right of entry (power of termination) and must act to terminate.","property-0"],
["Fee simple subject to executory limitation?","A fee that is divested upon a stated event in favor of a third party (not the grantor), who holds an executory interest. E.g., “to A, but if A ceases farming, to B.”","property-1"],
["Life tenant’s rights and waste?","A life tenant may use the land and take ordinary profits but may not commit waste: voluntary/affirmative (e.g., exploiting minerals, unless an exception such as open mines applies), permissive (failing to make reasonable repairs or pay taxes/mortgage interest, to the extent of income or rental value), or ameliorative (changes that alter the property — traditionally barred; modern view allows them if market value is not diminished).","property-2"],
["Vested vs. contingent remainders?","Vested remainder: created in an ascertained person and not subject to any condition precedent (other than natural termination of the prior estate). Includes vested subject to open (class gifts) and vested subject to complete divestment. Contingent remainder: in an unascertained person or subject to a condition precedent.","property-3"],
["Rule Against Perpetuities (common law)?","An interest is void if it might vest (or fail) more than 21 years after the death of some life in being at the creation of the interest. Applies to contingent remainders, executory interests, vested remainders subject to open, and certain options/rights of first refusal. Does not apply to the grantor’s reversionary interests (reversion, possibility of reverter, right of entry) or charity-to-charity gifts. Many states have adopted wait-and-see or USRAP (90-year) reforms.","property-4"],
