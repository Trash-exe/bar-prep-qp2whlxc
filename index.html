{"id":"crim_6","s":"crim","q":"An officer with reasonable suspicion that a suspect was armed stopped and frisked him. The officer felt a small, soft lump in the suspect’s pocket and determined it was not a weapon. The officer then squeezed and manipulated it until concluding it was a bag of cocaine, and seized it. On a motion to suppress, the court should:","o":["Grant the motion, because the officer exceeded the frisk’s scope by manipulating a known non-weapon.","Deny the motion, because the frisk was supported by reasonable suspicion, so anything found during it may be seized.","Deny the motion, because the cocaine was properly seized under the plain-feel doctrine.","Grant the motion, because officers may never seize anything other than weapons during a frisk."],"a":0,"e":"During a lawful Terry frisk, an officer may seize contraband whose identity is immediately apparent by plain feel. But once the officer knew the object was not a weapon, continued manipulation to determine its nature exceeded the frisk’s permissible scope (Minnesota v. Dickerson)."},
{"id":"crim_7","s":"crim","q":"Police received a reliable informant’s detailed tip, corroborated by surveillance, that drugs were hidden in a car parked on a public street. Without a warrant, officers searched the car, including the trunk and a closed backpack inside the trunk, finding drugs. The search was:","o":["Invalid, because the car was parked and unoccupied on a public street, so the officers had time to get a warrant.","Valid, because probable cause justified searching the entire car and any container that could hold drugs.","Invalid as to the backpack, because a closed container found in a car requires a separate warrant.","Valid only as to the passenger compartment, because the trunk requires a warrant absent consent."],"a":1,"e":"Under the automobile exception, police with probable cause to believe a vehicle contains contraband may search the entire vehicle, including the trunk and any containers that may conceal the object of the search, without a warrant (U.S. v. Ross; California v. Acevedo). No exigency beyond the vehicle’s inherent mobility is required."},
{"id":"crim_8","s":"crim","q":"Police stopped a driver and arrested him for driving with a suspended license. He was handcuffed and locked in the back of a patrol car. Officers then searched the car’s passenger compartment and found a gun under the seat. On a motion to suppress the gun, the court should:","o":["Deny the motion, because police may always search a vehicle’s passenger compartment incident to an occupant’s lawful arrest.","Deny the motion, because the gun was in plain view once the officers opened the car door.","Grant the motion, because a custodial arrest for a minor traffic offense never justifies any search.","Grant the motion, because the arrestee was secured and no license-offense evidence was likely inside."],"a":3,"e":"Under Arizona v. Gant, police may search a vehicle’s passenger compartment incident to arrest only if the arrestee is unsecured and within reaching distance, or it is reasonable to believe evidence of the offense of arrest is in the vehicle. Neither applies to a secured suspended-license arrestee. (Other exceptions, like an inventory search, are not indicated by the facts.)"},
{"id":"crim_9","s":"crim","q":"A defendant was acquitted in state court of robbing a federally insured bank. A federal grand jury then indicted him for federal bank robbery based on the same conduct. He moves to dismiss on double jeopardy grounds. The motion should be:","o":["Granted, because he was already acquitted of the same conduct in the state prosecution.","Denied, because the state and federal governments are separate sovereigns.","Granted, because the offenses have identical elements.","Denied, because an acquittal does not bar reprosecution."],"a":1,"e":"Under the separate-sovereigns doctrine (reaffirmed in Gamble v. United States, 2019), the state and federal governments may each prosecute the same conduct without violating double jeopardy. An acquittal ordinarily does bar reprosecution by the same sovereign."},
{"id":"crim_10","s":"crim","q":"A defendant was formally charged with burglary and appointed counsel at arraignment. He never asked police for a lawyer during questioning. While he was in jail, detectives gave him Miranda warnings, which he waived, and questioned him about an unrelated murder. He made incriminating statements. His statements about the murder are:","o":["Admissible, because the Sixth Amendment right is offense-specific and he validly waived his Miranda rights.","Inadmissible, because his Sixth Amendment right to counsel had attached when he was arraigned on the burglary charge.","Inadmissible, because police may never question a defendant who is represented by counsel on any charge.","Admissible only if his burglary counsel consented."],"a":0,"e":"The Sixth Amendment right to counsel is offense-specific (Texas v. Cobb; McNeil v. Wisconsin), so it does not bar questioning on uncharged, unrelated offenses. Accepting appointed counsel at arraignment is not an invocation of the Miranda right to counsel. A valid Miranda waiver makes the statements admissible."},
{"id":"crim_11","s":"crim","q":"A man suddenly attacked a defendant with a knife on a public sidewalk. The defendant could have escaped safely by running into a nearby store, but instead drew a pistol and shot the attacker, killing him. In a jurisdiction following the majority rule, the defendant is:","o":["Guilty of murder, because he could have retreated safely before using deadly force.","Guilty of voluntary manslaughter, because his use of deadly force was excessive.","Not guilty only if the attack occurred in his own home.","Not guilty, because he reasonably feared imminent death or serious harm and had no duty to retreat."],"a":3,"e":"A person may use deadly force when reasonably believing it necessary to prevent imminent death or serious bodily harm. The majority rule imposes no duty to retreat before using deadly force (if the person is not the initial aggressor). The minority “retreat” rule would require safe retreat outside the home."},
{"id":"evidence_0","s":"evidence","q":"A customer sued a grocery store after slipping on spilled oil. To prove the store had notice of the spill, the customer offers testimony from another shopper that, 20 minutes before the fall, she told the store manager, “There’s oil all over the floor in aisle 5.” The store objects on hearsay grounds. The testimony is:","o":["Admissible, because it is offered to show notice to the manager, not that oil was spilled.","Inadmissible hearsay, because the shopper’s out-of-court statement describes the spill.","Admissible only as a present sense impression, because the shopper described the oil as she saw it.","Admissible only if the shopper is unavailable to testify at trial about what she saw."],"a":0,"e":"A statement offered to show its effect on the listener — here, that the manager had notice of a possible hazard — is not offered for the truth of the matter asserted and is not hearsay. (Other evidence would establish the oil was actually there.)"},
{"id":"evidence_1","s":"evidence","q":"In a civil breach-of-contract trial, the defendant calls a witness. On cross-examination, the plaintiff seeks to ask the witness about her conviction six years ago for misdemeanor perjury, punishable by up to six months in jail. The defendant objects. The question is:","o":["Improper, because the crime was a misdemeanor punishable by no more than six months in jail.","Improper, unless the court finds that its probative value outweighs its prejudicial effect.","Proper only if the plaintiff first offers a certified record of the conviction into evidence.","Proper, because perjury is a crime of dishonesty admissible regardless of punishment."],"a":3,"e":"FRE 609(a)(2): evidence of a conviction for any crime whose elements require proving a dishonest act or false statement must be admitted for impeachment, regardless of the punishment and without 403 balancing (if within 10 years). Perjury qualifies."},
{"id":"evidence_2","s":"evidence","q":"A pedestrian sued a city after tripping on a broken sidewalk. A week after the accident, the city repaired the sidewalk. The city does not dispute that it owns and controls the sidewalk. The pedestrian offers evidence of the repair to prove the city was negligent. The evidence is:","o":["Inadmissible, because subsequent remedial measures cannot be used to prove negligence.","Admissible, because the repair shows the city knew the sidewalk was dangerous.","Admissible to show that it was feasible for the city to repair the sidewalk.","Inadmissible, because the repair is irrelevant to the condition of the sidewalk."],"a":0,"e":"FRE 407 bars evidence of subsequent remedial measures to prove negligence or culpable conduct. It may be admitted for other purposes — ownership, control, or feasibility — only if disputed. Here the city disputes none of those."},
{"id":"evidence_3","s":"evidence","q":"A defendant charged with assault calls a neighbor to testify for the defense. Which of the following is the neighbor permitted to say on direct examination?","o":["“Last year I saw the defendant break up a fight without throwing a punch.”","“The defendant has never been arrested.”","“The defendant has a reputation in our community as a peaceful person.”","“The defendant is an honest person.”"],"a":2,"e":"Under FRE 404(a)(2)(A) and 405(a), a criminal defendant may offer evidence of a pertinent character trait (peacefulness, for assault) by reputation or opinion testimony. Specific instances are not allowed on direct (except where character is an element). Honesty is not pertinent to assault."},
{"id":"evidence_4","s":"evidence","q":"In a wrongful-death action, the plaintiff offers testimony from a paramedic that the decedent, gravely injured and saying “I’m not going to make it,” stated that the defendant’s blue truck had run him over. The decedent died an hour later. The testimony is:","o":["Inadmissible, because dying declarations are admissible only in criminal prosecutions for homicide, not civil suits.","Inadmissible, because the decedent can no longer be cross-examined about what he saw.","Admissible as a dying declaration, because this is a civil case and he believed death was imminent.","Admissible only if the paramedic recorded the statement in a written report at the time."],"a":2,"e":"FRE 804(b)(2): in a homicide prosecution or a civil case, a statement made by an unavailable declarant while believing death to be imminent, about its cause or circumstances, is admissible. The declarant is unavailable (dead). The Confrontation Clause applies only in criminal cases."},
{"id":"evidence_5","s":"evidence","q":"In a negligence action arising from an intersection collision, a witness called by the defendant testifies that the defendant’s light was green. The plaintiff then offers the witness’s earlier unsworn statement to an investigating officer at the scene that the defendant’s light was red. The defendant objects. The earlier statement is admissible:","o":["As substantive evidence and for impeachment.","Only as substantive evidence.","Only to impeach the witness’s credibility, not as proof of the light’s color.","For neither purpose, because it is hearsay."],"a":2,"e":"A prior inconsistent statement may be used to impeach a witness’s credibility (with the 613 foundation). It is admissible as substantive evidence under 801(d)(1)(A) only if it was made under penalty of perjury at a trial, hearing, other proceeding, or deposition. An unsworn statement to an officer at the scene qualifies only for impeachment (absent some other exception such as an excited utterance, which the facts do not establish)."},
{"id":"evidence_6","s":"evidence","q":"A husband is on trial in federal court for arson. The prosecution calls his wife, who is willing to testify that she saw him pour gasoline on the building. The husband objects, asserting spousal privilege. The objection should be:","o":["Sustained, because in a criminal case a defendant may prevent his spouse from testifying against him.","Sustained, because the testimony concerns events during the marriage.","Overruled, because spousal privilege does not apply in criminal cases.","Overruled, because the witness-spouse holds the testimonial privilege and is willing to testify."],"a":3,"e":"Under Trammel v. United States, in federal court the spousal testimonial privilege belongs to the witness-spouse, who may choose to testify. Observing his conduct is not a confidential marital communication, so that privilege does not apply either."},
{"id":"evidence_7","s":"evidence","q":"A client asked his attorney how to transfer assets to relatives so that creditors in an anticipated fraud judgment could not reach them. In later litigation, the creditors seek to compel the attorney to testify about the conversation. The attorney-client privilege:","o":["Protects the conversation, because it was confidential.","Protects the conversation, because the privilege survives the end of the attorney-client relationship.","Does not protect the conversation, because the client sought advice to further a future fraud.","Does not protect the conversation, because the attorney did not act on the request."],"a":2,"e":"The crime-fraud exception removes privilege from communications in which the client seeks legal services to commit or plan a future crime or fraud. Whether the attorney complied is irrelevant; the client’s purpose controls."},
{"id":"evidence_8","s":"evidence","q":"In a dispute over the terms of a written lease, the landlord testifies from memory about what the lease says regarding repair obligations. The lease exists and is in the landlord’s possession, and no excuse is offered for not producing it. The tenant objects. The objection should be:","o":["Overruled, because the landlord has personal knowledge of what the lease says.","Overruled, because the landlord is a party.","Sustained, because the testimony is hearsay.","Sustained, because the original writing is required to prove its contents."],"a":3,"e":"Under the best evidence rule (FRE 1002), an original (or admissible duplicate) is required to prove the contents of a writing when its terms are at issue, absent an excuse such as loss without bad faith. The landlord is trying to prove the lease’s contents through memory."},
{"id":"evidence_9","s":"evidence","q":"To prove that a phone call came from the defendant, the prosecution calls the defendant’s longtime coworker, who testifies that she recognized the defendant’s voice on a recording of the call. The defendant objects for lack of authentication. The objection should be:","o":["Overruled, because a lay witness familiar with a voice may identify it.","Sustained, because voice identification requires expert testimony.","Sustained, unless the phone company’s records independently confirm the call was placed.","Overruled, because recordings are self-authenticating."],"a":0,"e":"FRE 901(b)(5) allows a voice to be identified by opinion based on hearing the voice at any time under circumstances connecting it with the alleged speaker. A familiar coworker suffices. Recordings are not self-authenticating."},
{"id":"evidence_10","s":"evidence","q":"At a murder trial, the defendant offers testimony that the defendant’s former roommate, now deceased, told a friend, “I’m the one who killed the victim, not the defendant.” Which additional showing is required for the statement to be admitted as a statement against interest?","o":["That the roommate made the statement under oath or in a formal proceeding.","That corroborating circumstances clearly indicate the statement’s trustworthiness.","That the prosecution had a prior opportunity to cross-examine the roommate about it.","No additional showing; such statements are always admissible."],"a":1,"e":"FRE 804(b)(3): a statement against penal interest by an unavailable declarant, offered in a criminal case, requires corroborating circumstances that clearly indicate its trustworthiness (whether offered by the prosecution or the defense). The roommate is unavailable because deceased."},
{"id":"evidence_11","s":"evidence","q":"Seconds after a collision at an intersection, a visibly shaken bystander shouted, “That red truck just blew through the red light!” The bystander cannot be located for trial. In the injured driver’s suit against the truck’s owner, the statement is:","o":["Inadmissible hearsay, because the bystander cannot be cross-examined.","Admissible as an excited utterance, whether or not the bystander is available.","Admissible only if the bystander is identified.","Admissible only as a statement against the bystander’s interest."],"a":1,"e":"A statement relating to a startling event, made while under the stress of excitement it caused, is an excited utterance (803(2)); describing an event while perceiving it or immediately after is a present sense impression (803(1)). Availability is immaterial for 803 exceptions, and there is no Confrontation Clause issue in a civil case."},
{"id":"property_0","s":"property","q":"An owner conveyed a lot to Ann, who did not record. A week later, the owner conveyed the same lot to Ben, who paid value and had no notice of Ann’s deed. Ann then recorded her deed. The next day Ben recorded his. The jurisdiction’s statute provides: “No conveyance is valid against a subsequent purchaser for value without notice who first records.” Who owns the lot?","o":["Ben, because he was a bona fide purchaser for value without notice.","Ben, because he paid value.","Ann, because her deed was first in time and recording is irrelevant.","Ann, because Ben, although a bona fide purchaser, did not record before Ann did."],"a":3,"e":"This is a race-notice statute: a subsequent purchaser prevails only if a BFP without notice AND records first. Ben was a BFP but recorded after Ann, so Ann’s prior conveyance prevails. Under a pure notice statute, Ben would win."},
{"id":"property_1","s":"property","q":"An owner conveyed land “to the City so long as the land is used as a public park.” Years later, the City built a parking garage on the land. What interest, if any, did the owner retain, and what happened when the garage was built?","o":["A possibility of reverter; title reverted to the owner automatically.","A right of entry; the owner may now elect to retake the land by suing to terminate.","An executory interest; title shifted automatically.","No interest; the City owns a fee simple absolute."],"a":0,"e":"Durational language (“so long as”) creates a fee simple determinable; the grantor retains a possibility of reverter, and the estate ends automatically when the stated use ceases. A right of entry accompanies a fee simple subject to a condition subsequent (“but if”); an executory interest is held by a third party."},
{"id":"property_2","s":"property","q":"An owner conveyed land “to Alice for life, then to those of Alice’s children who reach age 25.” At the time, Alice was alive and had two children, ages 2 and 4. In a jurisdiction applying the common-law Rule Against Perpetuities without reform, what are the interests?","o":["Alice has a life estate; her children have a contingent remainder that is valid because they are lives in being.","Alice has a life estate; her children have a vested remainder subject to open, which is valid.","Alice has a life estate; the remainder to her children is void, and the owner holds a reversion.","Alice holds a fee simple absolute, because the remainder fails and merges into her estate."],"a":2,"e":"Alice could have another child after the conveyance, and that child could reach 25 more than 21 years after the death of all lives in being (Alice and the existing children). Because vesting might occur too remotely, the contingent remainder fails under the common-law RAP, leaving the owner a reversion after Alice’s life estate."},
{"id":"property_3","s":"property","q":"A, B, and C owned land as joint tenants with right of survivorship. A conveyed her interest to D. Later, B died, leaving a will devising all his property to E. Who owns the land, and how?","o":["C owns two-thirds and D owns one-third, as tenants in common.","C and D as joint tenants, each with one-half.","C, D, and E as tenants in common, each owning an undivided one-third.","C owns the entire property by survivorship."],"a":0,"e":"A’s conveyance severed the joint tenancy as to her one-third share, so D holds one-third as a tenant in common. B and C remained joint tenants as to the other two-thirds. On B’s death, C took B’s share by survivorship (a joint tenant cannot devise the interest), so C holds two-thirds and D one-third as tenants in common."},
{"id":"property_4","s":"property","q":"An owner of a 100-acre tract sold the back 40 acres to a buyer. The 40 acres had no access to any public road except across the owner’s retained land, and the deed said nothing about access. Ten years later, the county built a public road adjoining the 40 acres. What is the status of the buyer’s right to cross the owner’s land?","o":["The buyer had an easement by necessity, which ended when the necessity ended.","The buyer never had an easement, because no easement was expressed in the deed.","The buyer has a permanent easement by necessity that runs with the 40 acres.","The buyer has a prescriptive easement from ten years of use."],"a":0,"e":"An easement by necessity arises when a conveyance severs commonly owned land and leaves a parcel without access (strict necessity). It lasts only as long as the necessity; the new public road ended it. Prescription requires adverse use, not use by right."},
{"id":"property_5","s":"property","q":"A residential tenant’s apartment had no heat for three weeks in January despite the tenant’s repeated written complaints to the landlord. The tenant withheld that month’s rent and remained in the apartment. The landlord sued to evict for nonpayment. The tenant’s best defense is:","o":["Breach of the implied warranty of habitability.","Constructive eviction, based on the landlord’s failure to provide heat.","Breach of the covenant of quiet enjoyment.","Frustration of purpose."],"a":0,"e":"The implied warranty of habitability lets a residential tenant who has given notice withhold or reduce rent while remaining in possession when the premises are unfit for habitation. Constructive eviction requires the tenant to vacate within a reasonable time, which this tenant did not do."},
{"id":"property_6","s":"property","q":"A landlord leased commercial space to a tenant for 5 years. In year 2, with the landlord’s consent, the tenant transferred her entire remaining interest to an assignee, who took possession. The landlord did not release the tenant. The assignee then stopped paying rent. From whom may the landlord recover the unpaid rent?","o":["Only the tenant, because the landlord’s contract was with her.","Only the assignee, because the landlord consented to the assignment of the lease.","Either the tenant (privity of contract) or the assignee (privity of estate).","Neither, because consenting to an assignment releases both."],"a":2,"e":"After an assignment, the assignee is in privity of estate with the landlord and is liable for rent while in possession; the original tenant remains liable under privity of contract unless released (a novation). Consent to the assignment is not a release."},
{"id":"property_7","s":"property","q":"The jurisdiction’s adverse-possession period is 10 years. Xavier entered an owner’s land and possessed it openly, exclusively, continuously, and without permission for 6 years, then sold his interest by deed to Yolanda, who possessed it in the same manner for 5 more years. The owner now sues to eject Yolanda. Who will prevail?","o":["The owner, because neither possessor held the land for 10 years.","The owner, because Yolanda’s deed came from someone who had no title to convey.","Yolanda, but only if she paid property taxes.","Yolanda, because she may tack Xavier’s possession onto hers through privity."],"a":3,"e":"Successive adverse possessors in privity (e.g., by deed, will, or descent) may tack their periods. Six years plus five years exceeds the 10-year period. Paying taxes is required only in some jurisdictions and is not indicated here."},
{"id":"property_8","s":"property","q":"A seller and buyer signed a valid contract for the sale of a house, with closing set for 60 days later. The contract was silent on risk of loss, and the jurisdiction has no statute on the issue. Before closing, the house was destroyed by lightning. The buyer refuses to close. Under the majority rule:","o":["The buyer may cancel, because the seller still held legal title when the house burned.","The contract is discharged for impossibility, because the house no longer exists.","The buyer must close, but at a price reduced by the value of the house.","The buyer must close and pay the full price, because she bore the risk of loss."],"a":3,"e":"Under the doctrine of equitable conversion (majority rule), the buyer becomes the equitable owner when the contract is signed and bears the risk of loss not caused by the seller, absent a contract provision or statute (such as the Uniform Vendor and Purchaser Risk Act) to the contrary. The buyer may be entitled to credit for any insurance proceeds the seller receives."},
{"id":"property_9","s":"property","q":"An owner borrowed from Bank 1, giving a mortgage that was promptly recorded, and later borrowed from Bank 2, giving a second recorded mortgage. The owner defaulted on Bank 2’s loan, and Bank 2 foreclosed, joining all necessary parties. A purchaser bought at the foreclosure sale. What is the purchaser’s position?","o":["The purchaser takes free of both mortgages.","The purchaser takes subject to Bank 2’s mortgage.","The purchaser is personally liable on Bank 1’s debt.","The purchaser takes subject to Bank 1’s mortgage."],"a":3,"e":"Foreclosure extinguishes the foreclosing mortgage and junior interests that are joined, but not senior interests. Bank 1’s senior mortgage survives, so the purchaser takes subject to it (though not personally liable unless she assumes it)."},
{"id":"property_10","s":"property","q":"A grantor conveyed land to a grantee by general warranty deed that did not mention a recorded utility easement crossing the property. The grantee discovers the easement a year later. Which covenant was breached, and when?","o":["Quiet enjoyment, when the grantee discovered the easement.","The covenant against encumbrances, breached at the time of conveyance.","The covenant of warranty, when the utility enters the land.","No covenant, because the grantee had record notice of the easement."],"a":1,"e":"The covenant against encumbrances is a present covenant, breached (if at all) at delivery of the deed if an encumbrance such as an easement exists. Most courts hold that the grantee’s knowledge of the encumbrance, including record notice, does not defeat the covenant."},
{"id":"property_11","s":"property","q":"A developer subdivided land into 50 lots under a recorded plat showing a residential development. The deeds to 49 lots restricted use to single-family homes. The deed to the last lot omitted the restriction. Its buyer, who saw that every other lot contained a single-family home, plans to build a convenience store. Neighbors sue to enjoin construction. The neighbors will most likely:","o":["Lose, because the buyer’s own deed contains no restriction on the use of the lot.","Win, because the common scheme implies a servitude of which the buyer had inquiry notice.","Lose, because there is no horizontal privity between the neighbors and the buyer of the lot.","Win, because zoning law automatically prohibits commercial use in subdivisions."],"a":1,"e":"Under the common-scheme (general plan) doctrine, a restriction may be implied on a lot whose deed omits it, creating an equitable servitude enforceable by injunction if the buyer had notice. The uniform appearance of the neighborhood gave inquiry notice. Privity is not required for equitable servitudes."},
{"id":"torts_0","s":"torts","q":"A defendant threw a rock at Al, intending to hit him. The rock missed Al and struck Beth, whom the defendant had not seen. In Beth’s battery action, the defendant will most likely be:","o":["Not liable, because he did not intend to hit Beth or even know she was there.","Not liable, because Beth was not the target of his intent.","Liable only if he was negligent in throwing the rock.","Liable, because his intent to strike Al transfers to Beth."],"a":3,"e":"Under the doctrine of transferred intent, the defendant’s intent to commit battery on Al transfers to the unintended victim, Beth. Transferred intent applies among assault, battery, false imprisonment, trespass to land, and trespass to chattels."},
{"id":"torts_1","s":"torts","q":"A city ordinance requires owners of apartment buildings to install handrails on all interior stairways to prevent falls. A tenant fell on a stairway that lacked a handrail. In the tenant’s negligence suit, what is the most likely effect of the ordinance under the majority rule?","o":["It establishes the landlord’s liability without further proof.","It is irrelevant, because violations of ordinances are punished only through criminal fines.","It establishes duty and breach, but the tenant must still prove causation and damages.","It creates a rebuttable presumption that the tenant was not negligent."],"a":2,"e":"Under negligence per se, an unexcused violation of a statute designed to protect a class including the plaintiff against the type of harm suffered establishes duty and breach (majority conclusive; some treat it as a presumption or evidence). The plaintiff must still prove causation and damages."},
{"id":"torts_2","s":"torts","q":"A host invited a friend to dinner. The host knew a back-porch step was rotten but did not mention it, and the rot was not visible. The friend stepped on it, fell, and was injured. In the friend’s negligence action, the host will most likely be:","o":["Not liable, because social guests take premises as they find them.","Not liable, because a host need not inspect for defects.","Liable, because the host failed to warn of a known, concealed danger.","Liable, because hosts owe social guests the highest care."],"a":2,"e":"A social guest is a licensee under the traditional approach. The possessor must warn of (or make safe) known dangerous conditions that the licensee is unlikely to discover. There is no duty to inspect for unknown dangers — but the host knew of the rot."},
{"id":"torts_3","s":"torts","q":"A patient underwent abdominal surgery under general anesthesia. She awoke with a severe injury to her right shoulder, which was not near the surgical site. She cannot identify which member of the surgical team caused it. In her negligence suit against the surgeon, anesthesiologist, and hospital, she can most likely:","o":["Not recover, because she cannot prove which of the defendants was negligent or how.","Recover only under a theory of strict liability for medical procedures.","Recover only if an expert witness identifies the specific negligent act.","Rely on res ipsa loquitur to infer negligence by those who controlled her care."],"a":3,"e":"Res ipsa loquitur applies where the injury ordinarily would not occur without negligence and the instrumentality was under the defendants’ control. Courts have applied it to unconscious patients injured during surgery, letting the inference run against those who controlled the patient (Ybarra v. Spangard)."},
{"id":"torts_4","s":"torts","q":"A plaintiff suffered $100,000 in damages in a collision. The jury found the plaintiff 60% at fault and the defendant 40% at fault. Nothing in the question indicates the jurisdiction’s rule. Under the rule assumed on the MBE, how much does the plaintiff recover?","o":["Nothing, because the plaintiff was more at fault than the defendant.","$60,000.","$40,000.","$100,000, because the defendant was negligent."],"a":2,"e":"NCBE’s MBE outline instructs examinees to assume pure comparative fault (and joint and several liability) unless otherwise indicated. Under pure comparative negligence, recovery is reduced by the plaintiff’s share of fault even if it exceeds 50%: $100,000 × 40% = $40,000. (A modified comparative-fault state like Ohio would bar recovery at 60% fault.)"},
{"id":"torts_5","s":"torts","q":"A driver negligently struck a pedestrian, breaking her leg. At the hospital, a doctor negligently set the fracture, causing permanent damage. Is the driver liable for the permanent damage?","o":["No, because the doctor’s negligence was a superseding cause.","Yes, because negligent medical care is a foreseeable intervening cause.","No, because the driver is liable only for harm he directly caused.","Yes, but only if the doctor is insolvent and cannot pay the judgment."],"a":1,"e":"Subsequent negligent medical care is a foreseeable consequence of causing physical injury, so it does not break the chain of proximate causation. The original tortfeasor is liable for the aggravation (the doctor is also liable for the harm she caused)."},
{"id":"torts_6","s":"torts","q":"A consumer bought a sealed can of soup at a grocery store. The soup contained a sharp piece of metal from the manufacturing process, which injured the consumer. The grocer had no way of discovering the defect. In the consumer’s strict products liability action against the grocer, the grocer will most likely be:","o":["Liable, because strict liability applies to all commercial sellers, regardless of fault.","Not liable, because it had no reasonable way to discover the defect in the sealed can.","Not liable, because only the manufacturer of a defective product is subject to strict liability.","Liable only if the grocer was negligent in how it stored or handled the soup."],"a":0,"e":"Strict products liability extends to all commercial sellers in the chain of distribution, including retailers, regardless of fault. The grocer may seek indemnity from the manufacturer. Lack of opportunity to inspect is not a defense to strict liability."},
{"id":"torts_7","s":"torts","q":"A newspaper published an article stating that the city’s mayor accepted a bribe. The statement was false. The reporter relied on a single source without checking public records that would have shown the story was false, but the reporter honestly believed the story was true. In the mayor’s defamation action, the mayor will most likely:","o":["Win, because the statement was false and defamatory.","Win, because the reporter was negligent in failing to check the readily available public records.","Lose, because a public official must prove actual malice, and negligence is not enough.","Lose, because statements about public officials are absolutely privileged."],"a":2,"e":"Under New York Times v. Sullivan, a public official must prove by clear and convincing evidence that the defendant published with actual malice — knowledge of falsity or reckless disregard for the truth (subjective serious doubts). A mere failure to investigate, without more, is negligence, not actual malice."},
{"id":"torts_8","s":"torts","q":"A jogger saw a young child, a stranger, face down in a shallow pond. The jogger could easily have pulled the child out without any risk but kept running. The child drowned. The jogger had no relationship with the child and did not create the danger. In a wrongful-death action against the jogger, the jogger will most likely be:","o":["Not liable, because there is generally no duty to rescue a stranger.","Liable, because the rescue would have involved no risk to the jogger.","Liable, because a reasonable person in the jogger’s position would have helped.","Not liable, because the child’s parents were negligent in supervising her."],"a":0,"e":"The common law imposes no general duty to aid or rescue a stranger, however easy the rescue. Exceptions exist for special relationships, where the defendant created the peril, or where the defendant undertook a rescue."},
{"id":"torts_9","s":"torts","q":"A construction company used dynamite to blast rock for a highway project, following all industry safety standards and exercising all reasonable care. Vibrations from the blast cracked the foundation of a nearby house. In the homeowner’s suit, the company will most likely be:","o":["Not liable, because it exercised all reasonable care and followed industry standards.","Not liable, because the highway project served an important public interest.","Liable, because blasting is an abnormally dangerous activity subject to strict liability.","Liable only if it violated a state or federal safety regulation."],"a":2,"e":"Blasting is a classic abnormally dangerous activity: it creates a foreseeable and highly significant risk of physical harm even with reasonable care and is not a matter of common usage. Strict liability applies to harm within that risk, such as vibration and debris damage."},
{"id":"torts_10","s":"torts","q":"A store employee saw a customer put something in her purse and reported it. A security guard politely asked the customer to come to the office, where she was held for 15 minutes while the guard reviewed security video, which showed she had put her own phone in the purse. She was then released with an apology. In her false imprisonment action, the store will most likely:","o":["Not be liable, because the detention fell within the shopkeeper’s privilege.","Be liable, because the customer was innocent of any shoplifting.","Be liable, because she was confined in the security office against her will for 15 minutes.","Not be liable, because the customer never attempted to leave the office."],"a":0,"e":"The shopkeeper’s privilege allows a merchant with a reasonable belief that a person has shoplifted to detain the person for a reasonable time and in a reasonable manner to investigate. A brief, polite detention to review video satisfies it, even though the customer was innocent."},
{"id":"torts_11","s":"torts","q":"A driver negligently rear-ended a car at low speed. Because the other driver had a rare bone condition, she suffered severe fractures that an ordinary person would not have suffered. The driver argues he should be liable only for the minor injuries an ordinary person would have sustained. The driver’s argument will most likely:","o":["Fail, because a defendant takes the plaintiff as he finds her.","Succeed, because damages are limited to foreseeable injuries.","Succeed, because her condition was a superseding cause.","Fail, because drivers are strictly liable for car accidents."],"a":0,"e":"Under the eggshell-skull (thin-skull) rule, once a defendant is liable for causing some physical harm, he is liable for the full extent of the injuries, even if they are unusually severe because of a pre-existing condition."}
];

{"id":"civpro_b1_01","s":"civpro","q":"An e-bike maker is incorporated and headquartered in Oregon. It advertises its e-bikes in Ohio, sells them through Ohio dealers, and runs authorized repair shops there. An Ohio resident bought a used e-bike of one of the maker’s current models from a private seller in Indiana and rode it home. The bike was first sold new in Washington. A month later its battery caught fire in the rider’s Ohio garage and burned her. She sued the maker in federal court in Ohio. Ohio’s long-arm statute reaches the limits of due process. The maker moved to dismiss for lack of personal jurisdiction. How should the court rule?","o":["Grant the motion, because specific jurisdiction requires that the maker’s Ohio contacts caused the claim, and this particular bike was first sold new outside Ohio.","Deny the motion, because the maker serves an Ohio market for this model and the claim relates to those Ohio contacts.","Deny the motion, because a company is subject to general jurisdiction in every state where it regularly advertises and sells its products.","Grant the motion, because the bike reached Ohio only through the rider’s unilateral act."],"a":1,"e":"Specific jurisdiction requires purposeful availment and a claim that “arises out of or relates to” the defendant’s forum contacts. Under Ford Motor Co. v. Montana Eighth Judicial District Court (2021), “relates to” does not require strict causation. When a company serves a market for a product in the forum and that product malfunctions and injures someone there, jurisdiction is proper even if the particular unit was first sold elsewhere. Why the other choices are wrong: The choice requiring the Ohio contacts to have caused the claim states the causation-only test the Supreme Court rejected in Ford; relatedness is enough. The general-jurisdiction choice is wrong because, under Daimler AG v. Bauman, a corporation is subject to general jurisdiction only where it is “at home,” ordinarily its state of incorporation and principal place of business (Oregon here). The unilateral-activity choice fails because the maker itself deliberately cultivated the Ohio market for this model; this is not a case like World-Wide Volkswagen, where the defendants did no business in the forum.","topic":"Civ Pro > Jurisdiction and venue > Personal jurisdiction > Specific jurisdiction (relatedness)","batch":1,"status":"approved"},
{"id":"civpro_b1_02","s":"civpro","q":"A freight train derailed and spilled chemicals near a town. The town sued the railroad in federal court, and after a full trial the jury found that the railroad negligently maintained the track. The railroad had every incentive to defend vigorously, and judgment for the town became final. No other judgments on the issue exist. A year later, a resident discovered chemical damage to her well that had not appeared earlier, and she sued the railroad in federal court. She moved for partial summary judgment, arguing the railroad is precluded from relitigating its negligence. Assume federal preclusion law applies. How should the court rule?","o":["Deny the motion, because issue preclusion requires mutuality of parties between the two actions.","Grant the motion if the court, in its discretion, finds that applying offensive issue preclusion is fair to the railroad.","Deny the motion, because offensive issue preclusion may never be used against a defendant who did not choose the forum in which the first action was litigated.","Grant the motion, because claim preclusion bars the railroad from relitigating any matter arising out of the same derailment in any later action against it."],"a":1,"e":"Federal courts have abandoned the mutuality requirement. Under Parklane Hosiery Co. v. Shore, a court has discretion to allow a nonparty to use issue preclusion offensively when the issue was actually litigated and necessarily decided in a final judgment, the party bound had a full and fair opportunity to litigate, and fairness factors favor it. Those factors include whether the plaintiff could easily have joined the first action, the defendant’s incentive to litigate, any inconsistent judgments, and procedural opportunities unavailable earlier. All favor the resident here. Why the other choices are wrong: The mutuality choice is wrong because federal law no longer requires mutuality for issue preclusion (Blonder-Tongue for defensive use; Parklane for offensive use). The never-against-a-defendant choice states no real rule; Parklane itself permitted offensive use against a defendant that fully litigated the issue. The claim-preclusion choice is wrong because claim preclusion requires the same parties (or privies) and the same claim; the resident was not a party and asserts her own claim.","topic":"Civ Pro > Verdicts, judgments, and preclusion > Issue preclusion > Nonmutual offensive use","batch":1,"status":"approved"},
{"id":"civpro_b1_03","s":"civpro","q":"A shopper slipped in a store on March 1, Year 1. The limitations period is two years. On February 20, Year 3, she sued “Brightway Stores, Inc.” in federal court. The store was actually operated by Brightway Retail LLC, a wholly owned subsidiary that shares offices and in-house counsel with the parent. That counsel received the complaint within a week and immediately understood that the shopper meant to sue the store’s operator. On April 25, Year 3, the shopper amended the complaint to name the LLC, which then moved to dismiss on limitations grounds. How should the court rule?","o":["Grant the motion, because an amendment that changes the party against whom a claim is asserted cannot relate back to the date of the original pleading.","Grant the motion, because the LLC was neither named nor served before the two-year limitations period expired on March 1, Year 3.","Deny the motion, because any amendment filed within 90 days after the original complaint automatically relates back to the original filing date.","Deny the motion, because within the Rule 4(m) period the LLC had notice of the suit and knew it would have been named but for a mistake about the proper party."],"a":3,"e":"Under Rule 15(c)(1)(C), an amendment changing the party relates back if the claim arises from the same conduct and, within the Rule 4(m) period for service (90 days after filing), the new party received notice so that it will not be prejudiced and knew or should have known that it would have been sued but for a mistake concerning the proper party’s identity. Krupski v. Costa Crociere focuses on what the new defendant knew, not on the plaintiff’s diligence. The amendment came within 90 days of filing, and the LLC knew of the mistake. Why the other choices are wrong: The cannot-relate-back choice is wrong because Rule 15(c)(1)(C) expressly allows relation back of an amendment that changes the party or its name. The served-before-limitations choice is wrong because notice need only come within the Rule 4(m) period after the original filing, not before the limitations period ran. The automatic-90-days choice is wrong because timing alone is not enough; the rule also requires the same conduct, notice, and knowledge of the mistake.","topic":"Civ Pro > Pretrial procedures > Pleadings > Amendment and relation back (Rule 15(c))","batch":1,"status":"approved"},
{"id":"civpro_b1_04","s":"civpro","q":"Purchasers of a smart thermostat with an allegedly defective sensor sued its manufacturer in federal court on behalf of about 40,000 buyers nationwide, seeking money damages. The court found that common questions predominate and that a class action is superior, and it certified a class under Rule 23(b)(3). Which of the following must the court now do?","o":["Confirm that every absent class member is a citizen of a state different from every defendant, since diversity is assessed across the whole class.","Require that each absent class member’s individual claim exceed $75,000, so the court has jurisdiction over every member’s claim.","Obtain the written consent of each class member before approving any settlement, because a class settlement binds members only if each one agrees to it.","Direct the best notice practicable to class members, including individual notice to those identifiable with reasonable effort, telling them they may opt out."],"a":3,"e":"For a Rule 23(b)(3) damages class, Rule 23(c)(2)(B) requires the best notice practicable under the circumstances, including individual notice to all members who can be identified through reasonable effort. The notice must tell members, among other things, that they may request exclusion and that the judgment will bind those who do not opt out. Why the other choices are wrong: The every-member-diverse choice is wrong because, in a traditional diversity class action, only the named representatives’ citizenship counts, and under CAFA minimal diversity suffices. The $75,000-per-member choice is wrong because absent members’ claims may be covered by supplemental jurisdiction if a named plaintiff satisfies the amount (Exxon Mobil v. Allapattah), and CAFA aggregates claims against a $5 million threshold. The individual-consent choice is wrong because a class settlement needs court approval after notice and a hearing on whether it is fair, reasonable, and adequate; members may object but individual consent is not required.","topic":"Civ Pro > Pretrial procedures > Joinder > Class actions (Rule 23(b)(3))","batch":1,"status":"approved"},
{"id":"civpro_b1_05","s":"civpro","q":"After a warehouse fire, the owner’s insurer anticipated a lawsuit by a neighboring business. Two days after the fire, the insurer’s claims investigator interviewed the warehouse’s night watchman and wrote a summary of what he said, adding her own assessment of his credibility. The watchman has since died. In the neighbor’s federal suit against the owner, the neighbor requested the summary, and the owner objected on work-product grounds. How should the court rule?","o":["Order production of the whole summary, because work-product protection covers only documents prepared by a party’s attorney, not by an insurer.","Deny production, because material prepared in anticipation of litigation is absolutely immune from discovery regardless of the requesting party’s need.","Deny production, because the summary is hearsay that would be inadmissible at trial and therefore falls outside the scope of discovery.","Order production of the factual portions, because the neighbor has a substantial need and cannot obtain their equivalent elsewhere, while protecting the investigator’s assessment."],"a":3,"e":"Rule 26(b)(3) protects documents prepared in anticipation of litigation by or for a party or its representative, expressly including its insurer. Ordinary (fact) work product is discoverable on a showing of substantial need and inability to obtain the substantial equivalent without undue hardship; the witness’s death makes that showing. Even then, the court must protect mental impressions, conclusions, opinions, and legal theories, such as the credibility assessment. Why the other choices are wrong: The attorney-only choice is wrong because the rule covers materials prepared by a party’s representatives, including its insurer and investigators. The absolute-immunity choice is wrong because ordinary work product yields to substantial need and undue hardship; only opinion work product receives near-absolute protection. The hearsay choice is wrong because information within the scope of discovery need not be admissible in evidence (Rule 26(b)(1)).","topic":"Civ Pro > Pretrial procedures > Discovery > Work product (Rule 26(b)(3))","batch":1,"status":"approved"},
{"id":"civpro_b1_06","s":"civpro","q":"An employer sued a former employee in federal court, alleging breach of a noncompetition agreement. The employer sought a permanent injunction and $300,000 in damages and timely demanded a jury. Whether the employee breached the agreement is a factual issue common to both remedies. How should the court proceed?","o":["Try the entire case without a jury, because the injunction is the primary relief sought and the damages claim is merely incidental to it.","Have the jury decide the common factual issues on the damages claim, then decide the injunction consistently with the jury’s findings.","Decide the injunction claim first, then submit only the amount of damages to the jury, so that the court’s findings on breach control.","Deny the jury demand on all issues, because a party that seeks equitable relief in its complaint waives any right to a jury on its other claims."],"a":1,"e":"The Seventh Amendment preserves the jury right for legal claims such as damages for breach of contract. When legal and equitable claims share common factual issues, the legal claims must be tried to the jury first (or together), so the judge’s equitable ruling cannot preclude the jury’s determination (Beacon Theatres v. Westover; Dairy Queen v. Wood). Why the other choices are wrong: The incidental-relief choice is wrong because the old equitable clean-up doctrine was rejected in Beacon Theatres and Dairy Queen; a legal claim keeps its jury right. The injunction-first choice is wrong because deciding the common issues in equity first would deprive the employer of a jury determination of breach. The waiver choice is wrong because seeking equitable relief does not waive the jury right on legal claims joined in the same action.","topic":"Civ Pro > Jury trials > Right to jury trial (legal and equitable claims)","batch":1,"status":"approved"},
{"id":"civpro_b1_07","s":"civpro","q":"Two drivers collided. The first driver sued the second in federal court, invoking diversity jurisdiction, for his injuries. The second driver answered and denied negligence but asserted no claim for her own injuries. After trial, judgment was entered for the first driver. The second driver then filed a new federal action against the first driver for her injuries from the same collision. The first driver moved to dismiss. How should the court rule?","o":["Deny the motion, because under the Federal Rules every counterclaim is permissive, so a defendant may always bring her own claim in a later action.","Deny the motion, because preclusion applies only to the party who chose to file the first action, and the second driver was the defendant there.","Grant the motion, because the second driver’s claim was a compulsory counterclaim that she failed to assert in the first action.","Grant the motion, because filing the first action started a new limitations period that expired before the second driver brought her claim."],"a":2,"e":"Under Rule 13(a), a pleading must state as a counterclaim any claim the pleader has against an opposing party that arises out of the same transaction or occurrence, unless an exception applies. A claim for injuries from the same collision is a classic compulsory counterclaim; failing to assert it bars a later action on it. Why the other choices are wrong: The always-permissive choice is wrong because Rule 13(a) makes same-transaction counterclaims compulsory; only claims from other transactions are permissive under Rule 13(b). The plaintiff-only choice is wrong because the compulsory-counterclaim rule specifically binds the defending party, and preclusion can bind both sides. The limitations choice is wrong because filing a lawsuit does not start or shorten the limitations period on the opposing party’s claim; the bar comes from Rule 13(a).","topic":"Civ Pro > Pretrial procedures > Joinder > Compulsory counterclaims (Rule 13(a))","batch":1,"status":"approved"},
{"id":"conlaw_b1_01","s":"conlaw","q":"A state law requires independent candidates for statewide office to file nominating petitions 300 days before the general election. An independent candidate sued state officials in federal court, claiming the deadline violates the First and Fourteenth Amendments, and sought declaratory and injunctive relief. The election took place while the case was on appeal. The candidate has announced she will run as an independent in the next election. The state argues the case is moot. Should the appeal be dismissed as moot?","o":["Yes, because the election is over and no court order could now place the candidate on the ballot for that election.","Yes, because federal courts may not issue declaratory judgments about the validity of procedures used in elections that have already taken place.","No, because the state has voluntarily stopped enforcing the deadline, and voluntary cessation never moots a case.","No, because the dispute is capable of repetition, yet evading review, and the candidate expects to face the deadline again."],"a":3,"e":"A case is normally moot when a live controversy ends. An exception applies when the challenged action is too short in duration to be fully litigated before it ends and there is a reasonable expectation that the same complaining party will be subject to it again. Election-law challenges are the classic example, and the candidate plans to run again. Why the other choices are wrong: The election-is-over choice ignores the capable-of-repetition exception, which exists precisely for disputes like this one. The no-declaratory-judgments choice states no such rule; the request for relief against future application of the deadline remains live under the exception. The voluntary-cessation choice misreads the facts: the state has not stopped enforcing the law. Voluntary cessation also only makes mootness harder to show; it does not mean cessation never moots a case.","topic":"Con Law > Judicial power > Justiciability > Mootness (capable of repetition, yet evading review)","batch":1,"status":"approved"},
{"id":"conlaw_b1_02","s":"conlaw","q":"A federal statute withholds 5% of a state’s federal highway-safety grant unless the state enacts a law suspending the driver’s license of anyone convicted of texting while driving. The condition is stated clearly in the statute. A state that refuses to enact such a law sues, claiming the statute exceeds Congress’s powers. How is the court likely to rule?","o":["The statute is unconstitutional, because Congress cannot directly regulate state driver licensing and therefore cannot do so indirectly by attaching conditions to grants.","The statute is constitutional, because the condition is unambiguous, related to the federal interest in highway safety, and not coercive.","The statute is unconstitutional, because the Tenth Amendment prohibits Congress from using federal money to influence the content of state legislation.","The statute is constitutional, because Congress may attach any condition it wishes to federal money, since each state remains free to decline the funds."],"a":1,"e":"Under South Dakota v. Dole, Congress may attach conditions to federal funds if they serve the general welfare, are stated unambiguously, are related to the federal interest in the program, do not require states to violate other constitutional provisions, and are not so coercive that pressure turns into compulsion. Losing 5% of one grant is mild encouragement, unlike the threat to all existing Medicaid funding struck down in NFIB v. Sebelius. Why the other choices are wrong: The cannot-do-indirectly choice is wrong because Dole holds that Congress may use spending conditions to pursue goals it might not reach directly. The Tenth Amendment choice is wrong because the anti-commandeering doctrine forbids compelling states to legislate, not offering them financial inducements they may refuse. The any-condition choice overstates the power; conditions must be unambiguous, related to the program, not coercive, and not otherwise unconstitutional.","topic":"Con Law > Powers of Congress > Spending power > Conditions on federal grants","batch":1,"status":"approved"},
{"id":"conlaw_b1_03","s":"conlaw","q":"A coastal state charges residents $50 for an annual commercial shrimping license and charges nonresidents $2,500 for the same license. The state asserts that the fee difference helps conserve shrimp stocks, but it offers no evidence that nonresidents harm the stocks more than residents do. A nonresident who shrimps commercially in the state’s waters sues to invalidate the fee difference. What is the strongest basis for the claim, and is it likely to succeed?","o":["The Fourteenth Amendment’s Privileges or Immunities Clause; likely to succeed, because that clause guarantees every citizen the right to pursue a lawful trade in any state.","Article IV’s Privileges and Immunities Clause; unlikely to succeed, because commercial fishing is not a fundamental interest.","The dormant Commerce Clause; unlikely to succeed, because a state may prefer its own residents in the use of wildlife and other natural resources found in its waters.","Article IV’s Privileges and Immunities Clause; likely to succeed, because the state shows no substantial reason for the discrimination closely related to it."],"a":3,"e":"The Article IV Privileges and Immunities Clause protects individual citizens of other states against discrimination concerning fundamental interests, including pursuing a livelihood or commercial activity. Discrimination survives only if the state has a substantial reason for it and the discrimination bears a substantial relationship to that reason, such as evidence that nonresidents are a peculiar source of the problem (Toomer v. Witsell). The state offered none. Why the other choices are wrong: The Fourteenth Amendment choice is wrong because that clause protects only a narrow set of national-citizenship rights (Slaughter-House Cases), such as aspects of the right to travel (Saenz v. Roe), not a general right to pursue a trade. The not-fundamental choice is wrong because pursuing a common calling, including commercial fishing, is a protected interest under Article IV. The state-ownership choice is wrong because the Supreme Court rejected the idea that state “ownership” of wildlife justifies discrimination (Hughes v. Oklahoma); discriminatory laws face near-fatal scrutiny under the dormant Commerce Clause.","topic":"Con Law > Federalism > Privileges and Immunities Clause of Article IV","batch":1,"status":"approved"},
{"id":"conlaw_b1_04","s":"conlaw","q":"A rural state has no public high schools in some towns. For students in those towns, it pays tuition at an approved private school of the family’s choice, but it excludes any school that provides religious instruction. Parents who want to use the tuition money at a religious school sue, claiming the exclusion is unconstitutional. How should the court rule?","o":["For the parents, because a state that subsidizes private schooling may not exclude schools because they are religious or teach religion.","For the state, because the Establishment Clause forbids public funding of religious instruction.","For the state, because the exclusion is a neutral law of general applicability that only incidentally burdens religion, so Employment Division v. Smith applies.","For the parents, because the Establishment Clause forbids state laws that express disapproval or hostility toward religious schools and religious families."],"a":0,"e":"In Carson v. Makin (2022), building on Trinity Lutheran and Espinoza, the Supreme Court held that excluding otherwise eligible schools from a generally available tuition program because of their religious character or religious instruction violates the Free Exercise Clause. Such an exclusion triggers strict scrutiny, and an interest in separation beyond what the Establishment Clause requires is not compelling. The Court rejected a status-versus-use distinction. Why the other choices are wrong: The Establishment Clause choice is wrong because aid that reaches religious schools only through private families’ independent choices does not violate that clause (Zelman v. Simmons-Harris). The Smith choice is wrong because the exclusion singles out religious schools by its terms, so it is not neutral and Smith’s deferential rule does not apply. The Establishment Clause–hostility choice is wrong because the parents’ winning claim rests on the Free Exercise Clause, not the Establishment Clause.","topic":"Con Law > Individual rights > First Amendment > Free Exercise (funding exclusions)","batch":1,"status":"approved"},
{"id":"conlaw_b1_05","s":"conlaw","q":"Congress created a federal agency with broad power to issue binding regulations and to bring enforcement actions seeking civil penalties. The agency is headed by a single director appointed by the President with the Senate’s consent for a five-year term. The statute lets the President remove the director only for “inefficiency, neglect of duty, or malfeasance in office.” The President removed the director solely because of policy disagreements. The director sued for reinstatement. Who is likely to prevail?","o":["The director, because under Humphrey’s Executor Congress may limit the President’s power to remove the heads of independent agencies to cause.","The director, because an officer whose appointment required Senate confirmation may be removed only with the Senate’s consent.","The President, because Congress may not insulate a single-director agency that wields significant executive power from removal at will.","The President, because the President may remove any federal officer at will, including inferior officers protected by civil-service laws."],"a":2,"e":"In Seila Law LLC v. CFPB (2020), the Court held that for-cause removal protection for the single director of an agency wielding significant executive power violates the separation of powers, and Collins v. Yellen (2021) applied that holding to another single-director agency. Humphrey’s Executor permits for-cause protection for multimember expert bodies, and Morrison v. Olson for certain inferior officers with limited duties. Neither describes this director. Why the other choices are wrong: The Humphrey’s Executor choice is wrong because that precedent covers multimember bodies of experts, not a single director exercising substantial executive power. The Senate-consent choice is wrong because the Constitution does not require Senate participation in removals, and Congress may not reserve a removal role for itself (Myers; Bowsher v. Synar). The any-officer choice is wrong because Congress may restrict removal of inferior officers and civil servants in many circumstances (Perkins; Morrison v. Olson).","topic":"Con Law > Separation of powers > Executive power > Appointment and removal of officers","batch":1,"status":"approved"},
{"id":"conlaw_b1_06","s":"conlaw","q":"To reduce vaping by teenagers, a city ordinance prohibits retailers from displaying the prices of lawful vaping products on any sign visible from outside the store. The price signs are truthful and do not propose illegal transactions. A retailer challenges the ordinance under the First Amendment. What test will the court apply?","o":["The ban will be upheld if it is rationally related to a legitimate government interest.","The city must show that the ban is necessary to achieve a compelling interest, because commercial speech is protected to the same degree as political speech.","The ban will be upheld without further inquiry, because advertising for products that are harmful to minors is a category of speech outside First Amendment protection.","The city must show that the ban directly advances a substantial interest and is not more extensive than necessary to serve it."],"a":3,"e":"Truthful, non-misleading commercial speech about lawful activity is protected under intermediate scrutiny (Central Hudson Gas & Electric v. Public Service Commission). The government must assert a substantial interest, show that the regulation directly advances it, and show that the regulation is not more extensive than necessary, meaning a reasonable fit rather than the least restrictive means. Lorillard Tobacco v. Reilly applied this test to tobacco-advertising limits aimed at protecting minors. Why the other choices are wrong: The rational-basis choice is wrong because commercial speech receives intermediate scrutiny, not rational-basis review. The strict-scrutiny choice is wrong because, under Central Hudson, regulation of commercial speech gets intermediate scrutiny rather than the strict scrutiny used for core political speech. The unprotected-category choice is wrong because truthful advertising of lawful products is not an unprotected category, even when the products may harm minors.","topic":"Con Law > Individual rights > First Amendment > Commercial speech","batch":1,"status":"approved"},
{"id":"conlaw_b1_07","s":"conlaw","q":"A state statute requires all public elementary and secondary school teachers to be United States citizens. A lawful permanent resident with a valid teaching certificate was denied a teaching job solely because of the statute. She sued, claiming a violation of the Equal Protection Clause. How should the court rule?","o":["Uphold the statute, because public-school teaching is a governmental function closely tied to self-government, so only rational-basis review applies.","Strike down the statute, because every state law that classifies on the basis of alienage is subject to strict scrutiny and this law is not narrowly tailored.","Strike down the statute, because only Congress may regulate matters relating to noncitizens, so state citizenship requirements are preempted by federal immigration law.","Uphold the statute, because noncitizens are not “persons” within the meaning of the Equal Protection Clause of the Fourteenth Amendment."],"a":0,"e":"State classifications based on alienage generally get strict scrutiny (Graham v. Richardson). Under the political-function exception, however, a state may require citizenship for positions closely tied to democratic self-government, and rational-basis review applies. The Supreme Court applied the exception to public-school teachers in Ambach v. Norwick and to police officers in Foley v. Connelie. Why the other choices are wrong: The always-strict-scrutiny choice is wrong because it ignores the political-function exception, which applies to public-school teaching. The preemption choice is wrong because a state’s choice of qualifications for its own public employees does not regulate immigration, and the federal plenary power over immigration does not bar it. The not-persons choice is wrong because lawfully present noncitizens are “persons” protected by the Equal Protection Clause (Yick Wo; Graham v. Richardson).","topic":"Con Law > Individual rights > Equal protection > Alienage (political-function exception)","batch":1,"status":"approved"},
{"id":"contracts_b1_01","s":"contracts","q":"A restaurant-equipment dealer sold a commercial dishwasher to a café for $9,000 under a three-page signed form contract. On page 3, in the same small type as the surrounding terms and without a heading, the form said: “Seller makes no warranties, express or implied, including any warranty of merchantability.” Within weeks, a manufacturing defect caused the machine to fail repeatedly. The café sued the dealer for breach of the implied warranty of merchantability. Is the disclaimer effective?","o":["Yes, because the disclaimer expressly uses the word “merchantability,” which is all that §2-316 requires for a written disclaimer of that warranty.","Yes, because the café is a commercial buyer, and the conspicuousness requirement protects only consumers who buy goods for personal or household use.","No, because a written disclaimer of merchantability must be conspicuous, and this one was not.","No, because a merchant can never disclaim the implied warranty of merchantability."],"a":2,"e":"The implied warranty of merchantability arises in a sale by a merchant who deals in goods of that kind (§2-314). Under §2-316(2), a disclaimer of that warranty must mention merchantability and, if in writing, must be conspicuous, meaning a reasonable person ought to notice it (for example, a heading, capitals, or contrasting type). Small type with no heading fails that test. Nothing suggests an “as is” sale or another basis for exclusion. Why the other choices are wrong: The mentions-merchantability choice is incomplete: naming the warranty is necessary, but a written disclaimer must also be conspicuous. The commercial-buyer choice is wrong because §2-316(2) has no exception for merchant or business buyers. The can-never-disclaim choice is wrong because Article 2 allows disclaimers that meet §2-316, and “as is” language can also exclude implied warranties.","topic":"Contracts > UCC Article 2 > Warranties > Disclaimer of implied warranty of merchantability (§2-316)","batch":1,"status":"approved"},
{"id":"contracts_b1_02","s":"contracts","q":"A packaging company agreed to deliver 1,000 printed cartons to a bakery on the first of each month for 12 months. In the third delivery, 40 cartons had a smudged logo. The packaging company immediately offered to replace them within a week, and the smudges did not affect the value of the remaining cartons or the bakery’s operations. The bakery rejected the entire third delivery and declared the whole contract canceled. Was the bakery entitled to reject the third installment, to cancel the contract, or both?","o":["It could reject the installment and cancel the contract.","It could reject the installment but could not cancel the contract.","It could cancel the contract but had to accept the installment.","It could neither reject the installment nor cancel the contract."],"a":3,"e":"In an installment contract (§2-612), the perfect-tender rule does not apply. A buyer may reject an installment only if the nonconformity substantially impairs that installment’s value and cannot be cured. If the seller gives adequate assurance of cure, the buyer must accept. The whole contract is breached, allowing cancellation, only if the nonconformity substantially impairs the value of the whole contract. Forty smudged cartons, with prompt replacement offered, meet neither standard. Why the other choices are wrong: The reject-and-cancel choice assumes the perfect-tender rule, which is wrong because §2-612 replaces the perfect-tender rule with a substantial-impairment standard for installment contracts. The reject-only choice is wrong because a curable defect that does not substantially impair the installment cannot justify rejecting it when the seller offers cure. The cancel-only choice is wrong because a minor, curable defect in one installment does not substantially impair the value of the whole contract.","topic":"Contracts > UCC Article 2 > Performance > Installment contracts (§2-612)","batch":1,"status":"approved"},
{"id":"contracts_b1_03","s":"contracts","q":"A quarry contracted to deliver 500 tons of gravel to a builder on June 1 at $40 per ton. The quarry failed to deliver. On June 2, the builder bought 500 tons of comparable gravel from another supplier in good faith and without unreasonable delay, at $46 per ton, the best price then available. The builder also paid a $300 broker’s fee to locate it. The market price on June 1 was $45 per ton. The builder incurred no other losses and saved no expenses. How much can the builder recover from the quarry?","o":["$2,500, the market price minus the contract price.","$3,000, the cover price minus the contract price.","$3,300, the cover difference plus the broker’s fee.","$23,300, the full cost of cover plus the broker’s fee."],"a":2,"e":"A buyer who covers in good faith and without unreasonable delay recovers the difference between the cost of cover and the contract price, plus incidental and consequential damages, minus expenses saved (§2-712). That is ($46 − $40) × 500 = $3,000, plus the $300 broker’s fee as an incidental damage (§2-715(1)), for a total of $3,300. Why the other choices are wrong: The $2,500 market-price choice uses §2-713, which is an alternative for a buyer who does not cover; a buyer who reasonably covers may measure damages by cover price. The $3,000 choice omits the broker’s fee, which is a recoverable incidental damage under §2-715(1) as a commercially reasonable expense of effecting cover. The $23,300 choice ignores that the builder would have paid the $20,000 contract price anyway; damages put the buyer where performance would have, not in a better position.","topic":"Contracts > UCC Article 2 > Remedies > Buyer’s cover damages (§2-712)","batch":1,"status":"approved"},
{"id":"contracts_b1_04","s":"contracts","q":"A general contractor preparing a bid on a school project solicited bids from electrical subcontractors. One subcontractor bid $200,000, which was in line with the other bids, and the contractor had no reason to suspect an error. The contractor used that bid in computing its own bid and was awarded the project. The next day, before the contractor formally accepted, the subcontractor said it had made a calculation error and withdrew its bid. The bid said nothing about irrevocability. The contractor promptly hired the next-lowest electrical subcontractor for $240,000 and sued the first subcontractor. What is the contractor likely to recover?","o":["$40,000, because the subcontractor should have expected the contractor to rely on its bid, and the contractor reasonably did.","Nothing, because an offer not supported by consideration may be revoked at any time before acceptance, and the contractor had not yet accepted.","$240,000, the full price of the substitute electrical work, because the subcontractor’s withdrawal was a repudiation of the entire contract.","Nothing, because a party who makes a unilateral calculation error in a bid may always withdraw it before the bid is formally accepted."],"a":0,"e":"Under Restatement (Second) of Contracts §87(2) and Drennan v. Star Paving, an offer that the offeror should reasonably expect to induce substantial action before acceptance, and that does induce it, is binding as an option contract to the extent necessary to avoid injustice. The subcontractor knew its bid would be used in the general bid. The contractor recovers its expectation loss, the $40,000 extra cost of substitute performance. Why the other choices are wrong: The freely-revocable choice states the traditional rule but ignores the reliance-based exception that makes subcontractor bids irrevocable once relied on. The $240,000 choice would give the contractor the substitute work for free; it would have paid $200,000 anyway, so its loss is the $40,000 difference. The unilateral-mistake choice is wrong because relief for unilateral mistake generally requires that the other party knew or had reason to know of the error (or that enforcement be unconscionable), and the contractor had no reason to suspect one.","topic":"Contracts > Formation > Consideration substitutes > Promissory estoppel and subcontractor bids","batch":1,"status":"approved"},
{"id":"contracts_b1_05","s":"contracts","q":"A homeowner who was not a dealer sold an old electric guitar to a hobbyist for $1,200. Before the sale, the homeowner had the guitar examined by a reputable repair shop, which identified it as an ordinary 1970s production model, and both parties believed that. Neither party had any reason to doubt the identification. After delivery, an expert determined that the guitar was a hand-built prototype worth about $60,000. The contract said nothing about the guitar’s identity or about who bore the risk of error. The homeowner sued to rescind. Is the homeowner likely to succeed?","o":["No, because a mistake about the value of the item sold is never a ground for rescission once the contract has been fully performed.","Yes, because both parties were mistaken about a basic assumption that materially affected the exchange, and the homeowner did not bear that risk.","No, because rescission for mistake is available only when one party alone was mistaken and the other party knew of that mistake.","Yes, because a price that is grossly below the item’s true value is unconscionable, so the court may refuse to enforce the sale."],"a":1,"e":"Under Restatement (Second) of Contracts §152, a contract is voidable by the adversely affected party when both parties share a mistake about a basic assumption on which the contract was made, the mistake materially affects the agreed exchange, and that party does not bear the risk of the mistake under §154. Both believed this was an ordinary production model; it was a different kind of object. The homeowner relied on an expert identification rather than knowingly proceeding with limited knowledge, so she did not bear the risk. Why the other choices are wrong: The mere-value choice is wrong because the shared mistake concerned the guitar’s identity and nature (a prototype, not a production model), which is a basic assumption; full performance does not bar rescission. The knew-of-the-mistake choice describ
