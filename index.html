{"id":"conlaw_b2_01","s":"conlaw","q":"A state law exempts religious organizations from burdensome charitable-solicitation registration and reporting requirements, but only if more than 60 percent of their funds come from their own members. Newer religious groups that rely mainly on soliciting the public must register. One such group sues, claiming that the law violates the Establishment Clause. What standard will the court apply?","o":["Rational basis, because the law is a neutral regulation of fundraising that applies to all charities.","No scrutiny, because exempting religious groups from regulation is a permissible accommodation of religion.","Intermediate scrutiny, because the law regulates soliciting money, which is a form of commercial speech.","Strict scrutiny, because the law grants a preference to some religious denominations over others."],"a":3,"e":"The clearest command of the Establishment Clause is that one religious denomination cannot be officially preferred over another. A law that draws distinctions among religious groups, here by favoring established, member-funded churches over newer groups that solicit the public, must be justified by a compelling governmental interest and be closely fitted (narrowly tailored) to that interest. Neutral laws that incidentally affect religion are analyzed differently, but this law classifies among denominations on its face. Why the other choices are wrong: The neutral-regulation choice is wrong because the exemption itself sorts religious organizations into favored and disfavored groups. It is not neutral among religions. The accommodation choice is wrong because a government may accommodate religion generally, but it may not grant an accommodation only to some denominations. The commercial-speech choice is wrong because charitable solicitation is fully protected speech, and in any event the challenge here is to a denominational preference under the Establishment Clause.","topic":"Con Law > Individual rights > First Amendment > Establishment Clause (denominational preference)","batch":2,"status":"approved"},
{"id":"conlaw_b2_02","s":"conlaw","q":"A state owns and operates a plant that produces road salt, which it has long sold to buyers in several states. During a severe winter shortage, the state adopted a policy of selling the plant’s salt only to its own municipalities and to private buyers located in the state. An out-of-state town that had regularly bought salt from the plant sues, claiming that the policy violates the dormant Commerce Clause. Will the town likely succeed?","o":["Yes, because the policy discriminates against out-of-state buyers, and the state has nondiscriminatory alternatives.","Yes, because the Privileges and Immunities Clause of Article IV forbids a state from favoring its own residents.","No, because a state may discriminate against interstate commerce whenever it faces a genuine emergency.","No, because the state is acting as a market participant selling its own product, not as a regulator of the market."],"a":3,"e":"The dormant Commerce Clause limits states acting as market regulators. When a state itself enters the market as a buyer or seller, it may generally choose its trading partners and favor its own citizens, just as a private business could. Selling salt produced at a state-owned plant only to in-state buyers falls within this market-participant exception. The exception does not let a state impose conditions that regulate downstream transactions after the sale, but no such conditions are involved here. Why the other choices are wrong: The discrimination choice applies the test for state regulation, which the market-participant exception displaces when the state sells its own goods. The Article IV choice is wrong because that clause protects individual citizens, not municipalities, and the town’s claim is brought under the dormant Commerce Clause. The emergency choice is wrong because there is no general emergency exception. Discriminatory regulation must still serve a legitimate local purpose that cannot be met by nondiscriminatory means.","topic":"Con Law > Federalism > Dormant Commerce Clause > Market-participant exception","batch":2,"status":"approved"},
{"id":"conlaw_b2_03","s":"conlaw","q":"A city requires all applicants for firefighter positions to pass a written test of reading and reasoning skills, which it adopted to measure job-related abilities. Applicants of one race fail the test at a substantially higher rate than other applicants. There is no evidence that the city adopted or kept the test because of its effect on any racial group. Unsuccessful applicants sue under the Equal Protection Clause. What standard will the court apply?","o":["Strict scrutiny, because the test has a substantially disproportionate impact on members of one racial group.","Rational basis, because a disparate impact triggers strict scrutiny only with proof of discriminatory purpose.","Intermediate scrutiny, because the test controls access to public employment, which is an important interest.","Strict scrutiny, because public employment is a fundamental right protected by the Equal Protection Clause."],"a":1,"e":"A facially neutral law is subject to strict scrutiny under the Equal Protection Clause only if the challenger proves that it was adopted or maintained because of, not merely in spite of, its adverse effect on a racial group. Disproportionate impact is relevant evidence of purpose, but standing alone it does not trigger strict scrutiny. Without proof of purpose, the test is reviewed under the rational-basis standard, which it easily satisfies because it is rationally related to the legitimate goal of hiring capable firefighters. (Federal employment statutes may impose disparate-impact liability, but the Constitution does not.) Why the other choices are wrong: The disparate-impact choice is wrong because impact alone does not establish a racial classification. Discriminatory purpose must be proved. The intermediate-scrutiny choice is wrong because intermediate scrutiny applies to classifications based on sex and nonmarital birth, not to tests for public jobs. The fundamental-right choice is wrong because there is no fundamental right to government employment.","topic":"Con Law > Individual rights > Equal protection > Facially neutral laws with a disparate impact (discriminatory purpose)","batch":2,"status":"approved"},
{"id":"conlaw_b2_04","s":"conlaw","q":"A landowner bought a lakefront parcel for $900,000, intending to build a vacation home, which was lawful at the time. The state then enacted a shoreline-protection law barring any permanent structure on her parcel, leaving it with no economically beneficial use. Building a home there would not have been a nuisance or otherwise prohibited under the state’s existing law of property and nuisance. The landowner sues for just compensation. Will she likely prevail?","o":["No, because the law is a valid exercise of the police power that protects a legitimate public interest.","No, because the state neither physically occupied the parcel nor took title to it from the landowner.","Yes, because a total loss of economic use is a taking unless existing nuisance or property law already barred the use.","Yes, but only if she shows the law fails the Penn Central test, weighing its economic impact and her expectations."],"a":2,"e":"A regulation that deprives land of all economically beneficial use is a categorical taking requiring just compensation, however important the public purpose, unless the prohibited use was already forbidden by background principles of the state’s property and nuisance law. Because building a home was not a nuisance and was otherwise lawful under existing law, the categorical rule applies. Regulations that cause a partial loss of value are instead analyzed under the Penn Central balancing test. Why the other choices are wrong: The police-power choice is wrong because a valid public purpose does not avoid the duty to pay just compensation for a total taking. The no-occupation choice is wrong because a regulation can be a taking without physical occupation, and a total loss of economic use is a categorical example. The Penn Central choice is wrong because balancing applies to partial losses. A total deprivation of economic use is a taking without balancing.","topic":"Con Law > Individual rights > Takings > Regulation denying all economically beneficial use","batch":2,"status":"approved"},
{"id":"conlaw_b2_05","s":"conlaw","q":"A motorist was stopped by city police for a broken taillight and, without provocation, was subjected to a dangerous restraint hold that injured him. He sued the city in federal court, seeking damages for his injuries and an injunction barring the police from using the hold in the future. He offers no evidence that he is likely to be stopped and subjected to the hold again. Does he have standing?","o":["He has standing to seek both damages and the injunction, because he suffered a concrete injury caused by the city’s practice.","Only for damages, because his past injury does not show a real and immediate threat that he will be harmed again.","He lacks standing to seek either form of relief, because his claim concerns a police practice that affects the general public.","He has standing to seek the injunction but not damages, because the city is immune from damages for its police practices."],"a":1,"e":"Standing must be shown separately for each form of relief sought. The motorist’s past injury, caused by the police and redressable by money, gives him standing to seek damages. But to seek an injunction, he must show a real and immediate threat that he personally will suffer the injury again. Past exposure to illegal conduct does not by itself establish a present case or controversy for injunctive relief, and speculation that he might again be stopped and subjected to the hold is not enough. Why the other choices are wrong: The both-forms choice is wrong because a past injury supports damages but does not by itself show the likelihood of future injury needed for an injunction. The generalized-grievance choice is wrong because the motorist suffered a particularized, concrete injury of his own, which supports a damages claim. The city-immunity choice is wrong because cities do not have Eleventh Amendment immunity, and standing does not depend on whether the defendant has an immunity defense.","topic":"Con Law > Judicial power > Justiciability > Standing to seek injunctive relief (threat of future injury)","batch":2,"status":"approved"},
{"id":"conlaw_b2_06","s":"conlaw","q":"Relying solely on its power under Section 5 of the Fourteenth Amendment, Congress enacted a statute allowing state employees to sue their state employers for damages for any employment decision that has a disparate impact on workers over age 40, even if the decision is rational. Congress made no findings of a pattern of unconstitutional age discrimination by the states. A state employee sues his state employer under the statute, and the state argues that the statute exceeds Congress’s power. Is the statute a valid exercise of the Section 5 power?","o":["No, because Section 5 laws must be congruent and proportional to actual constitutional violations by the states.","Yes, because Section 5 gives Congress broad power to define the substance of the rights that the Fourteenth Amendment protects.","Yes, because a statute that Congress labels as enforcing the Fourteenth Amendment validly abrogates state immunity.","No, because Congress may never authorize private suits for damages against an unconsenting state."],"a":0,"e":"Section 5 lets Congress enforce the Fourteenth Amendment, including by prohibiting some constitutional conduct to remedy or prevent violations. But Congress may not redefine the substance of the rights. There must be congruence and proportionality between the injury to be prevented and the means adopted. Age is not a suspect classification, so rational age-based decisions by states are constitutional. A statute reaching all rational decisions with a disparate impact, without any record of unconstitutional state conduct, is out of proportion to any remedial object. Valid Section 5 legislation could abrogate state sovereign immunity, but this statute is not valid Section 5 legislation. Why the other choices are wrong: The define-the-rights choice is wrong because the courts, not Congress, define the substance of Fourteenth Amendment rights. Congress may only enforce them through remedial or preventive measures. The labeling choice is wrong because a statute abrogates state immunity only if it is in fact valid Section 5 legislation, which requires congruence and proportionality. The never choice is wrong because Congress may abrogate state sovereign immunity when it validly acts under Section 5 of the Fourteenth Amendment.","topic":"Con Law > Powers of Congress > Enforcement power under Fourteenth Amendment §5 (congruence and proportionality)","batch":2,"status":"approved"},
{"id":"conlaw_b2_07","s":"conlaw","q":"A federal regulation, validly adopted under a federal statute, requires that a particular generic medication carry exactly the warning label approved by a federal agency and forbids manufacturers from changing the label without the agency’s approval. A state law requires manufacturers of that medication to add a stronger warning to the label. A manufacturer is sued under the state law for failing to add the stronger warning. What is the manufacturer’s best defense?","o":["The state law is preempted, because the manufacturer cannot comply with both the state law and the federal rule.","The state law violates the dormant Commerce Clause, because it burdens the interstate sale of medication.","The state law is preempted, because the commerce power automatically displaces all state regulation of products sold nationwide.","The state law is invalid under the Tenth Amendment, because product labeling is a power reserved to the federal government."],"a":0,"e":"Under the Supremacy Clause, valid federal law, including regulations adopted within an agency’s statutory authority, preempts conflicting state law. Conflict preemption exists when it is impossible to comply with both federal and state requirements, or when state law stands as an obstacle to the full purposes of federal law. Because federal law forbids the manufacturer to change the label on its own and state law requires a change, the manufacturer cannot obey both, so the state requirement is preempted. Why the other choices are wrong: The dormant Commerce Clause choice is wrong because a nondiscriminatory labeling law is not invalid merely because it affects interstate sales. The real problem is the conflict with federal law. The automatic-displacement choice is wrong because Congress’s commerce power does not by itself preempt state law. Preemption depends on what federal law actually provides. The Tenth Amendment choice is wrong because that amendment reserves powers to the states. It does not invalidate state laws.","topic":"Con Law > Federalism > Supremacy Clause > Conflict preemption (impossibility)","batch":2,"status":"approved"},
{"id":"contracts_b2_01","s":"contracts","q":"A landscaper finished work for a homeowner, who owed him $8,000 under their contract, payable in 30 days. The landscaper then assigned his right to the $8,000 to a supplier to whom he owed money. Before anyone told the homeowner about the assignment, the homeowner paid the $8,000 to the landscaper, who spent it. The supplier sues the homeowner for $8,000. Will the supplier prevail?","o":["Yes, because after a valid assignment, only the assignee is entitled to receive payment from the obligor.","Yes, because the assignment was made for value, which makes it irrevocable against the assignor and the obligor.","No, because an obligor who pays the assignor in good faith before notice of the assignment is discharged.","No, because a right to receive payment cannot be assigned without the obligor’s consent."],"a":2,"e":"A right to payment is generally assignable without the obligor’s consent, and after notice of the assignment the obligor must pay the assignee. But until the obligor receives notice, it may deal with the assignor, and a good-faith payment to the assignor discharges the obligation to the extent of the payment. The supplier’s remedy is against the landscaper, who received the money after assigning the right to it. Why the other choices are wrong: The only-the-assignee choice ignores the notice rule. An obligor who has not been notified may pay the assignor and is discharged. The for-value choice is wrong because irrevocability concerns whether the assignor can take the assignment back. It does not make the obligor pay twice. The consent choice is wrong because a right to payment is freely assignable. Assigning it does not materially change the obligor’s duty.","topic":"Contracts > Third-party rights > Assignment > Obligor’s payment to the assignor before notice","batch":2,"status":"approved"},
{"id":"contracts_b2_02","s":"contracts","q":"A factory owner contracted with an engineering firm to install a ventilation system for $90,000, with “payment conditioned on the owner’s satisfaction with the system’s performance.” The firm installed a system that met every technical specification, and independent engineers agree that it works as well as any comparable system. The owner, who had since found a cheaper competitor, said he was dissatisfied and refused to pay. Is the owner obligated to pay?","o":["No, because an express condition of satisfaction must be strictly met, and the owner says he is not in fact satisfied.","Yes, because satisfaction with a system’s utility is judged by whether a reasonable person would be satisfied.","No, because the owner may reject for any reason, as long as he states that he is dissatisfied.","Yes, because conditions based on one party’s satisfaction are unenforceable in contracts between businesses."],"a":1,"e":"When a contract conditions payment on one party’s satisfaction, courts apply an objective, reasonable-person standard if the subject is mechanical fitness, utility, or marketability, and a subjective, honest-satisfaction standard only for matters of personal taste, fancy, or judgment, such as a portrait. A ventilation system’s performance is a matter of utility, and a reasonable owner would be satisfied with a system that meets every specification. Even under a subjective standard, dissatisfaction must be honest, and the owner’s dissatisfaction appears to be a pretext. Why the other choices are wrong: The strict-compliance choice is wrong because, for matters of utility, the condition is satisfied when a reasonable person would be satisfied, whatever the owner claims. The any-reason choice is wrong twice: the reasonable-person standard applies here, and even a subjective standard requires honest, good-faith dissatisfaction. The unenforceable choice is wrong because satisfaction clauses are enforceable. The question is only which standard measures satisfaction.","topic":"Contracts > Performance > Conditions > Satisfaction clauses (objective versus subjective standard)","batch":2,"status":"approved"},
{"id":"contracts_b2_03","s":"contracts","q":"On March 1, a company orally hired a consultant to provide services “for 18 months, beginning April 1,” at a fixed monthly fee. Neither party signed any writing. Two months into the engagement, the company ended the arrangement without cause. When the consultant sued for breach of contract, the company asserted the statute of frauds. Is the oral agreement enforceable?","o":["Yes, because the consultant could die before the term ended, so the agreement could be performed within a year.","No, because by its own terms the agreement could not be fully performed within one year from the time it was made.","Yes, because the consultant’s partial performance took the agreement out of the statute of frauds.","No, because every contract for services worth more than $500 must be evidenced by a signed writing."],"a":1,"e":"The one-year provision of the statute of frauds covers agreements that, by their terms, cannot possibly be fully performed within one year from the date they are made. The year runs from March 1, the date of the agreement, and the 18-month term starting April 1 could not end within that year. The possibility that the consultant might die or the contract might be breached does not count, because those events would discharge or breach the contract rather than fully perform it. The consultant may still recover the reasonable value of services rendered, in restitution. Why the other choices are wrong: The death choice is wrong because death would excuse further performance rather than complete it. Full performance of an 18-month term within a year is impossible. The partial-performance choice is wrong because partial performance takes a land contract, not a one-year agreement, out of the statute. Only full performance by one side does that. The $500 choice borrows the UCC rule for sales of goods, which does not apply to a services contract.","topic":"Contracts > Defenses > Statute of frauds > One-year provision","batch":2,"status":"approved"},
{"id":"contracts_b2_04","s":"contracts","q":"A homeowner told a painter, “I will pay you $3,000 if you paint my barn by Saturday. I don’t want a promise; I want the barn painted.” The painter bought supplies and, on Thursday, painted half the barn. On Friday morning, before the painter returned to finish, the homeowner told him, “I revoke my offer.” Was the homeowner’s revocation effective?","o":["No, because starting work created an option contract, so the homeowner could not revoke while the painter had until Saturday to finish.","Yes, because an offer for a unilateral contract may be revoked at any time until the offeree has fully completed the requested performance.","Yes, because the painter never promised to finish the barn, so the homeowner received no consideration for his promise to keep the offer open.","No, because buying the supplies was an acceptance that bound both parties to a bilateral contract."],"a":0,"e":"An offer that can be accepted only by performance invites a unilateral contract. Under the modern rule, when the offeree begins the requested performance, an option contract is created: the offeror may not revoke, and the offeree has the time the offer itself allows to finish (here, until Saturday; only if the offer stated no time would a reasonable time apply). The offeror’s duty to pay remains conditional on the offeree completing the performance within that time. Mere preparation, such as buying supplies, does not create the option, but painting half the barn is the beginning of performance itself. Why the other choices are wrong: The revoke-any-time choice states the older rule, which the modern option-contract rule has replaced. The no-promise choice is wrong because the offer called for performance, not a promise. Beginning that performance supplies the basis for the option. The supplies choice is wrong because preparing to perform is not acceptance, and the homeowner expressly asked for performance, not a promise.","topic":"Contracts > Formation > Offer and acceptance > Offers inviting performance (option created by beginning performance)","batch":2,"status":"approved"},
{"id":"contracts_b2_05","s":"contracts","q":"A bakery hired a repair company to fix its only industrial oven, and the company promised to finish the repair by Monday. The bakery did not tell the company that it had just signed a lucrative catering contract for that week, which it would lose without the oven, and nothing in the circumstances suggested such a contract. The company finished the repair a week late. As a result, the bakery lost the catering contract and the $15,000 profit it would have earned on it. Can the bakery recover the $15,000 lost profit from the repair company?","o":["Yes, because the company breached the contract, and the lost profit resulted directly from the delay.","Yes, because a breaching party is liable for all losses that it could have learned about by asking the other party.","No, because losing that contract was not reasonably foreseeable to the company when the contract was made.","No, because lost profits are never recoverable for breach of a contract for services."],"a":2,"e":"Consequential damages are recoverable only if they were reasonably foreseeable, when the contract was made, as a probable result of breach, either because they arise in the ordinary course of events or because the breaching party had reason to know of the special circumstances. The bakery did not disclose the catering contract, and nothing in the circumstances suggested it, so the loss of that unusual profit was not foreseeable. The bakery may still recover losses that arise in the ordinary course, if proved with reasonable certainty. Why the other choices are wrong: The direct-result choice is wrong because causation is not enough. Consequential damages must also have been foreseeable when the contract was made. The could-have-asked choice is wrong because foreseeability depends on what the breaching party knew or had reason to know, not on what it might have discovered. The never-recoverable choice is wrong because lost profits are recoverable when foreseeable and proved with reasonable certainty.","topic":"Contracts > Remedies > Consequential damages > Foreseeability at the time of contracting","batch":2,"status":"approved"},
{"id":"contracts_b2_06","s":"contracts","q":"A retailer sent a manufacturer a purchase order for 500 space heaters at $40 each. The manufacturer responded with its own acknowledgment form, which agreed to the quantity and price but added a term disclaiming all implied warranties. The acknowledgment did not say that acceptance was conditional on the retailer’s assent to the new term. The retailer never responded, and the manufacturer shipped the heaters, which the retailer accepted. Is the warranty disclaimer part of the contract?","o":["Yes, because between merchants, additional terms in an acceptance automatically become part of the contract unless the offeror objects.","Yes, because the retailer accepted the heaters and thereby agreed to the terms in the manufacturer’s acknowledgment.","No, because between merchants, an additional term that materially alters the contract does not become part of it.","No, because the acknowledgment added a term not in the offer, so it was a counteroffer and no contract was formed."],"a":2,"e":"Under UCC §2-207(1), a definite and seasonable expression of acceptance operates as an acceptance even though it states additional terms, unless acceptance is expressly conditional on assent to those terms. Under §2-207(2), between merchants the additional terms become part of the contract unless the offer limits acceptance to its terms, the offeror objects, or the terms materially alter the contract. A clause disclaiming implied warranties would cause surprise or hardship if incorporated without express awareness, so it materially alters the contract and drops out. Why the other choices are wrong: The automatically choice omits the material-alteration exception, which keeps a warranty disclaimer out of the contract. The acceptance-of-goods choice is wrong because accepting the goods does not mean assenting to a materially altering term under §2-207. The counteroffer choice applies the common-law mirror-image rule, which §2-207 rejects for sales of goods.","topic":"Contracts > UCC Article 2 > Formation > Additional terms between merchants (§2-207(2))","batch":2,"status":"approved"},
{"id":"contracts_b2_07","s":"contracts","q":"A contractor billed a homeowner $12,000 for remodeling work. The homeowner honestly and reasonably believed the work was defective and worth no more than $9,000. She sent the contractor a $9,000 check with a cover letter, and both the letter and the check stated conspicuously, “Payment in full for all remodeling work.” The contractor cashed the check and then sued the homeowner for the remaining $3,000. Will the contractor recover the $3,000?","o":["Yes, because paying part of a debt is not consideration for the creditor’s promise to discharge the rest of the debt.","Yes, because the contractor could cash the check and still reserve his right to sue the homeowner for the balance.","No, because cashing a full-payment check for a claim disputed in good faith creates an accord and satisfaction.","No, because accepting any payment from a debtor discharges the debtor’s entire debt."],"a":2,"e":"When the amount owed is subject to a bona fide dispute, a debtor’s offer of a lesser sum in full satisfaction is supported by consideration (giving up the dispute). If the creditor accepts the payment, here by cashing a check conspicuously marked as full payment, the claim is discharged by accord and satisfaction. Under UCC §3-311, the creditor cannot avoid this by cashing the check while privately reserving rights, except in narrow circumstances not present here. Why the other choices are wrong: The part-payment choice applies only to an undisputed, liquidated debt. A good-faith dispute supplies consideration for the accord. The reservation choice is wrong because a creditor who cashes a conspicuous full-payment check for a disputed claim generally cannot preserve the claim by reserving rights. The any-payment choice overstates the rule. Discharge requires an accord, a dispute or other consideration, and acceptance of the payment on those terms.","topic":"Contracts > Discharge > Accord and satisfaction (good-faith dispute and full-payment check)","batch":2,"status":"approved"},
{"id":"crim_b2_01","s":"crim","q":"The defendant persuaded an elderly man to sell her his car for $8,000, paying with a cashier’s check that she knew was forged. Relying on the check, the man signed over the certificate of title and handed her the keys, intending that she become the owner of the car. The check bounced, and the defendant had already resold the car. With respect to the car, which crime has the defendant committed?","o":["Larceny by trick, because she obtained the car from the man through deception.","Embezzlement, because she converted the car after it lawfully came into her possession.","False pretenses, because she obtained title to the car by a knowing misrepresentation of fact.","No theft crime, because the man voluntarily transferred the car and its title to her."],"a":2,"e":"False pretenses is obtaining title to another’s property by a knowing false representation of a material past or present fact, with intent to defraud. Larceny by trick applies when the deception obtains only possession, with the owner not intending to transfer ownership. Here the man signed over the title and intended the defendant to become the owner, so she obtained title, which makes the crime false pretenses. Why the other choices are wrong: The larceny-by-trick choice is wrong because that crime involves obtaining possession only. The man intended to transfer title. The embezzlement choice is wrong because her possession was never lawful. She obtained the car by fraud, not through a relationship of trust. The no-crime choice is wrong because consent obtained by a knowing misrepresentation is exactly what false pretenses punishes.","topic":"Crim Law > Other crimes > Theft offenses > False pretenses versus larceny by trick","batch":2,"status":"approved"},
{"id":"crim_b2_02","s":"crim","q":"A state statute makes it a crime for two persons, by prior agreement, to fight each other in a duel with deadly weapons. Two rivals agreed to settle a dispute with a pistol duel at dawn, met at the agreed place, and exchanged shots. Neither was hit, and no one else took part in planning or carrying out the duel. The prosecutor charges each of them with dueling and with conspiracy to commit dueling. In a jurisdiction that follows Wharton’s rule, can they be convicted of conspiracy?","o":["Yes, because conspiracy does not merge into the completed crime, so they may be convicted of both dueling and conspiracy.","No, because dueling by definition requires both of them, so they cannot also be convicted of conspiring to commit it.","Yes, because each of them agreed to commit the crime, and an overt act was taken to carry out their agreement.","No, because neither duelist was hit, and conspiracy requires that the planned crime cause actual harm."],"a":1,"e":"Under Wharton’s rule, when a crime by definition requires the concerted action of two people, such as adultery, bigamy, incest, or dueling, those two cannot be convicted of conspiracy to commit it, because their agreement is already part of the crime itself. The rule does not apply when more people take part than the crime requires (for example, a third person who arranges the duel). Here only the two duelists were involved, so the conspiracy charge fails, although each may be convicted of dueling. Ordinarily conspiracy does not merge with the completed crime, which is why Wharton’s rule is an exception. (Federal courts treat the rule as a presumption about legislative intent.) Why the other choices are wrong: The no-merger choice states the general rule but ignores Wharton’s rule, which bars a conspiracy conviction when the crime itself requires both participants. The agreement-and-overt-act choice lists the usual elements of conspiracy, but Wharton’s rule creates an exception for crimes that require two participants. The no-harm choice is wrong because conspiracy requires an agreement (and, in most jurisdictions, an overt act), not any resulting harm. The bar here comes from Wharton’s rule.","topic":"Crim Law > Inchoate crimes > Conspiracy > Wharton’s rule","batch":2,"status":"approved"},
{"id":"crim_b2_03","s":"crim","q":"The defendant, who suffers from a severe mental disease, killed his neighbor. Psychiatrists agree that he knew he was killing a person and knew that killing was wrong and illegal, but that because of his disease he was unable to resist an overwhelming urge to kill. The jurisdiction uses only the M’Naghten test of insanity. Is the defendant entitled to be acquitted by reason of insanity?","o":["Yes, because his mental disease left him unable to conform his conduct to the requirements of the law.","Yes, because a defendant with a severe mental disease cannot form the malice that the crime of murder requires.","No, because insanity is a defense only to crimes that require proof of a specific intent.","No, because M’Naghten asks only whether he knew the nature of his act or that it was wrong, and he knew both."],"a":3,"e":"The M’Naghten test asks whether, because of a mental disease or defect, the defendant did not know the nature and quality of his act or did not know that it was wrong. It has no volitional prong. Inability to control one’s conduct is a basis for acquittal only under the irresistible-impulse test or the Model Penal Code test (lack of substantial capacity to appreciate wrongfulness or to conform conduct to the law). This defendant knew what he was doing and that it was wrong. Why the other choices are wrong: The conform-conduct choice applies the volitional prong of the Model Penal Code test, which the M’Naghten test does not include. The cannot-form-malice choice is wrong because the defendant intended to kill and knew it was wrong. Having a mental disease does not by itself negate intent. The specific-intent choice confuses insanity with voluntary intoxication. Insanity, when proved, is a defense to any crime.","topic":"Crim Law > General principles > Responsibility > Insanity (M’Naghten versus irresistible impulse)","batch":2,"status":"approved"},
{"id":"crim_b2_04","s":"crim","q":"The defendant took a neighbor’s car without permission and drove it for a week. He pleaded guilty in state court to joyriding, defined as taking or operating a vehicle without the owner’s consent. The state then charged him with auto theft, defined as joyriding with the intent to permanently deprive the owner of the vehicle, based on the same taking. The defendant moves to dismiss the auto theft charge on double jeopardy grounds. How should the court rule?","o":["Deny the motion, because auto theft requires proof of an intent that joyriding does not, so the two are different offenses.","Grant the motion, because joyriding is a lesser-included offense of auto theft, so they are the same offense.","Deny the motion, because jeopardy does not attach when a defendant pleads guilty instead of going to trial.","Grant the motion, but only because the state should have joined both charges under its joinder rules."],"a":1,"e":"Two offenses are the same offense under the Blockburger test unless each requires proof of a fact that the other does not. Auto theft requires every element of joyriding plus intent to permanently deprive, but joyriding requires nothing that auto theft does not. Because joyriding is a lesser-included offense, the Double Jeopardy Clause bars prosecution for the greater offense after a conviction for the lesser one (and vice versa) for the same conduct. Jeopardy attached when the court accepted the guilty plea. Why the other choices are wrong: The extra-element choice applies only half the test. Offenses are different only if each requires a fact the other does not. The guilty-plea choice is wrong because jeopardy attaches when the court accepts a guilty plea. The joinder-rules choice is wrong because the bar comes from the constitutional double jeopardy protection, not merely from state joinder rules.","topic":"Crim Pro > Fifth Amendment > Double jeopardy > Same offense and lesser-included offenses (Blockburger)","batch":2,"status":"approved"},
{"id":"crim_b2_05","s":"crim","q":"Police applied for a search warrant with an affidavit describing an informant’s tip and some corroboration. A neutral magistrate issued the warrant, and officers searched the defendant’s house and found stolen jewelry. The trial court later concluded that the affidavit fell short of establishing probable cause, although it was not so lacking that reliance on it was unreasonable. The officers had no reason to doubt the warrant’s validity. The defendant moves to suppress the jewelry. How should the court rule?","o":["Grant the motion, because evidence seized under a warrant unsupported by probable cause must be excluded.","Deny the motion, because the officers relied in objective good faith on a warrant that a neutral magistrate issued.","Grant the motion, because the good-faith exception applies only to warrantless searches made under statutes later held invalid.","Deny the motion, because the exclusionary rule applies only to statements, not to physical evidence."],"a":1,"e":"The exclusionary rule exists to deter police misconduct, so it does not apply when officers reasonably rely on a warrant issued by a neutral and detached magistrate that is later held invalid. The good-faith exception does not apply if the affidavit was so lacking in indicia of probable cause that reliance was unreasonable, the warrant was facially deficient, the magistrate abandoned a neutral role, or the officers misled the magistrate with knowing or reckless falsehoods. None of those exceptions applies here. Why the other choices are wrong: The must-exclude choice ignores the good-faith exception for reasonable reliance on a warrant. The statutes-only choice is wrong because the good-faith exception began with reliance on warrants and was later extended to statutes and to some database errors. The statements-only choice is wrong because the exclusionary rule applies to physical evidence obtained in violation of the Fourth Amendment.","topic":"Crim Pro > Fourth Amendment > Exclusionary rule > Good-faith reliance on a warrant later found invalid","batch":2,"status":"approved"},
{"id":"crim_b2_06","s":"crim","q":"An indigent defendant was charged with shoplifting, a misdemeanor punishable by up to six months in jail, a fine, or both. The court denied his request for appointed counsel, and he was tried without a lawyer, convicted, and sentenced only to a $300 fine. He appeals, arguing that his Sixth Amendment right to counsel was violated. Will he prevail?","o":["No, because an indigent misdemeanor defendant is entitled to appointed counsel only if he is actually imprisoned.","Yes, because an indigent defendant has a right to appointed counsel for any offense punishable by imprisonment.","Yes, because the right to appointed counsel applies in every criminal prosecution, whatever penalty is actually imposed.","No, because the right to appointed counsel applies only in prosecutions for felonies."],"a":0,"e":"An indigent defendant has a right to appointed counsel in any felony prosecution and in any misdemeanor prosecution that results in a sentence of imprisonment, including a suspended sentence that may later be activated. Whether imprisonment is merely authorized does not matter. Because the defendant received only a fine, the denial of counsel did not violate the Sixth Amendment, although the court could not have sentenced him to jail. Why the other choices are wrong: The punishable-by-imprisonment choice is wrong because the test is whether imprisonment is actually imposed, not whether it is authorized. The every-prosecution choice overstates the right, which does not extend to misdemeanor cases ending in a fine only. The felonies-only choice is wrong because indigent misdemeanor defendants are entitled to counsel when a sentence of imprisonment is imposed.","topic":"Crim Pro > Sixth Amendment > Right to counsel > Misdemeanor prosecutions (actual imprisonment)","batch":2,"status":"approved"},
{"id":"crim_b2_07","s":"crim","q":"A gang leader held a gun to the defendant’s head and told him that unless he shot a member of a rival gang standing nearby, the leader would kill him on the spot. Reasonably believing the threat, the defendant shot and killed the rival gang member, who had done nothing to threaten anyone. The defendant is charged with murder in a jurisdiction that follows the common law. Can he successfully claim duress?","o":["Yes, because he reasonably believed he faced an imminent threat of death unless he committed the crime.","Yes, because necessity justifies any act that saves a human life, and his own life was at stake.","No, because at common law, duress is never a defense to the intentional killing of an innocent person.","No, because duress applies only when the threat is directed at a member of the defendant’s family."],"a":2,"e":"Duress excuses most crimes committed because of a threat of imminent death or serious bodily harm that would cause a person of reasonable firmness to give in. At common law, however, duress is never a defense to murder: a person is expected to sacrifice his own life rather than take an innocent one. (Some jurisdictions allow duress to reduce felony murder or to mitigate in other ways, but not to excuse an intentional killing.) Why the other choices are wrong: The reasonable-belief choice describes the elements of duress but ignores the rule that duress is not a defense to murder. The necessity choice is wrong because necessity does not justify intentionally killing an innocent person to save oneself, and a threat by another person is analyzed as duress. The family-only choice is wrong because a threat to the defendant himself is the classic basis for duress.","topic":"Crim Law > General principles > Justification and excuse > Duress (not a defense to murder)","batch":2,"status":"approved"},
{"id":"evidence_b2_01","s":"evidence","q":"The defendant is charged in federal court with being a felon in possession of a firearm. His prior felony conviction was for aggravated assault with a gun. He offers to stipulate that he has a prior felony conviction, but the prosecutor refuses and seeks to introduce the judgment of conviction, which names the assault offense. The defendant objects. How should the court rule?","o":["Overrule the objection, because the prosecution is always entitled to prove its case with evidence of its own choosing.","Overrule the objection, because the prior gun conviction is admissible to show the defendant’s propensity to commit gun crimes.","Sustain the objection, because evidence of a defendant’s prior convictions is never admissible unless the defendant testifies.","Sustain the objection, because given the offered stipulation, naming the prior gun crime creates unfair prejudice that substantially outweighs its value."],"a":3,"e":"Under FRE 403, a court may exclude relevant evidence if its probative value is substantially outweighed by the danger of unfair prejudice. Ordinarily the prosecution may prove its case with evidence of its own choosing. But when the prior conviction matters only to prove the defendant’s legal status as a felon, a stipulation proves that element just as well, and the name and nature of a similar gun crime invites the jury to infer propensity. The court should accept the stipulation and exclude the record of the specific offense. Why the other choices are wrong: The always-entitled choice overstates the general rule. When the evidence goes only to legal status, an offered stipulation can make the details unfairly prejudicial. The propensity choice is wrong because FRE 404(b) forbids using a prior crime to show that the defendant acted in conformity with a criminal character. The never-admissible choice is wrong because prior convictions are admissible for many purposes, including proving an element such as felon status.","topic":"Evidence > Relevance > Exclusion for unfair prejudice (FRE 403) > Offer to stipulate to prior-felony status","batch":2,"status":"approved"},
{"id":"evidence_b2_02","s":"evidence","q":"In a negligence action arising from a car accident, the defendant driver calls a witness to testify that the defendant has a reputation in the community as a careful and prudent driver. The defendant offers the testimony to show that he was probably driving carefully at the time of the accident. The plaintiff objects. Should the testimony be admitted?","o":["Yes, because a party may always offer evidence of his own pertinent good character trait to show how he acted.","No, because character evidence is generally inadmissible in a civil case to prove conduct on a particular occasion.","Yes, because reputation testimony is a permitted method of proving character, although specific instances of conduct are not.","No, because character may be proved only by specific instances of conduct, never by reputation or opinion testimony."],"a":1,"e":"FRE 404(a) bars evidence of a person’s character or character trait to prove that on a particular occasion the person acted in accordance with it. The exceptions that let an accused offer pertinent character traits apply only in criminal cases. Character may be proved in a civil case when it is itself an element of a claim or defense (as in negligent entrustment or defamation), but a driver’s carefulness is not an element here. Evidence of a specific, regular habit might be admissible under FRE 406, but a general reputation for carefulness is not habit. Why the other choices are wrong: The own-character choice applies the rule for a criminal defendant, which does not extend to civil litigants. The method-of-proof choice confuses how character may be proved with whether it is admissible at all. Here character is inadmissible for this purpose. The specific-instances choice reverses the rule. When character is admissible, reputation and opinion are the usual methods.","topic":"Evidence > Relevance > Character evidence > Character to prove conduct in a civil case (FRE 404(a))","batch":2,"status":"approved"},
{"id":"evidence_b2_03","s":"evidence","q":"At his trial for robbery, the defendant testifies in his own defense. The prosecutor seeks to impeach him with his conviction four years earlier for felony possession of cocaine, a crime punishable by up to five years in prison that does not involve dishonesty or false statement. The defendant objects. What standard governs whether the conviction is admissible?","o":["It is automatically admissible, because it was a felony punishable by more than one year in prison.","It is admissible unless its probative value is substantially outweighed by unfair prejudice.","It is inadmissible, because only crimes of dishonesty may be used to impeach a criminal defendant.","It must be admitted only if its probative value outweighs its prejudicial effect to the testifying defendant."],"a":3,"e":"FRE 609(a)(1) governs convictions for crimes punishable by more than one year that do not involve dishonesty or false statement. When the witness is a criminal defendant, the conviction must be admitted only if the prosecution shows that its probative value outweighs its prejudicial effect to the defendant, a standard more protective than FRE 403. For other witnesses, such a conviction is admitted subject to FRE 403. Convictions for crimes involving dishonesty or false statement are admitted automatically under FRE 609(a)(2), and convictions more than ten years old face a stricter test. Why the other choices are wrong: The automatic choice applies the rule for crimes of dishonesty or false statement under FRE 609(a)(2), which drug possession is not. The substantially-outweighed choice states the FRE 403 standard, which applies to witnesses other than a criminal defendant. The dishonesty-only choice is wrong because a felony conviction may impeach an accused if it passes the FRE 609(a)(1)(B) balancing test.","topic":"Evidence > Witnesses > Impeachment > Felony conviction of a testifying accused (FRE 609(a)(1)(B))","batch":2,"status":"approved"},
{"id":"evidence_b2_04","s":"evidence","q":"Police responded to a report of a fight, by which time the suspect had left. An hour later at the police station, the victim gave an officer a signed written statement describing how the defendant had beaten her. The victim died of unrelated causes before trial, and the defendant never had an opportunity to cross-examine her. At the defendant’s criminal trial for assault, the prosecution offers the statement, and the court finds that it fits a hearsay exception. The defendant objects under the Confrontation Clause. How should the court rule?","o":["Overrule the objection, because the statement fits a hearsay exception and is therefore reliable enough for the Confrontation Clause.","Overrule the objection, because the defendant did not cause the victim’s death, so she is unavailable through no fault of anyone.","Sustain the objection, because the Confrontation Clause bars all hearsay offered against a criminal defendant.","Sustain the objection, because the statement is testimonial and the defendant never had a chance to cross-examine her."],"a":3,"e":"The Confrontation Clause bars the admission of a testimonial statement by a witness who does not appear at trial unless the witness is unavailable and the defendant had a prior opportunity for cross-examination (or forfeited the right by wrongdoing). Statements are testimonial when their primary purpose is to establish or prove past events for possible later prosecution, as with a formal statement given at a station after the emergency ended. Statements made to help police meet an ongoing emergency are nontestimonial. Fitting a hearsay exception does not satisfy the Clause. Why the other choices are wrong: The reliability choice reflects an abandoned approach. For testimonial statements, the Clause requires confrontation, not a judicial finding of reliability. The no-fault choice is wrong because unavailability is necessary but not sufficient. A prior opportunity for cross-examination is also required. The all-hearsay choice overstates the Clause, which applies only to testimonial statements.","topic":"Evidence > Hearsay > Constitutional limits > Confrontation Clause (testimonial statements)","batch":2,"status":"approved"},
{"id":"evidence_b2_05","s":"evidence","q":"Two business partners together consulted a lawyer to draft their partnership agreement. In each other’s presence, they discussed with the lawyer how profits would be divided. Years later, one partner sued the other over the profit split. The plaintiff seeks to testify about what the defendant said to the lawyer during the joint meeting. The defendant asserts the attorney-client privilege. How should the court rule?","o":["Exclude the testimony, because the statements were made in confidence to obtain legal advice, so the privilege applies.","Exclude the testimony, because the privilege can be waived only by the client who made the statement.","Admit the testimony, because the privilege never applies when more than one client is present.","Admit the testimony, because joint clients’ communications are not privileged in later litigation between them."],"a":3,"e":"Communications among jointly represented clients and their common lawyer are privileged against outsiders. But when the joint clients later become adversaries in a dispute about the matter of the joint representation, neither may invoke the privilege against the other. Each shared the communications with the other, and each expected the lawyer to act for both. The partners’ statements about profit division may therefore be disclosed in their suit against each other. Why the other choices are wrong: The confidential-advice choice is wrong because the joint-client exception removes the privilege in later litigation between the joint clients. The only-the-speaker choice is wrong because the issue is not waiver. The privilege never applied between these joint clients. The never-applies choice is wrong because joint clients’ communications are privileged against third parties.","topic":"Evidence > Privileges > Attorney-client privilege > Joint clients in later litigation between them","batch":2,"status":"approved"},
{"id":"evidence_b2_06","s":"evidence","q":"In a federal prosecution for drug distribution, the prosecution asks the court to take judicial notice that a particular street address lies within 1,000 feet of a public school, a fact relevant to an enhanced charge that can be accurately determined from official city maps. The court agrees to take judicial notice of the fact. How should the court instruct the jury about the noticed fact?","o":["That the jury must accept the noticed fact as conclusive, because it is not reasonably disputed.","That the noticed fact creates a rebuttable presumption that the defendant may overcome.","That the jury may consider the fact only if it is also proved beyond a reasonable doubt with admitted evidence.","That the jury may, but is not required to, accept the noticed fact as conclusive."],"a":3,"e":"A court may judicially notice an adjudicative fact that is not subject to reasonable dispute because it is generally known within the court’s territorial jurisdiction or can be accurately and readily determined from sources whose accuracy cannot reasonably be questioned. Under FRE 201(f), in a civil case the court instructs the jury to accept the noticed fact as conclusive. In a criminal case, to protect the defendant’s right to a jury trial, the court instructs the jury that it may or may not accept the noticed fact as conclusive. Why the other choices are wrong: The must-accept choice states the rule for civil cases. In criminal cases the jury may decline to accept the noticed fact. The rebuttable-presumption choice is wrong because judicial notice does not operate as a presumption that shifts a burden to the defendant. The also-prove choice is wrong because judicial notice substitutes for formal proof. No separate evidence is needed.","topic":"Evidence > Presentation of evidence > Judicial notice > Instructing the jury in a criminal case (FRE 201(f))","batch":2,"status":"approved"},
{"id":"evidence_b2_07","s":"evidence","q":"Testifying under oath before a grand jury, a witness said she saw the defendant leave the bank carrying a bag shortly after the robbery. At the defendant’s trial, the same witness testifies that she did not see who left the bank, and she is cross-examined about both accounts. The prosecution offers a transcript of her grand jury testimony. For what purpose may the jury consider it?","o":["Both to impeach the witness and as substantive evidence that the defendant left the bank carrying a bag.","Only to impeach the witness, because a prior inconsistent statement is hearsay when offered for its truth.","For neither purpose, because the defendant had no chance to cross-examine the witness before the grand jury.","Only as substantive evidence, because a party may not impeach a witness that it called."],"a":0,"e":"A declarant-witness’s prior statement is not hearsay under FRE 801(d)(1)(A) if the declarant testifies at trial and is subject to cross-examination about it, the statement is inconsistent with the trial testimony, and it was given under penalty of perjury at a trial, hearing, other proceeding, or deposition. Grand jury testimony qualifies. So the statement may be used both to impeach and for its truth. A prior inconsistent statement not made under oath may be used only to impeach. Why the other choices are wrong: The impeach-only choice states the rule for unsworn statements. A statement made under penalty of perjury at a proceeding is not hearsay. The no-earlier-cross choice is wrong because the rule requires cross-examination at the current trial, which the defendant had. The own-witness choice is wrong because under FRE 607 any party, including the party that called the witness, may attack the witness’s credibility.","topic":"Evidence > Hearsay > Prior statements of witnesses > Prior inconsistent statement under oath (FRE 801(d)(1)(A))","batch":2,"status":"approved"},
{"id":"property_b2_01","s":"property","q":"The jurisdiction has a 10-year adverse-possession period and a statute tolling the period for owners who are under a disability when adverse possession begins. In 2010, a farmer began openly and exclusively possessing an absent owner’s pasture, meeting all the requirements for adverse possession. In 2014, the owner was declared legally incompetent, and she remained incompetent until her death in 2023. Her heir now sues to eject the farmer. Who owns the pasture?","o":["The farmer, because a disability arising after adverse possession begins does not stop the period.","The heir, because the period was tolled while the owner was incompetent, so ten years have not yet run.","The heir, because adverse possession cannot run against an owner who becomes incompetent during the period.","The farmer, but only because the heir did not sue within one year after inheriting the land."],"a":0,"e":"Disability statutes protect owners who are under a disability (such as minority or incompetence) when the cause of action first accrues, that is, when adverse possession begins. A disability that arises later does not toll the running of the period. The owner was competent in 2010, so the 10-year period ran without interruption, and the farmer acquired title in 2020. The owner’s death and the heir’s inheritance do not revive the owner’s lost title. Why the other choices are wrong: The tolled choice is wrong because only a disability existing when adverse possession begins tolls the period. The becomes-incompetent choice is wrong because a later disability neither stops the period nor prevents title from vesting. The one-year choice invents a requirement. The farmer’s title vested in 2020, before the owner died.","topic":"Real Property > Titles > Adverse possession > Disability of the owner arising after possession begins","batch":2,"status":"approved"},
{"id":"property_b2_02","s":"property","q":"An owner of two adjoining lots built a house on the north lot and a paved driveway across the south lot, which gave the house its most convenient access to a public road. The house could also be reached, at substantial expense and inconvenience, by building a new driveway to a side street. The owner sold the north lot to a buyer, and the deed said nothing about the driveway. The owner later sold the south lot to a neighbor, who blocked the driveway. Does the buyer have an easement over the driveway?","o":["No, because an easement by necessity requires strict necessity, and the north lot has another possible access.","Yes, an easement implied from prior use, because the use was apparent, continuous, and reasonably necessary to the house.","No, because an easement in land must be created by a signed writing that satisfies the Statute of Frauds.","Yes, an easement by prescription, because the driveway had been used openly and continuously for years."],"a":1,"e":"An easement is implied from prior use when land in common ownership is divided, the owner had used one part for the benefit of the other before the division, the use was apparent and continuous, and it is reasonably necessary to the enjoyment of the dominant parcel. Reasonable necessity, not strict necessity, is required for an easement benefiting the conveyed parcel. A paved, visible driveway that provides the house’s practical access meets the test. The neighbor, who could see the driveway, took the south lot subject to the easement. Why the other choices are wrong: The strict-necessity choice applies the test for an easement by necessity. An easement implied from prior use requires only reasonable necessity. The writing choice is wrong because implied easements are a recognized exception to the Statute of Frauds. The prescription choice is wrong because use during common ownership is not adverse. A person cannot hold an easement in his own land.","topic":"Real Property > Easements > Creation > Easement implied from prior use","batch":2,"status":"approved"},
{"id":"property_b2_03","s":"property","q":"Two neighboring homeowners, who had no other relationship, signed and recorded an agreement in which each promised, for themselves and their successors, not to build any structure taller than 20 feet. Neither conveyed any interest in land to the other. Years later, a buyer who purchased one of the homes with notice of the agreement began building a 30-foot tower. The other original homeowner sues the buyer. In a jurisdiction that follows the traditional rules, what relief is she most likely entitled to?","o":["Damages and an injunction, because the covenant touches and concerns the land, was intended to run, and was recorded.","No relief, because the buyer was not a party to the agreement and did not promise anything.","Damages but not an injunction, because a promise exchanged between neighbors is enforceable only in an action at law.","An injunction but not damages, because without horizontal privity the promise binds the buyer only in equity."],"a":3,"e":"Traditionally, for the burden of a covenant to run at law (so that damages are available against a successor), there must be intent, notice, touch and concern, horizontal privity between the original parties (a shared interest in land or a conveyance between them), and vertical privity. Neighbors who simply exchange promises lack horizontal privity. An equitable servitude, enforceable by injunction, requires only intent, touch and concern, and notice, with no privity. The building restriction touches and concerns the land, it was intended to bind successors, and the buyer had notice. (The Restatement (Third) of Servitudes would drop the horizontal-privity requirement.) Why the other choices are wrong: The both-remedies choice is wrong because, under the traditional rules, damages against a successor require horizontal privity, which is missing here. The not-a-party choice is wrong because covenants and servitudes can bind successors who take with notice. The law-only choice reverses the analysis. Without horizontal privity, the promise is enforceable in equity but not at law.","topic":"Real Property > Covenants > Real covenants versus equitable servitudes (privity and remedies)","batch":2,"status":"approved"},
{"id":"property_b2_04","s":"property","q":"A tenant leased an apartment for three years at $1,500 a month. After one year, with the landlord’s consent, the tenant transferred possession to a subtenant for 18 months, keeping the last six months of the term for himself. The subtenant did not promise the landlord anything or assume the lease. The subtenant paid the tenant for four months and then stopped, and the tenant stopped paying the landlord. The landlord sues the subtenant for the unpaid rent. Will the landlord prevail?","o":["Yes, because the subtenant is in privity of estate with the landlord and so is bound by the covenant to pay rent.","Yes, because the landlord consented to the transfer, which made the subtenant directly liable to the landlord.","No, because once the landlord consented to the transfer, no one remains liable to the landlord for the rent.","No, because a subtenant is in privity of estate and contract only with the tenant, not with the landlord."],"a":3,"e":"A transfer of the tenant’s entire remaining term is an assignment, which puts the assignee in privity of estate with the landlord and makes the assignee liable for covenants that run with the land, including rent. A transfer of less than the entire remaining term, as here where the tenant kept the last six months, is a sublease. A subtenant is in privity of estate and contract only with the original tenant, so the landlord cannot sue the subtenant for rent (unless the subtenant assumed the lease). The original tenant remains liable to the landlord. Why the other choices are wrong: The privity-of-estate choice describes an assignment. A subtenant who received less than the full remaining term is not in privity of estate with the landlord. The consent choice is wrong because the landlord’s consent does not turn a sublease into an assignment or create privity with the subtenant. The no-one-liable choice is wrong because the original tenant remains liable on his contract with the landlord.","topic":"Real Property > Landlord and tenant > Sublease versus assignment (privity of estate)","batch":2,"status":"approved"},
{"id":"property_b2_05","s":"property","q":"A woman lawfully operated a small auto-repair shop on her lot for many years. The city then rezoned the area as exclusively residential, and the new ordinance allows existing nonconforming uses to continue. The woman now wants to double the size of her shop by adding two service bays. The city denies her a building permit. Is the denial lawful?","o":["Yes, because a nonconforming use may generally continue but may not be substantially expanded.","No, because the shop was lawful when established, so the owner has a vested right to any commercial use of the lot.","No, because refusing to let an existing business expand is a taking requiring just compensation.","Yes, because the city may require any nonconforming use to end at once without compensation."],"a":0,"e":"A use that was lawful before a zoning change and does not conform to the new ordinance may generally continue as a nonconforming use. Zoning law disfavors such uses, however, and seeks their gradual elimination. Owners usually may not substantially expand or enlarge the use, change it to a different nonconforming use, or rebuild after substantial destruction, and an abandoned nonconforming use is lost. Many jurisdictions also allow a reasonable amortization period after which the use must end. Doubling the size of the shop is a substantial expansion. Why the other choices are wrong: The vested-right choice overstates the protection. The owner may continue the existing use, not expand it or switch to any commercial use. The taking choice is wrong because limiting expansion of a nonconforming use leaves the existing use in place and is a valid land-use regulation. The end-at-once choice is wrong because this ordinance lets the use continue, and immediate termination without a reasonable amortization period could raise constitutional problems.","topic":"Real Property > Land-use regulation > Zoning > Nonconforming uses (continuation versus expansion)","batch":2,"status":"approved"},
{"id":"property_b2_06","s":"property","q":"A father signed a deed conveying his farm to his daughter and handed it to her, saying, “This deed takes effect only if you finish veterinary school.” The deed itself contained no condition. The daughter recorded the deed but later dropped out of school. The father sues to quiet title to the farm in himself. What is the most likely result?","o":["The daughter owns it, because handing an unconditional deed to the grantee is an effective delivery.","The father owns the farm, because the oral condition failed when she left school, so the deed never took effect.","The father owns the farm, because a deed is not delivered until the grantor himself records it.","The daughter owns the farm, but only because she recorded the deed before the father sued."],"a":0,"e":"Delivery requires that the grantor intend the deed to be presently operative. When a grantor hands a deed that is absolute on its face directly to the grantee, most courts hold that the delivery is effective and the oral condition is unenforceable, so title passes to the grantee immediately. To make delivery conditional, a grantor should deliver the deed to a third party (an escrow agent) with instructions. Recording is not required for a deed to pass title between the parties. Why the other choices are wrong: The condition-failed choice is wrong because an oral condition on a deed handed to the grantee is generally disregarded. The grantor-records choice is wrong because delivery depends on the grantor’s intent, and recording is not required for delivery. The recorded-first choice is wrong because title passed on delivery. Recording protects against later purchasers but is not needed between the parties.","topic":"Real Property > Titles > Conveyancing by deed > Delivery to the grantee subject to an oral condition","batch":2,"status":"approved"},
{"id":"property_b2_07","s":"property","q":"A brother and sister owned a house as joint tenants with right of survivorship. Without the sister’s knowledge, the brother borrowed $50,000 from a bank and gave it a mortgage on his interest in the house. The brother then died, leaving the loan unpaid. The jurisdiction follows the lien theory of mortgages. Does the sister own the house subject to the bank’s mortgage?","o":["Yes, because the brother’s mortgage severed the joint tenancy and turned it into a tenancy in common subject to the lien.","Yes, because a surviving joint tenant takes the deceased tenant’s share subject to all of his debts.","No, because the mortgage did not sever the joint tenancy, so the bank’s lien ended with the brother’s interest at his death.","No, because one joint tenant can never mortgage his interest without the other’s consent."],"a":2,"e":"In a lien-theory jurisdiction, a mortgage is only a lien and does not transfer title, so one joint tenant’s mortgage does not sever the joint tenancy. When the mortgaging joint tenant dies, his interest disappears and the survivor takes the whole property free of the lien, which attached only to the deceased tenant’s interest. In a title-theory jurisdiction, the mortgage may sever the joint tenancy, creating a tenancy in common subject to the mortgage on the mortgagor’s share. Why the other choices are wrong: The severance choice applies the title-theory approach. In a lien-theory jurisdiction a mortgage does not sever the joint tenancy. The subject-to-debts choice is wrong because the survivor does not inherit the deceased tenant’s share. That interest simply ends at death, and the lien ends with it. The consent choice is wrong because a joint tenant may encumber his own interest without the other tenant’s consent.","topic":"Real Property > Concurrent estates > Joint tenancy > Mortgage by one joint tenant (lien theory)","batch":2,"status":"approved"},
{"id":"torts_b2_01","s":"torts","q":"As a prank, a man pointed a realistic-looking pistol at his coworker and said, “Hand over your wallet.” The man knew the pistol was unloaded, but the coworker did not, and she was terrified until the man laughed and lowered it a few seconds later. The coworker suffered no physical harm. Is the man liable to the coworker for assault?","o":["Yes, because he intentionally caused her to reasonably apprehend an imminent harmful contact.","No, because the pistol was unloaded, so the man had no actual ability to cause the coworker any harm.","No, because the man intended only a joke and did not intend to harm the coworker.","No, because the coworker suffered no physical injury, which an assault claim requires."],"a":0,"e":"Assault requires an act intended to cause a harmful or offensive contact, or the imminent apprehension of one, that causes the plaintiff to reasonably apprehend an imminent contact. Apparent ability is enough: if the plaintiff reasonably believes the defendant can carry out the threat, it does not matter that the gun was unloaded. The man intended to cause apprehension, even if as a joke, and the coworker was not required to suffer physical harm, because the tort protects against the apprehension itself. Why the other choices are wrong: The actual-ability choice is wrong because a reasonable belief in the defendant’s apparent ability to cause the contact is sufficient. The just-a-joke choice is wrong because intent to cause apprehension of a contact is enough. No intent to injure is needed. The physical-injury choice is wrong because assault requires no physical harm. Damages for fright and distress are recoverable.","topic":"Torts > Intentional torts > Assault > Apparent ability (unloaded gun)","batch":2,"status":"approved"},
{"id":"torts_b2_02","s":"torts","q":"A gym owner secretly installed a camera in the women’s locker room to watch members changing clothes. He viewed the recordings privately and never showed them to anyone. A member who learns that she was recorded sues the owner for invasion of privacy. Will she likely prevail?","o":["Yes, because a highly offensive intrusion into a private place is actionable without any publication.","No, because the recordings were never shown to anyone, and invasion of privacy requires publicity.","No, because a business owner has a privilege to monitor activity anywhere on his own premises, including locker rooms.","Yes, but only if she proves the owner used the recordings for his own commercial gain."],"a":0,"e":"Intrusion upon seclusion is an intentional intrusion, physical or otherwise, into another’s private affairs or a place where she has a reasonable expectation of privacy, in a manner highly offensive to a reasonable person. The tort is complete upon the intrusion; no publication or disclosure is required. Secretly recording people changing in a locker room is a clear example. Publication matters for other privacy torts, such as public disclosure of private facts and false light. Why the other choices are wrong: The publicity choice confuses intrusion with public disclosure of private facts. Intrusion requires no publication. The owner’s-privilege choice is wrong because there is no privilege to intrude where people reasonably expect privacy, such as a locker room. The commercial-gain choice describes appropriation of name or likeness, a different privacy tort.","topic":"Torts > Invasion of privacy > Intrusion upon seclusion (no publication required)","batch":2,"status":"approved"},
{"id":"torts_b2_03","s":"torts","q":"A manufacturer sold a table saw equipped with a blade guard that, properly attached, would have prevented the plaintiff’s injury. The plaintiff’s employer removed the guard and rebuilt the saw’s cutting assembly with a homemade guard of its own design, a modification the manufacturer could not reasonably have foreseen. The plaintiff, an employee, was injured when the homemade guard failed. The plaintiff sues the manufacturer in strict products liability. What is the manufacturer’s best defense?","o":["That the plaintiff’s employer, not the manufacturer, had the legal duty to keep the saw safe for the employees who used it.","That the manufacturer exercised all possible care in designing and manufacturing the saw.","That the plaintiff did not buy the saw and so is not in privity of contract with the manufacturer.","That the saw was substantially altered after sale in a way it could not foresee, and the alteration caused the injury."],"a":3,"e":"A seller is strictly liable for a product that is defective when it leaves the seller’s control and that reaches the user without substantial change. An unforeseeable alteration by a third party that creates the danger and causes the injury relieves the manufacturer of liability, because the product was not defective as sold, or because the alteration is a superseding cause. Foreseeable alterations or misuse, by contrast, do not relieve the manufacturer, and a design may be defective if it fails to guard against them. Why the other choices are wrong: The employer’s-duty choice is wrong because an employer’s duties do not by themselves relieve a manufacturer of liability for a product that was defective when sold. The due-care choice is wrong because strict products liability does not depend on the manufacturer’s care. Care is a negligence concept. The privity choice is wrong because privity is not required in strict products liability. Users and bystanders may sue.","topic":"Torts > Products liability > Defenses > Substantial alteration after sale","batch":2,"status":"approved"},
{"id":"torts_b2_04","s":"torts","q":"Driving carefully and without fault, a motorist struck a bicyclist who suddenly swerved into her lane. The bicyclist lay injured and helpless in the traffic lane. The motorist could easily have called for help or warned oncoming traffic, but instead she drove away. A second car later struck the bicyclist, aggravating his injuries. Is the motorist liable for the aggravated injuries?","o":["No, because there is no duty to rescue, and the motorist was not at fault in causing the accident.","Yes, because one who innocently leaves another helpless and in danger must take reasonable steps to aid him.","No, because the second driver’s negligence was a superseding cause that cut off the motorist’s liability for the aggravation.","Yes, because a motorist who strikes a pedestrian or bicyclist is strictly liable for all resulting harm."],"a":1,"e":"There is generally no duty to rescue a stranger. Exceptions include special relationships, a voluntary undertaking to help, and situations in which the defendant’s own conduct, whether or not tortious, created the risk or left the plaintiff helpless. A motorist who injures someone, even without fault, must use reasonable care to aid him and prevent further harm. Her failure to call for help or warn traffic breached that duty and was a cause of the aggravated injuries. Why the other choices are wrong: The no-duty choice states the general rule but misses the exception: a person who innocently creates the peril must take reasonable steps to aid. The superseding-cause choice is wrong because being struck by another car is the very risk that made aiding the bicyclist necessary, so it is foreseeable. The strict-liability choice is wrong because driving is not an abnormally dangerous activity. Liability rests on breach of the duty to aid.","topic":"Torts > Negligence > Duty > Duty to aid when the defendant created the peril","batch":2,"status":"approved"},
