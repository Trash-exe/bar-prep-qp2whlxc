es one kind of unilateral-mistake relief; it does not displace the separate doctrine of mutual mistake. The unconscionability choice is wrong because unconscionability looks at unfair bargaining and terms when the contract was made; an inadequate price caused by a shared good-faith mistake is not unconscionable.","topic":"Contracts > Defenses > Mistake > Mutual mistake","batch":1,"status":"approved"},
{"id":"contracts_b1_06","s":"contracts","q":"A builder contracted to build a house for $400,000. The specifications called for “Brand X copper pipe.” Through an honest oversight, the builder’s plumber installed Brand Y copper pipe, which is identical in quality, durability, and market value. The substitution was discovered after completion. Replacing the pipe would require tearing out finished walls at a cost of $60,000, and the substitution does not reduce the house’s value. The owner refused to pay the $50,000 balance, and the builder sued. What is the builder likely to recover?","o":["The $50,000 balance, less the diminution in value caused by the substitution, which here is zero.","Nothing on the contract, because the pipe brand was an express condition of payment.","The $50,000 balance less the $60,000 replacement cost, so the builder recovers nothing and owes the owner $10,000.","Only the reasonable value of its work in restitution, because any deviation from the specifications is a material breach of a construction contract."],"a":0,"e":"A builder who substantially performs in good faith may recover the contract price minus the owner’s damages for the deviation. When remedying a minor defect would cost far more than the resulting loss in value (economic waste), damages are measured by diminution in value rather than cost of completion (Jacob & Youngs v. Kent). The pipe specification was a promise, not an express condition, and the breach was unintentional. Why the other choices are wrong: The express-condition choice is wrong because nothing makes the brand a condition; specifications are ordinarily promises, and courts avoid construing terms as conditions that would cause forfeiture. The cost-of-replacement choice is wrong because cost of completion is not used when it is grossly disproportionate to the value lost by a good-faith deviation. The restitution-only choice is wrong because a trivial, good-faith deviation is not a material breach; the builder substantially performed and can sue on the contract.","topic":"Contracts > Performance > Substantial performance and measure of damages","batch":1,"status":"approved"},
{"id":"contracts_b1_07","s":"contracts","q":"A company rented a hotel’s rooftop terrace for one evening for $15,000 so its clients could watch a fireworks show planned over the river after a championship game. The contract recited that the rental was “for viewing the championship fireworks.” The day before the event, the city canceled the fireworks because of a sudden fire-safety emergency. Neither party had reason to foresee the cancellation. The terrace remained available, but the company refused to pay. The hotel sued for the price. Who is likely to prevail?","o":["The hotel, because it remained ready to provide the terrace, and a contract is discharged only when performance becomes objectively impossible.","The hotel, because by contracting for a specific date the company assumed the risk that the event it wanted to watch would not take place.","The company, because its principal purpose, known to both parties, was substantially frustrated by an event whose nonoccurrence was a basic assumption.","The company, because the cancellation made the hotel’s performance commercially impracticable and therefore discharged both parties’ duties."],"a":2,"e":"Under the doctrine of frustration of purpose (Restatement (Second) of Contracts §265; compare Krell v. Henry), a party’s remaining duties are discharged when its principal purpose is substantially frustrated without its fault by an event whose nonoccurrence was a basic assumption of the contract, unless the contract or circumstances indicate otherwise. Both parties knew the only purpose of the rental, which the contract recited, and the event was unforeseeable. Why the other choices are wrong: The impossibility-only choice is wrong because frustration of purpose excuses performance even when it remains possible, if its value to one side is destroyed. The assumed-the-risk choice is wrong because nothing in the contract or circumstances allocated the risk of an unforeseeable cancellation to the company. The impracticability choice is wrong because the hotel’s performance did not become impracticable; the terrace was available. The excuse lies in the frustration of the company’s purpose.","topic":"Contracts > Excuse of performance > Frustration of purpose","batch":1,"status":"approved"},
{"id":"crim_b1_01","s":"crim","q":"Two friends planned to burglarize an electronics store at night. The jurisdiction’s burglary statute covers breaking and entering any building with intent to commit theft. The defendant agreed to act as lookout, and the day before the burglary he gave the friends a copy of a key to the store’s back door that he had obtained while working there. An hour before the burglary, the defendant told the friends he had changed his mind and went home. He did not ask for the key back or tell anyone about the plan. The friends used the key and stole merchandise. Is the defendant guilty of burglary as an accomplice?","o":["No, because he told the others he had changed his mind and left before the burglary began, which is an effective withdrawal.","No, because he was not present at the store when the burglary was committed, and an accomplice must be present at the scene.","Yes, because his withdrawal was ineffective: he did not neutralize the key he had supplied or otherwise try to prevent the crime.","Yes, because a person who agrees to help commit a crime can never escape accomplice liability for that crime by withdrawing."],"a":2,"e":"An accomplice is liable for a crime he intentionally aided. To withdraw effectively, he must act before the crime becomes unstoppable and neutralize his contribution. Someone who supplied material aid must try to make it ineffective, for example by retrieving the key, or else give timely warning to the police or otherwise make a proper effort to prevent the crime. Merely announcing that he was out and leaving is not enough. Why the other choices are wrong: The told-them-and-left choice is wrong because withdrawal by an accomplice who provided material aid requires neutralizing that aid, not just announcing a change of mind. The presence choice is wrong because accomplice liability does not require presence; aid given in advance (such as supplying a key) is enough. The never-withdraw choice is wrong because a timely and effective withdrawal is a defense to accomplice liability for later crimes.","topic":"Crim Law > Parties to crime > Accomplice liability > Withdrawal","batch":1,"status":"approved"},
{"id":"crim_b1_02","s":"crim","q":"Intending to kill his business rival, the defendant crept up at night to the rival’s parked car, in which he believed the rival was sleeping, as the rival sometimes did after late shifts. He fired three shots through the rear window. The rival had gone home an hour earlier, and the car was empty. The defendant is charged with attempted murder. What is his best argument, and will it succeed?","o":["That killing was impossible because the car was empty; it will succeed, because a person cannot attempt a crime that could not have been completed.","That no person was actually placed in danger; it will succeed, because attempt requires proof that an actual victim faced a real risk of harm.","That he abandoned the attempt when he walked away; it will succeed, because he left voluntarily before anyone was injured.","That killing was impossible because the car was empty; it will fail, because factual impossibility is not a defense to attempt."],"a":3,"e":"Attempt requires specific intent to commit the crime and an act beyond mere preparation (a substantial step, or dangerous proximity, depending on the test). When the defendant’s intended conduct would be a crime if the facts were as he believed them to be, his failure because of a fact he did not know (the empty car) is factual impossibility, which is not a defense under the common-law majority or the Model Penal Code. Firing the shots more than satisfies the act requirement. Why the other choices are wrong: The impossibility-succeeds choice is wrong because factual impossibility does not defeat an attempt charge. The real-victim choice states no such element; attempt focuses on the defendant’s intent and conduct, not on whether a victim was actually endangered. The abandonment choice is wrong because he did not abandon anything: he fired the shots, completing the attempt. Even where abandonment is recognized, it must be voluntary and come before the attempt is complete.","topic":"Crim Law > Inchoate crimes > Attempt > Factual impossibility","batch":1,"status":"approved"},
{"id":"crim_b1_03","s":"crim","q":"In a common-law jurisdiction, the defendant came home early and found his wife in bed with her coworker. Enraged, the defendant stormed out and spent the next two days driving around and brooding. On the third day, still furious, he went to the coworker’s apartment and shot him dead. The defendant is charged with murder and asks for a voluntary-manslaughter instruction. Of what crime is he most likely guilty?","o":["Murder, because a reasonable person would have cooled off during the two days before the killing.","Voluntary manslaughter, because discovering a spouse’s adultery is adequate provocation.","Involuntary manslaughter, because he acted under extreme emotional disturbance and did not form the intent to kill.","Voluntary manslaughter, because he was in fact still enraged when he killed, and the test for cooling off is whether the defendant had actually calmed down."],"a":0,"e":"Voluntary manslaughter is an intentional killing in the heat of passion upon adequate provocation, with no reasonable opportunity to cool off. Discovering a spouse in the act of adultery is a traditional adequate provocation. But the cooling-off test is objective as well as subjective: if a reasonable person would have cooled off in the time between provocation and killing, the killing is murder even though the defendant remained enraged. Why the other choices are wrong: The adequate-provocation choice stops halfway; provocation reduces murder to manslaughter only if the killing occurred before a reasonable person would have cooled off. The involuntary-manslaughter choice is wrong because involuntary manslaughter is an unintentional killing; this was intentional, and extreme emotional disturbance is a Model Penal Code concept, not the common law. The actually-still-enraged choice is wrong because a defendant who has not actually cooled off still gets no mitigation once a reasonable person would have done so.","topic":"Crim Law > Homicide > Voluntary manslaughter > Cooling-off period","batch":1,"status":"approved"},
{"id":"crim_b1_04","s":"crim","q":"At a party, the defendant became extremely drunk after voluntarily drinking a bottle of whiskey. Flailing his arms while trying to dance, he struck another guest in the face and broke her nose. At his trial for common-law battery, he offers credible expert testimony that he was so intoxicated he did not know what he was doing. How should the court treat this evidence?","o":["As a complete defense, because his intoxication prevented him from forming any intent to strike the other guest.","As no defense, because voluntary intoxication does not negate the mental state for a general-intent crime such as battery.","As a complete defense, because his movements were involuntary, and criminal liability requires a voluntary act.","As no defense, because voluntary intoxication is never a defense to any crime, whatever mental state the crime requires."],"a":1,"e":"Voluntary intoxication may negate a specific-intent element (for example, intent to permanently deprive in larceny, or intent to commit a felony in burglary). It is not a defense to general-intent crimes such as battery, or to crimes with a recklessness or negligence mental state; becoming voluntarily intoxicated is itself treated as reckless. Involuntary intoxication is treated differently. Why the other choices are wrong: The complete-defense choice treats battery as if it required a specific intent that voluntary intoxication could negate; it does not. The involuntary-act choice is wrong because his drinking and dancing were voluntary acts; intoxication does not make bodily movements involuntary the way a seizure or reflex does. The never-a-defense choice overstates the rule; voluntary intoxication can negate the specific intent required for some crimes.","topic":"Crim Law > Defenses > Intoxication (general versus specific intent)","batch":1,"status":"approved"},
{"id":"crim_b1_05","s":"crim","q":"Investigating a string of armed robberies, police obtained 120 days of the defendant’s historical cell-site location records from his wireless carrier. They used a court order issued under a statute that requires only “reasonable grounds” to believe the records are relevant, not a warrant supported by probable cause. The records placed the defendant near each robbery. He moves to suppress them. Assume no exception to the warrant requirement or to the exclusionary rule applies. How should the court rule?","o":["Deny the motion, because under the third-party doctrine a person has no reasonable expectation of privacy in records he voluntarily shares with a business.","Deny the motion, because the records were obtained under a court order authorized by statute, and statutory authorization satisfies the Fourth Amendment.","Grant the motion, because the Fifth Amendment privilege against self-incrimination protects any records that reveal a person’s location.","Grant the motion, because obtaining extensive historical cell-site records is a search that requires a warrant supported by probable cause."],"a":3,"e":"In Carpenter v. United States (2018), the Supreme Court held that a person has a reasonable expectation of privacy in the record of his physical movements captured by historical cell-site location information. Acquiring such records from a carrier, at least for seven days or more, is a Fourth Amendment search that generally requires a warrant supported by probable cause. A “reasonable grounds” order does not meet that standard. Why the other choices are wrong: The third-party-doctrine choice is wrong because Carpenter declined to extend that doctrine (Smith v. Maryland; United States v. Miller) to comprehensive cell-site location records. The statutory-authorization choice is wrong because a statute cannot lower the constitutional standard; the order required only reasonable grounds, not probable cause. The Fifth Amendment choice is wrong because the privilege protects against compelled testimonial communications by the defendant, not business records held by a third party.","topic":"Crim Pro > Fourth Amendment > What is a search > Cell-site location records (Carpenter)","batch":1,"status":"approved"},
{"id":"crim_b1_06","s":"crim","q":"Officers chased a man suspected of a shooting through a crowded park. As they closed in, they saw him toss a dark object into thick bushes beside a playground where children were playing. They tackled and handcuffed him. Before giving Miranda warnings, an officer asked, “What did you throw? Is it a gun?” The man said, “Yeah, it’s in the bushes.” Officers recovered a handgun. At trial, the man moves to suppress his statement. How should the court rule?","o":["Grant the motion, because the man was in custody and was interrogated before receiving Miranda warnings.","Grant the motion, because the public-safety exception applies only when officers ask questions out of fear for their own safety.","Deny the motion, because Miranda warnings are required only after a suspect has been formally charged with a crime.","Deny the motion, because the question was prompted by an objectively reasonable need to protect the public from a discarded weapon."],"a":3,"e":"Under New York v. Quarles, officers may ask questions reasonably prompted by a concern for public safety, such as locating a discarded gun, before giving Miranda warnings, and the answers are admissible. The exception turns on the objective circumstances, not the officer’s subjective motive. A gun abandoned near children in a public park is a paradigm public-safety threat. Why the other choices are wrong: The custody-plus-interrogation choice ignores the public-safety exception, which applies even to custodial interrogation. The officer-safety-only choice is wrong because the exception covers threats to the public as well as to officers. The formally-charged choice confuses Miranda, which applies to custodial interrogation regardless of charges, with the Sixth Amendment right to counsel, which attaches at formal charging.","topic":"Crim Pro > Fifth Amendment > Miranda > Public-safety exception","batch":1,"status":"approved"},
{"id":"crim_b1_07","s":"crim","q":"After the defendant was indicted for robbing a convenience store, police placed him in a lineup without notifying his appointed lawyer. The store clerk picked him out. At trial, the defendant moves to exclude evidence of the lineup identification. How should the court rule?","o":["Deny the motion, because the Sixth Amendment right to counsel applies only at trial and not during the investigative phase.","Deny the motion, because appearing in a lineup is nontestimonial, so the defendant had no constitutional right that the lineup could violate.","Grant the motion, because a post-indictment lineup is a critical stage at which the Sixth Amendment right to counsel applies.","Grant the motion, because the Fifth Amendment privilege against self-incrimination forbids requiring a suspect to stand in a lineup."],"a":2,"e":"The Sixth Amendment right to counsel attaches when formal adversary proceedings begin (indictment, information, formal charge, or arraignment) and applies at every critical stage, including a post-charge lineup (United States v. Wade; Gilbert v. California). Evidence of a lineup identification obtained in violation of that right is excluded. An in-court identification may still be allowed if the prosecution shows an independent source. Pre-charge lineups carry no right to counsel (Kirby v. Illinois). Why the other choices are wrong: The trial-only choice is wrong because the right applies at critical pretrial stages after charges are filed, including lineups. The nontestimonial choice is wrong because, although a lineup does not implicate the Fifth Amendment privilege, it is still a critical stage for Sixth Amendment purposes. The Fifth Amendment choice is wrong because being displayed in a lineup is not testimonial, so the privilege does not apply.","topic":"Crim Pro > Sixth Amendment > Right to counsel > Post-charge lineups","batch":1,"status":"approved"},
{"id":"evidence_b1_01","s":"evidence","q":"In a negligence suit against a delivery company, the plaintiff called the emergency-room physician who treated her. The physician testified that the plaintiff told him: “My lower back is killing me. It started when the delivery truck backed into me in the parking lot. The driver was staring at his phone.” The company objected to the testimony as hearsay. How should the court rule?","o":["Admit the statements except the one about the driver’s phone, because statements assigning fault are not pertinent to diagnosis or treatment.","Admit all of the statements, because statements made to a physician for medical diagnosis or treatment are excepted from the hearsay rule.","Exclude all of the statements, because a party’s own out-of-court statements are self-serving and may not be offered by that party.","Exclude all of the statements, because statements to a doctor are admissible only when made to obtain treatment, not when the doctor later testifies at trial."],"a":0,"e":"FRE 803(4) excepts statements made for, and reasonably pertinent to, medical diagnosis or treatment that describe medical history, symptoms, or their inception or general cause. The pain and the general cause (being struck by a backing truck) qualify. Statements of fault, such as the driver being on his phone, are not reasonably pertinent to treatment and are not covered. The plaintiff’s own statements are not opposing-party statements when she offers them. Why the other choices are wrong: The admit-everything choice is wrong because the exception covers only statements reasonably pertinent to diagnosis or treatment, and fault is not. The self-serving choice is wrong because there is no general self-serving bar; a party may offer her own statements if a hearsay exception applies, as 803(4) does here for most of them. The not-at-trial choice is wrong because the exception applies whenever the out-of-court statement was made for diagnosis or treatment, as it was in the emergency room.","topic":"Evidence > Hearsay > Exceptions > Statements for medical diagnosis or treatment (FRE 803(4))","batch":1,"status":"approved"},
{"id":"evidence_b1_02","s":"evidence","q":"A customer sued a grocery store after slipping on spilled oil. To prove that the oil had been on the floor long enough for the store to discover it, she offered the store’s incident report. The store’s safety manager prepared the report the same day, as store policy required. It said: “Customer Ann Lee, a bystander, told me calmly about 30 minutes after the fall that the oil had been on the floor for at least an hour.” The custodian of records authenticated the report. Lee did not testify. The store objected. How should the court rule?","o":["Exclude the statement about how long the oil was there, because Lee’s statement is a second layer of hearsay that no exception covers.","Admit it, because the report was made in the regular course of business by an employee who had a duty to record the information.","Admit it, because the report is the store’s own statement and is therefore an opposing-party statement when offered against the store.","Exclude it, because a business record is admissible only if the employee who prepared it testifies and is subject to cross-examination."],"a":0,"e":"Under FRE 805, each layer of hearsay must satisfy an exception. The report itself may qualify as a business record (made at or near the time, in the regular course, by someone with a business duty) and, when offered against the store, as the store employee’s statement on a matter within the scope of employment. Lee, however, was a bystander with no business duty to report, so the business-records exception does not cover her statement. She spoke calmly 30 minutes later, so it is neither an excited utterance nor a present sense impression. Why the other choices are wrong: The regular-course choice addresses only the outer layer; the business-records exception does not cover statements by outsiders who had no business duty. The opposing-party choice also covers only the outer layer; recording Lee’s words does not adopt them, so her statement remains unexcepted hearsay. The preparer-must-testify choice is wrong because 803(6) records can be authenticated by a custodian or certification, and availability is immaterial under Rule 803.","topic":"Evidence > Hearsay > Business records (FRE 803(6)) and hearsay within hearsay (FRE 805)","batch":1,"status":"approved"},
{"id":"evidence_b1_03","s":"evidence","q":"A motorist sued a trucking company after one of its trucks crossed the center line and hit her car. She offered testimony from her husband that, a week after the crash, the company’s dispatcher, whose job included scheduling drivers’ routes and hours, told him: “We knew our driver had been on the road for 18 hours. We pushed him to finish the run.” The dispatcher still works for the company. The company objected to the testimony as hearsay. How should the court rule?","o":["Exclude it, because the dispatcher was not authorized to speak on the company’s behalf about the accident.","Exclude it, because the statement was made a week after the accident and was not made in furtherance of the company’s business.","Admit it, because the dispatcher’s statement concerned a matter within the scope of her employment and was made while she was employed.","Admit it, because the dispatcher’s statement was against her own interest and therefore falls within an exception to the hearsay rule."],"a":2,"e":"Under FRE 801(d)(2)(D), a statement offered against a party is not hearsay if it was made by the party’s agent or employee on a matter within the scope of that relationship while it existed. The declarant need not have been authorized to speak for the company, and the statement need not be made in furtherance of the business. Driver scheduling was within the dispatcher’s job, and she was still employed. Why the other choices are wrong: The not-authorized choice confuses 801(d)(2)(D) with the separate authorized-speaker provision, 801(d)(2)(C); speaking authority is not required for an employee’s statement. The in-furtherance choice borrows the requirement for co-conspirator statements, 801(d)(2)(E); an employee’s statement need only concern a matter within the scope of employment. The statement-against-interest choice is wrong because 804(b)(3) requires that the declarant be unavailable, and the dispatcher is available.","topic":"Evidence > Hearsay > Opposing-party statements by employees (FRE 801(d)(2)(D))","batch":1,"status":"approved"},
{"id":"evidence_b1_04","s":"evidence","q":"The defendant is charged with burglarizing a jewelry store by drilling through its shared wall from a vacant shop next door. He claims he was misidentified. The prosecution, after giving proper pretrial notice, offers evidence that the defendant committed two earlier burglaries using the same unusual method of drilling through shared walls from vacant adjoining units. He was never convicted of the earlier burglaries, but the government has eyewitness and forensic evidence that he committed them. How should the court rule?","o":["Exclude it, because evidence of other crimes may not be used to show that the defendant has a criminal character and acted in conformity with it.","Admit it, because evidence of a defendant’s earlier crimes of the same type is always admissible against him in a criminal prosecution.","Exclude it, because the defendant was never convicted of the earlier burglaries.","Admit it to prove identity by a distinctive method, subject to Rule 403 balancing and a limiting instruction on request."],"a":3,"e":"FRE 404(b) bars other-acts evidence offered to show propensity, but permits it for another purpose such as identity, intent, motive, plan, or knowledge. A modus operandi so distinctive that it acts like a signature is admissible to prove identity. No conviction is required: under Huddleston v. United States, the court asks whether a jury could reasonably find by a preponderance that the defendant committed the other acts. The court then applies Rule 403 and gives a limiting instruction if asked. Why the other choices are wrong: The propensity choice states the general ban correctly but ignores that this evidence is offered for a non-propensity purpose, identity. The always-admissible choice is wrong because similar crimes may not be used for propensity (except under Rules 413–415 for sexual assault and child molestation) and remain subject to Rule 403. The conviction-required choice is wrong because Huddleston requires only evidence sufficient for a jury to find the acts by a preponderance.","topic":"Evidence > Relevance > Character and other acts > Other acts to prove identity (FRE 404(b))","batch":1,"status":"approved"},
{"id":"evidence_b1_05","s":"evidence","q":"In a civil fraud action, the defendant’s key witness testified on direct. On cross-examination, the plaintiff’s lawyer, who had a good-faith basis, asked the witness: “Isn’t it true that last year you lied about your work history on your application for a state contractor’s license?” The witness answered, “No.” The plaintiff then offered the license application and a state investigator’s testimony to prove the lie. The witness has no criminal convictions. How should the court rule on the question and on the extrinsic evidence?","o":["Both were improper, because only convictions can impeach.","The question was proper, but the extrinsic evidence is inadmissible.","Both were proper, because the lie shows untruthfulness.","The question was improper, but the authenticated application is admissible."],"a":1,"e":"Under FRE 608(b), a court may allow inquiry on cross-examination into specific instances of a witness’s conduct that are probative of untruthfulness, such as lying on a government application, if there is a good-faith basis. But extrinsic evidence is not admissible to prove those specific instances in order to attack the witness’s character for truthfulness. The cross-examiner must take the witness’s answer. Why the other choices are wrong: The convictions-only choice is wrong because Rule 608 also permits reputation and opinion testimony and cross-examination about untruthful acts. The both-proper choice is wrong because 608(b) expressly bars extrinsic evidence of specific instances offered to attack character for truthfulness. The question-improper choice reverses the rule; the question is the permitted method, and the extrinsic proof is the barred one.","topic":"Evidence > Witnesses > Impeachment > Specific instances of untruthfulness (FRE 608(b))","batch":1,"status":"approved"},
{"id":"evidence_b1_06","s":"evidence","q":"In a products-liability action, the plaintiff’s expert engineer testified that a rivet in the defendant’s ladder was defectively manufactured. She based her opinion partly on a metallurgy lab report prepared by a technician who will not testify. The report itself is inadmissible hearsay, but experts in the field reasonably rely on such reports. The defendant objected to the opinion and to the plaintiff’s request to read the report to the jury. How should the court rule?","o":["Admit the opinion, but bar disclosure of the report unless its value in evaluating the opinion substantially outweighs its prejudicial effect.","Exclude the opinion, because an expert may not base an opinion on facts or data that would themselves be inadmissible hearsay at trial.","Admit the opinion and admit the lab report for its truth, because once an expert relies on a document, the document comes in as substantive evidence.","Exclude the opinion unless the technician who prepared the report testifies and is subject to cross-examination by the defendant."],"a":0,"e":"Under FRE 703, an expert may base an opinion on facts or data that experts in the field would reasonably rely on, even if they are inadmissible. The proponent may disclose such inadmissible facts to the jury only if their probative value in helping the jury evaluate the opinion substantially outweighs their prejudicial effect. Reliance does not make the report admissible for its truth. (In criminal cases, the Confrontation Clause adds limits; see Smith v. Arizona (2024).) Why the other choices are wrong: The inadmissible-basis choice is wrong because Rule 703 expressly allows reliance on inadmissible facts of a kind experts reasonably rely on. The report-comes-in choice is wrong because reliance does not create a hearsay exception; disclosure is limited by Rule 703’s reverse balancing test. The technician-must-testify choice is wrong because Rule 703 does not require the preparer of underlying data to testify in a civil case.","topic":"Evidence > Opinion and expert testimony > Bases of expert opinion (FRE 703)","batch":1,"status":"approved"},
{"id":"evidence_b1_07","s":"evidence","q":"A pedestrian was struck by a hit-and-run driver. A witness wrote the car’s license-plate number on a napkin moments after the crash. At trial 18 months later, the witness testified that she wrote the number accurately while the event was fresh, but that she cannot now remember it, even after looking at the napkin. The plaintiff offered the napkin as an exhibit. How should the court rule?","o":["The napkin is admissible as an exhibit offered by the plaintiff, because it qualifies as a recorded recollection.","The note is inadmissible hearsay, because a witness who cannot remember the matter she recorded cannot lay a foundation for it.","The witness may read the note to the jury, but the napkin may be received as an exhibit only if the defendant offers it.","The witness may look at the napkin to refresh her memory and then testify to the number from the napkin, without its admission."],"a":2,"e":"Under FRE 803(5), a record of a matter the witness once knew but cannot now recall well enough to testify fully and accurately is admissible if it was made or adopted when the matter was fresh and accurately reflects her knowledge. The record may be read into evidence, but it may be received as an exhibit only if offered by an adverse party. Why the other choices are wrong: The plaintiff’s-exhibit choice is wrong because a recorded recollection may be read into evidence, but only an adverse party may introduce the record itself as an exhibit. The no-foundation choice is wrong because lack of present memory is exactly what 803(5) requires; she laid the foundation by testifying the note was accurate when made. The refresh choice is wrong because refreshing works only if the witness then testifies from revived memory; she cannot remember even after looking, so 803(5), not Rule 612, applies.","topic":"Evidence > Hearsay > Recorded recollection (FRE 803(5)) versus refreshing recollection (FRE 612)","batch":1,"status":"approved"},
{"id":"property_b1_01","s":"property","q":"A state’s recording act provides: “No conveyance of real property is valid against a subsequent purchaser for value without notice unless the conveyance is recorded.” In January, an owner deeded a lot to Ana, who did not record. In February, the owner deeded the same lot to Ben, who paid fair value and had no notice of Ana’s deed. Ben did not record. In March, Ana recorded her deed. In April, Ben sold and deeded the lot to Cara, who paid fair value and had actual knowledge of the deed to Ana. Who owns the lot?","o":["Ana, because she recorded her deed before both Ben and Cara recorded, and recording first controls under every type of recording act.","Cara, because Ben took free of Ana’s unrecorded deed as a purchaser without notice, and Cara succeeds to Ben’s protected position.","Ana, because Cara bought with actual and constructive notice of Ana’s recorded deed and therefore cannot be a protected purchaser.","Cara, because the most recent purchaser for value always prevails under a notice statute."],"a":1,"e":"Under a notice statute, a subsequent purchaser for value without notice prevails over an earlier unrecorded conveyance as of the moment of purchase, whether or not she records. When Ben bought in February, Ana’s deed was unrecorded and Ben lacked notice, so Ben cut off Ana’s claim. Ana’s later recording cannot revive it. Under the shelter rule, a transferee from a protected purchaser takes that purchaser’s rights even if the transferee has notice, so Cara owns the lot. Why the other choices are wrong: The recorded-first choice describes a race or race-notice statute; under this pure notice statute, Ben won when he bought without notice, and recording first is irrelevant. The Cara-had-notice choice ignores the shelter rule: Cara does not need her own protected status because she takes Ben’s title, which already defeated Ana. The latest-purchaser choice states no real rule; a later purchaser with notice of an earlier recorded deed would ordinarily lose, and Cara wins only through Ben.","topic":"Real Property > Titles > Recording acts > Notice statute and the shelter rule","batch":1,"status":"approved"},
{"id":"property_b1_02","s":"property","q":"An owner borrowed $200,000 from a bank, signed a promissory note, and gave the bank a recorded mortgage on her house. She later sold the house to a buyer by a deed stating that the buyer took “subject to” the existing mortgage. The buyer did not agree to pay the mortgage debt, and the bank did not release the owner. The buyer later stopped making payments, and the bank foreclosed. The sale brought $150,000, leaving a $50,000 deficiency. Assume the bank never enforced its due-on-sale clause. Who is personally liable for the deficiency?","o":["The buyer only, because the buyer owned the property when the default occurred and the bank’s mortgage followed the land into the buyer’s hands.","Both the owner and the buyer, jointly and severally, because each held title to the mortgaged property while the debt remained unpaid.","The original owner only, because the buyer took subject to the mortgage without assuming it.","Neither, because foreclosure extinguishes the debt along with the lien."],"a":2,"e":"A grantee who takes “subject to” a mortgage does not become personally liable on the debt; the land remains security, so the grantee risks losing the property but owes no deficiency. A grantee who assumes the mortgage becomes primarily liable, and the original mortgagor becomes secondarily liable, in effect a surety. In either case, the original mortgagor remains personally liable on her note unless the lender releases her (a novation). Why the other choices are wrong: The buyer-only choice confuses the land’s liability with personal liability; a nonassuming grantee owes no deficiency, and the owner was never released. The both-liable choice would be closer if the buyer had assumed the debt; taking subject to the mortgage creates no personal obligation. The neither choice is wrong because foreclosure extinguishes the mortgage lien, not the debt; absent an anti-deficiency statute, the lender may seek a deficiency judgment against those personally liable.","topic":"Real Property > Mortgages > Transfers by the mortgagor > Taking “subject to” versus assuming","batch":1,"status":"approved"},
{"id":"property_b1_03","s":"property","q":"A creditor obtained a money judgment against a debtor and properly docketed it in the county. Under state law, a docketed judgment becomes a lien on any real property the debtor owns or later acquires in the county. A year later, the debtor bought a house in the county. At closing, she borrowed most of the price from a lender, which paid the funds to the seller, and she gave the lender a mortgage on the house that was signed and recorded the same day. The debtor later defaulted on both obligations. Which lien has priority on the house?","o":["The creditor’s, because its judgment was docketed a year before the lender’s mortgage was recorded, and the first lien of record always prevails.","The creditor’s, because a lien imposed by law on a judgment always takes priority over a consensual lien such as a mortgage.","The lender’s, because a purchase-money mortgage has priority over earlier judgment liens against the buyer that attach only when she acquires title.","Neither; the two liens share the sale proceeds in proportion to their amounts, because both attached at the instant the debtor acquired title."],"a":2,"e":"A purchase-money mortgage (one given to secure funds used to buy the property) has priority over prior liens arising against the mortgagor, such as docketed judgment liens, that attach to after-acquired property. The debtor acquires title already burdened by the mortgage, so the judgment lien can attach only to her equity. This priority does not depend on the recording act. Why the other choices are wrong: The first-of-record choice is wrong because purchase-money priority overrides earlier judgment liens against the purchaser, regardless of docketing order. The liens-by-law choice states no such rule; priority does not turn on whether a lien is judicial or consensual. The share-pro-rata choice is wrong because the purchase-money mortgage is treated as attaching first, so there is no simultaneous attachment to share.","topic":"Real Property > Mortgages > Priorities > Purchase-money mortgage versus prior judgment lien","batch":1,"status":"approved"},
{"id":"property_b1_04","s":"property","q":"An owner conveyed land “to Abe for life, then to Bea and her heirs, but if the land is ever used to sell alcohol, then to Cal and his heirs.” Abe, Bea, and Cal are alive. The jurisdiction applies the common-law Rule Against Perpetuities without modification. What interests do Bea and Cal hold?","o":["Cal’s interest is void under the Rule, so Bea holds an indefeasibly vested remainder in fee simple absolute.","Cal holds a valid shifting executory interest, so Bea holds a vested remainder subject to complete divestment if the land is used to sell alcohol.","Cal holds a contingent remainder, and Bea holds a vested remainder subject to open, because both interests follow Abe’s life estate.","Cal’s interest is void, so the owner holds a possibility of reverter."],"a":0,"e":"Cal’s interest is a shifting executory interest that would cut short Bea’s estate on an event (alcohol sales) that could occur at any time, including more than 21 years after the death of every life in being. Under the common-law Rule, it is void from the start. Striking it leaves “to Abe for life, then to Bea and her heirs,” and because the condition was phrased as a divesting condition subsequent in favor of a third party, Bea’s remainder becomes absolute. No interest returns to the grantor. Why the other choices are wrong: The valid-executory-interest choice correctly labels the interests but ignores that Cal’s interest violates the common-law Rule, because it might vest too remotely. The contingent-remainder choice is wrong because an interest that cuts short a prior vested estate is an executory interest, not a remainder, and there is no class gift to Bea that could open. The possibility-of-reverter choice applies the result for durational (“so long as”) language; here the void gift over was a condition subsequent in favor of a third party, so striking it leaves Bea’s estate absolute.","topic":"Real Property > Future interests > Executory interests and the Rule Against Perpetuities","batch":1,"status":"approved"},
{"id":"property_b1_05","s":"property","q":"A dentist leased office space for five years. The landlord covenanted to supply heat. One January, the heating system failed repeatedly, leaving the office too cold to use on many days. The dentist sent written complaints, but the landlord did nothing. The dentist stayed in the office and paid full rent through the winter and spring. In August, the dentist moved out and stopped paying rent, claiming constructive eviction. The landlord sued for rent. Who is likely to prevail?","o":["The dentist, because the landlord breached its express covenant to supply heat, which automatically ended the dentist’s duty to pay rent.","The dentist, because the implied warranty of habitability entitled the dentist to stop paying rent once the landlord failed to make repairs.","The landlord, because a tenant claiming constructive eviction must vacate within a reasonable time after the landlord fails to cure.","The landlord, because a landlord’s covenant to supply heat is independent of the tenant’s covenant to pay rent and can never excuse the tenant."],"a":2,"e":"Constructive eviction requires (1) a landlord’s act or omission that substantially interferes with the tenant’s use and enjoyment, (2) notice and the landlord’s failure to cure within a reasonable time, and (3) the tenant’s vacating within a reasonable time. Remaining in possession for months after the interference, and leaving only in summer, waives the claim. The dentist could still sue for damages for the breach of the covenant to supply heat. Why the other choices are wrong: The automatic-termination choice skips the requirement that the tenant vacate within a reasonable time; breach of the heat covenant alone does not end the rent obligation. The habitability choice is wrong because the implied warranty of habitability generally applies only to residential leases, not to a commercial dental office. The independent-covenants choice is wrong because constructive eviction is an established exception that can end the duty to pay rent; the dentist loses only because of the delay.","topic":"Real Property > Landlord and tenant > Constructive eviction","batch":1,"status":"approved"},
{"id":"property_b1_06","s":"property","q":"Two siblings inherited a farmhouse as tenants in common in equal shares. One sibling moved in and has lived there alone for six years. The other sibling lives in another state, never asked to live in the farmhouse, and was never refused access. There is no agreement about use of the property. The out-of-state sibling now demands that the occupying sibling pay her half the fair rental value for the past six years. Is the occupying sibling liable for that amount?","o":["Yes, for half the fair rental value, because the occupying sibling has had exclusive use of the property for six years.","Yes, because a cotenant who occupies the property holds it in trust for the other cotenants and must account for its full value.","No, because the occupying sibling has acquired the other sibling’s share by adverse possession through six years of exclusive occupancy.","No, because absent ouster or an agreement, a cotenant in possession owes no rent to the other cotenants for her own use."],"a":3,"e":"Each cotenant has the right to possess the whole property. Under the majority rule, a cotenant in sole possession is not liable to the others for the rental value of her own use unless she ousted them, agreed to pay, or (in some jurisdictions) collected rent from third parties, which she must share. Ouster requires a refusal of access or an unequivocal claim of exclusive ownership. Nothing like that happened here. Why the other choices are wrong: The exclusive-use choice is wrong because occupying the property alone, without ouster or agreement, does not create a duty to pay rent to a cotenant. The in-trust choice states no such rule; cotenants are not trustees for one another merely because one of them occupies the property. The adverse-possession choice is wrong because a cotenant’s possession is not adverse to the other cotenants without ouster, and the facts give no statutory period that has run.","topic":"Real Property > Concurrent estates > Rights of cotenants (possession and rent)","batch":1,"status":"approved"},
{"id":"property_b1_07","s":"property","q":"A seller contracted to sell a house to a buyer for $300,000, with closing set for June 30. The contract required the seller to convey marketable title and said nothing else about encumbrances. On May 1, the buyer’s title search revealed a recorded mortgage on the house securing a $90,000 debt. The seller told the buyer he would pay the mortgage off at closing out of the purchase price. The buyer immediately notified the seller that she was rescinding the contract because the title was unmarketable. Was the buyer entitled to rescind?","o":["No, because the seller need not provide marketable title until closing, and he may use the purchase price to pay off the mortgage then.","Yes, because an outstanding mortgage is an encumbrance that makes title unmarketable, and the buyer need not wait to see whether it is removed.","Yes, because the seller breached the covenant against encumbrances when he signed a contract to sell property that was subject to a mortgage.","No, because a buyer under a contract for the sale of land takes title subject to every encumbrance that is recorded before the contract is signed."],"a":0,"e":"The implied (or express) covenant to convey marketable title is measured at closing, not at the time of contracting. A seller may cure defects before or at closing, including paying off a mortgage with the sale proceeds, so long as the mortgage will be discharged when title passes. A buyer who repudiates before closing because of a curable encumbrance is herself in breach. Why the other choices are wrong: The no-need-to-wait choice is wrong because marketability is tested at closing, and the seller has until then to remove the mortgage. The covenant-against-encumbrances choice is wrong because that covenant is a deed covenant that arises when the deed is delivered at closing, not a term of the sale contract. The takes-subject-to-everything choice is wrong because the right to marketable title protects the buyer against recorded encumbrances such as unpaid mortgages unless she agreed to take subject to them.","topic":"Real Property > Real estate contracts > Marketable title > Encumbrances payable at closing","batch":1,"status":"approved"},
{"id":"torts_b1_01","s":"torts","q":"A driver who was texting swerved onto a sidewalk. A pedestrian leaped aside, and the car missed her by inches before smashing into a bus shelter beside her. She was not touched. In the following weeks she suffered recurring vomiting, insomnia, and a diagnosed stress disorder caused by the near miss. She sued the driver for negligent infliction of emotional distress. Is she likely to recover?","o":["No, because she suffered no physical impact, and emotional-distress damages caused by negligence require a contemporaneous impact.","Yes, because she was in the zone of danger created by the driver’s negligence, and her distress produced physical symptoms.","No, because emotional-distress damages are recoverable only when the defendant acted intentionally or recklessly, not merely negligently.","Yes, because anyone who witnesses an accident caused by another’s negligence may recover for the emotional distress the accident causes."],"a":1,"e":"A plaintiff who is placed in the zone of physical danger by the defendant’s negligence, and who suffers emotional distress with resulting physical manifestations, may recover even without an impact. Most jurisdictions have abandoned the impact rule, and the zone-of-danger test is the common ground the MBE uses for direct victims. Here she was nearly struck, and her distress caused physical symptoms. Why the other choices are wrong: The impact-rule choice states a minority, largely abandoned rule; being within the zone of danger is enough. The intent-required choice describes intentional infliction of emotional distress; negligent infliction is a separate, recognized theory. The anyone-who-witnesses choice is too broad; bystanders outside the zone of danger generally recover only if they are closely related to a victim who was injured, were present, and perceived the injury.","topic":"Torts > Negligence > Special duty rules > Negligent infliction of emotional distress (zone of danger)","batch":1,"status":"approved"},
{"id":"torts_b1_02","s":"torts","q":"A manufacturer makes table saws. A blade-stopping sensor that halts the blade within milliseconds of contact with skin has been available for years. It is reliable and adds about $100 to the cost of a $1,500 saw. No manufacturer uses it, and the manufacturer’s saws meet every industry standard. While using a saw properly, a carpenter’s hand slipped into the blade, and he lost two fingers. He sued the manufacturer in strict products liability for defective design. The jurisdiction uses a risk-utility test. Which is the most accurate statement?","o":["He can prevail by proving that the sensor was a feasible, reasonable alternative design whose omission made the saw not reasonably safe; industry custom is not conclusive.","The manufacturer will prevail, because a product that conforms to the customs and safety standards of its industry cannot be found defective in design.","The manufacturer will prevail, because the danger of a spinning saw blade is open and obvious to any experienced carpenter who uses the saw.","He will prevail without more evidence, because his injury during proper use of the saw shows that the saw was defective."],"a":0,"e":"Under the risk-utility approach (Restatement (Third) of Torts: Products Liability §2(b)), a design is defective if the foreseeable risks could have been reduced or avoided by a reasonable alternative design and omitting it renders the product not reasonably safe. Compliance with industry custom or standards is relevant evidence but does not conclusively establish that the design was reasonable. Why the other choices are wrong: The industry-custom choice is wrong because compliance with custom is evidence of reasonableness, not a complete defense; an entire industry can lag behind feasible safety measures. The open-and-obvious choice is wrong because obviousness may defeat a failure-to-warn claim, but it does not bar a design-defect claim when a reasonable alternative design would have reduced the risk. The injury-proves-defect choice is wrong because the plaintiff must prove a defect; an injury during normal use does not by itself establish one, and the injury here is consistent with an obvious risk.","topic":"Torts > Products liability > Design defect > Risk-utility and reasonable alternative design","batch":1,"status":"approved"},
{"id":"torts_b1_03","s":"torts","q":"A furniture company’s delivery driver was making scheduled deliveries in a company truck. Between stops, he drove four blocks off his route to pick up lunch at a drive-through, as drivers commonly did. Pulling out of the drive-through to return to his route, he negligently struck a pedestrian. The pedestrian sued the furniture company. Is the company likely to be liable?","o":["No, because at the moment of the accident the driver was serving his own personal interest in getting lunch rather than his employer’s interest.","Yes, because a minor deviation from the employer’s business, such as a short lunch stop, is a detour within the scope of employment.","No, because an employer is liable for an employee’s negligence only when the employer authorized or ratified the specific act that caused the harm.","Yes, because an employer is strictly liable for every tort an employee commits during working hours, wherever the employee happens to be."],"a":1,"e":"Under respondeat superior, an employer is vicariously liable for torts an employee commits within the scope of employment. A small, foreseeable deviation (a detour) remains within the scope of employment, while a substantial departure for purely personal purposes (a frolic) does not. A brief lunch stop a few blocks off route during a delivery shift, which drivers commonly made, is a detour, and the driver was returning to his route. Why the other choices are wrong: The personal-interest choice is wrong because brief personal acts incidental to the workday, such as eating, are detours that remain within the scope of employment. The authorization choice is wrong because vicarious liability does not require that the employer authorize the tortious act; it rests on the employment relationship. The every-tort choice is wrong because liability is limited to conduct within the scope of employment; a true frolic would fall outside it even during working hours.","topic":"Torts > Vicarious liability > Respondeat superior > Frolic versus detour","batch":1,"status":"approved"},
{"id":"torts_b1_04","s":"torts","q":"A plaintiff suffered $100,000 in damages in a three-car collision and sued both other drivers. The jurisdiction applies pure comparative negligence and joint and several liability. The jury found the plaintiff 20% at fault, the first defendant 30% at fault, and the second defendant 50% at fault. The second defendant is insolvent and uninsured. What is the most the plaintiff can collect from the first defendant?","o":["$80,000, the reduced award.","$30,000, its 30% share.","$100,000, the full damages.","$60,000, its share plus a reallocated part."],"a":0,"e":"Under pure comparative negligence, the plaintiff’s recovery is reduced by her own share of fault, to $80,000. Under joint and several liability, she may collect that entire amount from any defendant found liable. The first defendant may then seek contribution from the second defendant for the amount paid beyond its 30% share, bearing the risk of the second defendant’s insolvency. Why the other choices are wrong: The $30,000 choice applies several-only liability, which the jurisdiction does not use. The $100,000 choice ignores the reduction for the plaintiff’s own 20% fault; joint and several liability applies to the reduced recovery. The $60,000 choice uses a reallocation scheme that some states adopt by statute; it is not the default under the joint-and-several assumption the MBE uses.","topic":"Torts > Negligence > Multiple defendants > Joint and several liability with comparative fault","batch":1,"status":"approved"},
{"id":"torts_b1_05","s":"torts","q":"A hog farm has operated in a rural area for 20 years using ordinary methods. A developer later built homes on adjacent land, and a family bought one of them. Odors from the farm regularly make the family’s yard unusable and seep into the home. Most neighbors find the odor seriously offensive. The family sued the farm for private nuisance. The farm argues that the family came to the nuisance. Assume no right-to-farm statute applies. Which statement is most accurate?","o":["The farm will prevail, because a plaintiff who chooses to move next to an existing lawful activity is completely barred from bringing a nuisance claim against it.","The family may recover if the odor substantially and unreasonably interferes with their use and enjoyment; coming to the nuisance is only a factor.","The family will prevail automatically, because a hog farm located near residential homes is a nuisance per se regardless of how carefully it is operated.","The farm will prevail, because a private-nuisance claim requires a physical invasion of the plaintiff’s land, and odors are not a physical invasion."],"a":1,"e":"Private nuisance is a substantial and unreasonable interference with another’s use and enjoyment of land, judged by the standard of a normal person in the community. That the plaintiff knowingly moved near an existing activity (coming to the nuisance) is a factor in deciding whether the interference is unreasonable and what remedy fits, but it is not a complete defense in most jurisdictions. Courts may weigh it, for example, by awarding damages rather than an injunction. Why the other choices are wrong: The complete-bar choice states a minority position; coming to the nuisance is generally a factor rather than an absolute defense. The nuisance-per-se choice is wrong because a lawful farm is not a nuisance per se; the family must prove a substantial and unreasonable interference. The physical-invasion choice is wrong because nuisance does not require a tangible physical invasion; odors, noise, and light can be actionable (and a physical-invasion requirement belongs to trespass).","topic":"Torts > Nuisance > Private nuisance > Coming to the nuisance","batch":1,"status":"approved"},
{"id":"torts_b1_06","s":"torts","q":"An owner’s remote, unoccupied hunting cabin had been broken into several times. He rigged a spring gun inside the door, aimed at leg level, that fired when the door was opened. A trespasser broke in intending to steal some antique bottles and was shot in the leg. The trespasser sued the owner for battery. Who is likely to prevail?","o":["The owner, because the trespasser was committing a crime when he was injured, and a person engaged in a crime cannot recover for injuries suffered while committing it.","The trespasser, because an owner may not use deadly force, including a mechanical device, merely to protect property.","The owner, because he had posted no-trespassing signs and the trespasser knowingly assumed the risk of entering the cabin.","The trespasser, but only in negligence, because the owner did not intend to injure any particular person and therefore lacked the intent required for battery."],"a":1,"e":"A possessor may use reasonable force to defend property but may not use force likely to cause death or serious bodily harm solely to protect property, and may not do indirectly by a mechanical device what he could not do in person (Katko v. Briney). Because the cabin was unoccupied, no one’s safety was threatened. The trespasser’s own crime may expose him to prosecution, but it does not privilege the owner’s use of deadly force. Why the other choices are wrong: The criminal-plaintiff choice is wrong because the plaintiff’s wrongdoing does not create a privilege to use deadly force against him. The assumption-of-risk choice relies on facts not given (no signs or warning of the gun are mentioned), and a warning still would not make deadly force against a property intruder lawful. The negligence-only choice is wrong because battery requires intent to cause a harmful or offensive contact, not intent to harm a known person; setting the gun to strike whoever entered satisfies intent.","topic":"Torts > Intentional torts > Defenses > Defense of property (mechanical devices)","batch":1,"status":"approved"},
{"id":"torts_b1_07","s":"torts","q":"A local newspaper falsely reported that a dentist in private practice was under investigation for insurance fraud. The reporter relied on a single unverified tip and made no effort to confirm it; a single phone call would have revealed the tip was false. The reporter did not know the statement was false and had no serious doubts about it. The dentist, a private figure, proved that he lost patients and income worth $40,000. What may he recover?","o":["Nothing, because a defamation plaintiff must prove actual malice whenever the statement concerns a matter of public concern.","Presumed and punitive damages, because a false accusation of crime is defamatory per se, and no proof of fault is required.","His proven actual damages, but not presumed or punitive damages.","Nothing, because a report that someone is under investigation is a statement of opinion and is absolutely protected by the First Amendment."],"a":2,"e":"Under Gertz v. Robert Welch, Inc., a private-figure plaintiff suing over a statement on a matter of public concern must prove at least negligence about the statement’s falsity and may recover only actual damages. Presumed and punitive damages require actual malice (knowledge of falsity or reckless disregard for the truth). The reporter was negligent but did not act with actual malice. Why the other choices are wrong: The actual-malice choice applies the New York Times standard, which governs public officials and public figures, not private figures. The per-se choice is wrong because, after Gertz, a media defendant’s fault must be proven, and presumed or punitive damages on a matter of public concern require actual malice. The opinion choice is wrong because saying someone is under investigation is a verifiable assertion of fact, not protected opinion (Milkovich v. Lorain Journal).","topic":"Torts > Defamation > Constitutional limits > Private-figure plaintiff, matter of public concern","batch":1,"status":"approved"}
);

{"id":"civpro_b2_01","s":"civpro","q":"A Florida citizen sued a Georgia corporation in federal court in Georgia for $500,000 on a state-law breach-of-warranty claim, invoking diversity jurisdiction. The plaintiff served the corporation by delivering the summons and complaint to its registered agent, as Federal Rule of Civil Procedure 4(h) permits. A Georgia statute also requires that, in suits against corporations, a copy of the summons be mailed to the corporation’s president, and Georgia state courts dismiss actions in which that is not done. The corporation moves to dismiss for insufficient service, relying on the Georgia statute. How should the court rule?","o":["Deny the motion, because a valid Federal Rule that directly covers the question controls in federal court, even though state law differs.","Grant the motion, because under Erie a federal court sitting in diversity must apply any state rule that could affect the outcome of the case.","Grant the motion, because service of process is substantive for Erie purposes whenever the state courts would dismiss for noncompliance.","Deny the motion, because state procedural statutes never apply in a federal court, whether or not a Federal Rule addresses the issue."],"a":0,"e":"When a Federal Rule of Civil Procedure is broad enough to cover the issue and directly collides with state law, the federal court applies the Federal Rule, provided the Rule is valid under the Rules Enabling Act (it really regulates procedure and does not abridge, enlarge, or modify a substantive right) and the Constitution. Rule 4(h) governs how a corporation is served in federal court, and it easily meets that test. The Erie outcome-determination and twin-aims analysis applies only when no Federal Rule or federal statute is on point. Why the other choices are wrong: The outcome-affecting choice describes the analysis for a pure judge-made federal practice. It does not apply when a valid Federal Rule directly governs the question. The service-is-substantive choice is wrong because the manner of serving process is procedural and is governed in federal court by Rule 4. The never-apply choice overstates the rule. When no Federal Rule covers the issue, a federal court may apply a state rule that is substantive under the Erie analysis, such as when a state statute of limitations begins to run.","topic":"Civ Pro > Law applied by federal courts > Erie doctrine > Federal Rule versus conflicting state law (Hanna)","batch":2,"status":"approved"},
{"id":"civpro_b2_02","s":"civpro","q":"An Ohio citizen sued a Texas manufacturer in the federal district court for the Northern District of Ohio, where venue and personal jurisdiction were proper, on a state-law product-liability claim. Ohio’s choice-of-law rules point to Ohio law, which favors the plaintiff. Because most witnesses and documents are in Texas, the defendant moved under 28 U.S.C. §1404(a) to transfer the case to the Southern District of Texas, whose state choice-of-law rules would point to Texas law. The court granted the motion. Which state’s choice-of-law rules will the Texas federal court apply?","o":["Texas’s, because a federal court hearing a diversity case applies the choice-of-law rules of the state in which it sits.","Ohio’s, because after a §1404(a) transfer from a proper venue, the transferee court applies the transferor state’s law.","Neither state’s, because after a transfer between districts, the federal court applies federal common-law choice-of-law principles.","Ohio’s, but only because the defendant rather than the plaintiff moved for the transfer to the Texas court."],"a":1,"e":"A federal court in a diversity case ordinarily applies the choice-of-law rules of the state where it sits. But when a case filed in a proper venue is transferred under §1404(a) for convenience, the law travels with the case: the transferee court applies the state law, including the choice-of-law rules, that the transferor court would have applied. This keeps a transfer from changing the governing law. The rule applies whether the defendant or the plaintiff moved for transfer. By contrast, after a transfer from an improper venue under §1406, the transferee court applies its own state’s rules. Why the other choices are wrong: The forum-state choice states the general rule but misses the exception: after a §1404(a) transfer, the transferee court applies the transferor state’s rules. The federal-common-law choice is wrong because there is no general federal common law of choice of law in diversity cases. A federal court applies a state’s choice-of-law rules. The defendant-moved choice is wrong because the transferor’s law applies even when the plaintiff is the one who seeks the §1404(a) transfer.","topic":"Civ Pro > Jurisdiction and venue > Venue > Transfer under §1404(a) and choice of law","batch":2,"status":"approved"},
{"id":"civpro_b2_03","s":"civpro","q":"A homeowner sued a roofing company for negligence, alleging that a roof it installed leaked because of improper installation and damaged her home. After discovery closed, the company moved for summary judgment, pointing out that the homeowner had disclosed no expert and had produced no evidence that the leak resulted from improper installation rather than storm damage. The company submitted no affidavits of its own. In response, the homeowner relied only on the allegations in her complaint. How should the court rule?","o":["Deny the motion, because a party moving for summary judgment must submit affidavits or other evidence that negates the opposing party’s claim.","Deny the motion, because the factual allegations in a complaint are enough by themselves to create a genuine dispute of material fact.","Grant the motion, because the company showed an absence of evidence on an element the homeowner must prove, and she identified none.","Deny the motion, because causation is a question of fact that only a jury may decide in a negligence case."],"a":2,"e":"A party moving for summary judgment on a claim that the opponent must prove at trial need not offer evidence negating the claim. It may meet its initial burden by pointing out that the opponent lacks evidence to support an essential element. The burden then shifts to the nonmoving party to identify specific facts in the record, such as depositions, documents, or affidavits, showing a genuine dispute for trial. The homeowner could not rest on her pleadings, and she pointed to no evidence of causation. Why the other choices are wrong: The must-negate choice is wrong because a moving party that does not bear the burden of proof may simply show that the opponent has no evidence on an essential element. The allegations choice is wrong because a party opposing a properly supported motion may not rest on its pleadings. It must cite evidence in the record. The jury-only choice is wrong because a court may decide causation as a matter of law when the record contains no evidence from which a reasonable jury could find it.","topic":"Civ Pro > Pretrial procedures > Adjudication without trial > Summary judgment burdens (party without burden of proof)","batch":2,"status":"approved"},
{"id":"civpro_b2_04","s":"civpro","q":"After a bench trial in a breach-of-contract case, the judge found, based mainly on her assessment of two witnesses who gave conflicting accounts, that the parties had orally agreed to extend the delivery deadline. She entered judgment for the seller. The buyer appeals, arguing that the evidence more strongly supported the buyer’s version of the conversation. What standard will the court of appeals apply to the finding about the oral agreement?","o":["It will review the finding de novo, because a bench trial produces no jury verdict, so the finding is not entitled to any deference.","It will review the finding for abuse of discretion, the standard that applies to every ruling a trial judge makes without a jury.","It will set the finding aside only if it is clearly erroneous, deferring to the judge’s view of credibility.","It will reverse if, after weighing the record itself, it concludes that the preponderance of the evidence favors the buyer."],"a":2,"e":"Under Rule 52(a)(6), findings of fact in a bench trial, whether based on oral or documentary evidence, must not be set aside unless clearly erroneous, and the reviewing court must give due regard to the trial court’s opportunity to judge the witnesses’ credibility. A finding is clearly erroneous only when the appellate court is left with a definite and firm conviction that a mistake was made. If two permissible views of the evidence exist, the trial judge’s choice between them cannot be clearly erroneous. Conclusions of law, by contrast, are reviewed de novo. Why the other choices are wrong: The de novo choice applies the standard for conclusions of law. A trial judge’s findings of fact receive clear-error deference. The abuse-of-discretion choice is wrong because that standard governs discretionary rulings, such as most evidentiary and case-management decisions, not findings of fact. The reweigh-the-record choice is wrong because an appellate court does not independently decide which side the evidence favors. It asks only whether the finding is clearly erroneous.","topic":"Civ Pro > Appealability and review > Standards of review > Findings of fact after a bench trial (clear error)","batch":2,"status":"approved"},
{"id":"civpro_b2_05","s":"civpro","q":"In an employment-discrimination suit, the employer’s manager deleted relevant text messages after the employer was on notice of the litigation, and the messages cannot be restored or replaced through other discovery. The court finds that the manager acted negligently, not with intent to deprive the employee of the information, and that the loss prejudiced the employee. The employee asks the court to instruct the jury that it must presume the lost messages were unfavorable to the employer. Should the court give this instruction?","o":["No, because that instruction requires a finding that the employer acted with intent to deprive the employee of the information.","Yes, because the employer failed to take reasonable steps to preserve the messages after it should have anticipated the litigation.","Yes, because prejudice to the opposing party is enough to support whatever sanction the court finds appropriate.","No, because discovery sanctions are available only after a party has violated a court order compelling discovery."],"a":0,"e":"Rule 37(e) governs electronically stored information that should have been preserved but was lost because a party failed to take reasonable steps, and that cannot be restored or replaced. On a finding of prejudice, the court may order measures no greater than necessary to cure the prejudice, such as letting the parties present evidence and argument about the loss. Only on a finding that the party acted with intent to deprive another party of the information may the court presume the information was unfavorable, instruct the jury that it may or must so presume, or dismiss the action or enter a default judgment. Why the other choices are wrong: The failed-to-preserve choice is wrong because a failure to take reasonable steps triggers Rule 37(e), but an adverse-inference instruction also requires intent to deprive. The prejudice-is-enough choice is wrong because prejudice alone permits only curative measures no greater than necessary, not a presumption that the information was unfavorable. The court-order choice is wrong because Rule 37(e) authorizes measures for lost electronically stored information without any prior order to compel.","topic":"Civ Pro > Pretrial procedures > Discovery > Sanctions for lost electronically stored information (Rule 37(e))","batch":2,"status":"approved"},
{"id":"civpro_b2_06","s":"civpro","q":"A buyer sued a seller in federal court, invoking diversity jurisdiction, seeking rescission of a contract under which the seller and his business partner jointly sold the buyer an apartment building. The partner signed the contract and would have to return his share of the sale proceeds if rescission were granted. The partner is a citizen of the same state as the buyer, so joining him would destroy complete diversity. What should the court do?","o":["Order the partner joined as a defendant and exercise supplemental jurisdiction over the buyer’s claim against him.","Proceed without the partner, because only parties are bound by a judgment, so a judgment cannot harm him.","Decide whether, in equity and good conscience, the case should proceed without the partner or be dismissed.","Dismiss the action at once, because a court may never proceed when a required party cannot be joined."],"a":2,"e":"The partner is a required party under Rule 19(a): he claims an interest in the subject of the action, and resolving the case without him may impair his ability to protect it. Because joining him would destroy diversity, joinder is not feasible. Under Rule 19(b) the court must then decide whether, in equity and good conscience, the action should proceed among the existing parties or be dismissed. It considers the prejudice to the absent party and the existing parties, whether relief can be shaped to lessen that prejudice, whether a judgment without him would be adequate, and whether the plaintiff would have an adequate remedy if the case were dismissed. Why the other choices are wrong: The supplemental-jurisdiction choice is wrong because 28 U.S.C. §1367(b) bars supplemental jurisdiction over claims by plaintiffs against persons made parties under Rule 19 in diversity cases. The not-bound choice is wrong because Rule 19 asks whether disposing of the case may, as a practical matter, impair the absent party’s interest, not just whether he is legally bound. The automatic-dismissal choice is wrong because Rule 19(b) calls for a pragmatic balancing. A court may proceed without a required party when equity and good conscience allow.","topic":"Civ Pro > Pretrial procedures > Joinder > Required parties when joinder is not feasible (Rule 19)","batch":2,"status":"approved"},
{"id":"civpro_b2_07","s":"civpro","q":"A defendant believed that the plaintiff’s complaint asserted a claim that was not warranted by existing law or by a nonfrivolous argument for changing it. The same day the complaint was served, the defendant filed a motion for Rule 11 sanctions with the court, without first serving the motion on the plaintiff. Two weeks later, the plaintiff voluntarily withdrew the challenged claim. Should the court grant the defendant’s motion?","o":["Yes, because withdrawing the claim after the sanctions motion was filed is an admission that the claim was frivolous.","Yes, because Rule 11 requires the court to impose a sanction whenever a pleading lacks a legal basis, whatever happens later.","No, because Rule 11 sanctions may be imposed only on the court’s own initiative, never on a party’s motion.","No, because a party must serve a sanctions motion 21 days before filing it, giving the opponent a chance to withdraw."],"a":3,"e":"Rule 11(c)(2) contains a safe harbor: a motion for sanctions must be made separately, must be served on the opposing party, and must not be filed with the court if the challenged paper is withdrawn or appropriately corrected within 21 days after service. The defendant skipped the safe-harbor step, and the plaintiff withdrew the claim anyway, so the motion should be denied. Even when Rule 11 is violated, sanctions are discretionary (the court may impose them), and they must be limited to what suffices to deter repetition. Why the other choices are wrong: The admission choice is wrong because withdrawal is exactly what the safe harbor is meant to encourage, and it is not treated as a concession that sanctions are warranted. The mandatory-sanction choice is wrong because Rule 11 says the court may impose a sanction after notice and a reasonable opportunity to respond. Sanctions are discretionary. The court-only choice is wrong because Rule 11 allows sanctions either on a party’s motion (after the safe harbor) or on the court’s own initiative.","topic":"Civ Pro > Pretrial procedures > Rule 11 sanctions > Safe-harbor requirement for a party’s motion","batch":2,"status":"approved"},
