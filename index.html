lso directly liable for negligent hiring or retention if it knew or should have known the employee posed an unreasonable risk of the type of harm that occurred. PizzaCo hired Dina for a driving job knowing of three recent speeding tickets. Paul must also show that the known risk (unsafe driving) caused the harm; PizzaCo will argue speeding is different from texting, but both reflect unsafe driving habits, making this a jury question.\n\n3. Paul’s jaywalking. Paul’s crossing outside a crosswalk in violation of an ordinance may itself be negligence per se (if the ordinance aims to protect pedestrians from vehicles) or at least evidence of negligence. Most jurisdictions apply comparative fault. Under pure comparative fault, Paul’s damages are reduced by his percentage of fault, however large. Under modified comparative fault (the majority of states), Paul recovers reduced damages unless his fault exceeds the threshold. Ohio note: R.C. 2315.33 says a plaintiff’s contributory fault does not bar recovery “if the contributory fault of the plaintiff was not greater than the combined tortious conduct of all other persons from whom the plaintiff seeks recovery in this action and of all other persons from whom the plaintiff does not seek recovery in this action,” and the court diminishes the damages by the plaintiff’s percentage. Under R.C. 2315.35, if the plaintiff’s percentage “is greater than the sum of the percentages of the tortious conduct determined to be attributable to all parties to the tort action from whom the plaintiff seeks recovery plus all persons from whom the plaintiff does not seek recovery in this action,” judgment is entered for the defendants. So Paul’s fault is measured against the combined tortious conduct of Dina, PizzaCo (for its own negligent hiring), and nonparties such as the surgeon. Defendants raise a nonparty’s share as an affirmative defense under R.C. 2307.23(C), and all percentages must total 100%. Given Dina’s texting, a jury is unlikely to find Paul primarily at fault. In the few contributory-negligence jurisdictions, any negligence by Paul would bar recovery, unless last clear chance applied. Dina and PizzaCo would be jointly and severally liable (or severally liable for their shares, depending on the jurisdiction’s rule), with PizzaCo entitled to indemnity from Dina for vicarious liability. Ohio note: under R.C. 2307.22, a defendant found responsible for more than 50% of the tortious conduct is jointly and severally liable for all compensatory damages that represent economic loss. A defendant at 50% or less is liable only for its proportionate share of economic damages. Every defendant is liable only for its proportionate share of noneconomic damages. Exceptions: (1) a defendant at 50% or less against whom an intentional tort claim is alleged and established is jointly and severally liable for economic damages (R.C. 2307.22(A)(3)); (2) statutes that expressly impose joint and several liability control (R.C. 2307.22(A) cites 2307.70(B), 4507.07(B), and 4399.02); and (3) R.C. 2307.24 leaves non-tort joint liability and vicarious liability untouched, and it treats a principal and agent (e.g., PizzaCo and Dina, as to respondeat superior) as a single party when percentages are calculated."},
{id:"e_agency",s:"ba",title:"Feast Catering (Agency & Partnership)",
facts:"Ann, Bob, and Cal began operating a catering business called Feast Catering three years ago. They have no written agreement and have never filed any document with the state. Each contributed $10,000, works full-time in the business, and takes one-third of the profits.\n\nLast month, the three partners voted 2–1 (Bob dissenting) not to buy new ovens. Bob nonetheless signed a contract on behalf of Feast Catering to buy $50,000 of commercial ovens from Vendor. Vendor did not know of the vote. Feast Catering has refused to pay.\n\nLast week, while delivering food for an event in Feast Catering’s van, Cal negligently struck a cyclist, who suffered $200,000 in damages. Feast Catering’s assets total $80,000.\n\nAnn has secretly begun a separate catering business, using Feast Catering’s client list, and has diverted two large wedding contracts to it.",
call:["1. What type of business entity is Feast Catering? Explain.","2. Is Feast Catering bound by the oven contract? Explain.","3. Who is liable to the cyclist, and to what extent? Explain.","4. Has Ann breached any duty? Explain."],
issues:[["General partnership formed: association of 2+ persons to carry on as co-owners a business for profit; intent and filing unnecessary; profit sharing presumption",1.5,"e_agency.0"],["Each partner is an agent; act apparently carrying on ordinary course binds partnership unless third party knew/had notice of lack of authority (RUPA §301)",1.5,"e_agency.1"],["Bob lacked actual authority (majority vote on ordinary matter) but had apparent authority — buying equipment is ordinary course; Vendor unaware → partnership bound; Bob may be liable to partnership",1.5,"e_agency.2"],["Partnership liable for partner’s torts in ordinary course of business (RUPA §305); Cal personally liable as tortfeasor",1.5,"e_agency.3"],["All partners jointly and severally liable for partnership obligations; creditor generally must exhaust partnership assets first ($80,000) before reaching Ann’s and Bob’s personal assets",1.5,"e_agency.4"],["Ann breached duty of loyalty: competing with partnership before dissolution; usurping partnership opportunities; using partnership property (client list)",1.5,"e_agency.5"],["Remedies: account for profits, damages; possible wrongful dissociation/expulsion",1,"e_agency.6"],["Internal allocation of the tort loss: partnership must indemnify Cal for ordinary-course liability (RUPA §401(c)); ordinary negligence does not breach the duty of care (§409(c): gross negligence, recklessness, intentional misconduct, knowing violation of law) → $200,000 is a partnership loss shared like profits — one-third each (§401(b))",1,"e_agency.7"]],
model:"1. Entity. Under the Revised Uniform Partnership Act (RUPA), the association of two or more persons to carry on as co-owners a business for profit forms a partnership, whether or not the persons intend to form one. No filing is required. Ann, Bob, and Cal each contributed capital, work in and manage the business, and share profits equally; a person who receives a share of profits is presumed to be a partner. Feast Catering is a general partnership. Because they never filed a statement of qualification, it is not an LLP.\n\n2. Oven contract. Each partner is an agent of the partnership for the purpose of its business. An act of a partner for apparently carrying on in the ordinary course the partnership business, or business of the kind carried on by the partnership, binds the partnership unless the partner had no authority and the third party knew or had notice of the lack of authority (RUPA §301). Matters in the ordinary course are decided by a majority of the partners; the 2–1 vote stripped Bob of actual authority to buy ovens. But buying cooking equipment is apparently in the ordinary course of a catering business, and Vendor did not know of the vote or the restriction, and no statement of partnership authority limiting Bob’s authority was filed. Bob therefore had apparent authority, and Feast Catering is bound. Because Bob acted in violation of the partners’ decision, he may be liable to the partnership for resulting losses.\n\n3. Liability to the cyclist. A partnership is liable for loss or injury caused by a partner’s wrongful act or omission while acting in the ordinary course of the partnership business (RUPA §305). Cal was delivering food for an event in the partnership’s van — squarely within the business. Feast Catering is liable for the $200,000. Cal is personally liable as the tortfeasor. In addition, all partners are jointly and severally liable for all obligations of the partnership (RUPA §306). Under RUPA §307, however, a judgment creditor generally must first obtain a judgment against the partnership and the partner and exhaust partnership assets before levying on a partner’s personal assets. The cyclist may reach the partnership’s $80,000 first, then collect the remaining $120,000 from Ann, Bob, or Cal personally. Among the partners, the loss is not Cal’s alone. Under RUPA §401(c), the partnership must indemnify a partner for liabilities he incurs in the ordinary course of the partnership’s business, and Cal incurred this one while making a partnership delivery. The partnership has no claim against him for breach of the duty of care. Under §409(c), that duty is limited to refraining from grossly negligent or reckless conduct, intentional misconduct, or a knowing violation of law, and Cal’s ordinary negligence in driving does not meet that standard. The $200,000 is therefore a partnership loss. Each partner is charged with losses in proportion to his or her share of profits (§401(b)), so here it is shared equally, one-third each (about $66,667), because they split profits equally and the facts show no contrary agreement. A partner who pays the cyclist more than that share may recover the excess through reimbursement, indemnification, and the partnership accounting.\n\n4. Ann’s conduct. Partners owe the partnership and each other a duty of loyalty, which includes (a) accounting for any property, profit, or benefit derived from partnership business or use of partnership property, including appropriation of a partnership opportunity; (b) refraining from dealing adversely to the partnership; and (c) refraining from competing with the partnership before dissolution (RUPA §409). Ann operates a competing catering business, used the partnership’s client list (partnership property), and diverted two wedding contracts — partnership opportunities — to herself. She breached her duty of loyalty, and also her obligation of good faith and fair dealing. The partnership may require her to account for and disgorge the profits from the diverted contracts and recover damages; her misconduct may also justify expulsion by judicial decree."},
{id:"e_corp",s:"ba",title:"Brightline Corp. (Corporations)",
facts:"Brightline Corp., a Franklin corporation, manufactures LED fixtures. Its stock is held by 12 shareholders. Its five-member board consists of CEO Carla (who owns 40% of the shares), two of Carla’s longtime golf partners, and two independent directors. Franklin has adopted the Model Business Corporation Act.\n\nCarla personally owns a warehouse. At a board meeting, Carla proposed that Brightline buy the warehouse for $3 million. She did not disclose that she owned it through a wholly owned LLC, or that an appraisal she had obtained valued it at $2 million. After a 10-minute discussion, the board approved the purchase 3–2, with Carla and her two golf partners voting yes and both independent directors voting no.\n\nShareholder Sam, who has owned 5% of Brightline’s stock for six years, believes the purchase was improper and wants to sue. Separately, a supplier owed $400,000 by Brightline wants to hold Carla personally liable, pointing out that Brightline has observed all corporate formalities and is adequately capitalized, but that Carla is its largest shareholder.",
call:["1. Did Carla breach any duty to Brightline in connection with the warehouse purchase? Explain.","2. What procedural steps must Sam take to sue, and what kind of action is it? Explain.","3. Can the supplier hold Carla personally liable for the $400,000? Explain."],
issues:[["Duty of loyalty: director’s conflicting-interest transaction (Carla on other side through her LLC)",1.5,"e_corp.0"],["MBCA safe harbor: approval by majority of qualified (disinterested) directors after required disclosure, OR disinterested shareholders, OR fairness",1.5,"e_corp.1"],["No disclosure of interest or appraisal; Carla and possibly golf partners not qualified directors; both qualified independents voted no → no safe harbor",1.5,"e_corp.2"],["Fairness: price $1M above appraisal → unfair; BJR does not protect conflicted transaction; also duty of care (10-minute uninformed decision)",1.5,"e_corp.3"],["Derivative (harm to corporation; recovery to corporation); contemporaneous ownership; fairly and adequately represents",1,"e_corp.4"],["MBCA universal demand: written demand on board; wait 90 days unless rejected earlier or irreparable injury",1.5,"e_corp.5"],["Veil piercing requires abuse of corporate form (commingling, undercapitalization, fraud); mere controlling shareholder status insufficient → Carla not personally liable",1.5,"e_corp.6"]],
model:"1. Carla’s duty of loyalty. Directors owe a duty of loyalty, which requires them to act in good faith in the corporation’s best interests rather than their own. Under MBCA Subchapter F, a director’s conflicting-interest transaction is one in which the director (or a related person/entity) is a party or has a material financial interest. Carla, through her wholly owned LLC, was the seller, so the purchase is a director’s conflicting-interest transaction. The transaction may not be challenged on the ground of Carla’s interest if (a) it was approved by a majority (but at least two) of qualified directors after the required disclosure — the existence and nature of the conflict and all facts known to the director that a director free of the conflict would reasonably believe material; (b) it was approved by a majority of votes cast by disinterested shareholders after disclosure; or (c) it was fair to the corporation at the relevant time. None applies. Carla disclosed neither her ownership nor the $2 million appraisal — clearly material facts. The only votes in favor came from Carla, who is conflicted, and her golf partners, whose close personal relationships with her likely make them not “qualified” directors; the two plainly disinterested directors voted no. No shareholder vote occurred. Finally, paying $3 million for property appraised at $2 million is not fair in price, and the process — nondisclosure and a 10-minute discussion — was not fair either. The business judgment rule does not shield an interested transaction. Carla breached her duty of loyalty and is liable to Brightline for its loss (at least the $1 million overpayment), or the transaction may be rescinded. The directors who approved the purchase without adequate information may also have breached their duty of care, though exculpation provisions may limit monetary liability for care violations (not for Carla’s improper financial benefit).\n\n2. Sam’s suit. The harm — overpayment for a corporate asset — was suffered by Brightline, so the claim belongs to the corporation and must be brought as a derivative suit; any recovery goes to Brightline. Under the MBCA, a shareholder may bring a derivative proceeding only if the shareholder was a shareholder when the challenged transaction occurred (Sam has held shares for six years) and fairly and adequately represents the corporation’s interests. The MBCA imposes a universal demand requirement: Sam must make a written demand on the board to take suitable action and then wait 90 days before filing suit, unless the board rejects the demand earlier or irreparable injury to the corporation would result from waiting. Futility does not excuse demand under the MBCA. If the board (or a committee of qualified independent directors) determines in good faith after reasonable inquiry that the suit is not in Brightline’s best interests, the court may dismiss; but here the independent directors opposed the transaction, making a vigorous pursuit of the claim plausible.\n\n3. Supplier’s claim against Carla. Shareholders are generally not personally liable for corporate debts. Courts pierce the corporate veil only when a shareholder has abused the corporate form — for example, by disregarding formalities, commingling funds, inadequately capitalizing the corporation, or using it to perpetrate fraud — such that honoring the corporate form would promote injustice. Being the largest (or even controlling) shareholder is not enough. Brightline observes formalities and is adequately capitalized, and nothing suggests Carla used it to defraud creditors. The supplier cannot hold Carla personally liable for the $400,000 contract debt. (Carla’s breach of loyalty is owed to the corporation and is remedied through the derivative suit, not directly to creditors.)"}
];

["Read the task memo first — twice","The task memo tells you the audience, the type of document, the issues to address, and any formatting instructions. Following instructions is heavily weighted. Note whether the tone is objective (memo to partner, client letter) or persuasive (brief, demand letter)."],

["Apply facts to rules — that is the grade","Graders reward organized analysis: rule (with citations to Library cases), comparison of your facts to precedent facts, counterarguments (in objective tasks), and conclusion. Cite the Library authority you rely on."],

["Don’t bring in outside law","The MPT tests lawyering skills using the provided materials. Use only the Library law unless the instructions say otherwise, even if you know a different rule."],

// NCBE: "From July 2026 through February 2028, both Family Law and Trusts and Estates will be tested regularly
// through the Multistate Performance Test." Source: https://www.ncbex.org/exams/mee/preparing-mee (checked Oct 1, 2026).
const MPT_SOURCE = {url:'https://www.ncbex.org/exams/mee/preparing-mee', url2:'https://help.ncbex.org/hc/en-us/articles/39895955991707',
 text:'Effective with the July 2026 exam, NCBE removed Conflict of Laws, Family Law, Trusts and Estates, and Secured Transactions from the MEE. NCBE says that from July 2026 through February 2028, both Family Law and Trusts and Estates will be tested regularly through the MPT. That window covers the February 2027 exam.'};
const MPT_PRIMERS = [
{title:'Family Law primer', items:[
["Marriage: validity and annulment","Usual requirements: a license, solemnization, capacity, and consent. A party cannot already be married (a bigamous marriage is void) or be within a prohibited degree of kinship, and must meet the minimum age. Void and voidable marriages can be annulled; voidable ones (e.g., fraud going to the essence, or nonage) can be ratified. Only a minority of states still allow common-law marriages to be formed, but most states recognize one validly formed where the couple lived. Same-sex couples have a constitutional right to marry (Obergefell v. Hodges, 2015)."],
["Premarital (prenuptial) agreements","Must be in writing and signed by both parties. Under the Uniform Premarital Agreement Act, an agreement is unenforceable if the challenger proves either (1) they did not sign voluntarily, or (2) it was unconscionable when signed AND, before signing, they did not get fair and reasonable disclosure of the other party’s property and obligations, did not voluntarily waive that disclosure in writing, and did not have adequate knowledge of it. Many states add more: independent counsel, time to review before the wedding, or fairness at enforcement. A child’s right to support cannot be adversely affected. Expect the Library to supply the specific test."],
["Divorce grounds","Every state allows no-fault divorce, based on irretrievable breakdown or irreconcilable differences, or living separate and apart for a statutory period. Some states keep fault grounds (adultery, cruelty, desertion), and fault may still affect alimony or property division in some states."],
["Property division","Most states divide marital property by equitable distribution (fair, not necessarily equal). A minority are community-property states. Marital or community property is generally whatever either spouse acquired during the marriage. Separate property is what a spouse owned before the marriage or received by gift or inheritance, plus its traceable proceeds. Common MPT issues: classification, commingling and transmutation, tracing, appreciation of separate property caused by marital effort or funds, pensions and businesses partly earned during the marriage, and statutory factors (length of the marriage, contributions including homemaking, each spouse’s economic circumstances)."],
["Spousal support (alimony / maintenance)","Based on one spouse’s need and the other’s ability to pay. Typical factors: length of the marriage, standard of living during the marriage, age and health, earning capacity, contributions to the other’s career or education, and the property division. Types: temporary (while the case is pending), rehabilitative, durational/limited, and permanent/indefinite. Usually modifiable on a substantial change in circumstances unless the parties validly agreed otherwise. Usually ends on either party’s death or the recipient’s remarriage, and sometimes on cohabitation."],
["Child custody and jurisdiction","The standard is the best interests of the child. Legal custody means decision-making; physical custody means where the child lives; either can be joint or sole. Common factors: each parent’s relationship with the child and caregiving history, stability, the child’s preference (weighted by maturity), each parent’s willingness to support the child’s relationship with the other parent, and domestic violence. Modification usually requires a substantial (material) change in circumstances plus best interests. Relocation cases apply statutory notice requirements and factor tests. Interstate jurisdiction falls under the UCCJEA. The child’s home state has priority, meaning the state where the child lived with a parent for 6 consecutive months immediately before the case was filed. The state that made the initial custody decision generally keeps exclusive, continuing jurisdiction."],
["Child support","Both parents owe a duty of support. State guidelines produce a presumptively correct amount, and departures require findings. Parents cannot bargain away a child’s right to support. Support can be modified on a substantial change in circumstances, but generally only going forward: each past-due installment becomes a vested judgment that cannot be retroactively modified (federal Bradley Amendment). Interstate support falls under UIFSA, under which the issuing state generally keeps continuing, exclusive jurisdiction to modify its order while a party or the child still lives there."],
["Parents’ constitutional rights; parentage","Fit parents have a fundamental liberty interest in the care, custody, and control of their children. Courts must give special weight to a fit parent’s decision about third-party (e.g., grandparent) visitation (Troxel v. Granville, 2000). Terminating parental rights requires at least clear and convincing evidence (Santosky v. Kramer, 1982). An unmarried father’s protection depends largely on whether he has established an actual relationship with the child (Lehr v. Robertson, 1983). Parentage can be established by the marital presumption, acknowledgment, genetic testing, or adjudication, and in many states it also covers assisted reproduction."],
["Agreements, protection orders, and enforcement","Separation and settlement agreements are generally enforceable if they were entered voluntarily with disclosure and are not unconscionable. Terms about custody and child support always remain subject to the court’s best-interests review. Also expect civil protection orders for domestic violence and contempt or other enforcement remedies."]
]},
{title:'Trusts & Estates primer', items:[
["Intestate succession","The surviving spouse takes a statutory share. Under the UPC, the spouse takes the whole estate if all of the decedent’s descendants are also the spouse’s and the spouse has no other descendants; otherwise the share is smaller. The rest goes to descendants, then parents, then parents’ descendants (collaterals). Shares among descendants are split by strict per stirpes, modern per stirpes (per capita with representation), or per capita at each generation (UPC). Adopted children inherit like biological children. Many statutes require an heir to survive the decedent by 120 hours. Advancements and disclaimers are also tested."],
["Will execution and capacity","Typical formalities: a writing, the testator’s signature (or another person’s signature at the testator’s direction and in their presence), and attestation by two witnesses. Presence and timing rules vary by state. Testamentary capacity is judged at execution: the testator must understand the nature of the act, the nature and extent of the property, the natural objects of their bounty, and the plan of disposition. About half the states accept holographic wills (signature and material provisions in the testator’s handwriting). The UPC harmless-error rule (§2-503) can validate a defectively executed document if clear and convincing evidence shows the decedent intended it as a will. A self-proving affidavit removes the need for witness testimony at probate. Interested-witness rules vary: some states purge the witness’s excess gift; the UPC gives no effect."],
["Revocation and revival","A will can be revoked (1) by a later will or codicil, expressly or by inconsistency, or (2) by a physical act (burning, tearing, canceling, destroying) done with intent to revoke. Dependent relative revocation lets a court disregard a revocation made on a mistaken assumption, such as that a new will is valid. Revival of an earlier revoked will depends on state law and the testator’s intent. By operation of law, divorce revokes will provisions for the former spouse. Under the UPC, it also revokes nonprobate designations and gifts to the ex-spouse’s relatives."],
["Construction problems","Lapse: a gift fails if the beneficiary dies before the testator, unless an anti-lapse statute substitutes the beneficiary’s descendants (usually only for gifts to certain relatives) or the will provides otherwise. Class gifts follow their own rules. Ademption by extinction: a specific gift no longer in the estate fails under the identity theory, which the UPC softens. Ademption by satisfaction is a lifetime gift meant to count against a will gift. Abatement order to pay debts: intestate property, then residuary, then general, then specific gifts. Also watch for incorporation by reference, acts of independent significance, and omitted (pretermitted) child and omitted spouse statutes."],
["Will contests","Grounds: lack of capacity; undue influence; fraud (in the execution or in the inducement); duress; and mistake (limited relief). Undue influence is influence that overcomes the testator’s free will. Elements are often susceptibility, opportunity, disposition to exert influence, and a result reflecting it. A presumption often arises from a confidential relationship plus the beneficiary’s active participation in procuring the will, and it shifts the burden to the proponent. No-contest (in terrorem) clauses are often not enforced when the contestant had probable cause (UPC)."],
["Spousal protections and nonprobate transfers","Instead of taking under the will, a surviving spouse may elect a statutory share. Traditionally that is one-third. The UPC instead uses a percentage of the augmented estate, which reaches many nonprobate transfers and grows with the length of the marriage. Community-property states take a different approach. There may also be homestead, exempt-property, and family-allowance rights. Nonprobate assets pass outside the will: joint tenancy with right of survivorship, POD/TOD accounts and deeds, life insurance and retirement-account beneficiary designations, and revocable trust property."],
["Creating an express trust","Requirements: a settlor with capacity and intent to create a trust; trust property (the res); ascertainable beneficiaries (except charitable trusts and permitted purpose trusts); and a lawful purpose. A trust will not fail for lack of a trustee; the court appoints one. A writing is required for land (Statute of Frauds) and for testamentary trusts (Wills Act formalities). A pour-over to a revocable trust is valid (UTATA). Revocability: at common law a trust is irrevocable unless the power to revoke is reserved. The Uniform Trust Code (§602) flips the default, so a trust is revocable unless its terms say otherwise (for trusts created after the state adopted the UTC)."],
["Trustee duties","Loyalty: no self-dealing. Under the no-further-inquiry rule, a self-dealing transaction can be voided by the beneficiaries regardless of fairness unless the trust terms, the beneficiaries’ informed consent, or the court authorized it. Conflict-of-interest transactions are presumed voidable. Prudence: the prudent investor rule judges investments in the context of the whole portfolio and requires diversification absent special circumstances. Impartiality between income and remainder beneficiaries. Duties to inform and account, to keep trust property separate and not commingle it, to administer the trust according to its terms, and not to delegate improperly. Remedies: surcharge (damages), removal, voiding transactions, and tracing."],
["Spendthrift and discretionary trusts","A spendthrift clause bars both voluntary and involuntary transfers of a beneficiary’s interest, so creditors cannot reach it until it is distributed. The UTC makes exceptions, e.g., for a beneficiary’s child or spouse seeking support and for certain government claims. In most states, a settlor cannot shield assets from their own creditors through a self-settled trust. Discretionary trusts may have standards such as health, education, maintenance, and support. A trustee must exercise discretion in good faith and in line with the trust’s purposes, and a court will not interfere absent abuse."],
["Charitable trusts; modification and termination","A charitable trust needs a charitable purpose and can last indefinitely. The state attorney general (and in some states the settlor) can enforce it. Under cy pres, if a specific charitable purpose becomes impossible, impracticable, or illegal (under the UTC, also wasteful), the court may redirect the trust to a similar purpose that fits the settlor’s general charitable intent. Private trusts: under the Claflin doctrine, beneficiaries can terminate a trust only if all consent and termination would not defeat a material purpose. The UTC allows modification or termination with the consent of the settlor and all beneficiaries, and lets a court modify a trust when circumstances the settlor did not anticipate arise."],
["Related documents that show up in T&E files","Durable powers of attorney: the agent’s authority survives the principal’s incapacity, and the agent owes fiduciary duties. Health-care directives and living wills. Trust-administration letters and fiduciary accountings."]
]}
];
