{"id":"crim_7","s":"crim","q":"Police received a reliable informant’s detailed tip, corroborated by surveillance, that drugs were hidden in a car parked on a public street. Without a warrant, officers searched the car, including the trunk and a closed backpack inside the trunk, finding drugs. The search was:","o":["Invalid, because the car was parked and unoccupied on a public street, so the officers had time to get a warrant.","Invalid as to the backpack, because a closed container found in a car requires a separate warrant.","Valid, because probable cause justified searching the entire car and any container that could hold drugs.","Valid only as to the passenger compartment, because the trunk requires a warrant absent consent."],"a":2,"e":"Under the automobile exception, police with probable cause to believe a vehicle contains contraband may search the entire vehicle, including the trunk and any containers that may conceal the object of the search, without a warrant (U.S. v. Ross; California v. Acevedo). No exigency beyond the vehicle’s inherent mobility is required."},
{"id":"crim_8","s":"crim","q":"Police stopped a driver and arrested him for driving with a suspended license. He was handcuffed and locked in the back of a patrol car. Officers then searched the car’s passenger compartment and found a gun under the seat. On a motion to suppress the gun, the court should:","o":["Deny the motion, because police may always search a vehicle’s passenger compartment incident to an occupant’s lawful arrest.","Deny the motion, because the gun was in plain view once the officers opened the car door.","Grant the motion, because the arrestee was secured and no license-offense evidence was likely inside.","Grant the motion, because a custodial arrest for a minor traffic offense never justifies any search."],"a":2,"e":"Under Arizona v. Gant, police may search a vehicle’s passenger compartment incident to arrest only if the arrestee is unsecured and within reaching distance, or it is reasonable to believe evidence of the offense of arrest is in the vehicle. Neither applies to a secured suspended-license arrestee. (Other exceptions, like an inventory search, are not indicated by the facts.)"},
{"id":"crim_9","s":"crim","q":"A defendant was acquitted in state court of robbing a federally insured bank. A federal grand jury then indicted him for federal bank robbery based on the same conduct. He moves to dismiss on double jeopardy grounds. The motion should be:","o":["Granted, because he was already acquitted of the same conduct in the state prosecution.","Granted, because the offenses have identical elements.","Denied, because the state and federal governments are separate sovereigns.","Denied, because an acquittal does not bar reprosecution."],"a":2,"e":"Under the separate-sovereigns doctrine (reaffirmed in Gamble v. United States, 2019), the state and federal governments may each prosecute the same conduct without violating double jeopardy. An acquittal ordinarily does bar reprosecution by the same sovereign."},
{"id":"crim_10","s":"crim","q":"A defendant was formally charged with burglary and appointed counsel at arraignment. He never asked police for a lawyer during questioning. While he was in jail, detectives gave him Miranda warnings, which he waived, and questioned him about an unrelated murder. He made incriminating statements. His statements about the murder are:","o":["Inadmissible, because his Sixth Amendment right to counsel had attached when he was arraigned on the burglary charge.","Inadmissible, because police may never question a defendant who is represented by counsel on any charge.","Admissible, because the Sixth Amendment right is offense-specific and he validly waived his Miranda rights.","Admissible only if his burglary counsel consented."],"a":2,"e":"The Sixth Amendment right to counsel is offense-specific (Texas v. Cobb; McNeil v. Wisconsin), so it does not bar questioning on uncharged, unrelated offenses. Accepting appointed counsel at arraignment is not an invocation of the Miranda right to counsel. A valid Miranda waiver makes the statements admissible."},
{"id":"crim_11","s":"crim","q":"A man suddenly attacked a defendant with a knife on a public sidewalk. The defendant could have escaped safely by running into a nearby store, but instead drew a pistol and shot the attacker, killing him. In a jurisdiction following the majority rule, the defendant is:","o":["Guilty of murder, because he could have retreated safely before using deadly force.","Guilty of voluntary manslaughter, because his use of deadly force was excessive.","Not guilty, because he reasonably feared imminent death or serious harm and had no duty to retreat.","Not guilty only if the attack occurred in his own home."],"a":2,"e":"A person may use deadly force when reasonably believing it necessary to prevent imminent death or serious bodily harm. The majority rule imposes no duty to retreat before using deadly force (if the person is not the initial aggressor). The minority “retreat” rule would require safe retreat outside the home."},
{"id":"evidence_0","s":"evidence","q":"A customer sued a grocery store after slipping on spilled oil. To prove the store had notice of the spill, the customer offers testimony from another shopper that, 20 minutes before the fall, she told the store manager, “There’s oil all over the floor in aisle 5.” The store objects on hearsay grounds. The testimony is:","o":["Inadmissible hearsay, because the shopper’s out-of-court statement describes the spill.","Admissible only as a present sense impression, because the shopper described the oil as she saw it.","Admissible, because it is offered to show notice to the manager, not that oil was spilled.","Admissible only if the shopper is unavailable to testify at trial about what she saw."],"a":2,"e":"A statement offered to show its effect on the listener — here, that the manager had notice of a possible hazard — is not offered for the truth of the matter asserted and is not hearsay. (Other evidence would establish the oil was actually there.)"},
{"id":"evidence_1","s":"evidence","q":"In a civil breach-of-contract trial, the defendant calls a witness. On cross-examination, the plaintiff seeks to ask the witness about her conviction six years ago for misdemeanor perjury, punishable by up to six months in jail. The defendant objects. The question is:","o":["Improper, because the crime was a misdemeanor punishable by no more than six months in jail.","Improper, unless the court finds that its probative value outweighs its prejudicial effect.","Proper, because perjury is a crime of dishonesty admissible regardless of punishment.","Proper only if the plaintiff first offers a certified record of the conviction into evidence."],"a":2,"e":"FRE 609(a)(2): evidence of a conviction for any crime whose elements require proving a dishonest act or false statement must be admitted for impeachment, regardless of the punishment and without 403 balancing (if within 10 years). Perjury qualifies."},
{"id":"evidence_2","s":"evidence","q":"A pedestrian sued a city after tripping on a broken sidewalk. A week after the accident, the city repaired the sidewalk. The city does not dispute that it owns and controls the sidewalk. The pedestrian offers evidence of the repair to prove the city was negligent. The evidence is:","o":["Admissible, because the repair shows the city knew the sidewalk was dangerous.","Admissible to show that it was feasible for the city to repair the sidewalk.","Inadmissible, because subsequent remedial measures cannot be used to prove negligence.","Inadmissible, because the repair is irrelevant to the condition of the sidewalk."],"a":2,"e":"FRE 407 bars evidence of subsequent remedial measures to prove negligence or culpable conduct. It may be admitted for other purposes — ownership, control, or feasibility — only if disputed. Here the city disputes none of those."},
{"id":"evidence_3","s":"evidence","q":"A defendant charged with assault calls a neighbor to testify for the defense. Which of the following is the neighbor permitted to say on direct examination?","o":["“Last year I saw the defendant break up a fight without throwing a punch.”","“The defendant has a reputation in our community as a peaceful person.”","“The defendant has never been arrested.”","“The defendant is an honest person.”"],"a":1,"e":"Under FRE 404(a)(2)(A) and 405(a), a criminal defendant may offer evidence of a pertinent character trait (peacefulness, for assault) by reputation or opinion testimony. Specific instances are not allowed on direct (except where character is an element). Honesty is not pertinent to assault."},
{"id":"evidence_4","s":"evidence","q":"In a wrongful-death action, the plaintiff offers testimony from a paramedic that the decedent, gravely injured and saying “I’m not going to make it,” stated that the defendant’s blue truck had run him over. The decedent died an hour later. The testimony is:","o":["Inadmissible, because dying declarations are admissible only in criminal prosecutions for homicide, not civil suits.","Inadmissible, because the decedent can no longer be cross-examined about what he saw.","Admissible as a dying declaration, because this is a civil case and he believed death was imminent.","Admissible only if the paramedic recorded the statement in a written report at the time."],"a":2,"e":"FRE 804(b)(2): in a homicide prosecution or a civil case, a statement made by an unavailable declarant while believing death to be imminent, about its cause or circumstances, is admissible. The declarant is unavailable (dead). The Confrontation Clause applies only in criminal cases."},
{"id":"evidence_5","s":"evidence","q":"In a negligence action arising from an intersection collision, a witness called by the defendant testifies that the defendant’s light was green. The plaintiff then offers the witness’s earlier unsworn statement to an investigating officer at the scene that the defendant’s light was red. The defendant objects. The earlier statement is admissible:","o":["As substantive evidence and for impeachment.","Only to impeach the witness’s credibility, not as proof of the light’s color.","Only as substantive evidence.","For neither purpose, because it is hearsay."],"a":1,"e":"A prior inconsistent statement may be used to impeach a witness’s credibility (with the 613 foundation). It is admissible as substantive evidence under 801(d)(1)(A) only if it was made under penalty of perjury at a trial, hearing, other proceeding, or deposition. An unsworn statement to an officer at the scene qualifies only for impeachment (absent some other exception such as an excited utterance, which the facts do not establish)."},
{"id":"evidence_6","s":"evidence","q":"A husband is on trial in federal court for arson. The prosecution calls his wife, who is willing to testify that she saw him pour gasoline on the building. The husband objects, asserting spousal privilege. The objection should be:","o":["Sustained, because in a criminal case a defendant may prevent his spouse from testifying against him.","Sustained, because the testimony concerns events during the marriage.","Overruled, because the witness-spouse holds the testimonial privilege and is willing to testify.","Overruled, because spousal privilege does not apply in criminal cases."],"a":2,"e":"Under Trammel v. United States, in federal court the spousal testimonial privilege belongs to the witness-spouse, who may choose to testify. Observing his conduct is not a confidential marital communication, so that privilege does not apply either."},
{"id":"evidence_7","s":"evidence","q":"A client asked his attorney how to transfer assets to relatives so that creditors in an anticipated fraud judgment could not reach them. In later litigation, the creditors seek to compel the attorney to testify about the conversation. The attorney-client privilege:","o":["Protects the conversation, because it was confidential.","Protects the conversation, because the privilege survives the end of the attorney-client relationship.","Does not protect the conversation, because the client sought advice to further a future fraud.","Does not protect the conversation, because the attorney did not act on the request."],"a":2,"e":"The crime-fraud exception removes privilege from communications in which the client seeks legal services to commit or plan a future crime or fraud. Whether the attorney complied is irrelevant; the client’s purpose controls."},
{"id":"evidence_8","s":"evidence","q":"In a dispute over the terms of a written lease, the landlord testifies from memory about what the lease says regarding repair obligations. The lease exists and is in the landlord’s possession, and no excuse is offered for not producing it. The tenant objects. The objection should be:","o":["Overruled, because the landlord has personal knowledge of what the lease says.","Overruled, because the landlord is a party.","Sustained, because the original writing is required to prove its contents.","Sustained, because the testimony is hearsay."],"a":2,"e":"Under the best evidence rule (FRE 1002), an original (or admissible duplicate) is required to prove the contents of a writing when its terms are at issue, absent an excuse such as loss without bad faith. The landlord is trying to prove the lease’s contents through memory."},
{"id":"evidence_9","s":"evidence","q":"To prove that a phone call came from the defendant, the prosecution calls the defendant’s longtime coworker, who testifies that she recognized the defendant’s voice on a recording of the call. The defendant objects for lack of authentication. The objection should be:","o":["Sustained, because voice identification requires expert testimony.","Sustained, unless the phone company’s records independently confirm the call was placed.","Overruled, because a lay witness familiar with a voice may identify it.","Overruled, because recordings are self-authenticating."],"a":2,"e":"FRE 901(b)(5) allows a voice to be identified by opinion based on hearing the voice at any time under circumstances connecting it with the alleged speaker. A familiar coworker suffices. Recordings are not self-authenticating."},
{"id":"evidence_10","s":"evidence","q":"At a murder trial, the defendant offers testimony that the defendant’s former roommate, now deceased, told a friend, “I’m the one who killed the victim, not the defendant.” Which additional showing is required for the statement to be admitted as a statement against interest?","o":["That the roommate made the statement under oath or in a formal proceeding.","That corroborating circumstances clearly indicate the statement’s trustworthiness.","That the prosecution had a prior opportunity to cross-examine the roommate about it.","No additional showing; such statements are always admissible."],"a":1,"e":"FRE 804(b)(3): a statement against penal interest by an unavailable declarant, offered in a criminal case, requires corroborating circumstances that clearly indicate its trustworthiness (whether offered by the prosecution or the defense). The roommate is unavailable because deceased."},
{"id":"evidence_11","s":"evidence","q":"Seconds after a collision at an intersection, a visibly shaken bystander shouted, “That red truck just blew through the red light!” The bystander cannot be located for trial. In the injured driver’s suit against the truck’s owner, the statement is:","o":["Inadmissible hearsay, because the bystander cannot be cross-examined.","Admissible only if the bystander is identified.","Admissible as an excited utterance, whether or not the bystander is available.","Admissible only as a statement against the bystander’s interest."],"a":2,"e":"A statement relating to a startling event, made while under the stress of excitement it caused, is an excited utterance (803(2)); describing an event while perceiving it or immediately after is a present sense impression (803(1)). Availability is immaterial for 803 exceptions, and there is no Confrontation Clause issue in a civil case."},
{"id":"property_0","s":"property","q":"An owner conveyed a lot to Ann, who did not record. A week later, the owner conveyed the same lot to Ben, who paid value and had no notice of Ann’s deed. Ann then recorded her deed. The next day Ben recorded his. The jurisdiction’s statute provides: “No conveyance is valid against a subsequent purchaser for value without notice who first records.” Who owns the lot?","o":["Ben, because he was a bona fide purchaser for value without notice.","Ben, because he paid value.","Ann, because Ben, although a bona fide purchaser, did not record before Ann did.","Ann, because her deed was first in time and recording is irrelevant."],"a":2,"e":"This is a race-notice statute: a subsequent purchaser prevails only if a BFP without notice AND records first. Ben was a BFP but recorded after Ann, so Ann’s prior conveyance prevails. Under a pure notice statute, Ben would win."},
{"id":"property_1","s":"property","q":"An owner conveyed land “to the City so long as the land is used as a public park.” Years later, the City built a parking garage on the land. What interest, if any, did the owner retain, and what happened when the garage was built?","o":["A right of entry; the owner may now elect to retake the land by suing to terminate.","A possibility of reverter; title reverted to the owner automatically.","An executory interest; title shifted automatically.","No interest; the City owns a fee simple absolute."],"a":1,"e":"Durational language (“so long as”) creates a fee simple determinable; the grantor retains a possibility of reverter, and the estate ends automatically when the stated use ceases. A right of entry accompanies a fee simple subject to a condition subsequent (“but if”); an executory interest is held by a third party."},
{"id":"property_2","s":"property","q":"An owner conveyed land “to Alice for life, then to those of Alice’s children who reach age 25.” At the time, Alice was alive and had two children, ages 2 and 4. In a jurisdiction applying the common-law Rule Against Perpetuities without reform, what are the interests?","o":["Alice has a life estate; her children have a contingent remainder that is valid because they are lives in being.","Alice has a life estate; her children have a vested remainder subject to open, which is valid.","Alice has a life estate; the remainder to her children is void, and the owner holds a reversion.","Alice holds a fee simple absolute, because the remainder fails and merges into her estate."],"a":2,"e":"Alice could have another child after the conveyance, and that child could reach 25 more than 21 years after the death of all lives in being (Alice and the existing children). Because vesting might occur too remotely, the contingent remainder fails under the common-law RAP, leaving the owner a reversion after Alice’s life estate."},
{"id":"property_3","s":"property","q":"A, B, and C owned land as joint tenants with right of survivorship. A conveyed her interest to D. Later, B died, leaving a will devising all his property to E. Who owns the land, and how?","o":["C and D as joint tenants, each with one-half.","C, D, and E as tenants in common, each owning an undivided one-third.","C owns two-thirds and D owns one-third, as tenants in common.","C owns the entire property by survivorship."],"a":2,"e":"A’s conveyance severed the joint tenancy as to her one-third share, so D holds one-third as a tenant in common. B and C remained joint tenants as to the other two-thirds. On B’s death, C took B’s share by survivorship (a joint tenant cannot devise the interest), so C holds two-thirds and D one-third as tenants in common."},
{"id":"property_4","s":"property","q":"An owner of a 100-acre tract sold the back 40 acres to a buyer. The 40 acres had no access to any public road except across the owner’s retained land, and the deed said nothing about access. Ten years later, the county built a public road adjoining the 40 acres. What is the status of the buyer’s right to cross the owner’s land?","o":["The buyer never had an easement, because no easement was expressed in the deed.","The buyer has a permanent easement by necessity that runs with the 40 acres.","The buyer had an easement by necessity, which ended when the necessity ended.","The buyer has a prescriptive easement from ten years of use."],"a":2,"e":"An easement by necessity arises when a conveyance severs commonly owned land and leaves a parcel without access (strict necessity). It lasts only as long as the necessity; the new public road ended it. Prescription requires adverse use, not use by right."},
{"id":"property_5","s":"property","q":"A residential tenant’s apartment had no heat for three weeks in January despite the tenant’s repeated written complaints to the landlord. The tenant withheld that month’s rent and remained in the apartment. The landlord sued to evict for nonpayment. The tenant’s best defense is:","o":["Constructive eviction, based on the landlord’s failure to provide heat.","Breach of the covenant of quiet enjoyment.","Breach of the implied warranty of habitability.","Frustration of purpose."],"a":2,"e":"The implied warranty of habitability lets a residential tenant who has given notice withhold or reduce rent while remaining in possession when the premises are unfit for habitation. Constructive eviction requires the tenant to vacate within a reasonable time, which this tenant did not do."},
{"id":"property_6","s":"property","q":"A landlord leased commercial space to a tenant for 5 years. In year 2, with the landlord’s consent, the tenant transferred her entire remaining interest to an assignee, who took possession. The landlord did not release the tenant. The assignee then stopped paying rent. From whom may the landlord recover the unpaid rent?","o":["Only the tenant, because the landlord’s contract was with her.","Only the assignee, because the landlord consented to the assignment of the lease.","Either the tenant (privity of contract) or the assignee (privity of estate).","Neither, because consenting to an assignment releases both."],"a":2,"e":"After an assignment, the assignee is in privity of estate with the landlord and is liable for rent while in possession; the original tenant remains liable under privity of contract unless released (a novation). Consent to the assignment is not a release."},
{"id":"property_7","s":"property","q":"The jurisdiction’s adverse-possession period is 10 years. Xavier entered an owner’s land and possessed it openly, exclusively, continuously, and without permission for 6 years, then sold his interest by deed to Yolanda, who possessed it in the same manner for 5 more years. The owner now sues to eject Yolanda. Who will prevail?","o":["The owner, because neither possessor held the land for 10 years.","The owner, because Yolanda’s deed came from someone who had no title to convey.","Yolanda, because she may tack Xavier’s possession onto hers through privity.","Yolanda, but only if she paid property taxes."],"a":2,"e":"Successive adverse possessors in privity (e.g., by deed, will, or descent) may tack their periods. Six years plus five years exceeds the 10-year period. Paying taxes is required only in some jurisdictions and is not indicated here."},
{"id":"property_8","s":"property","q":"A seller and buyer signed a valid contract for the sale of a house, with closing set for 60 days later. The contract was silent on risk of loss, and the jurisdiction has no statute on the issue. Before closing, the house was destroyed by lightning. The buyer refuses to close. Under the majority rule:","o":["The buyer may cancel, because the seller still held legal title when the house burned.","The buyer must close and pay the full price, because she bore the risk of loss.","The contract is discharged for impossibility, because the house no longer exists.","The buyer must close, but at a price reduced by the value of the house."],"a":1,"e":"Under the doctrine of equitable conversion (majority rule), the buyer becomes the equitable owner when the contract is signed and bears the risk of loss not caused by the seller, absent a contract provision or statute (such as the Uniform Vendor and Purchaser Risk Act) to the contrary. The buyer may be entitled to credit for any insurance proceeds the seller receives."},
{"id":"property_9","s":"property","q":"An owner borrowed from Bank 1, giving a mortgage that was promptly recorded, and later borrowed from Bank 2, giving a second recorded mortgage. The owner defaulted on Bank 2’s loan, and Bank 2 foreclosed, joining all necessary parties. A purchaser bought at the foreclosure sale. What is the purchaser’s position?","o":["The purchaser takes free of both mortgages.","The purchaser takes subject to Bank 1’s mortgage.","The purchaser takes subject to Bank 2’s mortgage.","The purchaser is personally liable on Bank 1’s debt."],"a":1,"e":"Foreclosure extinguishes the foreclosing mortgage and junior interests that are joined, but not senior interests. Bank 1’s senior mortgage survives, so the purchaser takes subject to it (though not personally liable unless she assumes it)."},
{"id":"property_10","s":"property","q":"A grantor conveyed land to a grantee by general warranty deed that did not mention a recorded utility easement crossing the property. The grantee discovers the easement a year later. Which covenant was breached, and when?","o":["Quiet enjoyment, when the grantee discovered the easement.","The covenant against encumbrances, breached at the time of conveyance.","The covenant of warranty, when the utility enters the land.","No covenant, because the grantee had record notice of the easement."],"a":1,"e":"The covenant against encumbrances is a present covenant, breached (if at all) at delivery of the deed if an encumbrance such as an easement exists. Most courts hold that the grantee’s knowledge of the encumbrance, including record notice, does not defeat the covenant."},
{"id":"property_11","s":"property","q":"A developer subdivided land into 50 lots under a recorded plat showing a residential development. The deeds to 49 lots restricted use to single-family homes. The deed to the last lot omitted the restriction. Its buyer, who saw that every other lot contained a single-family home, plans to build a convenience store. Neighbors sue to enjoin construction. The neighbors will most likely:","o":["Lose, because the buyer’s own deed contains no restriction on the use of the lot.","Lose, because there is no horizontal privity between the neighbors and the buyer of the lot.","Win, because the common scheme implies a servitude of which the buyer had inquiry notice.","Win, because zoning law automatically prohibits commercial use in subdivisions."],"a":2,"e":"Under the common-scheme (general plan) doctrine, a restriction may be implied on a lot whose deed omits it, creating an equitable servitude enforceable by injunction if the buyer had notice. The uniform appearance of the neighborhood gave inquiry notice. Privity is not required for equitable servitudes."},
{"id":"torts_0","s":"torts","q":"A defendant threw a rock at Al, intending to hit him. The rock missed Al and struck Beth, whom the defendant had not seen. In Beth’s battery action, the defendant will most likely be:","o":["Not liable, because he did not intend to hit Beth or even know she was there.","Not liable, because Beth was not the target of his intent.","Liable, because his intent to strike Al transfers to Beth.","Liable only if he was negligent in throwing the rock."],"a":2,"e":"Under the doctrine of transferred intent, the defendant’s intent to commit battery on Al transfers to the unintended victim, Beth. Transferred intent applies among assault, battery, false imprisonment, trespass to land, and trespass to chattels."},
{"id":"torts_1","s":"torts","q":"A city ordinance requires owners of apartment buildings to install handrails on all interior stairways to prevent falls. A tenant fell on a stairway that lacked a handrail. In the tenant’s negligence suit, what is the most likely effect of the ordinance under the majority rule?","o":["It establishes the landlord’s liability without further proof.","It establishes duty and breach, but the tenant must still prove causation and damages.","It is irrelevant, because violations of ordinances are punished only through criminal fines.","It creates a rebuttable presumption that the tenant was not negligent."],"a":1,"e":"Under negligence per se, an unexcused violation of a statute designed to protect a class including the plaintiff against the type of harm suffered establishes duty and breach (majority conclusive; some treat it as a presumption or evidence). The plaintiff must still prove causation and damages."},
{"id":"torts_2","s":"torts","q":"A host invited a friend to dinner. The host knew a back-porch step was rotten but did not mention it, and the rot was not visible. The friend stepped on it, fell, and was injured. In the friend’s negligence action, the host will most likely be:","o":["Not liable, because social guests take premises as they find them.","Not liable, because a host need not inspect for defects.","Liable, because the host failed to warn of a known, concealed danger.","Liable, because hosts owe social guests the highest care."],"a":2,"e":"A social guest is a licensee under the traditional approach. The possessor must warn of (or make safe) known dangerous conditions that the licensee is unlikely to discover. There is no duty to inspect for unknown dangers — but the host knew of the rot."},
{"id":"torts_3","s":"torts","q":"A patient underwent abdominal surgery under general anesthesia. She awoke with a severe injury to her right shoulder, which was not near the surgical site. She cannot identify which member of the surgical team caused it. In her negligence suit against the surgeon, anesthesiologist, and hospital, she can most likely:","o":["Not recover, because she cannot prove which of the defendants was negligent or how.","Rely on res ipsa loquitur to infer negligence by those who controlled her care.","Recover only under a theory of strict liability for medical procedures.","Recover only if an expert witness identifies the specific negligent act."],"a":1,"e":"Res ipsa loquitur applies where the injury ordinarily would not occur without negligence and the instrumentality was under the defendants’ control. Courts have applied it to unconscious patients injured during surgery, letting the inference run against those who controlled the patient (Ybarra v. Spangard)."},
{"id":"torts_4","s":"torts","q":"A plaintiff suffered $100,000 in damages in a collision. The jury found the plaintiff 60% at fault and the defendant 40% at fault. Nothing in the question indicates the jurisdiction’s rule. Under the rule assumed on the MBE, how much does the plaintiff recover?","o":["Nothing, because the plaintiff was more at fault than the defendant.","$40,000.","$60,000.","$100,000, because the defendant was negligent."],"a":1,"e":"NCBE’s MBE outline instructs examinees to assume pure comparative fault (and joint and several liability) unless otherwise indicated. Under pure comparative negligence, recovery is reduced by the plaintiff’s share of fault even if it exceeds 50%: $100,000 × 40% = $40,000. (A modified comparative-fault state like Ohio would bar recovery at 60% fault.)"},
{"id":"torts_5","s":"torts","q":"A driver negligently struck a pedestrian, breaking her leg. At the hospital, a doctor negligently set the fracture, causing permanent damage. Is the driver liable for the permanent damage?","o":["No, because the doctor’s negligence was a superseding cause.","No, because the driver is liable only for harm he directly caused.","Yes, because negligent medical care is a foreseeable intervening cause.","Yes, but only if the doctor is insolvent and cannot pay the judgment."],"a":2,"e":"Subsequent negligent medical care is a foreseeable consequence of causing physical injury, so it does not break the chain of proximate causation. The original tortfeasor is liable for the aggravation (the doctor is also liable for the harm she caused)."},
{"id":"torts_6","s":"torts","q":"A consumer bought a sealed can of soup at a grocery store. The soup contained a sharp piece of metal from the manufacturing process, which injured the consumer. The grocer had no way of discovering the defect. In the consumer’s strict products liability action against the grocer, the grocer will most likely be:","o":["Not liable, because it had no reasonable way to discover the defect in the sealed can.","Not liable, because only the manufacturer of a defective product is subject to strict liability.","Liable, because strict liability applies to all commercial sellers, regardless of fault.","Liable only if the grocer was negligent in how it stored or handled the soup."],"a":2,"e":"Strict products liability extends to all commercial sellers in the chain of distribution, including retailers, regardless of fault. The grocer may seek indemnity from the manufacturer. Lack of opportunity to inspect is not a defense to strict liability."},
{"id":"torts_7","s":"torts","q":"A newspaper published an article stating that the city’s mayor accepted a bribe. The statement was false. The reporter relied on a single source without checking public records that would have shown the story was false, but the reporter honestly believed the story was true. In the mayor’s defamation action, the mayor will most likely:","o":["Win, because the statement was false and defamatory.","Win, because the reporter was negligent in failing to check the readily available public records.","Lose, because a public official must prove actual malice, and negligence is not enough.","Lose, because statements about public officials are absolutely privileged."],"a":2,"e":"Under New York Times v. Sullivan, a public official must prove by clear and convincing evidence that the defendant published with actual malice — knowledge of falsity or reckless disregard for the truth (subjective serious doubts). A mere failure to investigate, without more, is negligence, not actual malice."},
{"id":"torts_8","s":"torts","q":"A jogger saw a young child, a stranger, face down in a shallow pond. The jogger could easily have pulled the child out without any risk but kept running. The child drowned. The jogger had no relationship with the child and did not create the danger. In a wrongful-death action against the jogger, the jogger will most likely be:","o":["Liable, because the rescue would have involved no risk to the jogger.","Liable, because a reasonable person in the jogger’s position would have helped.","Not liable, because there is generally no duty to rescue a stranger.","Not liable, because the child’s parents were negligent in supervising her."],"a":2,"e":"The common law imposes no general duty to aid or rescue a stranger, however easy the rescue. Exceptions exist for special relationships, where the defendant created the peril, or where the defendant undertook a rescue."},
{"id":"torts_9","s":"torts","q":"A construction company used dynamite to blast rock for a highway project, following all industry safety standards and exercising all reasonable care. Vibrations from the blast cracked the foundation of a nearby house. In the homeowner’s suit, the company will most likely be:","o":["Not liable, because it exercised all reasonable care and followed industry standards.","Not liable, because the highway project served an important public interest.","Liable, because blasting is an abnormally dangerous activity subject to strict liability.","Liable only if it violated a state or federal safety regulation."],"a":2,"e":"Blasting is a classic abnormally dangerous activity: it creates a foreseeable and highly significant risk of physical harm even with reasonable care and is not a matter of common usage. Strict liability applies to harm within that risk, such as vibration and debris damage."},
{"id":"torts_10","s":"torts","q":"A store employee saw a customer put something in her purse and reported it. A security guard politely asked the customer to come to the office, where she was held for 15 minutes while the guard reviewed security video, which showed she had put her own phone in the purse. She was then released with an apology. In her false imprisonment action, the store will most likely:","o":["Be liable, because the customer was innocent of any shoplifting.","Be liable, because she was confined in the security office against her will for 15 minutes.","Not be liable, because the detention fell within the shopkeeper’s privilege.","Not be liable, because the customer never attempted to leave the office."],"a":2,"e":"The shopkeeper’s privilege allows a merchant with a reasonable belief that a person has shoplifted to detain the person for a reasonable time and in a reasonable manner to investigate. A brief, polite detention to review video satisfies it, even though the customer was innocent."},
{"id":"torts_11","s":"torts","q":"A driver negligently rear-ended a car at low speed. Because the other driver had a rare bone condition, she suffered severe fractures that an ordinary person would not have suffered. The driver argues he should be liable only for the minor injuries an ordinary person would have sustained. The driver’s argument will most likely:","o":["Succeed, because damages are limited to foreseeable injuries.","Succeed, because her condition was a superseding cause.","Fail, because a defendant takes the plaintiff as he finds her.","Fail, because drivers are strictly liable for car accidents."],"a":2,"e":"Under the eggshell-skull (thin-skull) rule, once a defendant is liable for causing some physical harm, he is liable for the full extent of the injuries, even if they are unusually severe because of a pre-existing condition."}
];

// ORIGINAL MEE-style practice prompts written for this app (not actual NCBE questions). “Franklin” is a fictional state.
// Each checklist issue has a FIXED id (3rd element); saved self-grades are keyed by it. Never change or reuse ids; append new issues with new ids.
const ESSAYS = [
{id:"e_civpro",s:"civpro",title:"Exploding Mower (Jurisdiction & Joinder)",
facts:"Paula, a citizen of Ohio, bought a riding lawnmower from HardwareCo, a hardware store incorporated in Ohio with its only place of business in Ohio. The mower was manufactured by MowCo, a corporation incorporated in Delaware with its headquarters, where its officers direct and control its business, in Michigan. MowCo designs and builds its mowers in Michigan and sells them throughout the United States, including through more than 40 Ohio retailers. MowCo advertises its mowers on Ohio television stations. The mower exploded while Paula was using it in her Ohio yard, and she suffered injuries she values at $500,000.\n\nPaula sued only MowCo in the U.S. District Court for the Southern District of Ohio, asserting a state-law strict products liability claim. MowCo has moved to dismiss for lack of personal jurisdiction. MowCo also wants to bring HardwareCo into the case, asserting that HardwareCo improperly assembled the mower and must indemnify MowCo for any liability. If HardwareCo is joined, Paula would like to assert her own state-law negligence claim directly against HardwareCo. Assume Ohio’s long-arm statute reaches as far as the U.S. Constitution permits.",
call:["1. Does the federal court have subject-matter jurisdiction over Paula’s claim against MowCo? Explain.","2. Does the court have personal jurisdiction over MowCo? Explain.","3. May MowCo join HardwareCo, and does the court have subject-matter jurisdiction over MowCo’s claim against HardwareCo? Explain.","4. Does the court have subject-matter jurisdiction over Paula’s claim against HardwareCo? Explain."],
issues:[["Diversity rule: complete diversity + amount in controversy > $75,000 (§1332)",1,"e_civpro.0"],["Applies citizenship: Paula = Ohio (domicile); MowCo = Delaware and Michigan (incorporation + nerve center, Hertz); $500,000 claim → jurisdiction exists",1.5,"e_civpro.1"],["PJ rule: long-arm + due process minimum contacts, fair play and substantial justice (International Shoe)",1,"e_civpro.2"],["No general jurisdiction — MowCo not “at home” in Ohio (Daimler)",0.5,"e_civpro.3"],["Specific jurisdiction: purposeful availment through Ohio retailers and Ohio advertising; claim arises out of or relates to those contacts (Ford Motor Co., 2021); fair and reasonable",1.5,"e_civpro.4"],["Rule 14 impleader: defendant may implead a nonparty who is or may be liable to it for all or part of the claim (indemnity); as of right within 14 days of answer, otherwise leave",1,"e_civpro.5"],["Supplemental jurisdiction §1367(a) over MowCo v. HardwareCo (same case or controversy); §1367(b) does not bar claims by defendants",1.5,"e_civpro.6"],["Paula v. HardwareCo: no diversity (both Ohio), no federal question; §1367(b) bars claims by plaintiffs against persons made parties under Rule 14 in diversity cases (Owen Equipment v. Kroger) → no jurisdiction",2,"e_civpro.7"]],
model:"1. Subject-matter jurisdiction. A federal court has diversity jurisdiction when the parties are completely diverse and the amount in controversy exceeds $75,000, exclusive of interest and costs. 28 U.S.C. §1332(a). An individual is a citizen of the state of domicile; Paula is an Ohio citizen. A corporation is a citizen of every state of incorporation and of the state of its principal place of business, its “nerve center” (Hertz Corp. v. Friend). MowCo is a citizen of Delaware and Michigan. Paula seeks $500,000 in good faith. Diversity jurisdiction exists.\n\n2. Personal jurisdiction. A federal court in a diversity case generally has the personal jurisdiction that the forum state’s courts would have. Because Ohio’s long-arm statute is assumed to reach the constitutional limit, the question is due process: the defendant must have minimum contacts with the forum such that the suit does not offend traditional notions of fair play and substantial justice (International Shoe). General jurisdiction is unavailable because MowCo is not “at home” in Ohio — it is neither incorporated nor headquartered there (Daimler). Specific jurisdiction exists, however. MowCo purposefully availed itself of the Ohio market by selling through more than 40 Ohio retailers and advertising on Ohio television. Paula’s claim “arises out of or relates to” those contacts: a MowCo mower sold in Ohio malfunctioned and injured an Ohio resident in Ohio (Ford Motor Co. v. Montana Eighth Judicial District, 2021). Litigating in Ohio is fair: Ohio has a strong interest, the evidence and witnesses are there, and MowCo, a national company, faces little burden. The motion to dismiss should be denied.\n\n3. Impleader of HardwareCo. Under Rule 14(a), a defending party may serve a third-party complaint on a nonparty “who is or may be liable to it for all or part of the claim against it.” A claim for indemnity based on HardwareCo’s improper assembly fits squarely. MowCo may do so without leave within 14 days after serving its original answer, and with leave afterward. As for subject-matter jurisdiction, MowCo (Delaware/Michigan) and HardwareCo (Ohio) are diverse, so diversity would independently support the claim if the indemnity amount exceeds $75,000. Regardless of amount, supplemental jurisdiction under §1367(a) covers the claim because it arises from the same nucleus of operative fact as Paula’s claim. Section 1367(b) restricts only claims by plaintiffs, so it does not bar this defendant’s claim.\n\n4. Paula’s claim against HardwareCo. Paula and HardwareCo are both Ohio citizens, and her negligence claim arises under state law, so there is no original jurisdiction. Although the claim is part of the same case or controversy under §1367(a), §1367(b) provides that in a case founded solely on diversity, the court lacks supplemental jurisdiction over claims by plaintiffs against persons made parties under Rule 14 when that would be inconsistent with §1332. This codifies Owen Equipment & Erection Co. v. Kroger and prevents plaintiffs from evading complete diversity by suing only the diverse defendant and waiting for impleader. The court lacks jurisdiction over Paula’s claim against HardwareCo; she could pursue it in Ohio state court."},
{id:"e_conlaw",s:"conlaw",title:"Franklin Waste Fee & Park Signs",
facts:"The State of Franklin has several privately owned landfills. To extend their useful life, the Franklin legislature enacted a statute imposing a disposal fee of $40 per ton on solid waste generated outside Franklin and $10 per ton on waste generated within Franklin. Franklin officials testified that out-of-state waste is no more hazardous than in-state waste. HaulCo, a waste-hauling corporation based in a neighboring state that brings out-of-state waste to Franklin landfills, sued to invalidate the fee differential.\n\nSeparately, the City of Centerville, Franklin, adopted an ordinance prohibiting the display in any city park of any sign “that criticizes a public official of the City.” Signs on all other subjects are permitted. Maria was cited for carrying a sign in Centerville’s central park that read, “The Mayor Is Wasting Our Taxes.”",
call:["1. Is the Franklin disposal-fee statute constitutional? Explain.","2. Can HaulCo challenge the statute under the Privileges and Immunities Clause of Article IV? Explain.","3. Is the Centerville ordinance constitutional as applied to Maria? Explain."],
issues:[["Dormant Commerce Clause rule: state may not discriminate against interstate commerce absent congressional authorization",1,"e_conlaw.0"],["Fee is facially discriminatory (out-of-state waste charged more); virtually per se invalid unless necessary to serve a legitimate local purpose with no reasonable nondiscriminatory alternative",1.5,"e_conlaw.1"],["Conservation of landfill space can be achieved by nondiscriminatory means (e.g., higher fee on all waste) → invalid (cf. Oregon Waste; Philadelphia v. New Jersey)",1.5,"e_conlaw.2"],["Market-participant exception does not apply — landfills privately owned; state acting as regulator",1,"e_conlaw.3"],["Article IV P&I protects only citizens (individuals); corporations are not protected → HaulCo cannot use it",1.5,"e_conlaw.4"],["Park = traditional public forum",1,"e_conlaw.5"],["Ordinance is content-based (indeed viewpoint-based) → strict scrutiny; city bears burden; not narrowly tailored to compelling interest",1.5,"e_conlaw.6"],["Political speech criticizing officials is at the core of the First Amendment; ordinance unconstitutional as applied",1,"e_conlaw.7"]],
model:"1. Dormant Commerce Clause. Because the Commerce Clause grants Congress power over interstate commerce, it implicitly restricts states from discriminating against or unduly burdening interstate commerce. A state law that discriminates against out-of-state commerce on its face is virtually per se invalid; it will be upheld only if the state shows it serves a legitimate local purpose that cannot be adequately served by reasonable nondiscriminatory alternatives. Solid waste is an article of commerce (Philadelphia v. New Jersey). Franklin’s statute charges four times more for out-of-state waste than identical in-state waste — facial discrimination (Oregon Waste Systems v. Department of Environmental Quality). The asserted purpose, conserving landfill space, is legitimate, but it can be served without discrimination — for example, by raising the fee on all waste. Franklin officials concede that out-of-state waste is no more dangerous, so there is no health basis for differential treatment. The market-participant exception does not apply because the landfills are privately owned; Franklin is acting as a regulator, not a market participant. Congress has not authorized the discrimination. The fee differential is unconstitutional.\n\n2. Privileges and Immunities Clause. Article IV, §2 prohibits a state from discriminating against citizens of other states with respect to fundamental rights, such as the right to pursue a livelihood, unless the state has a substantial reason and the discrimination bears a substantial relationship to that reason. However, the Clause protects only citizens — natural persons — not corporations or aliens. HaulCo is a corporation and cannot invoke it. (Individual out-of-state haulers might have a claim, but the dormant Commerce Clause already invalidates the statute.)\n\n3. Centerville ordinance. Public parks are traditional public forums. Content-based restrictions on speech in a public forum are subject to strict scrutiny: the government must show the restriction is necessary (narrowly tailored) to achieve a compelling interest. The ordinance singles out signs that criticize city officials while permitting signs on every other subject — a content-based and, worse, viewpoint-based restriction, since praise of officials is allowed but criticism is not. Political speech criticizing government officials lies at the core of First Amendment protection. Centerville has no compelling interest in shielding officials from criticism, and a ban on one viewpoint is not narrowly tailored to any legitimate goal such as preventing clutter. Nor does Maria’s sign fall within an unprotected category; it is not incitement, a true threat, or defamation (it is opinion about public conduct). The ordinance is unconstitutional as applied to Maria."},
{id:"e_contracts",s:"contracts",title:"Hotel Chairs (UCC Article 2)",
facts:"Inn LLC, which operates a hotel, emailed Seating Co., a commercial furniture manufacturer, a purchase order for 200 banquet chairs at $100 per chair, with delivery “on or before March 1.” The email ended with the typed name of Inn’s purchasing manager. Seating Co. replied by email, “We accept your order,” with an attached standard acknowledgment form containing a clause stating that “buyer’s exclusive remedy for defects is repair or replacement.” Inn did not respond to the attachment.\n\nSeating Co. delivered 200 chairs to the hotel on March 1 in its own trucks; no outside carrier was used. That afternoon, Inn inspected and found that 30 chairs had cracked legs. Seating Co. did not know of the cracks, which resulted from a mishap while the chairs were in transit on Seating Co.’s truck. Inn immediately notified Seating Co. that it rejected all 200 chairs. Seating Co. replied the same day that it would deliver 30 replacement chairs within three days. Inn refused, and on March 3 bought 200 comparable chairs from another supplier at $120 per chair, a reasonable price.",
call:["1. Was a contract formed, and is it enforceable under the Statute of Frauds? Explain.","2. Is the repair-or-replacement clause part of the contract? Explain.","3. Who bore the risk of the transit damage, was Inn entitled to reject all 200 chairs, and did Seating Co. have a right to cure? Explain.","4. Assuming Inn rightfully rejected, what damages may it recover? Explain."],
issues:[["UCC Article 2 governs (sale of goods); both parties are merchants",0.5,"e_contracts.0"],["Offer (PO) and acceptance (email reply) → contract",1,"e_contracts.1"],["Statute of Frauds: goods ≥ $500; writing signed by party to be charged — emails with typed names satisfy signature (UCC/E-SIGN/UETA); quantity stated",1.5,"e_contracts.2"],["§2-207: definite expression of acceptance with additional term; between merchants additional term becomes part unless material alteration, offer limits, or objection",1.5,"e_contracts.3"],["Material alteration test: surprise or hardship without express awareness (Comment 4); courts split on remedy limitations — argue both sides and state the consequence for Inn’s remedies",1,"e_contracts.4"],["Perfect tender rule (§2-601): buyer may reject the whole, accept the whole, or accept commercial units and reject the rest",1,"e_contracts.5"],["Cure §2-508: time for performance had expired (delivery on March 1); cure beyond contract time only if seller had reasonable grounds to believe tender would be acceptable — discuss both sides (seller unaware of defect)",1.5,"e_contracts.6"],["Cover damages §2-712: (cover price − contract price) = $20 × 200 = $4,000, plus incidental/consequential, minus expenses saved",2,"e_contracts.7"],["Comment 5 to §2-207: a clause “limiting remedy in a reasonable manner” (§§2-718, 2-719) is listed as NOT a material alteration — Seating Co.’s best argument; repair/replace is a §2-719(1)(a) remedy; failure of essential purpose §2-719(2)",1,"e_contracts.8"],["Risk of loss: seller delivered in its own trucks → §2-509(3), merchant seller bears risk until buyer’s receipt (also §2-510(1)); contrast shipment contract by carrier, §2-509(1)(a): risk passes on due delivery to carrier",1,"e_contracts.9"]],
model:"1. Formation and Statute of Frauds. Article 2 of the UCC governs because the contract is for the sale of goods (chairs). Both parties are merchants dealing in or buying goods in their business. Inn’s purchase order was an offer, and Seating Co.’s “We accept your order” was an acceptance, forming a contract. Because the price is $20,000, the Statute of Frauds (§2-201) requires a writing sufficient to indicate a contract, signed by the party against whom enforcement is sought, stating a quantity. Emails are writings, and typed names at the end of an email generally satisfy the signature requirement (the UCC defines “signed” to include any symbol adopted with present intent to authenticate; E-SIGN and UETA give electronic signatures legal effect). Both emails reference 200 chairs. The contract is enforceable against either party.\n\n2. Repair-or-replacement clause. Under §2-207(1), a definite and seasonable expression of acceptance operates as an acceptance even though it states additional terms, unless acceptance is expressly made conditional on assent to them — and “We accept your order” was not so conditioned. Under §2-207(2), between merchants an additional term becomes part of the contract unless (a) the offer expressly limits acceptance to its terms, (b) the term materially alters the contract, or (c) objection is given within a reasonable time. Neither (a) nor (c) applies: Inn’s purchase order did not limit acceptance to its terms, and Inn never objected. The issue is whether the clause materially alters the contract, meaning it would cause surprise or hardship if incorporated without the other party’s express awareness (Comment 4). Courts are split on remedy limitations, so argue both sides. Seating Co. will rely on Comment 5 to §2-207, which lists a clause “limiting remedy in a reasonable manner (see Sections 2-718 and 2-719)” as an example of a term that involves no unreasonable surprise and is therefore incorporated unless the buyer seasonably objects. A repair-or-replacement remedy is the standard limitation expressly permitted by §2-719(1)(a), it is common in the commercial furniture trade, and Inn never objected. Inn will respond that the clause is not a reasonable limitation in context: it would strip Inn of its rights to reject and to cover for goods needed by a fixed date, which is real hardship. Inn will also note that many courts treat exclusive-remedy clauses as material alterations that surprise a buyer who never expressly agreed to them, and that materiality is a fact question (e.g., trade usage, course of dealing, whether Inn actually knew of the term). The consequences matter for parts 3 and 4. If the clause is excluded, the UCC’s default remedies (rejection, cover, damages) apply. If it is included, Inn’s exclusive remedy was repair or replacement of the 30 defective chairs, unless that remedy failed of its essential purpose (§2-719(2)). Seating Co.’s prompt three-day replacement offer makes that failure unlikely, which would make Inn’s rejection of all 200 chairs and its cover wrongful.\n\n3. Risk of loss, rejection, and cure. The cracks occurred before Inn received the chairs, while they were on Seating Co.’s own truck. Because the contract did not require or authorize shipment by a carrier, §2-509(1) does not apply, and §2-509(3) governs: if the seller is a merchant, risk of loss passes to the buyer only on the buyer’s receipt of the goods. Seating Co. is a merchant, so it bore the risk of the transit damage, and the 30 cracked chairs were simply a nonconforming tender. Under §2-510(1), where a tender so fails to conform as to give a right of rejection, the risk stays on the seller until cure or acceptance. By contrast, under a shipment contract with an independent carrier (one requiring or authorizing the seller to ship but not to deliver at a particular destination), §2-509(1)(a) would have passed risk to Inn when the chairs were duly delivered to the carrier. In-transit damage would then have been Inn’s loss, to pursue against the carrier or its insurer. Under the perfect-tender rule (§2-601), if the goods or tender fail in any respect to conform to the contract, the buyer may reject the whole, accept the whole, or accept any commercial unit(s) and reject the rest. Thirty cracked chairs make the tender nonconforming, so Inn could reject all 200, provided it rejected within a reasonable time and seasonably notified the seller, which it did the same day. Seller’s right to cure under §2-508(1) applies when the time for performance has not yet expired; here delivery was due “on or before March 1” and occurred on March 1, so that time had expired. Under §2-508(2), a seller who had reasonable grounds to believe a nonconforming tender would be acceptable may have a further reasonable time to substitute a conforming tender. Seating Co. will argue it had reasonable grounds because it did not know of the cracks, which arose in shipping, and it offered a prompt three-day replacement. Inn will argue that §2-508(2) is aimed at sellers who knowingly tendered goods they reasonably thought acceptable (e.g., an upgraded model), not at sellers who simply shipped defective goods, and that Inn needed the chairs by March 1. Courts are divided; a strong answer recognizes both arguments. If cure was available, Inn’s refusal and cover would be wrongful; if not, Inn’s rejection was proper.\n\n4. Damages. If Inn rightfully rejected, it may cover by making in good faith and without unreasonable delay a reasonable purchase of substitute goods (§2-712) and recover the difference between the cost of cover and the contract price, plus incidental and consequential damages, less expenses saved because of the breach. Inn covered two days later at a reasonable price: ($120 − $100) × 200 = $4,000, plus any incidental damages (e.g., costs of inspecting, storing, and returning the rejected chairs) and any foreseeable consequential damages that could not reasonably have been prevented. Inn may also recover any part of the price already paid (§2-711)."},
{id:"e_crim",s:"crim",title:"Warehouse Burglary (Crim Law & Procedure)",
facts:"Dan and Ed agreed to break into a closed warehouse at night to steal electronics. Dan rented a van for the job. Unknown to Dan, Ed brought a loaded pistol. Inside the warehouse, a night watchman confronted them. Ed shot and killed the watchman. Dan ran out of the building and drove away; Ed was caught at the scene.\n\nThe next morning, police officers with probable cause but without a warrant went to Dan’s house. When Dan opened the door, they stepped inside and arrested him in his living room. At the station, Dan received and waived his Miranda rights. Twenty minutes into questioning, he said, “Maybe I should talk to a lawyer.” The detective replied, “That’s up to you,” and continued asking questions. Dan then confessed to planning the burglary.\n\nThe jurisdiction defines burglary as “unlawfully entering any building with intent to commit a felony therein” and follows the common law for all other crimes. Theft of the electronics would be a felony.",
call:["1. With what crimes can Dan be charged, and is he likely to be convicted? Explain.","2. Should Dan’s confession be suppressed? Explain."],
issues:[["Conspiracy to commit burglary/larceny: agreement + intent (+ overt act — renting van)",1.5,"e_crim.0"],["Burglary under statute (unlawful entry, intent to commit felony at entry) — Dan guilty as principal; attempted larceny/larceny analysis",1,"e_crim.1"],["Felony murder: killing during inherently dangerous felony (burglary); killing by co-felon in furtherance → Dan liable",1.5,"e_crim.2"],["Pinkerton/accomplice liability for murder — foreseeability; Dan’s lack of knowledge of gun is not a defense to felony murder",1,"e_crim.3"],["Payton violation: warrantless, nonconsensual entry into home to arrest without exigency violates Fourth Amendment",1.5,"e_crim.4"],["New York v. Harris: with probable cause, station-house statement is not fruit of the Payton violation → not suppressed on that ground",1,"e_crim.5"],["Miranda waiver valid; invocation of counsel must be unambiguous (Davis v. U.S.); “Maybe I should talk to a lawyer” is ambiguous → police may continue",1.5,"e_crim.6"],["Conclusion: confession admissible (voluntariness assumed)",1,"e_crim.7"]],
model:"1. Dan’s criminal liability.\n\nConspiracy. A conspiracy is an agreement between two or more persons to commit a crime, with the intent to agree and to achieve the unlawful objective; most jurisdictions also require an overt act. Dan and Ed agreed to break into the warehouse and steal electronics, and Dan rented the van in furtherance. Dan is guilty of conspiracy to commit burglary and larceny. Conspiracy does not merge with the completed offense.\n\nBurglary and larceny. Under the statute, burglary requires an unlawful entry into a building with intent, at the time of entry, to commit a felony inside. Dan entered the closed warehouse at night without permission intending to steal electronics, a felony. He is guilty of burglary. If they did not carry away any property, Dan is guilty of attempted larceny (a substantial step with specific intent); if they did, larceny.\n\nFelony murder. Malice for murder may be supplied by the commission or attempted commission of an inherently dangerous felony, including burglary. The watchman was killed during the burglary by Ed, a co-felon, in furtherance of the felony (to avoid capture). Under both the agency and proximate-cause theories, a co-felon’s killing in furtherance of the felony is attributable to all participants. Dan’s ignorance of Ed’s gun is no defense: felony murder requires only intent to commit the underlying felony, and death resulting from a confrontation with a watchman during a nighttime burglary is foreseeable. Dan may also be liable under Pinkerton for crimes committed by a co-conspirator in furtherance of the conspiracy and reasonably foreseeable. Dan will likely be convicted of felony murder.\n\n2. Suppression of the confession.\n\nPayton violation. Absent consent or exigent circumstances, police need an arrest warrant to enter a suspect’s home to make a routine felony arrest (Payton v. New York). Opening the door is not consent to entry, and no exigency appears (the arrest occurred the next morning, with no evidence of imminent flight or destruction of evidence). The entry violated the Fourth Amendment. However, under New York v. Harris, when police have probable cause to arrest, the exclusionary rule does not bar a statement made by the suspect outside the home, even after an unlawful in-home arrest, because the detention itself was lawful and the statement is not the product of being in the home. The station-house confession is not suppressible on Fourth Amendment grounds.\n\nMiranda. Dan was in custody and subject to interrogation, and he received warnings and validly waived his rights. Once a suspect unambiguously invokes the right to counsel, interrogation must stop (Edwards). But the invocation must be unambiguous — a reasonable officer must understand it as a request for an attorney. In Davis v. United States, “Maybe I should talk to a lawyer” was held too ambiguous; police may continue questioning and need not ask clarifying questions. Dan used virtually the same words. The detective’s continued questioning did not violate Miranda. Nothing suggests police coercion rendering the confession involuntary under due process. The confession should not be suppressed."},
{id:"e_evidence",s:"evidence",title:"Texting Driver (Evidence)",
facts:"Pam sued Dave in federal court for injuries she suffered when Dave’s car struck hers at an intersection. Dave denies he ran a red light. At trial, Pam offers the following evidence. Dave objects to each item.\n\n(a) Pam’s testimony that immediately after the collision, Dave walked over and said, “I’m so sorry, I was looking at a text. I’ll pay your hospital bills.”\n\n(b) A police report prepared by the investigating officer, who is available, stating (i) the officer’s observation of 40 feet of skid marks behind Dave’s car, and (ii) that an unidentified bystander told the officer, “The car ran the red light.”\n\n(c) On cross-examination of Dave, Pam’s attorney asks, “Isn’t it true you were convicted of misdemeanor shoplifting three years ago?” The crime was punishable by up to six months in jail.\n\n(d) Testimony by Pam’s treating physician that Pam told her, “A car ran a red light and slammed into my door, and now my neck hurts.”",
call:["How should the court rule on each objection? Explain."],
issues:[["(a) “I was looking at a text” — opposing party’s statement, 801(d)(2)(A) → admissible",1.5,"e_evidence.0"],["(a) “I’ll pay your hospital bills” — offer to pay medical expenses inadmissible under 409 to prove liability; but accompanying factual admission not excluded (unlike 408)",1.5,"e_evidence.1"],["(b) Officer’s own observations — public record 803(8)(A)(iii) in civil case (factual findings from legally authorized investigation) or business record; admissible",1.5,"e_evidence.2"],["(b) Bystander statement — hearsay within hearsay (805); bystander had no duty to report; no exception shown (excited utterance not established) → inadmissible",1.5,"e_evidence.3"],["(c) 609: misdemeanor punishable ≤ 1 year not admissible under 609(a)(1); shoplifting not a crime requiring proof of dishonest act/false statement under 609(a)(2) → inadmissible; 608(b) note",1.5,"e_evidence.4"],["(d) 803(4): statements for medical diagnosis/treatment — mechanism (hit in door) and symptoms (neck pain) admissible; fault (“ran a red light”) not pertinent → redact",2.5,"e_evidence.5"]],
model:"(a) Dave’s statements at the scene. Hearsay is an out-of-court statement offered for its truth. But a statement offered against a party that was made by that party is not hearsay (FRE 801(d)(2)(A)). Dave’s statement “I was looking at a text” is offered against him and is admissible as an opposing party’s statement; his apology “I’m so sorry” is likewise admissible. However, FRE 409 provides that evidence of furnishing, offering, or promising to pay medical, hospital, or similar expenses resulting from an injury is not admissible to prove liability. “I’ll pay your hospital bills” must be excluded. Unlike Rule 408 (compromise negotiations), Rule 409 does not extend to statements of fact accompanying the offer, so the admission about the text remains admissible. The court should sustain the objection as to the offer to pay and overrule it as to the rest.\n\n(b) Police report. The report is an out-of-court statement offered for its truth. (i) Skid marks: Under FRE 803(8)(A)(iii), in a civil case a record of a public office setting out factual findings from a legally authorized investigation is admissible unless the opponent shows a lack of trustworthiness; the officer’s own observations recorded in the course of his duties are also within 803(8)(A)(ii) (matters observed under a legal duty to report — the law-enforcement limitation applies only in criminal cases). Nothing suggests untrustworthiness. That portion is admissible. (ii) Bystander’s statement: This is hearsay within hearsay (FRE 805); each layer needs an exception. The officer’s recording is covered by 803(8), but the bystander had no duty to report, so the bystander’s statement needs its own exception. No foundation shows the bystander was under the stress of excitement (803(2)) or describing the event as it occurred (803(1)), and the bystander is unidentified. That portion should be excluded (redacted). The officer’s availability does not matter for 803 exceptions.\n\n(c) Impeachment by conviction. Under FRE 609(a)(1), convictions are admissible for impeachment only if the crime was punishable by death or imprisonment for more than one year. Shoplifting punishable by six months does not qualify. Under 609(a)(2), any crime is admissible regardless of punishment if proving its elements required proving a dishonest act or false statement; shoplifting (theft) generally does not require such proof and is not treated as a crimen falsi offense. The question is improper and the objection should be sustained. (Pam might try to ask about the underlying conduct under 608(b), but most courts hold theft is not sufficiently probative of untruthfulness, and in any event the question as phrased asks about the conviction.)\n\n(d) Statement to physician. FRE 803(4) excepts statements made for, and reasonably pertinent to, medical diagnosis or treatment that describe medical history, symptoms, or their inception or general cause. “A car slammed into my door, and now my neck hurts” describes the mechanism of injury and symptoms and is pertinent to treatment. But “ran a red light” assigns fault and is not reasonably pertinent to diagnosis or treatment. The court should admit the statement with the fault portion redacted."},
{id:"e_property",s:"property",title:"Blackacre (Recording, Licenses, Mortgages)",
facts:"Owen owned Blackacre, a house on two acres in the State of Franklin, subject to a recorded mortgage held by Bank. In 2020, Owen sold Blackacre to Ana by a deed that Ana did not record. Ana moved in immediately and has lived there continuously since. In 2022, Owen, short of cash, executed a second deed to Blackacre to Ben, who paid fair value. Ben searched the land records but never visited the property. Ben recorded his deed promptly.\n\nIn 2021, Ana orally told her neighbor, Nick, that he could build and use a gravel driveway across the corner of Blackacre to reach his garage. Nick spent $15,000 building the driveway and has used it since. Ana now wants to stop Nick’s use.\n\nWhen Ana bought Blackacre, her deed recited that she took “subject to” Bank’s mortgage. The mortgage loan is now in default.\n\nFranklin’s recording act provides: “No conveyance of real property is good against a subsequent purchaser for value and without notice unless it is recorded.”",
call:["1. As between Ana and Ben, who owns Blackacre? Explain.","2. Can Ana stop Nick from using the driveway? Explain.","3. Is Ana personally liable on the mortgage debt, and what can Bank do? Explain."],
issues:[["Identifies notice statute; protects subsequent BFP for value without notice",1,"e_property.0"],["Notice includes actual, record, and inquiry notice; Ana’s open possession gives inquiry notice — a reasonable inspection would have revealed her claim",2,"e_property.1"],["Ben is not a BFP → Ana prevails (Ben’s prompt recording irrelevant under notice statute)",1,"e_property.2"],["Oral grant of an easement violates Statute of Frauds → license, normally revocable",1.5,"e_property.3"],["Irrevocable license / easement by estoppel: licensor knew licensee would rely; substantial expenditure in reasonable reliance → Ana likely cannot revoke (at least until value of investment realized)",2,"e_property.4"],["“Subject to” — grantee not personally liable; Owen remains personally liable",1.5,"e_property.5"],["Bank may foreclose on Blackacre (mortgage lien survives conveyance); deficiency only against Owen",1,"e_property.6"]],
model:"1. Ana v. Ben. At common law, the first in time prevails: Owen had nothing left to convey to Ben after deeding Blackacre to Ana. Franklin’s statute is a notice statute: an unrecorded conveyance is void against a subsequent purchaser for value without notice, regardless of who records first. Ben paid fair value, so the question is notice. Notice includes actual notice, record (constructive) notice, and inquiry notice. A purchaser is charged with what a reasonable inspection of the property would have revealed. Ana has been in open, continuous possession since 2020, living in the house. Had Ben visited, he would have discovered her occupancy and, upon inquiry, her deed. Because Ben is charged with inquiry notice, he is not a bona fide purchaser, and the recording act does not protect him. His prompt recording is irrelevant under a notice statute. Ana owns Blackacre (Ben’s remedy is against Owen, e.g., for breach of deed covenants or fraud).\n\n2. Nick’s driveway. An easement is an interest in land and generally must be created by a writing that satisfies the Statute of Frauds. Ana’s oral permission therefore created only a license — permission to use land that is ordinarily revocable at the will of the licensor. However, a license becomes irrevocable (often treated as an easement by estoppel) when the licensor knows or reasonably should expect that the licensee will rely on it, and the licensee makes substantial expenditures in reasonable reliance. Ana gave permission specifically to build a driveway; Nick spent $15,000 doing so. Allowing revocation would be inequitable. Most courts would hold the license irrevocable for as long as reasonably necessary to recoup the value of Nick’s investment, or as long as the nature of the license calls for. Ana likely cannot stop Nick’s use now. (No prescriptive easement exists, because Nick’s use was permissive and of insufficient duration.)\n\n3. Mortgage. A mortgage is a lien that follows the land; when mortgaged property is conveyed, the grantee takes subject to the mortgage. A grantee who takes “subject to” a mortgage is not personally liable on the debt; only a grantee who “assumes” the mortgage becomes personally liable. Ana took subject to the mortgage, so she is not personally liable. Owen, the original mortgagor, remains personally liable on the note. On default, Bank may foreclose on Blackacre (Ana may redeem by paying the debt before the sale to protect her ownership); if the sale proceeds are insufficient, Bank may seek a deficiency judgment against Owen, not Ana. (If the mortgage contains a due-on-sale clause, Bank could also have accelerated upon the transfer.)"},
{id:"e_torts",s:"torts",title:"Pizza Delivery Collision (Torts)",
facts:"Dina, age 19, works as a delivery driver for PizzaCo, driving her own car. PizzaCo’s written policy, which Dina signed, forbids drivers from using phones while driving. A Franklin statute prohibits “texting while operating a motor vehicle” and imposes a fine. While delivering a pizza, Dina read and replied to a text from a friend. Distracted, she failed to see Paul, a pedestrian who was crossing mid-block outside a crosswalk in violation of a city ordinance. Dina’s car struck Paul, breaking his leg. At the hospital, a surgeon negligently set the fracture, requiring a second surgery.\n\nPizzaCo had hired Dina despite knowing that she had received three speeding tickets in the prior year. Paul sues Dina and PizzaCo for negligence.",
call:["1. Is Dina liable to Paul, including for the harm from the second surgery? Explain.","2. Is PizzaCo liable to Paul? Explain.","3. How will Paul’s jaywalking affect his recovery? Explain."],
issues:[["Negligence elements; duty of reasonable care to other users of the road",1,"e_torts.0"],["Breach via negligence per se: texting statute; Paul within protected class (public on roads) and harm of the type prevented; no excuse",1.5,"e_torts.1"],["Actual and proximate cause; negligent medical treatment is a foreseeable intervening cause → Dina liable for aggravation",1.5,"e_torts.2"],["Respondeat superior: employee acting within scope (delivering pizza) — violation of employer’s rule does not take conduct outside scope (forbidden manner of authorized act)",2,"e_torts.3"],["Direct negligence: negligent hiring/retention given known speeding tickets; causation question",1,"e_torts.4"],["Comparative fault: pure vs. modified; jaywalking (ordinance) as negligence per se or evidence of negligence; reduces recovery; contributory negligence minority bar",2,"e_torts.5"],["Joint and several liability / apportionment (Ohio R.C. 2307.22: >50% defendant jointly and severally liable for economic damages; ≤50% proportionate share; noneconomic damages several only; intentional-tort exception; principal and agent count as one party, R.C. 2307.24)",1,"e_torts.6"]],
model:"1. Dina’s liability. To recover in negligence, Paul must show duty, breach, actual and proximate causation, and damages. Drivers owe a duty of reasonable care to others on or near the roadway, including pedestrians. Breach: a reasonable driver does not read and send texts while driving. Moreover, under negligence per se, a statute can establish the standard of care when the plaintiff is in the class the statute protects and the harm is of the type it was designed to prevent. Franklin’s texting statute protects the traveling public, including pedestrians, from accidents caused by distracted driving — exactly what occurred. No excuse (emergency, impossibility) appears. Under the majority rule, the violation establishes duty and breach. Causation: but for her texting, Dina would have seen Paul and avoided him; being struck by a car is the foreseeable result. Paul suffered a broken leg. As to the second surgery, negligent medical treatment of injuries the defendant caused is a foreseeable intervening force that does not supersede the original negligence. Dina is liable for the aggravation as well (the surgeon is also liable for the harm he caused).\n\n2. PizzaCo’s liability. Vicarious liability: Under respondeat superior, an employer is liable for torts its employee commits within the scope of employment — conduct of the kind the employee is hired to perform, within authorized time and space limits, motivated at least in part to serve the employer. Dina was making a delivery, the core of her job, when the accident occurred. Reading a personal text was a brief deviation in the manner of performing an authorized act, not a frolic. An employer’s prohibition on a particular manner of performing the work (no phones) does not take the conduct outside the scope of employment; otherwise employers could avoid liability simply by forbidding negligence. That Dina used her own car does not change the analysis. PizzaCo is vicariously liable. Direct liability: An employer is a
