OUTLINES.civpro=[
{id:'o.civpro.1',t:'Subject-matter jurisdiction, supplemental jurisdiction & removal',b:[
'Federal question (§1331): the claim must arise under federal law on the face of a well-pleaded complaint. A federal defense does not count.',
'Diversity (§1332): complete diversity (no plaintiff shares citizenship with any defendant) and more than $75,000, exclusive of interest and costs. Citizenship is measured when the suit is filed.',
'Citizenship: an individual is a citizen of their domicile. A corporation is a citizen of its state(s) of incorporation and its principal place of business (“nerve center,” Hertz). An LLC or partnership is a citizen of every state where any member is a citizen.',
'Aggregation: one plaintiff may add up all of their claims against one defendant. Co-plaintiffs or claims against separate defendants generally cannot be aggregated unless they are enforcing a common, undivided right.',
'Supplemental jurisdiction (§1367): covers claims that share a common nucleus of operative fact with an anchor claim. In diversity-only cases, §1367(b) bars plaintiffs’ claims against persons joined under Rules 14, 19, 20 or 24 when they would destroy §1332 requirements. The court may decline under §1367(c), e.g., if the federal claims are dismissed early.',
'Removal: only defendants may remove, to the federal district embracing the state court. The notice is due within 30 days after service, and all properly joined and served defendants must consent. Diversity cases are not removable if any properly joined and served defendant is a forum citizen, or more than 1 year after commencement absent bad faith. Lack of SMJ can be raised at any time and cannot be waived.']},
{id:'o.civpro.2',t:'Personal jurisdiction, service & venue',b:[
'Two steps: the state long-arm statute must authorize jurisdiction and it must satisfy due process.',
'Specific jurisdiction requires (1) purposeful availment of the forum, (2) a claim that arises out of or relates to the forum contacts (Ford, 2021), and (3) fair play and substantial justice (burden on the defendant, the forum’s interest, the plaintiff’s interest, efficiency).',
'General jurisdiction (any claim) lies only where a defendant is “at home.” For an individual that is the domicile; for a corporation, its place of incorporation and principal place of business. In-state personal service on an individual also suffices (Burnham).',
'PJ, venue and service defenses are waived if omitted from the first Rule 12 motion or, if no motion is made, from the answer (Rule 12(h)(1)).',
'Venue (§1391): any district where a defendant resides if all defendants reside in the forum state, or a district where a substantial part of the events or property is located. Fallback: any district with PJ over a defendant.',
'Transfer: §1404(a) moves a case from a proper venue for convenience and the interest of justice, and the transferor’s law follows the case. §1406 covers improper venue (dismiss or transfer). Forum non conveniens dismisses a case when the better forum is abroad.']},
{id:'o.civpro.3',t:'Erie & choice of law',b:[
'In diversity and supplemental claims, a federal court applies state substantive law (including the forum state’s choice-of-law rules, Klaxon) and federal procedural law.',
'If a valid Federal Rule directly covers the issue, apply it (Hanna; Rules Enabling Act).',
'With no on-point federal rule, ask whether ignoring state law would be outcome-determinative in a way that encourages forum shopping or inequitable administration (the twin aims of Erie). Also weigh strong federal interests (Byrd).',
'Statutes of limitation, burdens of proof and most presumptions are substantive for Erie purposes.']},
{id:'o.civpro.4',t:'Pleadings, amendment & joinder',b:[
'Rule 8 requires a short and plain statement showing entitlement to relief. The facts must make the claim plausible (Twombly/Iqbal). Fraud and mistake must be pleaded with particularity (Rule 9(b)).',
'The answer is due 21 days after service, or 60 days after a waiver request is sent if service is waived. A Rule 12 motion postpones the answer.',
'Amendment: once as a matter of course within 21 days after serving, or 21 days after a responsive pleading or Rule 12(b), (e) or (f) motion. Later amendments need consent or leave, which is freely given when justice requires. Relation back (15(c)) requires the same conduct, transaction or occurrence. A new defendant also must have had notice within the Rule 4(m) period (90 days) and must have known it would have been sued but for a mistake about identity.',
'Claims: Rule 18 lets a party join any claims against an opponent. A counterclaim from the same transaction or occurrence is compulsory (13(a)) and is lost if not asserted. Crossclaims against co-parties must arise from the same transaction or occurrence (13(g)).',
'Parties: permissive joinder (20) needs the same transaction or series plus a common question. Impleader (14) brings in a nonparty who is or may be liable to the defendant for all or part of the claim (indemnity or contribution). A defendant may implead within 14 days after answering without leave.',
'Required parties (19): join if feasible. If not feasible, the court decides in equity and good conscience whether to proceed. Class actions (23(a)) need numerosity, commonality, typicality and adequacy, plus one 23(b) category. A (b)(3) class needs predominance and superiority, plus notice and opt-out.']},
{id:'o.civpro.5',t:'Discovery, sanctions & summary judgment',b:[
'Scope: any nonprivileged matter relevant to any party’s claim or defense and proportional to the needs of the case (Rule 26(b)(1)).',
'Work product: documents prepared in anticipation of litigation. Fact work product is discoverable on a showing of substantial need and inability to obtain the equivalent without undue hardship. Opinion work product (mental impressions) is almost never discoverable.',
'Required disclosures: initial disclosures (26(a)(1)), expert disclosures and reports, and pretrial disclosures. Parties must supplement when disclosures become incomplete.',
'Rule 37 covers motions to compel (after a good-faith conferral) and escalating sanctions. Lost ESI triggers sanctions if reasonable steps were not taken; the severest sanctions require intent to deprive.',
'Rule 11: certifications in signed filings. Sanctions motions require a 21-day safe harbor to withdraw or correct.',
'Summary judgment (Rule 56) is proper if there is no genuine dispute of material fact and the movant is entitled to judgment as a matter of law. The evidence is viewed in the light most favorable to the nonmovant, and the court does not weigh credibility.']},
{id:'o.civpro.6',t:'Trial, post-trial, appeal & preclusion',b:[
'Seventh Amendment: jury right for legal claims (damages) in federal court. When legal and equitable claims share issues, the jury decides the common issues first (Beacon Theatres). A jury demand is due within 14 days after service of the last pleading directed to the issue.',
'JMOL (Rule 50(a)) may be made after the opponent has been fully heard. A renewed JMOL (50(b)) is due within 28 days after judgment and requires a prior 50(a) motion. A new-trial motion (59) is also due within 28 days.',
'Rule 60(b) relief from judgment: mistake, newly discovered evidence or fraud must be raised within a reasonable time and no more than 1 year after judgment. Void judgments and other grounds require only a reasonable time.',
'Appeal: the final judgment rule (§1291). The notice of appeal is due within 30 days after entry of judgment (60 if the U.S. is a party). Exceptions include orders on injunctions (§1292(a)(1)), certified interlocutory appeals (§1292(b)), the collateral order doctrine, Rule 23(f) class certification orders, and mandamus.',
'Claim preclusion: same claim (same transaction), same parties or privies, valid final judgment on the merits.',
'Issue preclusion: same issue, actually litigated and determined, essential to the judgment, asserted against someone who was a party with a full and fair opportunity to litigate. Nonmutual defensive use is generally allowed. Nonmutual offensive use is discretionary (Parklane factors).']}];
OUTLINES.conlaw=[
{id:'o.conlaw.1',t:'Justiciability & the Eleventh Amendment',b:[
'Standing: injury in fact (concrete, particularized, actual or imminent), causation, and redressability. Organizations may sue for their members if a member has standing, the interests are germane, and member participation is not needed. Generalized taxpayer grievances do not confer standing; the Establishment Clause exception is narrow.',
'Ripeness: no premature, hypothetical claims. Mootness: a live controversy must exist throughout. Exceptions include wrongs capable of repetition yet evading review, voluntary cessation, and certified class actions.',
'Political questions: issues committed to the political branches or lacking judicially manageable standards (e.g., the Guarantee Clause, partisan gerrymandering).',
'Eleventh Amendment/sovereign immunity: bars private suits for damages against an unconsenting state in federal court. Exceptions: (1) state consent (waiver); (2) valid congressional abrogation by an unmistakably clear statement under §5 of the Fourteenth Amendment (congruent and proportional), the Bankruptcy Clause (Central Va. Community College v. Katz, 2006), or Congress’s war powers (Torres v. Texas Dep’t of Public Safety, 2022). Congress generally cannot abrogate under its ordinary Article I powers such as the Commerce Clause (Seminole Tribe, 1996); (3) suits against state officers for prospective injunctive relief (Ex parte Young). Cities and counties are not protected.']},
{id:'o.conlaw.2',t:'Federal powers & separation of powers',b:[
'Commerce power: channels, instrumentalities, and activities that substantially affect interstate commerce. Economic activity may be aggregated (Wickard, Raich). Noneconomic activity generally may not (Lopez, Morrison). Congress cannot compel people to enter commerce (NFIB).',
'Taxing and spending for the general welfare. Spending conditions must be unambiguous, related to the federal interest, and not coercive (Dole; NFIB).',
'Section 5 of the Fourteenth Amendment: Congress may enforce, not redefine, rights. Remedies must be congruent and proportional (Boerne).',
'Anti-commandeering (Tenth Amendment): Congress cannot order states to legislate or regulate, or conscript state officers (New York, Printz, Murphy). Generally applicable laws may reach states.',
'Presidential power follows the Youngstown framework: maximum with congressional authorization, a “zone of twilight” when Congress is silent, and lowest against Congress’s will. The President appoints principal officers with Senate consent. Congress may vest appointment of inferior officers elsewhere but cannot appoint executive officers itself. The President may generally remove principal executive officers at will.',
'Treaties need Senate ratification by two-thirds. Executive agreements do not, but they cannot override federal statutes.']},
{id:'o.conlaw.3',t:'Limits on state power',b:[
'Preemption: express, field, or conflict (impossibility or obstacle).',
'Dormant Commerce Clause: a law that discriminates against interstate commerce is virtually per se invalid unless necessary to a legitimate local interest with no reasonable nondiscriminatory alternative. Exceptions: the market-participant exception and congressional consent. A nondiscriminatory law is struck only if its burden clearly exceeds local benefits (Pike).',
'Article IV Privileges and Immunities: protects citizens (not corporations or aliens) against state discrimination on fundamental rights such as earning a livelihood, unless there is a substantial reason closely related to the discrimination.',
'Intergovernmental immunity: states may not directly tax or regulate the federal government or discriminate against it.',
'Full faith and credit is owed to sister-state judgments rendered with jurisdiction.']},
{id:'o.conlaw.4',t:'Due process, equal protection & takings',b:[
'State action is required: government conduct, a traditional exclusive public function, or significant entanglement or encouragement.',
'Procedural due process: identify a protected liberty or property interest (a legitimate claim of entitlement), then balance what process is due (Mathews: private interest, risk of error and value of added safeguards, government interest).',
'Substantive due process: fundamental rights (marriage, procreation, contraception, family relations and child-rearing, travel, voting) get strict scrutiny. Dobbs (2022) held there is no federal constitutional right to abortion. Other laws get rational basis.',
'Equal protection: strict scrutiny (necessary to a compelling interest, narrowly tailored) for race, national origin, and state alienage classifications (with a political-function exception). Intermediate scrutiny (substantially related to an important interest; an “exceedingly persuasive justification”) for sex and nonmarital children. Rational basis otherwise, where the challenger bears the burden. Discriminatory purpose is required; disparate impact alone is not enough.',
'Takings: per se takings for permanent physical occupations (including Cedar Point access easements) and total wipeouts of economic value (Lucas). Otherwise apply Penn Central (economic impact, interference with investment-backed expectations, character of the action). Exactions need an essential nexus and rough proportionality (Nollan/Dolan). The remedy is just compensation for public use.']},
{id:'o.conlaw.5',t:'Freedom of speech',b:[
'Content-based regulation gets strict scrutiny. Content-neutral time, place and manner rules in public or designated forums must be narrowly tailored to a significant interest and leave ample alternative channels. Limited and nonpublic forums need only be viewpoint-neutral and reasonable.',
'Less protected or unprotected speech: incitement (directed to and likely to produce imminent lawless action, Brandenburg), true threats (at least recklessness as to the threatening nature, Counterman), fighting words, obscenity (Miller test), and child pornography.',
'Defamation limits: public officials and figures must prove actual malice (knowledge of falsity or reckless disregard) by clear and convincing evidence. Private plaintiffs on matters of public concern need at least negligence, and actual malice for presumed or punitive damages.',
'Commercial speech (Central Hudson): lawful, non-misleading speech may be regulated if the regulation directly advances a substantial interest and is no more extensive than necessary.',
'Symbolic conduct (O’Brien): an important interest unrelated to suppressing expression, with an incidental restriction no greater than essential. Prior restraints carry a heavy presumption of invalidity. Vague or substantially overbroad laws are void.',
'Government employees’ speech made pursuant to official duties is unprotected (Garcetti). Speech as a citizen on public concerns is protected under Pickering balancing.']},
{id:'o.conlaw.6',t:'Religion clauses',b:[
'Free Exercise: neutral, generally applicable laws need only a rational basis (Employment Division v. Smith). Laws that target religion or are not generally applicable (secular exemptions or individualized discretion; Fulton, Tandon) trigger strict scrutiny.',
'A state may not exclude religious schools or persons from a generally available public benefit because of religious status or use (Trinity Lutheran, Espinoza, Carson).',
'Establishment Clause: interpreted by reference to historical practices and understandings (Kennedy v. Bremerton, 2022, abandoning Lemon). Government may not coerce religious exercise or prefer one denomination over another (denominational preferences get strict scrutiny).']}];
OUTLINES.contracts=[
{id:'o.contracts.1',t:'Governing law, offer & acceptance',b:[
'UCC Article 2 governs sales of goods. The common law governs services and land. Mixed contracts follow their predominant purpose. UCC merchant rules apply to dealers in goods of the kind or those with special knowledge.',
'An offer is a manifestation of willingness to bargain that creates a power of acceptance. Advertisements are generally not offers. A revocable offer ends on revocation (effective on receipt; indirect revocation counts), rejection or counteroffer, lapse, or death or incapacity of either party.',
'UCC firm offer (§2-205): a merchant’s signed written assurance that an offer will be held open is irrevocable without consideration for the stated time or a reasonable time, never more than 3 months. Common-law options need consideration. Part performance of a unilateral-contract offer makes it irrevocable for a reasonable time.',
'Mailbox rule: acceptance is effective on dispatch. Rejections, revocations and acceptances under an option are effective on receipt.',
'Common law follows the mirror-image rule. Under UCC §2-207, a definite expression of acceptance works even with additional or different terms. Between merchants, additional terms become part of the contract unless the offer limits acceptance, they materially alter it, or there is timely objection. Most courts knock out conflicting different terms and fill gaps with the UCC. If the writings do not form a contract but conduct does, the terms are those the writings agree on plus gap-fillers (§2-207(3)).']},
{id:'o.contracts.2',t:'Consideration, promissory estoppel & modification',b:[
'Consideration is a bargained-for exchange of legal value. Past consideration and illusory promises do not count. Requirements and output contracts are valid (with a good-faith limit).',
'Preexisting duty rule: a promise to do what one is already bound to do is not consideration for a modification at common law, unless there are new duties or unanticipated circumstances (Restatement §89).',
'UCC §2-209: modifications need no consideration but must be in good faith. The statute of frauds applies if the modified contract is within it.',
'Promissory estoppel: a promise that the promisor should reasonably expect to induce reliance, which does induce reliance, is enforceable to the extent needed to avoid injustice.']},
{id:'o.contracts.3',t:'Defenses to formation & enforcement',b:[
'Statute of frauds: marriage; contracts not performable within one year; interests in land; executor’s promise to pay estate debts personally; goods for $500 or more; suretyship. A writing signed by the party to be charged is required. Land and services exceptions include part performance and full performance.',
'UCC §2-201: a writing must indicate a contract and state a quantity. Exceptions: merchant’s written confirmation (unless objected to within 10 days), specially manufactured goods, admission in court, and goods paid for or received and accepted.',
'Mutual mistake about a basic assumption with a material effect makes a contract voidable by the adversely affected party unless that party bore the risk. Unilateral mistake also requires that the other party knew or should have known, or that enforcement would be unconscionable.',
'Other defenses: misrepresentation (fraudulent or material, with justified reliance), duress, undue influence, unconscionability (procedural and substantive, measured at formation), illegality, and incapacity. Minors’ contracts are voidable, but minors are liable for necessaries.']},
{id:'o.contracts.4',t:'Terms: parol evidence, interpretation & warranties',b:[
'Parol evidence rule: a final writing bars evidence of prior or contemporaneous agreements that contradict it (partial integration) or that add to it (complete integration). Exceptions: formation defects (fraud, mistake, duress), conditions precedent to effectiveness, interpreting ambiguity, and later modifications.',
'UCC hierarchy: express terms, then course of performance, then course of dealing, then usage of trade. Each may explain or supplement terms.',
'Warranties: express (affirmation, description or sample that is part of the basis of the bargain); implied merchantability (merchant sellers; fit for ordinary purposes); fitness for a particular purpose (seller knows the purpose and the buyer relies on the seller’s skill).',
'Disclaimers: merchantability must be mentioned, and if written must be conspicuous. A fitness disclaimer must be written and conspicuous. “As is” disclaims implied warranties.']},
{id:'o.contracts.5',t:'Performance, breach & excuse',b:[
'Express conditions require strict compliance, though they can be excused by waiver, prevention, or to avoid forfeiture. Common law: substantial performance triggers the other side’s duty, and a material breach suspends it.',
'UCC perfect tender: the buyer may reject any nonconformity. The seller may cure if time remains, or with reasonable grounds to believe the tender would be accepted (§2-508). Installment contracts may be rejected only on substantial impairment (§2-612). A buyer may revoke acceptance if a nonconformity substantially impairs value and was hard to discover or acceptance relied on cure.',
'Anticipatory repudiation: an unequivocal statement or act. The non-repudiating party may sue immediately, suspend, or await performance for a commercially reasonable time. Retraction is possible until the other side relies or treats the repudiation as final.',
'Adequate assurance (§2-609; also widely applied at common law): with reasonable grounds for insecurity, a party may demand assurance in writing. Failure to give it within a reasonable time (no more than 30 days) is a repudiation.',
'Excuse: impossibility or impracticability (an unforeseen event whose nonoccurrence was a basic assumption) and frustration of purpose (the principal purpose is substantially frustrated).',
'Risk of loss without breach (§2-509): in carrier cases, a shipment contract passes risk when goods are duly delivered to the carrier, and a destination contract passes risk on tender at the destination. Goods held by a bailee: on negotiable document, acknowledgment, or (non-negotiable document) a reasonable time. Otherwise, from a merchant seller on the buyer’s receipt, and from a non-merchant on tender. Breach shifts risk (§2-510).']},
{id:'o.contracts.6',t:'Remedies & third parties',b:[
'Expectation damages: put the non-breaching party where performance would have. Consequential damages must be foreseeable at formation (Hadley). Damages must be reasonably certain and are reduced by losses that could reasonably have been avoided (mitigation).',
'Liquidated damages are enforceable if reasonable in light of anticipated or actual harm and the difficulty of proof. Penalties are not enforced.',
'UCC buyer: cover minus contract price, or market minus contract price, plus incidental and consequential damages. Specific performance for unique goods. Accepted goods: difference in value for breach of warranty.',
'UCC seller: resale minus contract price, contract minus market price, lost profits for a lost-volume seller, or action for the price when goods were accepted or cannot be resold.',
'Equitable remedies: specific performance for land or unique goods. Courts will not order personal services. Restitution is available to prevent unjust enrichment, including for a breaching party’s part performance (net of damages).',
'Third-party beneficiaries: only intended beneficiaries may sue. Their rights vest on assent, material reliance, or suit. Rights are generally assignable unless the assignment materially changes the obligor’s duty or risk. A clause barring assignment of “the contract” is read as barring only delegation of duties. Duties may be delegated except personal ones, and the delegating party remains liable unless there is a novation.']}];
OUTLINES.crim=[
{id:'o.crim.1',t:'Elements, mental states & causation',b:[
'Actus reus: a voluntary act, or an omission where there is a legal duty (statute, relationship, contract, voluntary assumption of care, or creation of the peril).',
'MPC culpability: purposely, knowingly, recklessly (conscious disregard of a substantial and unjustifiable risk), negligently (should have been aware). When a statute is silent, recklessness is the default.',
'Common-law specific-intent crimes include solicitation, conspiracy, attempt, first-degree premeditated murder, assault with intent, larceny, embezzlement, false pretenses, robbery, burglary and forgery. Murder and arson require malice. Strict-liability crimes include public-welfare offenses and statutory rape.',
'Mistake of fact: an honest mistake negates specific intent. For general-intent crimes the mistake must be honest and reasonable. It is no defense to strict liability. Mistake of law is generally no defense.',
'Causation: actual (but-for) and proximate (a foreseeable result). Unforeseeable intervening acts break the chain; ordinary medical negligence does not.',
'Accomplice liability: aiding or encouraging with intent that the crime be committed. The accomplice is liable for the crime and its foreseeable consequences. Withdrawal requires neutralizing the assistance or timely warning police.']},
{id:'o.crim.2',t:'Homicide',b:[
'Murder = unlawful killing with malice aforethought: intent to kill, intent to inflict serious bodily harm, depraved heart (extreme recklessness), or felony murder.',
'Felony murder: a killing during an inherently dangerous felony (burglary, arson, robbery, rape, kidnapping). The felony must be independent of the killing. Who did the killing matters. Under the majority agency rule, felons are liable only for killings by a felon or co-felon, so they are not liable for any killing by a non-felon (a police officer or the victim), even when the person killed is an innocent bystander. Under the minority proximate-cause rule, felons can be liable for a killing by a non-felon, though most proximate-cause jurisdictions still impose no liability when the person killed is a co-felon. The MBE often tests the bystander version: a police officer or victim shoots at a fleeing felon and kills a bystander.',
'First-degree murder is usually statutory: premeditated and deliberate killings and enumerated-felony murders. Other murder is second degree.',
'Voluntary manslaughter: a killing in the heat of passion from adequate provocation, with no reasonable cooling time and no actual cooling. Some states also recognize imperfect self-defense.',
'Involuntary manslaughter: criminal negligence or recklessness short of depraved heart, or misdemeanor-manslaughter.']},
{id:'o.crim.3',t:'Property crimes, other crimes & inchoate offenses',b:[
'Larceny: trespassory taking and carrying away of another’s personal property with intent to permanently deprive. Embezzlement: fraudulent conversion by one in lawful possession. False pretenses: obtaining title by a knowing false representation of fact meant to defraud. Larceny by trick: obtaining possession only, by fraud.',
'Robbery: larceny from the person or presence by force or threat of immediate force. Common-law burglary: breaking and entering the dwelling of another at night with intent to commit a felony inside (modern statutes broaden this). Arson: malicious burning of another’s dwelling.',
'Solicitation: asking another to commit a crime with intent that it be committed. It merges into conspiracy or the completed crime.',
'Conspiracy: an agreement between two or more people (MPC: unilateral) with intent to agree and to achieve the objective. The modern majority requires an overt act. It does not merge. Each member is liable for foreseeable crimes in furtherance (Pinkerton). Withdrawal requires notice to all members (MPC: thwarting success) and does not undo the conspiracy itself.',
'Attempt: specific intent plus a substantial step (MPC) or dangerous proximity. Factual impossibility is no defense. True legal impossibility (the act is not a crime) is. Attempt merges into the completed crime.']},
{id:'o.crim.4',t:'Defenses',b:[
'Self-defense: a reasonable belief that force is necessary against imminent unlawful force. Deadly force is allowed only against imminent deadly force or serious bodily harm. Majority: no duty to retreat. Minority: retreat if completely safe, except in one’s home. Initial aggressors regain the right by withdrawing or when met with escalated deadly force.',
'Defense of others: the same scope as self-defense. Defense of property: reasonable non-deadly force only.',
'Necessity: a lesser harm to avoid a greater one, never for intentional killing. Duress: a threat of death or serious bodily harm; it is no defense to murder.',
'Insanity: M’Naghten (did not know the nature and quality of the act or that it was wrong); irresistible impulse; MPC (lacked substantial capacity to appreciate wrongfulness or conform conduct); Durham (product of mental disease).',
'Intoxication: voluntary intoxication can negate only specific intent (and premeditation). Involuntary intoxication is treated like insanity. Entrapment requires government inducement and a defendant not predisposed (majority subjective test).']},
{id:'o.crim.5',t:'Fourth Amendment',b:[
'A search occurs when the government intrudes on a reasonable expectation of privacy (Katz) or physically trespasses to gather information (Jones). Historical cell-site location data requires a warrant (Carpenter). Standing: the defendant’s own privacy interest.',
'Warrants need probable cause and particularity. Exceptions: search incident to lawful arrest (person and wingspan; vehicles only if the arrestee is unsecured and within reach, or it is reasonable to believe evidence of the crime of arrest is inside, Gant); the automobile exception (probable cause, the whole car and containers); plain view (lawful vantage and immediately apparent); voluntary consent (apparent authority counts); exigent circumstances (hot pursuit, destruction of evidence, emergency aid); inventory; and special needs.',
'Terry stop: reasonable suspicion of criminal activity. Frisk: reasonable suspicion that the person is armed and dangerous, with a pat-down for weapons (plain feel).',
'Exclusionary rule and fruit of the poisonous tree. Exceptions: independent source, inevitable discovery, attenuation, good-faith reliance on a warrant or law, and knock-and-announce violations (Hudson). Illegally obtained evidence may be used to impeach the defendant.']},
{id:'o.crim.6',t:'Fifth & Sixth Amendments, trial rights',b:[
'Miranda applies to custodial interrogation. Invoking silence must be scrupulously honored. Invoking counsel must be unambiguous and stops questioning on any crime (Edwards) until counsel is present or after a 14-day break in custody (Shatzer). A voluntary statement taken in violation of Miranda may be used to impeach. Physical fruits are admissible.',
'Sixth Amendment counsel attaches at formal charging, is offense-specific (Blockburger test), and covers all critical stages, including post-charge lineups.',
'Double jeopardy: offenses are the same unless each requires proof of an element the other does not (Blockburger). Jeopardy attaches when the jury is sworn (bench trial: first witness sworn). Separate sovereigns may each prosecute.',
'Confrontation Clause: testimonial hearsay is barred unless the declarant is unavailable and was subject to prior cross-examination (Crawford). Statements meant to meet an ongoing emergency are non-testimonial.',
'Other rights: jury trial for offenses punishable by more than 6 months; unanimity for serious state offenses (Ramos); Brady disclosure of material exculpatory evidence; ineffective assistance (Strickland: deficient performance plus prejudice).']}];
OUTLINES.evidence=[
{id:'o.evidence.1',t:'Relevance & character evidence',b:[
'Relevant evidence has any tendency to make a consequential fact more or less probable (401). Exclude it if probative value is substantially outweighed by unfair prejudice, confusion, misleading the jury, delay or cumulativeness (403).',
'Character evidence to prove conduct is barred (404(a)). Exceptions: a criminal defendant may offer a pertinent trait, and the prosecution may rebut. If the defendant offers a victim’s trait, the prosecution may offer the same trait of the defendant. In homicide, the prosecution may show the victim’s peacefulness to rebut a claim that the victim was the first aggressor.',
'Other acts (404(b)) may be offered for a non-propensity purpose: motive, intent, absence of mistake, identity, common plan, opportunity or knowledge. The prosecution must give notice in criminal cases. 403 still applies.',
'Methods (405): reputation or opinion. Specific instances may be inquired into on cross, or used when character is an essential element (e.g., defamation, negligent entrustment). Habit and routine practice are admissible (406).',
'Policy exclusions: subsequent remedial measures, which may still be offered for ownership, control, feasibility if disputed, or impeachment (407); compromise offers and statements, with a narrow criminal exception (408); offers to pay medical expenses, though accompanying statements are admissible (409); plea discussions (410); liability insurance, except for other purposes (411).',
'Sex cases: rape shield (412) with narrow exceptions. Prior sexual assaults or child molestation are admissible as propensity evidence (413–415).']},
{id:'o.evidence.2',t:'Witnesses & impeachment',b:[
'Lay witnesses need personal knowledge. Leading questions are generally barred on direct but allowed for hostile witnesses, adverse parties and preliminary matters. Refreshing recollection (612) is not evidence, and the adverse party may inspect and introduce the writing.',
'Bias or interest: extrinsic evidence is allowed (after a foundation in most courts).',
'Prior inconsistent statement (613): extrinsic proof is allowed if the witness has a chance to explain or deny. It is substantive evidence only if made under penalty of perjury at a prior proceeding or deposition (801(d)(1)(A)).',
'Character for truthfulness (608): opinion or reputation only. Specific instances of untruthfulness may be asked about on cross, with no extrinsic evidence.',
'Convictions (609): crimes of dishonesty or false statement are always admitted for any witness. Felonies: 403 balancing for non-defendant witnesses; for an accused, probative value must outweigh prejudice. Convictions more than 10 years old require probative value that substantially outweighs prejudice, plus notice.',
'Other methods: sensory or mental defects, and contradiction (no extrinsic evidence on collateral matters). Rehabilitation: truthful character only after an attack; prior consistent statements to rebut fabrication or rehabilitate.']},
{id:'o.evidence.3',t:'Hearsay: definition & non-hearsay',b:[
'Hearsay is an out-of-court statement offered to prove the truth of the matter asserted. Not hearsay: effect on the listener, verbal acts (contract words, defamation), impeachment, and circumstantial evidence of the declarant’s knowledge or state of mind.',
'Prior statements of a testifying witness subject to cross (801(d)(1)): inconsistent statements under oath at a prior proceeding; consistent statements offered to rebut fabrication or to rehabilitate; identification of a person.',
'Opposing party statements (801(d)(2)): the party’s own statement, adopted statements (including silence when a reasonable person would deny), authorized statements, statements by an agent or employee on a matter within the scope of the relationship while it existed, and co-conspirator statements during and in furtherance of the conspiracy. The statement itself is considered but is not alone sufficient.',
'Hearsay within hearsay: each layer needs an exception.']},
{id:'o.evidence.4',t:'Hearsay exceptions',b:[
'Declarant availability immaterial (803): present sense impression; excited utterance; then-existing mental, emotional or physical condition, including intent to show future acts (but not memory to prove the fact remembered, except about the declarant’s will); statements for medical diagnosis or treatment (not fault); recorded recollection (read to the jury, not an exhibit unless offered by the adverse party).',
'Business records (803(6)): made at or near the time by someone with knowledge, kept in the regular course, as a regular practice. Foundation comes from a custodian or certification. Public records (803(8)) exclude matters observed by law enforcement when offered against a criminal defendant. Learned treatises are read into the record if established as reliable.',
'Declarant unavailable (804): former testimony (opportunity and similar motive to develop it); dying declaration (homicide prosecutions or civil cases, made while believing death is imminent, about its cause); statement against interest (criminal exposure offered in a criminal case needs corroborating circumstances); personal or family history; forfeiture by wrongdoing.',
'Unavailability: privilege, refusal, lack of memory, death or illness, or absence despite reasonable efforts. Not unavailable if the proponent caused it.',
'Residual exception (807): sufficient guarantees of trustworthiness, more probative than other reasonably available evidence, with notice. In criminal cases, check the Confrontation Clause overlay (Crawford).']},
{id:'o.evidence.5',t:'Writings, opinions, judicial notice & privileges',b:[
'Authentication (901): evidence sufficient to support a finding that the item is what the proponent claims. Some items are self-authenticating (902: certified public records, newspapers, trade inscriptions, certified business records).',
'Best evidence rule (1002): the original is required to prove the contents of a writing, recording or photo when the contents are at issue. Duplicates are admissible unless authenticity is genuinely questioned or it would be unfair (1003). Originals are excused if lost or destroyed without bad faith (1004). Summaries of voluminous records are allowed (1006).',
'Lay opinion (701): rationally based on perception and helpful, not specialized. Expert (702, amended 2023): the proponent must show by a preponderance that the expert is qualified, the testimony will help, it rests on sufficient facts, and reliable methods were reliably applied. Experts may rely on inadmissible facts experts reasonably rely on (703). In criminal cases, no opinion on whether the defendant had the mental state that is an element (704(b)).',
'Judicial notice (201): facts not subject to reasonable dispute. In civil cases the jury must accept them; in criminal cases the jury may.',
'Privileges: federal common law governs except where state law supplies the rule of decision (501). Attorney-client: confidential communications for legal advice. Exceptions: crime-fraud, and joint clients in later disputes between them. Spousal testimonial privilege (federal criminal; the witness-spouse holds it). Marital communications (confidential communications during marriage; survives divorce). Psychotherapist-patient privilege. Inadvertent disclosure does not waive privilege if reasonable steps were taken (502).']},
{id:'o.evidence.6',t:'Procedure: objections & preliminary questions',b:[
'Preserve error with a timely, specific objection or an offer of proof. Plain error is the exception (103).',
'104(a): the judge decides admissibility by a preponderance and is not bound by evidence rules (except privilege). 104(b): for conditional relevance, the question is whether there is evidence sufficient for a reasonable jury to find the condition.',
'Limiting instructions (105). Rule of completeness (106) for written or oral statements: the remainder in fairness may come in now.',
'Civil presumptions (301) shift the burden of production, not persuasion, unless a statute says otherwise. In diversity, state law governs presumptions on state-law elements (302).']}];
OUTLINES.property=[
{id:'o.property.1',t:'Estates & future interests',b:[
'Fee simple absolute. Fee simple determinable (“so long as,” “until”) ends automatically and leaves a possibility of reverter in the grantor. Fee simple subject to condition subsequent (“but if”) leaves a right of entry that must be exercised. Fee simple subject to executory limitation: the interest is cut short in favor of a third party.',
'Life estate: the life tenant may not commit waste (voluntary, permissive, or ameliorative without consent or changed conditions), and must pay ordinary taxes and mortgage interest up to the value of possession.',
'Remainders follow a natural end. A vested remainder has an ascertained taker and no condition precedent (indefeasibly vested, subject to open, or subject to divestment). Otherwise it is contingent. Executory interests divest a prior estate or spring from the grantor.',
'Rule Against Perpetuities: a contingent remainder, executory interest or class gift (vested subject to open) must vest or fail within 21 years after some life in being at creation. It does not apply to the grantor’s interests (reversion, possibility of reverter, right of entry). Many states reform via wait-and-see or USRAP (90 years). Classic traps: the fertile octogenarian, the unborn widow, and administrative contingencies.']},
{id:'o.property.2',t:'Concurrent ownership',b:[
'Joint tenancy needs the four unities (time, title, interest, possession) and clear survivorship language. A conveyance by one joint tenant severs as to that share, making it a tenancy in common. A mortgage severs in title-theory states but not in lien-theory states (majority).',
'Tenancy by the entirety: married couples with survivorship. Neither spouse can unilaterally sever or encumber it, and one spouse’s creditors cannot reach it. Divorce converts it to a tenancy in common.',
'Tenancy in common is the default, with no survivorship.',
'Each cotenant may possess the whole. No rent is owed to other cotenants absent ouster. Rents from third parties are shared (accounting). Cotenants contribute to taxes and mortgage interest. Improvements are credited only on partition. Partition is in kind or by sale.']},
{id:'o.property.3',t:'Landlord & tenant',b:[
'Tenancies: term of years; periodic (notice equal to one period, max 6 months for year-to-year at common law); at will; at sufferance (holdover). For a holdover, the landlord may evict or bind the tenant to a new periodic tenancy.',
'Landlord duties: deliver actual possession (majority English rule); covenant of quiet enjoyment, where constructive eviction requires substantial interference, notice and failure to fix, and vacating within a reasonable time; implied warranty of habitability for residential leases (the tenant may withhold rent, repair and deduct, or terminate). Retaliatory eviction is barred.',
'Tenant duties: pay rent and avoid waste. If the tenant abandons, most jurisdictions now require the landlord to mitigate (especially residential).',
'Assignment vs. sublease: an assignee is in privity of estate and liable to the landlord for rent and running covenants while in possession. A sublessee is not directly liable to the landlord. The original tenant stays liable on privity of contract unless released. A landlord who consents to one assignment waives the restriction for later ones (Dumpor rule, followed by some).',
'Landlord tort liability is generally limited: common areas, concealed latent defects, negligent repairs, and short-term furnished rentals.']},
{id:'o.property.4',t:'Easements, covenants & servitudes',b:[
'Easements are created by express grant (a writing); by implication from a prior use that was apparent, continuous and reasonably necessary when a common owner severed the land; by necessity (strict necessity at severance, ending when the necessity ends); or by prescription (open and notorious, adverse, continuous for the statutory period).',
'An appurtenant easement benefits a dominant parcel and passes with it. An easement in gross is personal (commercial ones are transferable). The burden binds successors with notice.',
'Termination: merger, written release, abandonment (nonuse plus an act showing intent; nonuse alone is not enough), estoppel, prescription, end of necessity, or condemnation.',
'Real covenant (damages): for the burden to run you need a writing, intent, touch and concern, notice, and horizontal plus vertical privity. The benefit needs vertical privity only (not horizontal).',
'Equitable servitude (injunction): writing (or implied from a common scheme), intent, touch and concern, and notice. No privity needed. A common development scheme can create reciprocal negative servitudes.',
'Defenses: changed conditions so radical that the purpose cannot be achieved, unclean hands, acquiescence, and laches.']},
{id:'o.property.5',t:'Land sales, deeds & mortgages',b:[
'The contract must satisfy the statute of frauds. Part performance (two of possession, payment, improvements) can satisfy it in equity. The seller impliedly promises marketable title at closing (free of reasonable doubt; existing violations of zoning or encumbrances render it unmarketable). The seller must disclose known latent material defects. Equitable conversion (majority): risk of loss is on the buyer once the contract is signed unless the contract or a statute says otherwise.',
'Deeds require delivery (present intent to transfer) and acceptance. A general warranty deed carries present covenants (seisin, right to convey, against encumbrances, breached at delivery) and future covenants (quiet enjoyment, warranty, further assurances, which run with the land). A special warranty deed covers only the grantor’s own acts. A quitclaim deed carries no covenants.',
'Mortgages: lien theory is the majority. A transferee who takes subject to a mortgage has no personal liability; one who assumes it is personally liable, and the original mortgagor remains liable as surety. The equity of redemption exists until the foreclosure sale. Some states add statutory redemption.',
'Priority: generally first in time (as modified by recording acts). A purchase-money mortgage has priority over pre-existing liens against the purchaser. Foreclosure wipes out junior interests that were joined, but not senior ones. Sale proceeds go to the senior debt, then junior debts, then the mortgagor. A deficiency judgment may follow, subject to anti-deficiency limits.']},
{id:'o.property.6',t:'Recording acts & adverse possession',b:[
'Race: the first to record wins. Notice: a subsequent bona fide purchaser for value without notice wins whether or not they record. Race-notice: a subsequent BFP without notice who records first wins.',
'Notice can be actual, record (constructive) or inquiry (possession, reference in the chain). Donees and heirs are not protected purchasers. Under the shelter rule, a transferee from a BFP takes the BFP’s protection.',
'Chain-of-title problems: wild deeds (recorded out of the chain) and deeds recorded late do not give record notice in many jurisdictions. Estoppel by deed (after-acquired title) passes title to the grantee.',
'Adverse possession: actual, open and notorious, exclusive, hostile (without permission), and continuous for the statutory period. Tacking requires privity. Possession under color of title can extend constructively to the whole described parcel. Disability of the owner at the start tolls the period. The possessor gains title to only what was possessed.']}];
OUTLINES.torts=[
{id:'o.torts.1',t:'Intentional torts & privileges',b:[
'Battery: intent to cause a harmful or offensive contact, and the contact results. Assault: intent to cause reasonable apprehension of an imminent harmful or offensive contact. Transferred intent applies among assault, battery, false imprisonment, trespass to land and trespass to chattels.',
'False imprisonment: intentional confinement within boundaries, where the plaintiff is aware of it or harmed by it. IIED: extreme and outrageous conduct, intent or recklessness, and severe emotional distress. Bystanders are covered if present and a close family member (or present and suffering bodily harm).',
'Trespass to land: intentional entry, with no damage required. Trespass to chattels: interference that causes damage or dispossession. Conversion: serious interference warranting full value.',
'Defenses: consent (express or implied; exceeding its scope is a battery); self-defense and defense of others (reasonable force); defense of property (no deadly force); shopkeeper’s privilege (reasonable detention on reasonable suspicion); public necessity (complete); private necessity (pay actual damages).']},
{id:'o.torts.2',t:'Negligence: duty & breach',b:[
'Duty: a reasonable person under the circumstances, owed to foreseeable plaintiffs (Cardozo). Children are held to a child of like age, intelligence and experience unless doing an adult activity. Professionals are held to the customary standard. Physical disabilities are taken into account; mental ones generally are not.',
'Landowners: undiscovered trespassers are owed nothing beyond avoiding willful or wanton harm. Discovered or anticipated trespassers must be warned of known, concealed, artificial dangers. Licensees: warn of known concealed dangers. Invitees: reasonable inspection and repair or warning. Attractive nuisance applies to child trespassers. Many states merge licensees and invitees.',
'Generally there is no duty to rescue. Exceptions: special relationships, creating the peril, voluntarily undertaking a rescue, and duties to control others in special relationships.',
'Negligence per se: violating a statute meant to protect the plaintiff’s class from this type of harm establishes duty and breach (excused if compliance was impossible or more dangerous).',
'Breach: compare burden of precautions vs. probability times gravity of harm (Hand). Custom is evidence. Res ipsa loquitur: the accident normally does not occur without negligence, the instrumentality was in the defendant’s control or responsibility, and the plaintiff did not contribute.']},
{id:'o.torts.3',t:'Causation, damages & emotional distress',b:[
'Actual cause: but-for. Use substantial factor for merged causes. Alternative liability (Summers): the burden shifts to multiple negligent defendants when one caused the harm.',
'Proximate cause: a foreseeable type of harm to a foreseeable plaintiff. Foreseeable intervening forces (rescuers, medical negligence, foreseeable negligence of others) do not cut off liability. Unforeseeable intentional or criminal acts may be superseding. Eggshell plaintiff: the defendant takes the plaintiff as found.',
'Damages: actual injury is required in negligence. Compensatory damages cover economic and noneconomic loss. Punitive damages require malice or reckless indifference. The collateral source rule applies (traditional). Pure economic loss is generally not recoverable in negligence.',
'NIED: a plaintiff in the zone of danger who suffers distress, usually with physical manifestation. Bystanders: closely related, present at the scene, and contemporaneously perceiving the injury. Special relationships (e.g., mishandling a corpse, misdiagnosis) are an exception.']},
{id:'o.torts.4',t:'Defenses & multiple defendants',b:[
'Contributory negligence is a complete bar in the few jurisdictions that keep it (last clear chance mitigates). Comparative negligence: pure, where recovery is reduced by the plaintiff’s share (the MBE default unless stated otherwise), or modified, where recovery is barred if the plaintiff’s fault exceeds 50% or reaches it, depending on the state.',
'Assumption of risk: express (a valid waiver, not for gross negligence or against public policy) or implied (knowing, voluntary). In most comparative-fault states, implied assumption is folded into fault allocation.',
'Joint and several liability for an indivisible injury traditionally. Many states now limit it. Contribution among tortfeasors follows comparative shares. Indemnity is available for vicarious or passive tortfeasors.',
'Vicarious liability: respondeat superior for employees acting within the scope of employment (detour is within scope; frolic is not; intentional torts are within scope if serving the employer or a natural incident of the job). Generally no vicarious liability for independent contractors, except inherently dangerous activities and nondelegable duties. Owners are generally not vicariously liable for car drivers (except permissive-use statutes). Parents are not vicariously liable at common law (direct negligence only).']},
{id:'o.torts.5',t:'Strict liability & products liability',b:[
'Abnormally dangerous activities (high risk of serious harm even with reasonable care, not of common usage, e.g., blasting) are strictly liable for harm within the risk. Wild animals and domestic animals with known dangerous propensities are also strictly liable.',
'Strict products liability: a commercial seller in the chain sells a product in a defective condition that is unreasonably dangerous when it left the seller’s control, and the defect causes injury to a foreseeable user or bystander.',
'Defect types: manufacturing (departs from the intended design); design (risk-utility with a reasonable alternative design, or the consumer-expectations test in some states); warning (inadequate instructions or warnings about foreseeable risks).',
'Defenses: unforeseeable misuse, substantial alteration, and comparative fault (reduces recovery in most states). Assumption of a known risk may bar or reduce recovery.',
'Alternative theories: negligence (duty of reasonable care in making and inspecting) and warranty (merchantability or fitness; privity is largely relaxed).']},
{id:'o.torts.6',t:'Defamation, privacy, nuisance & economic torts',b:[
'Defamation: a defamatory statement of fact of and concerning the plaintiff, published to a third person, causing damage. Libel (written) is generally actionable without special damages. Slander requires special damages unless per se (crime, loathsome disease, business or profession, sexual misconduct). Truth is a defense.',
'Constitutional overlay: public officials and figures must prove falsity and actual malice. Private plaintiffs on public-concern matters need falsity and at least negligence, and actual malice for presumed or punitive damages. Privileges: absolute (judicial, legislative, spouses) and qualified (common interest; lost by abuse).',
'Privacy: intrusion upon seclusion, appropriation of name or likeness, false light (highly offensive), and public disclosure of private facts (not newsworthy).',
'Nuisance: private nuisance is a substantial and unreasonable interference with use and enjoyment of land. Public nuisance requires special injury different in kind for a private action. Coming to the nuisance is a factor, not a bar.',
'Misrepresentation: intentional (knowing falsity, intent to induce reliance, justifiable reliance, damages) or negligent (in a business capacity, causing pecuniary loss). Intentional interference with contract or prospective advantage requires knowledge, intent and improper interference.']}];
OUTLINES.ba=[
{id:'o.ba.1',t:'Agency: formation, authority & contract liability',b:[
'Agency is a fiduciary relationship: the principal manifests assent that the agent will act on its behalf and subject to its control, and the agent consents. No writing or compensation is required.',
'Actual authority (express or implied): the agent reasonably believes, from the principal’s manifestations, that the principal wants the agent to act. Apparent authority: a third party reasonably believes the agent is authorized, traceable to the principal’s manifestations. Ratification: a principal with knowledge of the material facts affirms the act, binding it as if authorized. It must be the whole act, before material changes.',
'Agent liability on a contract: with a disclosed principal, the agent is not a party. With an unidentified principal, the agent is a party. With an undisclosed principal, the agent is a party, and the principal is also liable if the agent acted with actual authority. An agent who lacks authority breaches the implied warranty of authority.',
'Agent’s duties: loyalty (no self-dealing, competition, or secret profits), care, obedience, and disclosure. The principal must indemnify the agent for authorized expenses. Termination of actual authority does not end apparent authority until third parties have notice.']},
{id:'o.ba.2',t:'Agency: tort liability',b:[
'Respondeat superior: an employer is vicariously liable for an employee’s torts within the scope of employment. An employee is someone whose manner and means of work the employer controls or has the right to control (factors: skill, tools, payment by time, duration, part of the regular business).',
'Scope: work assigned or a course of conduct subject to the employer’s control. A minor detour is within scope; an independent frolic is not. Intentional torts are within scope when motivated at least partly to serve the employer, or when force is a natural incident of the job.',
'Independent contractors: generally no vicarious liability. Exceptions: inherently dangerous activities, nondelegable duties, and apparent agency (holding out).',
'Direct liability: negligent hiring, supervision, retention, or entrustment, and torts the principal directs or authorizes.']},
{id:'o.ba.3',t:'General partnerships, LPs & LLPs',b:[
'Formation: an association of two or more persons carrying on as co-owners a business for profit, whether or not they intend to form a partnership and with no filing. Sharing profits creates a presumption, except profits received as debt repayment, wages, rent, annuities, interest, or sale-of-business payments.',
'A partnership is an entity. Each partner is an agent for apparently carrying on in the ordinary course the partnership’s business (or business of the kind), unless the partner lacked authority and the third party knew it.',
'Partners are jointly and severally liable for all partnership obligations, but a judgment creditor generally must exhaust partnership assets first. A new partner is not personally liable for obligations incurred before joining (their capital is at risk).',
'Defaults: equal management rights; ordinary matters by majority; acts outside the ordinary course and amendments by unanimous consent; profits shared equally and losses like profits; no pay for services except winding up. A partner’s transferable interest is the right to distributions only.',
'Fiduciary duties: loyalty (account for benefits, no adverse dealing, no competition before dissolution) and care (refrain from gross negligence, recklessness, intentional misconduct, or a knowing violation of law), plus the obligation of good faith and fair dealing.',
'Dissociation and dissolution: in an at-will partnership, a partner’s express will to withdraw causes dissolution and winding up. In most other cases the partnership buys out the dissociated partner. A wrongful dissociation (before the end of a term) makes the partner liable for damages. LP: general partners are personally liable; limited partners are not, even if they participate in management (ULPA 2001). LLP: a filed statement shields partners from personal liability for partnership obligations.']},
{id:'o.ba.4',t:'Corporations: formation, structure & shareholders',b:[
'Incorporation: articles filed with the state. Persons who purport to act for a corporation knowing there was no incorporation are jointly and severally liable (MBCA). Some courts recognize de facto corporations and corporation by estoppel.',
'Promoters are personally liable on pre-incorporation contracts unless there is a novation. The corporation becomes liable only by adopting the contract (expressly or impliedly), and the promoter stays liable absent novation.',
'Piercing the veil: courts disregard the entity when the shareholder dominates it and respecting it would promote fraud or injustice. Factors: commingling, ignoring formalities, undercapitalization, and siphoning. Courts pierce more readily for tort creditors and close corporations.',
'The board manages. Directors act by majority vote at a meeting with a quorum (default: majority of directors), or by unanimous written consent. Officers have actual or apparent authority. Directors may be removed by shareholders with or without cause unless the articles require cause.',
'Shareholders elect directors and approve fundamental changes. Cumulative voting applies only if the articles provide it (MBCA). Proxies must be in writing or transmitted electronically, and are revocable unless coupled with an interest. Inspection: basic records on 5 business days’ written demand; other records (e.g., accounting records) with a proper purpose, described with reasonable particularity.']},
{id:'o.ba.5',t:'Directors’ & officers’ duties; shareholder suits',b:[
'Duty of care: the business judgment rule presumes directors acted on an informed basis, in good faith, and in the honest belief that the action was in the corporation’s best interest. Liability for an uninformed decision or bad faith. Directors may rely in good faith on officers, experts, and committees.',
'Articles may eliminate directors’ money damages for care violations. They cannot do so for receiving improper financial benefits, intentionally inflicting harm on the corporation or shareholders, unlawful distributions, or intentional violations of criminal law (MBCA §2.02(b)(4)).',
'Duty of loyalty: a director’s conflicting-interest transaction is protected if approved after full disclosure by qualified (disinterested) directors or by disinterested shareholders, or if fair to the corporation. Corporate opportunity: a director or officer must first offer the corporation business opportunities it would reasonably expect (a line-of-business or expectancy test) and may pursue them only after a rejection.',
'Derivative suits: the plaintiff must have owned shares when the wrong occurred (contemporaneous ownership) and fairly represent the corporation. MBCA universal demand: a written demand, then 90 days unless rejected earlier or irreparable injury would result. The court dismisses if qualified independent directors determine in good faith, after reasonable inquiry, that the suit is not in the corporation’s best interests. Recovery goes to the corporation.',
'Direct suits address individual harm (e.g., voting rights, pre-emptive rights, oppression of minority shareholders in close corporations). Controlling shareholders owe duties when they use control to obtain a benefit at the minority’s expense.']},
{id:'o.ba.6',t:'LLCs, distributions & fundamental changes',b:[
'LLC: members and managers are not personally liable for the LLC’s obligations solely by being members or managers. Veil piercing can apply, but failing to observe formalities is not a ground under RULLCA. An LLC is member-managed by default. Under RULLCA, a member is not an agent solely by reason of being a member; check the operating agreement and statements of authority.',
'LLC fiduciary duties: in member-managed LLCs, members owe loyalty and care. In manager-managed LLCs, managers do; members owe only good faith and fair dealing. The operating agreement may modify duties within statutory limits (it cannot eliminate loyalty). A member’s dissociation does not dissolve the LLC.',
'Distributions are barred if the corporation could not pay debts as they come due (equity insolvency) or if total assets would be less than liabilities plus preferential dissolution rights (balance sheet). Directors who vote for unlawful distributions without due care are personally liable for the excess, with contribution from knowing recipients.',
'Fundamental changes (merger, share exchange, sale of all or substantially all assets outside the ordinary course, dissolution, most article amendments) require board adoption and shareholder approval. The MBCA default is a meeting with a quorum of a majority of votes entitled to be cast where more votes are cast for than against. Older statutes require a majority of outstanding shares. A short-form merger of a 90%-owned subsidiary needs no vote.',
'Appraisal rights let dissenting shareholders receive fair value for a merger, share exchange, sale of substantially all assets, or certain amendments, after following the notice procedure. Under the market-out exception, appraisal is generally unavailable for publicly traded shares (subject to exceptions).']}];

/* ===== Stats helpers (ids are fixed: card id = card[2], question id = q.id) ===== */
function cardStats(sid){const list=CARDS[sid]||[];let seen=0,mastered=0,due=0;const now=Date.now();list.forEach(c=>{const st=S.cards[c[2]];if(st){seen++;if(st.iv>=21)mastered++;if(st.due<=now)due++;}});return {total:list.length,seen,mastered,due};}
function mcqStats(sid){let att=0,cor=0,uniq=0,total=0;MCQ.forEach(q=>{if(sid!=='all'&&q.s!==sid)return;total++;const st=S.mcq[q.id];if(st){att+=st.att;cor+=st.cor;uniq++;}});return {att,cor,uniq,total,acc:pct(cor,att)};}
// Optional outside practice logged by the user (Settings) — included in accuracy so weak-area targeting uses real-question results too.
function extStats(sid){let n=0,cor=0;(S.extMcq||[]).forEach(x=>{if(sid==='all'||x.subj===sid){n+=+x.n||0;cor+=+(x.cor??x.correct)||0;}});return {n,cor,acc:pct(cor,n)};}
function mbeAcc(sid){const m=mcqStats(sid),x=extStats(sid);const att=m.att+x.n,cor=m.cor+x.cor;return {att,cor,acc:pct(cor,att),app:m,ext:x};}
function essayStats(sid){let n=0,sum=0,att=0;ESSAYS.forEach(e=>{if(sid!=='all'&&e.s!==sid)return;const st=S.essays[e.id];if(st&&st.attempts&&st.attempts.length){const last=st.attempts[st.attempts.length-1];n++;sum+=last.pct;att+=st.attempts.length;}});return {n,avg:n?Math.round(sum/n):null,att};}
function retention(sid){const r=S.subjRev[sid];if(!r||r.n<10)return null;return Math.round(100*(r.n-r.again)/r.n);}
function composite(sid){const parts=[];const m=mbeAcc(sid);if(m.att>=5)parts.push([m.acc,0.5]);const r=retention(sid);if(r!=null)parts.push([r,0.25]);const e=essayStats(sid);if(e.avg!=null)parts.push([e.avg,0.25]);if(!parts.length)return null;const w=parts.reduce((a,p)=>a+p[1],0);return Math.round(parts.reduce((a,p)=>a+p[0]*p[1],0)/w);}
// Adaptive weighting: subjects scoring below ~72% get up to 1.6× practice time; strong subjects down to 0.75×.
function weaknessMult(){const o={};SUBJECTS.forEach(s=>{const c=composite(s.id);o[s.id]=c==null?1:Math.max(0.75,Math.min(1.6,Math.round((1+(72-c)/100*1.5)*10)/10));});return o;}

function autoMinutes(ds){let m=0;S.mcqSessions.forEach(x=>{if(x.date===ds)m+=(x.secs||0)/60;});ESSAYS.forEach(e=>{const st=S.essays[e.id];(st&&st.attempts||[]).forEach(a=>{if(a.date===ds)m+=(a.secs||0)/60;});});(S.mpt.sessions||[]).forEach(x=>{if(x.date===ds)m+=x.mins||0;});const cl=S.cardLog[ds];if(cl)m+=(cl.rev||0)*0.4;(S.extMcq||[]).forEach(x=>{if(x.date===ds)m+=+x.mins||0;});return Math.round(m);}
// A day's study minutes = the larger of what you logged (manual + focus timer) and what the app tracked, so time isn't double-counted.
function dayMinutes(ds){return Math.max(+(S.hoursLog[ds]||0),autoMinutes(ds));}
function activityDates(){const set=new Set();Object.keys(S.hoursLog).forEach(d=>{if(S.hoursLog[d]>0)set.add(d);});Object.keys(S.cardLog).forEach(d=>{if((S.cardLog[d].rev||0)>0)set.add(d);});Object.keys(S.mcqDay||{}).forEach(d=>{if((S.mcqDay[d].n||0)>0)set.add(d);});S.mcqSessions.forEach(x=>set.add(x.date));(S.extMcq||[]).forEach(x=>set.add(x.date));(S.mpt.sessions||[]).forEach(x=>set.add(x.date));ESSAYS.forEach(e=>{const st=S.essays[e.id];(st&&st.attempts||[]).forEach(a=>set.add(a.date));});return set;}
function loggedTotalMin(){const ds=new Set([...Object.keys(S.hoursLog),...activityDates()]);let t=0;ds.forEach(d=>t+=dayMinutes(d));return t;}
function streak(){const set=activityDates();let n=0;let d=new Date();if(!set.has(ymd(d)))d=addDays(d,-1);while(set.has(ymd(d))){n++;d=addDays(d,-1);}return {n,today:set.has(todayStr())};}
function logMinutes(min,src){const t=todayStr();S.hoursLog[t]=Math.max(0,Math.round((+S.hoursLog[t]||0)+min));save();toast(`Logged ${fmtMin(min)}${src?' ('+src+')':''} · today: ${fmtMin(dayMinutes(t))}`);if(curTab==='dash')RENDER.dash();}
// Pace vs. the target total: compares logged time with the plan's scheduled time up to yesterday.
function pace(){const plan=getPlan();const t=todayStr();let plannedToDate=0,remainingDays=0;plan.days.forEach(d=>{if(d.type==='exam')return;if(d.date<t)plannedToDate+=d.mins||0;else if(d.type!=='off'&&d.type!=='eve')remainingDays++;});const logged=loggedTotalMin();const target=(+S.settings.targetHours||400)*60;const need=remainingDays?Math.max(0,(target-logged)/remainingDays):0;return {plannedToDate,logged,target,remainingDays,needPerDay:need,diff:logged-plannedToDate,planTotal:plan.total};}

/* ===== Daily chunks (bite-sized pieces of today's plan) ===== */
function dayChunks(day){if(!day||!day.tasks)return [];const out=[];
 day.tasks.forEach((t,ti)=>{const m=t.meta||{};const base={task:t,ti,tab:t.tab,subj:t.subj};
  const push=(k,label,mins,extra)=>out.push(Object.assign({},base,{id:t.id+'#'+k,label,mins},extra||{}));
  if(m.sim&&t.tab==='mcq'&&m.q){let n=m.q,k=0;const parts=Math.ceil(n/100);while(n>0){const c=Math.min(100,Math.ceil(n/(parts-k)));push(k,`Simulated MBE${parts>1?` session ${k+1}/${parts}`:''}: ${c} mixed in-app questions at exam pace (108 s each)`,Math.round(c*EXAM_PACE_SEC/60),{n:c,timed:true,pool:'sim'});k++;n-=c;}return;}
  if(m.sim||!t.tab){push(0,t.label,t.mins);return;}
  if(m.kind==='review'&&m.outline&&m.outline.length){const per=Math.round(t.mins/m.outline.length);m.outline.forEach((sid,i)=>{const sec=OUTLINE_BY_ID[sid];push(i,`Review: ${sec?sec.t:sid}${t.subj&&SUBJ[t.subj]?' · '+SUBJ[t.subj].short:''}`,per,{sec:sid});});return;}
  if(m.q&&t.tab==='mcq'){let n=m.q,k=0;const per=10;while(n>0){const c=n<per+5?n:per;push(k++,m.review?`In-app review: ${c} ${t.subj&&t.subj!=='all'?SUBJ[t.subj].short:'mixed'} questions (missed/marked first, then oldest-seen)${m.timed?' · exam pace':''}`:`MBE: ${c} ${t.subj&&t.subj!=='all'?SUBJ[t.subj].short:'mixed'} questions (in-app)${m.timed?' · exam pace':''}`,Math.round(c*(m.timed?1.8:2.4)),{n:c,timed:!!m.timed,pool:m.review?'review':'smart'});n-=c;}return;}
  if(m.kind==='cards'){const k=Math.max(1,Math.min(4,Math.round(t.mins/12)));for(let i=0;i<k;i++)push(i,`Flashcards: 20 ${t.subj&&t.subj!=='all'?SUBJ[t.subj].short+' ':''}cards`,Math.round(t.mins/k),{n:20});return;}
  if(m.es){for(let i=0;i<m.es;i++)push(i,`Essay ${i+1}/${m.es}: write (30 min) + self-grade${t.subj&&t.subj!=='all'?' · '+SUBJ[t.subj].short:''}`,Math.round(t.mins/m.es));return;}
  if(m.mpt){push(0,t.label,t.mins);return;}
  const k=Math.max(1,Math.min(4,Math.round(t.mins/25)));if(k===1){push(0,t.label,t.mins);return;}
  for(let i=0;i<k;i++)push(i,`${t.label} — block ${i+1}/${k}`,Math.round(t.mins/k));});
 return out;}

function setChunkDone(ds,id,on){const arr=S.done[ds]||(S.done[ds]=[]);if(on){if(!arr.includes(id))arr.push(id);}else S.done[ds]=arr.filter(x=>x!==id);save();}
function completeChunk(id){if(!id)return;const t=todayStr();const ds=/^\d{4}-\d\d-\d\d:/.test(id)?id.slice(0,10):t;setChunkDone(ds,id,true);const day=getPlan().byDate[t];const ch=dayChunks(day);const left=ch.filter(c=>!chunkDone(t,c)).length;celebrate(left?`Chunk done ✓ — ${left} to go today`:'All of today’s chunks are done! 🎉');}
function startChunk(c){if(!c)return;const ds=todayStr();
 if(c.tab==='mcq'){MQ.setupSubj=c.subj||'all';go('mcq');if(c.n){startQuiz({subj:c.subj||'all',n:c.n,timed:!!c.timed,pool:c.pool||'smart',fallback:true,chunk:c.id});setFocus(true);}return;}
 if(c.tab==='cards'){FC.subj=c.subj&&c.subj!=='all'?c.subj:'all';FC.mode='srs';FC.goal={n:c.n||20,done:0,chunk:c.id};go('cards');setFocus(true);return;}
 if(c.tab==='outline'){OL.subj=c.subj&&SUBJ[c.subj]?c.subj:OL.subj;OL.sec=c.sec||null;OL.chunk=c.id;go('outline');return;}
 if(c.tab==='essay'){ES.filter=c.subj&&c.subj!=='all'&&SUBJ[c.subj]?c.subj:'all';ES.chunk=c.id;ES.cur=null;go('essay');toast('Pick a prompt, write for 30 minutes, then self-grade against the model answer. Saving the score completes this step.');return;}

 <details class="card fold" style="margin-top:14px"><summary>Most-missed questions</summary>${missed.length?`<div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>Subject</th><th>Question</th><th>Missed</th></tr></thead><tbody>${missed.map(q=>`<tr><td>${chip(q.s)}</td><td class="small">${esc(q.q.slice(0,140))}…</td><td>${S.mcq[q.id].att-S.mcq[q.id].cor}/${S.mcq[q.id].att}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Redo them with MBE Practice → Pool → “Previously missed” (the Smart mix also puts them first).</p>`:'<p class="muted small">No missed questions yet.</p>'}</details>`;
 bindGo($('#t-weak'));};

/* ===== Settings & data ===== */
RENDER.data=function(){const st=S.settings;const bytes=new Blob([JSON.stringify(S)]).size;
 const tg=(id,key,label,hint)=>`<label class="switch"><input type="checkbox" id="${id}" ${st[key]?'checked':''}><span class="sw-ui" aria-hidden="true"></span><span><b>${label}</b>${hint?`<br><span class="tiny muted">${hint}</span>`:''}</span></label>`;
 $('#t-data').innerHTML=`<div class="grid g2"><div class="card"><h2>Settings</h2>
 ${tg('sAnim','anim','Animations','Card flips, correct/incorrect motion. Always off if your device asks for reduced motion.')}
 ${tg('sSound','sound','Sounds','Soft tones for answers and the end of a focus block.')}
 ${tg('sCeleb','celebrate','Celebrations','Confetti when you finish a chunk or a day.')}
 ${tg('sFont','font','Extra-readable font','Wider letter spacing with a hyperlegible system font stack (works offline).')}
 ${tg('sAdapt','adaptive','Adaptive schedule','Shift future practice toward weak subjects.')}
 <div class="grid g2" style="margin-top:8px"><label>New flashcards per day<br><input type="number" id="sNew" min="0" max="200" value="${st.newPerDay}" style="width:90px"></label>
 <label>Course completion goal (%)<br><input type="number" id="sGoal" min="50" max="100" step="5" value="${st.completionTarget||75}" style="width:90px"></label></div>
 <p class="small muted">Study hours, days off, review and practice-test days are on the <a href="#" data-go="plan">Schedule</a> tab. Focus-timer lengths are in the ⏱ panel.</p>
 <div class="row"><button class="btn primary" id="sSave">Save settings</button><button class="btn ghost" id="sTheme">Toggle dark mode</button></div></div>
 <div class="card"><h2>Backup &amp; restore</h2><p class="small muted">All progress is stored on this device in this browser (${(bytes/1024).toFixed(1)} KB). A home-screen app keeps its own separate storage on iPhone. Export regularly, because clearing browser data deletes it.</p>
 <div class="row"><button class="btn primary" id="dExport">⬇ Export progress (JSON)</button><label class="btn">⬆ Import JSON<input type="file" id="dImport" accept="application/json,.json" class="hidden"></label></div>
 <p class="small muted" id="dMsg"></p>${extLogHtml()}<hr style="border:0;border-top:1px solid var(--border)"><button class="btn danger sm" id="dReset">Reset all progress…</button>
 <p class="tiny muted" style="margin-top:10px">Version ${typeof BUILD!=='undefined'?BUILD:'dev'} · data format v2${PURGED.length?` · removed ${PURGED.length} old saved-data key(s) on this device`:''}</p></div></div>`;
 bindGo($('#t-data'));
 const live=()=>{st.anim=$('#sAnim').checked;st.sound=$('#sSound').checked;st.celebrate=$('#sCeleb').checked;st.font=$('#sFont').checked?'readable':'default';st.adaptive=$('#sAdapt').checked;save();applyTheme();_plan=null;};
 ['sAnim','sSound','sCeleb','sFont','sAdapt'].forEach(id=>$('#'+id).onchange=live);$('#sFont').checked=st.font==='readable';
 $('#sSave').onclick=()=>{st.newPerDay=Math.max(0,+$('#sNew').value||0);st.completionTarget=Math.max(50,Math.min(100,+$('#sGoal').value||75));live();toast('Settings saved');};
 $('#sTheme').onclick=toggleTheme;
 $('#dExport').onclick=()=>{const blob=new Blob([JSON.stringify({app:'ohio-bar-prep',format:2,exported:new Date().toISOString(),state:S},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ohio-bar-prep-progress-'+todayStr()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);$('#dMsg').textContent='Exported.';};
 $('#dImport').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const st2=o.state||o;if(!st2||typeof st2!=='object'||!st2.settings)throw new Error('Not an Ohio Bar Prep export');if((st2.version||1)<2)throw new Error('This backup is from the old version (before the Oct 2026 fresh start) and can’t be imported');if(!confirm('Replace current progress with the imported file?'))return;S=merge(DEFAULT_STATE(),st2);save();_plan=null;applyTheme();toast('Progress imported');RENDER.data();$('#dMsg').textContent='Imported '+f.name;}catch(e){$('#dMsg').textContent='Import failed: '+e.message;}};r.readAsText(f);};
 bindExtLog(()=>RENDER.data());
 $('#dReset').onclick=()=>{if(confirm('Delete ALL progress (cards, scores, essays, settings)? Export first if unsure.')){S=DEFAULT_STATE();save();_plan=null;applyTheme();toast('Progress reset');RENDER.data();}};};

const SOURCES_HTML=''; // Neal: everything happens in-app; no outside-product pointers.

RENDER.info=function(){
 const tot=SUBJECTS.reduce((a,s)=>a+CARDS[s.id].length,0);
 $('#t-info').innerHTML=`<div class="card"><h2>February 2027 Ohio bar exam — format (verified Oct 1, 2026)</h2>

 </ul>
 <h3>Sources</h3><ul class="small">
 <li><a href="https://www.ncbex.org/jurisdictions/OH" target="_blank" rel="noopener">NCBE — Ohio jurisdiction page</a></li>
 <li><a href="https://www.supremecourt.ohio.gov/attorneys/admission-to-the-practice-of-law-in-ohio/important-dates/" target="_blank" rel="noopener">Supreme Court of Ohio — Important Dates</a></li>
 <li><a href="https://www.supremecourt.ohio.gov/attorneys/admission-to-the-practice-of-law-in-ohio/" target="_blank" rel="noopener">Supreme Court of Ohio — Admission to the Practice of Law (NextGen July 2028)</a></li>
 <li><a href="https://www.supremecourt.ohio.gov/attorneys/admission-to-the-practice-of-law-in-ohio/ohio-bar-examination/ohio-law-component/" target="_blank" rel="noopener">Supreme Court of Ohio — Ohio Law Component</a> · <a href="https://www.supremecourt.ohio.gov/attorneys/admission-to-the-practice-of-law-in-ohio/ohio-bar-examination/uniform-bar-examination/" target="_blank" rel="noopener">UBE FAQ</a></li>
 <li><a href="https://www.ncbex.org/exams/ube" target="_blank" rel="noopener">NCBE — UBE</a> · <a href="https://www.ncbex.org/exams/mbe" target="_blank" rel="noopener">MBE</a> · <a href="https://www.ncbex.org/exams/mee" target="_blank" rel="noopener">MEE</a> · <a href="https://www.ncbex.org/exams/mpt" target="_blank" rel="noopener">MPT</a> · <a href="https://www.ncbex.org/exams/mbe/preparing-mbe" target="_blank" rel="noopener">Preparing for the MBE</a> · <a href="https://www.ncbex.org/sites/default/files/2023-01/MBE_Subject_Matter_Outline.pdf" target="_blank" rel="noopener">MBE Subject Matter Outline</a></li></ul>
 <h3>About this app’s content</h3><p class="small">${tot} flashcards, ${MCQ.length} MBE-style questions, ${ESSAYS.length} MEE-style prompts. All practice questions and essay prompts are <b>original</b> and are not actual NCBE questions. Content states majority / MBE rules; Ohio-specific law is noted only where confident (and Ohio law is not tested on the UBE itself). The subject reviews (Reviews tab) are original concise outlines written for this app (pending QA review). Always confirm details with official sources and your bar-review materials, since rules change.</p></div>`+SOURCES_HTML;};
